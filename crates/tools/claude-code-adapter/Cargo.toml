[package]
name = "ryeos-claude-code-adapter"
version = "0.1.0"
edition = "2024"
description = "Stdio adapter that speaks the structured-session wire for the claude-code bundle (Claude Code driver, plus a test-only stub)"
license.workspace = true
repository = "https://github.com/leolilley/ryeos"

[[bin]]
name = "claude-code-adapter"
path = "src/main.rs"

[features]
default = ["stub-driver"]
# Compiles the scripted stub driver. The stub answers sessions without running
# Claude Code, so a shipped adapter must be built with
# `--no-default-features`: that binary refuses the stub knob outright.
stub-driver = []

[dependencies]
libc = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
