[package]
name = "ryeos-codex-runtime-verifier"
version = "0.5.102"
edition = "2024"
description = "Bounded Codex app-server runtime qualification probe"
license.workspace = true
repository = "https://github.com/leolilley/ryeos"

[[bin]]
name = "codex-runtime-verifier"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
lillux = { workspace = true }
ryeos-codex-external-configuration = { path = "../codex-external-configuration" }
ryeos-external-execution = { workspace = true }
ryeos-external-execution-contract = { workspace = true }
ryeos-project-capture = { workspace = true }
ryeos-runtime = { workspace = true }
ryeos-state = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shlex = "=1.3.0"
toml = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
rmp-serde = { workspace = true }
ryeos-state = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
