[package]
name = "ryeos-external-candidate-supervisor"
version = "0.5.99"
edition = "2024"
description = "Protected occurrence-bound RyeOS external candidate supervisor"
license.workspace = true
repository = "https://github.com/leolilley/ryeos"

[features]
default = []
test-support = []

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
lillux = { workspace = true }
url = { workspace = true }
ryeos-http-transport = { workspace = true }
ryeos-external-execution = { workspace = true }
ryeos-external-execution-contract = { workspace = true }
ryeos-state = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = { workspace = true }
