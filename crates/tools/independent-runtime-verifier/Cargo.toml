[package]
name = "ryeos-independent-runtime-verifier"
version = "0.5.101"
edition = "2024"
description = "Bounded independent runtime qualification probe"
license.workspace = true
repository = "https://github.com/leolilley/ryeos"

[[bin]]
name = "independent-runtime-verifier"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
lillux = { workspace = true }
ryeos-external-execution-contract = { workspace = true }
ryeos-project-capture = { workspace = true }
ryeos-runtime = { workspace = true }
ryeos-state = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
ryeos-state = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
