[package]
name = "ryeos-scheduler-service"
version = "0.1.0"
edition = "2024"
description = "Selected scheduler service ownership and App lifecycle adapters"
license.workspace = true

[features]
default = []
# Exact process-kill qualification for scheduler execution-history reset
# stage transitions. The cut selector does not exist in production builds.
crash-qualification-test-support = ["ryeos-app/crash-qualification-test-support", "lillux/crash-qualification-test-support"]

[dependencies]
ryeos-node-runtime = { workspace = true }
anyhow = { workspace = true }
lillux = { workspace = true }
lillux-sqlite = { workspace = true }
ryeos-app = { workspace = true }
ryeos-engine = { workspace = true }
ryeos-executor = { workspace = true }
ryeos-scheduler = { workspace = true }
ryeos-scheduler-contract = { workspace = true }
ryeos-state = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
ryeos-app = { workspace = true, features = ["test-support"] }
ryeos-scheduler = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
