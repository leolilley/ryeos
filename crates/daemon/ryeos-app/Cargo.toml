[package]
name = "ryeos-app"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
test-support = ["ryeos-engine/test-support", "ryeos-state/test-support", "ryeos-node-runtime/test-support", "lillux-sqlite/test-support"]
latency-profiling = []
# Allows an exact runtime-owned phase to be selected by the daemon's
# process-kill qualification harness. Production daemon builds never enable
# this environment channel.
crash-qualification-test-support = []

[dependencies]
ryeos-node-runtime = { workspace = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
lillux = { workspace = true }
lillux-sqlite = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { workspace = true }
ryeos-accounting = { workspace = true }
ryeos-bundle = { workspace = true }
ryeos-bundle-publication-contract = { workspace = true }
ryeos-engine = { workspace = true }
ryeos-external-execution = { workspace = true }
ryeos-external-execution-contract = { workspace = true }
ryeos-handler-protocol = { workspace = true }
ryeos-effect-contract = { workspace = true }
ryeos-gpu-loader-owner-contract = { workspace = true }
ryeos-isolation-protocol = { workspace = true }
ryeos-runtime = { workspace = true }
ryeos-scheduler-contract = { workspace = true }
ryeos-state = { workspace = true }
ryeos-tracing = { workspace = true }
ryeos-provider-contract = { workspace = true }
ryeos-project-capture = { workspace = true }
ryeos-vault = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
ryeos-node-runtime = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
ryeos-state = { workspace = true, features = ["test-support"] }
ryeos-engine = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
