[package]
name = "ryeos-app"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = []
test-support = ["ryeos-engine/test-support", "ryeos-state/test-support"]
latency-profiling = []
# Allows an exact runtime-owned phase to be selected by the daemon's
# process-kill qualification harness. Production daemon builds never enable
# this environment channel.
crash-qualification-test-support = []

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
lillux = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
ryeos-accounting = { workspace = true }
ryeos-bundle = { workspace = true }
ryeos-engine = { workspace = true }
ryeos-graph-definition = { workspace = true }
ryeos-effect-contract = { workspace = true }
ryeos-isolation-protocol = { workspace = true }
ryeos-runtime = { workspace = true }
ryeos-scheduler = { workspace = true }
ryeos-state = { workspace = true }
ryeos-tracing = { workspace = true }
ryeos-provider-contract = { workspace = true }
ryeos-vault = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ryeos-state = { workspace = true, features = ["test-support"] }
ryeos-engine = { workspace = true, features = ["test-support"] }
