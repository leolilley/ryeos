[package]
name = "ryeos-render-sandbox-lifecycle-adapter"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Unqualified early-access Render Sandbox lifecycle adapter"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
lillux = { path = "../../kernel/lillux" }
ryeos-external-execution-contract = { path = "../../engine/ryeos-external-execution-contract" }
ryeos-http-transport = { path = "../../engine/ryeos-http-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { workspace = true }
url = "2"
zeroize = "1"

[[bin]]
name = "ryeos-render-sandbox-lifecycle-adapter"
path = "src/main.rs"
