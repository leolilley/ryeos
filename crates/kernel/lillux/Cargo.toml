[package]
name = "lillux"
version = "0.5.102"
edition = "2024"
description = "Lillux microkernel — Execute, Memory, Identity, Time"
license.workspace = true
repository = "https://github.com/leolilley/ryeos"

[lib]
name = "lillux"
path = "src/lib.rs"

[[bin]]
name = "lillux"
path = "src/main.rs"

[features]
# Arms Lillux interruption hooks from test code; never enable outside
# [dev-dependencies].
test-support = []
# Process-kill qualification hook between the move and the unlink of a planned
# removal; never enable outside test builds.
crash-qualification-test-support = []

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_stacker = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "rand_core", "pem"] }
sha2 = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
ring = "0.17.14"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = { workspace = true }
zeroize = { workspace = true }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio", "system-config"] }
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "io-util"] }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "invocation_startup"
path = "tests/invocation_startup.rs"
harness = false

[[test]]
name = "environment_capture"
path = "tests/environment_capture.rs"
harness = false

[[test]]
name = "private_source_owner"
path = "tests/private_source_owner.rs"
harness = false

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
] }

[lints]
workspace = true
