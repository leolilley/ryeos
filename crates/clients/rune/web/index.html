<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>RyeOS</title>
  <!-- The same frame the renderer draws while it starts, so the page does not change when it takes over. -->
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#1d2021}#ryeos-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box}#ryeos-boot>div{display:flex;flex-direction:column;gap:16px;width:100%;max-width:440px}.ryeos-mark{display:flex;align-items:center;gap:10px;color:#a89984;font:10px ui-monospace,monospace;letter-spacing:3px}.ryeos-mark i{width:10px;height:10px;border:1px solid #d65d0e}.ryeos-head{color:#ebdbb2;font:400 22px system-ui,sans-serif;letter-spacing:-0.4px}.ryeos-rule{height:1px;background:linear-gradient(90deg,#d65d0e 48px,#4a4842 48px)}#ryeos-status{color:#a89984;font:12px system-ui,sans-serif}</style>
</head>
<body>
  <div id="ryeos-boot"><div>
    <div class="ryeos-mark"><i></i>RYEOS</div>
    <div class="ryeos-head">Opening presentation</div>
    <div class="ryeos-rule"></div>
    <div id="ryeos-status" role="status" aria-live="polite">Loading the renderer.</div>
  </div></div>
  <script type="module" src="/ui/assets/ryeos_boot.js"></script>
</body>
</html>
