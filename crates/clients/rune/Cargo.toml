# The browser renderer is its own Cargo workspace with its own Cargo.lock. Rune and the crates it
# patches come from git, and the root lock (which the release chain vendors) names crates.io
# sources only. Every package both locks share must resolve identically: the repository policy
# check compares them, and `rune-lock.py --regenerate` rebuilds this lock from the root one.
[workspace]

[package]
name = "ryeos-client-rune"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RyeOS in Rune: the GPU renderer for the browser and, later, a native window, over the shared client runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune = { git = "https://github.com/leolilley/rune", rev = "124c84b8a8176a917d27cfec2df160f6fd08e9bc", default-features = false, features = ["embedded-fonts", "webgl"] }
ryeos-client-base = { path = "../base" }
ryeos-client-runtime = { path = "../runtime" }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
serde_yaml = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Exact: the wasm-bindgen CLI that packages this crate must be the same version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"

[lints.clippy]
result_large_err = "allow"
large_enum_variant = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
lto = "thin"
strip = "debuginfo"

# The browser renderer (.ai/tools/ryeos/development/browser-assets-production/lib/build-rune-web.sh): a page downloads it, so
# size wins. Whole-program LTO, one codegen unit, and no symbol names, which
# the page has no use for and which cost megabytes.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
# Rune builds against its own patched copies of these crates (its `vendor/` directory). A
# dependency's `[patch]` does not reach the workspace that depends on it, so this workspace names
# them here, at the same revision as the `rune` dependency above.
wgpu-hal = { git = "https://github.com/leolilley/rune", rev = "124c84b8a8176a917d27cfec2df160f6fd08e9bc" }
winit = { git = "https://github.com/leolilley/rune", rev = "124c84b8a8176a917d27cfec2df160f6fd08e9bc" }
sctk-adwaita = { git = "https://github.com/leolilley/rune", rev = "124c84b8a8176a917d27cfec2df160f6fd08e9bc" }
parley_engine = { git = "https://github.com/leolilley/rune", rev = "124c84b8a8176a917d27cfec2df160f6fd08e9bc" }
