[package]
name = "ryeos-client-web"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Browser launcher for RyeOS: mints a launch URL and opens the browser"

[[bin]]
name = "web"
path = "src/bin/web.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
lillux = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
ryeos-client-base = { workspace = true }
ryeos-client-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
