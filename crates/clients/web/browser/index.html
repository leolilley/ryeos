<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RyeOS</title>
  <link rel="stylesheet" href="/ui/assets/web-shell.css">
</head>
<body>
  <div id="app">
    <main class="ryeos-boot" aria-labelledby="ryeos-boot-title">
      <div class="ryeos-boot-mark" aria-hidden="true">
        <span class="ryeos-boot-mark-core"></span>
        <span class="ryeos-boot-mark-orbit"></span>
      </div>
      <div class="ryeos-boot-copy">
        <p class="ryeos-boot-kicker">RyeOS / operator surface</p>
        <h1 id="ryeos-boot-title">Opening your node</h1>
        <div class="ryeos-boot-rail" aria-hidden="true"><span></span></div>
        <p id="ryeos-boot-stage" class="ryeos-boot-stage" role="status" aria-live="polite">
          Loading signed interface
        </p>
        <p id="ryeos-boot-detail" class="ryeos-boot-detail">Establishing the local browser session.</p>
      </div>
    </main>
  </div>
  <script type="module" src="/ui/assets/bootstrap.js"></script>
</body>
</html>
