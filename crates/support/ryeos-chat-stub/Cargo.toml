[package]
name = "ryeos-chat-stub"
version = "0.1.0"
edition = "2024"
description = "Scripted chat-completions stub server for zero-cost runtime tests and manual probes"
license.workspace = true

[[bin]]
name = "ryeos-chat-stub"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true, features = ["default"] }
bytes = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal", "io-util"] }

[lints]
workspace = true
