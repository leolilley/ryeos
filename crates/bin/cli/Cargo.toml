[package]
name = "ryeos-cli"
version = "0.5.102"
edition = "2024"
license.workspace = true
description = "CLI for Rye OS"

[[bin]]
name = "ryeos"
path = "src/main.rs"

[features]
default = []
scheduling = ["dep:ryeos-scheduler-service", "ryeos-api/scheduling"]
model-provider-setup = ["dep:ryeos-directive-definition"]

[dependencies]
chrono = { workspace = true }
ryeos-node-runtime = { workspace = true }
anyhow      = { workspace = true }
base64      = { workspace = true }
clap        = { workspace = true }
crossterm   = { workspace = true }
dirs        = { workspace = true }
futures-util = { workspace = true }
libc        = { workspace = true }
rand        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }
sha2        = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "io-util", "net"] }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-width = { workspace = true }
uuid        = { workspace = true }
zeroize     = { workspace = true }

lillux         = { workspace = true }
ryeos-client-transport = { workspace = true }
ryeos-app      = { workspace = true }
ryeos-api      = { workspace = true }
ryeos-bundle   = { workspace = true }
ryeos-engine   = { workspace = true }
ryeos-node     = { workspace = true }
ryeos-runtime  = { workspace = true }
ryeos-state    = { workspace = true }
ryeos-scheduler-service = { workspace = true, optional = true }
ryeos-core-tools    = { workspace = true }
ryeos-directive-definition = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
