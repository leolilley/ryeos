# Maps each daemon end-to-end test binary (crates/bin/daemon/tests/*.rs) to the
# workspace packages whose changes can break it. A merge gate compiles and runs
# every test whose `covers` list names a changed package, or whose `paths`
# globs match a changed file, before a branch merges.
#
# covers: cargo package names the test genuinely drives through the daemon it
#         spawns (endpoints, services, runtimes, adapters, state stores).
#         The daemon crate itself is never listed: a change there selects
#         every test.
# paths:  repo-relative globs for wide crates (lillux, ryeos-app, ryeos-api,
#         ryeos-engine, ryeos-state and similar) that nearly every test
#         depends on transitively. A wide crate is named in `covers` only
#         where the test exists to exercise that crate; otherwise the specific
#         modules the test drives are listed here.
#
# Tables are sorted by test name; lists are sorted.


# [authority]: the operator-authority and trust-store surface. A change that
# matches it (a named path, or a token on a changed line of a changed Rust
# file; a comment or test module counts, over-selecting is cheap) adds to a
# merge gate: every binary tagged `authority = true` below, the extra test
# `packages`, and one real-isolation smoke test (`smoke`). The full
# process-scope matrix stays on next. When a suite goes red on next that the
# gate did not select, name the miss here: add the path or token. This map is
# itself a named path, so a change to the selection runs the smoke test.
[authority]
paths = [
    "crates/bin/daemon/tests/e2e-coverage.toml",
    "crates/bin/cli/src/lifecycle_key_link.rs",
    "crates/bin/cli/src/lifecycle_offline_operation.rs",
    "crates/bin/cli/src/lifecycle_trust.rs",
    "crates/daemon/ryeos-api/src/handlers/offline_operations.rs",
    "crates/daemon/ryeos-api/src/handlers/project_owner.rs",
    "crates/daemon/ryeos-api/src/handlers/remote_admit_principal.rs",
    "crates/daemon/ryeos-api/src/handlers/remote_offline_operations.rs",
    "crates/daemon/ryeos-api/src/handlers/trust_list.rs",
    "crates/daemon/ryeos-app/src/bundle_transaction.rs",
    "crates/daemon/ryeos-app/src/live_project_path.rs",
    "crates/daemon/ryeos-app/src/operator_authority.rs",
    "crates/daemon/ryeos-app/src/principal.rs",
    "crates/daemon/ryeos-app/src/project_owner.rs",
    "crates/daemon/ryeos-app/src/project_registry.rs",
    "crates/daemon/ryeos-node/src/key_link.rs",
    "crates/daemon/ryeos-node/src/offline_operation/**",
    "crates/engine/ryeos-engine/src/authority/trust/**",
    "crates/engine/ryeos-engine/src/principal_contract.rs",
    "crates/engine/ryeos-node-runtime/src/node_policy/sections/authorization.rs",
    "crates/engine/ryeos-node-runtime/src/node_policy/sections/bundle_publication.rs",
    "crates/engine/ryeos-node-runtime/src/node_policy/sections/hosted.rs",
]
tokens = [
    "admit_handler_live_path",
    "admit_live_project_path",
    "admit_signer",
    "authorize_launch_project",
    "key_link",
    "live_logical_project",
    "local_signer_only",
    "owner_for",
    "remote_principal",
    "require_admitted_operator",
    "speaks_for",
    "trust_store",
]
packages = ["ryeos-synthetic-external-lifecycle-adapter"]

[authority.smoke]
