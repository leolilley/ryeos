[package]
name = "ryeos-http-transport"
version = "0.1.0"
edition = "2024"
description = "Bounded HTTP/1.1 over explicit Lillux network and TLS authorities"
license.workspace = true

[dependencies]
lillux = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq-proto = { version = "0.6.4", default-features = false, features = ["client"] }
url = { workspace = true }
