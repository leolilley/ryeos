category: test
name: produce
version: "2.0.0"
description: Write bounded lossless workspace outputs with Bash
executor_id: "@subprocess"
execution_protocol: protocol:ryeos/core/opaque
effects: live
workspace_access: shared_exclusive
filesystem_authority: node_policy
network_authority: isolated
env_config:
  interpreter:
    type: local_binary
    binary: bash
    candidates: []
    search_paths: []
    path_candidates: [bash]
config:
  command: "${interpreter}"
  args:
    - --noprofile
    - --norc
    - -c
    - literal: |
        # fixture-producer-begin
        set -euo pipefail
        # Restrict this Bash probe, without injecting reserved runtime env keys.
        export PATH=''
        if [[ $# -ne 1 || $1 != /* ]]; then
          printf '%s\n' 'producer requires one absolute project path' >&2
          exit 64
        fi
        project_root=$1
        distribution=$project_root/products/distribution
        runtime=$distribution/runtime
        scratch=$project_root/products/build-scratch
        umask 077
        /usr/bin/mkdir -p -- \
          "$runtime/bin" \
          "$runtime/empty-subdir" \
          "$distribution/licenses" \
          "$scratch/intermediate"
        /usr/bin/base64 --decode > "$runtime/bin/program" <<'RYEOS_FIXTURE_PROGRAM'
