name: sccache or plain rustc
description: >-
  Sets up sccache backed by the Actions cache and proves its server answers.
  When sccache cannot be installed or its server does not start (the
  "Timed out waiting for server startup" outage), the job clears
  RUSTC_WRAPPER for every later step and builds with plain rustc: the same
  builds and tests run, only uncached and slower. The fallback is announced
  as a warning and in the step summary; it never fails the job.
inputs:
  off:
    description: "'true' skips sccache and builds with plain rustc (operator switch for a known outage)."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # Annotations are off because the action's post step runs
    # `sccache --show-stats`, which fails the job when the server is down.
    # The probe step below prints the stats of a healthy server instead.
    - name: Install sccache
      if: ${{ inputs.off != 'true' }}
      continue-on-error: true
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        disable_annotations: "true"

    - name: Start the sccache server, or fall back to plain rustc
      shell: bash
      env:
        SCCACHE_OFF: ${{ inputs.off }}
      run: '"$GITHUB_ACTION_PATH/start-or-fall-back.sh"'
