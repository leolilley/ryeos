name: Build composition image candidates

# Builds every composition image in the bake file's `composition` group from
# the checked-out commit, signed with the development
# publisher key, and pushes candidate tags to GHCR. Candidates are deployed by
# the digests printed below, never by tag. Nothing here promotes an image to an
# official release: the development publication refuses the official owner.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate SemVer with a prerelease, for example 0.1.0-composition.1"
        required: true
        type: string
      tag_suffix:
        description: "Optional suffix appended to the candidate tag"
        required: false
        default: ""
        type: string
      targets:
        description: "Bake targets to build: the whole `composition` group, or a comma-separated list such as `f5r-controller`"
        required: false
        default: "composition"
        type: string

permissions:
  contents: read

concurrency:
  group: ryeos-composition-candidates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve candidate coordinates
        id: candidate
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="$(scripts/release/resolve-version.sh workflow_dispatch '' "$REQUESTED_VERSION")"
          [[ "$VERSION" == *-* ]] || {
            echo "candidate version must carry a prerelease identifier" >&2
            exit 1
          }
          [[ -z "$TAG_SUFFIX" || "$TAG_SUFFIX" =~ ^[0-9A-Za-z][0-9A-Za-z.-]{0,40}$ ]] || {
            echo "tag suffix must be a short tag-safe string" >&2
            exit 1
          }
          SOURCE_SHA="$(git rev-parse --verify HEAD)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_SHA")"
          BUILD_DATE="$(date --utc --date="@${SOURCE_DATE_EPOCH}" '+%Y-%m-%dT%H:%M:%SZ')"
          TAG="candidate-${SOURCE_SHA}${TAG_SUFFIX:+-$TAG_SUFFIX}"
          PREFIX="ghcr.io/${OWNER,,}/ryeos"
          CACHE_REF="ghcr.io/${OWNER,,}/ryeos-buildcache"
          {
            echo "version=$VERSION"
            echo "sha=$SOURCE_SHA"
            echo "epoch=$SOURCE_DATE_EPOCH"
            echo "build_date=$BUILD_DATE"
            echo "tag=$TAG"
            echo "prefix=$PREFIX"
            echo "cache_ref=$CACHE_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Assert development publisher key
        run: |
          # The development publisher key is committed: it only signs
          # candidates that development trust accepts, never an official
          # release. The checks pin it to the development trust document and
          # refuse it if it were ever the official key.
          KEY_FILE=.dev-keys/PUBLISHER_DEV.pem
          test -s "$KEY_FILE"
          EXPECTED="$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path(".dev-keys/PUBLISHER_DEV_TRUST.toml").read_text())["fingerprint"])')"
          ACTUAL="$(openssl pkey -in "$KEY_FILE" -pubout -outform DER 2>/dev/null \
            | tail -c 32 | sha256sum | cut -d' ' -f1)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "$KEY_FILE does not match the development publisher trust document" >&2
            exit 1
          }
          [[ "$ACTUAL" != "$(scripts/release/official-publisher-fingerprint.sh)" ]]
          {
            echo 'RYEOS_PUBLISHER_KEY<<RYEOS_PUBLISHER_KEY_EOF'
            cat "$KEY_FILE"
            echo 'RYEOS_PUBLISHER_KEY_EOF'
          } >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push composition candidates
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          # Ten targets' provenance makes the metadata output larger than an
          # environment variable can carry; only the digests are read below.
          BUILDX_METADATA_PROVENANCE: "false"
        with:
          source: .
          files: ./docker-bake.composition.hcl
          targets: ${{ inputs.targets }}
          # The bake file names no output; pushing candidates is this
          # workflow's explicit choice. The build cache goes to a GHCR
          # registry cache, not `type=gha`: the gha cache is capped at 10 GB
          # across the repository, which one compiled dependency closure
          # exceeds, and the compiled dependencies are exported as an image
          # layer that only a registry cache carries between fresh runners.
          push: true
          vars: |
            PUBLICATION_STAGE=development-publication
            PUBLISHER_OWNER=RyeOS Development
            VERSION=${{ steps.candidate.outputs.version }}
            SOURCE_DATE_EPOCH=${{ steps.candidate.outputs.epoch }}
            VCS_REF=${{ steps.candidate.outputs.sha }}
            BUILD_DATE=${{ steps.candidate.outputs.build_date }}
            IMAGE_PREFIX=${{ steps.candidate.outputs.prefix }}
            IMAGE_TAG=${{ steps.candidate.outputs.tag }}
            BUILD_CACHE_REF=${{ steps.candidate.outputs.cache_ref }}

      - name: Print candidate digests
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
          PREFIX: ${{ steps.candidate.outputs.prefix }}
          TAG: ${{ steps.candidate.outputs.tag }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          {
            echo "### Composition candidates"
            echo
            echo "Source: \`$SOURCE_SHA\` (development publisher; not an official release)"
            echo
            echo "| image | digest reference |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          built="$(jq -r 'to_entries[] | select((.value | type) == "object" and (.value | has("containerimage.digest"))) | .key' <<<"$BAKE_METADATA" | sort)"
          [[ -n "$built" ]] || { echo "bake pushed no images" >&2; exit 1; }
          for target in $built; do
            DIGEST="$(jq -r --arg target "$target" '.[$target]["containerimage.digest"] // empty' <<<"$BAKE_METADATA")"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "no pushed digest for $target" >&2
              exit 1
            }
            IMAGE="${PREFIX}-${target}"
            docker buildx imagetools inspect "${IMAGE}@${DIGEST}" >/dev/null
            echo "${IMAGE}:${TAG} -> ${IMAGE}@${DIGEST}"
            echo "| ${target} | \`${IMAGE}@${DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: First-boot init smoke
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
          PREFIX: ${{ steps.candidate.outputs.prefix }}
        run: |
          # Runs the node's own first-boot initialization, exactly as the image
          # entrypoint does it (its functions are sourced, not copied), against a
          # throwaway anonymous /data volume, as the image's node account. Only the
          # init runs; the daemon is never started. The profile is the one each
          # image bakes; the host class is read from that profile's own
          # declared classes, hosted when it declares it, else its first.
          failed=()
          built="$(jq -r 'to_entries[] | select((.value | type) == "object" and (.value | has("containerimage.digest"))) | .key' <<<"$BAKE_METADATA" | sort)"
          [[ -n "$built" ]] || { echo "bake pushed no images" >&2; exit 1; }
          for target in $built; do
            DIGEST="$(jq -r --arg target "$target" '.[$target]["containerimage.digest"] // empty' <<<"$BAKE_METADATA")"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "no pushed digest for $target" >&2
              exit 1
            }
            IMAGE="${PREFIX}-${target}@${DIGEST}"
            echo "::group::first-boot init: ${target}"
            # The single-quoted script is expanded by the container shell.
            # shellcheck disable=SC2016
            if ! docker run --rm \
              --user 10000:10000 \
              --volume /data \
              --entrypoint /bin/bash \
              -e RYEOS_SUBSTRATE_IMAGE="$IMAGE" \
              -e RYEOS_SUBSTRATE_PROTOCOL=1 \
              -e RYEOS_TRUST_BAKED_PUBLISHERS=1 \
              "$IMAGE" \
              -c 'source /usr/local/bin/entrypoint.sh
                  profile=/opt/ryeos/.ai/node/init/profiles/$RYEOS_INIT_NODE_PROFILE.yaml
                  classes="$(awk "
                    /^ *host_classes:\$/ { base = match(\$0, /[^ ]/); on = 1; next }
                    on && match(\$0, /[^ ]/) <= base { exit }
                    on && match(\$0, /[^ ]/) == base + 2 && /^ +[a-z][a-z0-9_-]*:\$/ { sub(/^ +/, \"\"); sub(/:\$/, \"\"); print }
                  " "$profile")"
                  [[ -n "$classes" ]] || { echo "[smoke] no host classes declared in $profile" >&2; exit 1; }
                  RYEOS_INIT_HOST_CLASS="$(grep -Fx hosted <<<"$classes" || head -n1 <<<"$classes")"
                  export RYEOS_INIT_HOST_CLASS
                  collect_baked_publisher_trust_args /opt/ryeos
                  build_ryeos_init_args /opt/ryeos /data/app 127.0.0.1:7400
                  echo "[smoke] profile: $RYEOS_INIT_NODE_PROFILE host class: $RYEOS_INIT_HOST_CLASS (declared: $(tr "\\n" " " <<<"$classes"))"
                  ryeos "${INIT_ARGS[@]}" "${TRUST_ARGS[@]}"'; then
              echo "::endgroup::"
              echo "first-boot init failed for image target ${target} (${IMAGE})" >&2
              failed+=("$target")
              continue
            fi
            echo "::endgroup::"
            echo "first-boot init ok: ${target}"
          done
          # Every image is booted before the verdict so one refusal does not
          # hide another; the step fails if any image refused its init.
          if (( ${#failed[@]} > 0 )); then
            echo "first-boot init failed for: ${failed[*]}" >&2
            exit 1
          fi

      - name: Daemon ready smoke
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
          PREFIX: ${{ steps.candidate.outputs.prefix }}
        run: |
          # Starts each built image exactly as a hosted deployment does (the
          # image entrypoint initializes a throwaway anonymous /data volume and
          # then execs the daemon) and fails unless /_ryeos/ready answers
          # within the bound. A daemon that refuses its installed services, a
          # bundle set its binary was not built for, or any other startup
          # refusal exits the container or leaves the probe unanswered, and the
          # container log is printed. The host class is the one the profile
          # declares, hosted when present, as in the init smoke above.
          failed=()
          built="$(jq -r 'to_entries[] | select((.value | type) == "object" and (.value | has("containerimage.digest"))) | .key' <<<"$BAKE_METADATA" | sort)"
          [[ -n "$built" ]] || { echo "bake pushed no images" >&2; exit 1; }
          for target in $built; do
            DIGEST="$(jq -r --arg target "$target" '.[$target]["containerimage.digest"] // empty' <<<"$BAKE_METADATA")"
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "no pushed digest for $target" >&2
              exit 1
            }
            IMAGE="${PREFIX}-${target}@${DIGEST}"
            NAME="ready-smoke-${target}"
            echo "::group::daemon ready: ${target}"
            profile_classes="$(docker run --rm --entrypoint /bin/bash "$IMAGE" -c \
              'awk "
                 /^ *host_classes:\$/ { base = match(\$0, /[^ ]/); on = 1; next }
                 on && match(\$0, /[^ ]/) <= base { exit }
                 on && match(\$0, /[^ ]/) == base + 2 && /^ +[a-z][a-z0-9_-]*:\$/ { sub(/^ +/, \"\"); sub(/:\$/, \"\"); print }
               " /opt/ryeos/.ai/node/init/profiles/$RYEOS_INIT_NODE_PROFILE.yaml' || true)"
            host_class="$(grep -Fx hosted <<<"$profile_classes" || head -n1 <<<"$profile_classes")"
            ok=0
            if [[ -n "$host_class" ]] && docker run --detach --name "$NAME" \
                 --volume /data \
                 -e PORT=8000 \
                 -e RYEOS_INIT_HOST_CLASS="$host_class" \
                 -e RYEOS_SUBSTRATE_IMAGE="$IMAGE" \
                 -e RYEOS_SUBSTRATE_PROTOCOL=1 \
                 -e RYEOS_TRUST_BAKED_PUBLISHERS=1 \
                 "$IMAGE" >/dev/null; then
              for _ in $(seq 1 60); do
                if docker exec "$NAME" python3 -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/_ryeos/ready',timeout=3).read()" 2>/dev/null; then
                  ok=1
                  break
                fi
                [[ "$(docker inspect -f '{{.State.Running}}' "$NAME")" == true ]] || break
                sleep 2
              done
            fi
            if (( ok == 0 )); then
              docker logs "$NAME" 2>&1 | tail -n 80 || true
            fi
            docker rm --force --volumes "$NAME" >/dev/null 2>&1 || true
            echo "::endgroup::"
            if (( ok == 1 )); then
              echo "daemon ready: ${target}"
            else
              echo "daemon did not reach ready within 120s for image target ${target} (${IMAGE})" >&2
              failed+=("$target")
            fi
          done
          if (( ${#failed[@]} > 0 )); then
            echo "daemon ready smoke failed for: ${failed[*]}" >&2
            exit 1
          fi
