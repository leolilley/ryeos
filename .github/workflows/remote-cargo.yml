name: Remote cargo

# Runs one cargo command for a branch on a GitHub-hosted runner, so threads can
# verify work in parallel instead of queueing on the shared local cargo guard.
# Dispatch it on the branch to check:
#
#   gh workflow run remote-cargo.yml --ref work/<branch> \
#     -f command=test -f args="-p ryeos-ui --lib"
#
# The args are split on whitespace and passed to cargo as separate arguments;
# they are never evaluated by a shell.
#
# Tests that load populated bundle bins (most daemon e2e) need -f bundles=next:
#
#   gh workflow run remote-cargo.yml --ref work/<branch> \
#     -f command=test -f bundles=next -f args="-p ryeosd --test <name>"
#
# bundles=next restores the bundle state of the newest next CI run whose bundles
# job succeeded and whose artifact is unexpired (1 day retention), and prints
# the next sha and run id. It fails if none is available, and refuses if the
# branch differs from that next sha on any path the state would overwrite or
# delete, or anywhere under bundles/ (merge origin/next, or avoid those paths).
# Crate source differences only warn: bundle bins come from next's crates.
# bundles=branch instead refreshes the bundles from this branch's own sources
# (the CI bundles job, about 45 min more): use it when bundles=next refuses.
# bundles=none (default) runs cargo on the plain checkout.
#
# The browser renderer (crates/clients/rune) is its own Cargo workspace. Target
# it with -f workspace=rune; cargo then runs with its manifest:
#
#   gh workflow run remote-cargo.yml --ref work/<branch> \
#     -f workspace=rune -f command=clippy -f args="--all-targets -- -D warnings"
on:
  workflow_dispatch:
    inputs:
      command:
        description: "cargo subcommand"
        required: true
        default: test
        type: choice
        options:
          - test
          - clippy
          - check
          - build
          - fmt
      args:
        description: "Arguments after the subcommand, e.g. -p ryeos-ui --lib, or -p ryeosd --all-targets -- -D warnings"
        required: true
        type: string
      bundles:
        description: "none; next to restore bundle state from a recent next CI run; branch to refresh the bundles from this branch (about 45 min, for branches that change bundles/)"
        required: false
        default: none
        type: choice
        options:
          - none
          - next
          - branch
      workspace:
        description: "root for the main workspace; rune for the browser renderer's own workspace (crates/clients/rune)"
        required: false
        default: root
        type: choice
        options:
          - root
          - rune
      label:
        description: "Optional short label shown in the run name"
        required: false
        default: ""
        type: string

run-name: "remote cargo ${{ inputs.command }} ${{ inputs.label }} (${{ github.ref_name }})"

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  GATE_BUILD_JOBS: 0
  GATE_TEST_THREADS: 0

jobs:
  cargo:
    name: cargo ${{ inputs.command }} ${{ inputs.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libxkbcommon-dev binutils xz-utils pkg-config libssl-dev ca-certificates openssl python3 python3-yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master, pinned
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Read the CI workflow's crate cache but never save one: many branches
      # dispatch this, and per-run saves would evict the CI caches.
      - name: Restore cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: workspace-crates-v1
          cache-workspace-crates: true
          save-if: false
          workspaces: |
            . -> target
            crates/clients/rune -> target

      - name: Prepare the runner
        run: ./scripts/ci/prepare-runner.sh

      - name: Restore next's bundle state
        if: ${{ inputs.bundles == 'next' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # Restores the bundle state of a recent next CI run, refusing when that would hide branch changes.
        # Restore the refreshed bundle state of a recent `next` CI run into this
        # checkout (a branch under test), refusing when that would hide branch changes.
        # Finds the newest ci.yml push run on next whose "Bundle refresh for tests" job
        # succeeded and whose bundle-state artifact has not expired, downloads it, and
        # unpacks it with unpack-bundle-state.sh.
        # Overwrite-safety rule: the bundle state is a snapshot of next's tree plus the
        # refresh output. Let S be the next commit the state came from and HEAD the
        # branch under test. The restore is refused (exit 1) when any path the state
        # would write (modified tracked or untracked/ignored files) or delete differs
        # between S and HEAD, because unpacking would silently replace the branch's
        # version of that file with next's. Untracked/ignored generated files
        # (populated bin trees, signatures) never differ in git, so they restore freely.
        # It is also refused when anything under bundles/ differs between S and HEAD,
        # even a tracked file the refresh did not modify: the state's bins and
        # signatures were produced from S's bundle sources, so a branch with other
        # bundle sources would load a mismatched, partly stale bundle. If it refuses
        # because the branch is merely behind next, merge origin/next (the newest next
        # run whose bundles job has finished is used, so wait for it if next just moved).
        # Branch changes to crate sources can make the prebuilt bundle bins stale
        # relative to the branch; that only warns.
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
          : "${GH_TOKEN:?GH_TOKEN is required}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          run_id=""
          sha=""
          runs="$(gh api "repos/$repo/actions/workflows/ci.yml/runs?branch=next&event=push&per_page=30" \
              --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')"
          while read -r id head; do
              [[ -n "$id" ]] || continue
              ok="$(gh api "repos/$repo/actions/runs/$id/jobs?per_page=100" \
                  --jq '[.jobs[] | select(.name == "Bundle refresh for tests" and .conclusion == "success")] | length')"
              [[ "$ok" -gt 0 ]] || continue
              live="$(gh api "repos/$repo/actions/runs/$id/artifacts?per_page=100" \
                  --jq "[.artifacts[] | select(.name == \"bundle-state-$head\" and (.expired | not))] | length")"
              if [[ "$live" -gt 0 ]]; then
                  run_id="$id"
                  sha="$head"
                  break
              fi
          done <<<"$runs"

          if [[ -z "$run_id" ]]; then
              echo "::error::No unexpired bundle state found: none of the last 30 ci.yml runs on next has a successful bundles job with a live artifact (retention is 1 day). Wait for a next CI run to finish its bundles job, or run with bundles=none."
              exit 1
          fi
          echo "Bundle state comes from next $sha (ci.yml run $run_id)"
          echo "https://github.com/$repo/actions/runs/$run_id"

          gh run download "$run_id" --repo "$repo" -n "bundle-state-$sha" -D "$work/dl"
          state="$work/dl/bundle-state.tar.zst"

          # Paths the state would write or delete.
          tar --zstd -tf "$state" | grep -v -e '^\.ci-deleted-files$' -e '/$' | sort -u > "$work/state-paths" || true
          tar --zstd -xOf "$state" .ci-deleted-files | sort -u > "$work/deleted-paths"
          sort -u "$work/state-paths" "$work/deleted-paths" > "$work/touched"

          git fetch --no-tags --depth=1 origin "$sha"
          git diff --name-only "$sha" HEAD | sort -u > "$work/differs"

          { comm -12 "$work/touched" "$work/differs"; grep '^bundles/' "$work/differs" || true; } | sort -u > "$work/conflicts"
          conflicts="$(cat "$work/conflicts")"
          if [[ -n "$conflicts" ]]; then
              echo "::error::Refusing to restore next's bundle state: this branch differs from next $sha on paths the state would overwrite or delete, or on bundle sources the state was built from, so the run would test next's version, not the branch's. Merge origin/next into the branch, or keep branch edits out of these paths."
              while IFS= read -r path; do echo "  conflict: $path"; done <<<"$conflicts"
              exit 1
          fi

          if grep -E -q '^(crates/|Cargo\.lock$|Cargo\.toml$)' "$work/differs"; then
              echo "::warning::This branch differs from next $sha in crate sources; the prebuilt bundle bins were built from next and may not reflect those changes."
          fi

          ./scripts/ci/unpack-bundle-state.sh "$state"
          {
              echo "### Bundle state"
              echo "next \`$sha\`, ci.yml run [$run_id](https://github.com/$repo/actions/runs/$run_id); $(wc -l < "$work/touched") paths; no branch overlap."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # The CI bundles job's refresh, run against this branch's own bundle and
      # crate sources: for branches that change bundles/, where restoring next's
      # state is refused.
      - name: Refresh the bundles from this branch
        if: ${{ inputs.bundles == 'branch' }}
        env:
          GATE_BUNDLE_TARGET_DIR: ${{ runner.temp }}/ryeos-bundle-target
        run: ./scripts/gate.sh --refresh-bundles --no-tests

      - name: Run cargo
        env:
          CARGO_SUBCOMMAND: ${{ inputs.command }}
          CARGO_ARGS: ${{ inputs.args }}
          CARGO_WORKSPACE: ${{ inputs.workspace }}
        run: |
          set -euo pipefail
          read -r -a extra <<<"$CARGO_ARGS"
          manifest=()
          if [[ "$CARGO_WORKSPACE" == rune ]]; then
            manifest=(--manifest-path crates/clients/rune/Cargo.toml)
          fi
          echo "cargo $CARGO_SUBCOMMAND ${manifest[*]} ${extra[*]}"
          cargo "$CARGO_SUBCOMMAND" "${manifest[@]}" "${extra[@]}"
