name: Remote node build

# Builds a node install on a GitHub-hosted runner so it need not be compiled on
# a developer machine. It runs exactly what
#   install-local-direct.sh --populate --all --bundle-set <set>
# builds (scripts/populate-bundles.sh with the installer's default dev publisher
# key and owner, release profile, whole set), then packs what the installer
# reads without --populate into one artifact: the binaries it copies from
# <target>/release, the populated bundle state of the checkout, and a manifest.
#
#   gh workflow run remote-node-build.yml --repo leolilley/ryeos \
#     --ref work/<branch> -f bundle_set=standard -f label=<thread>
#
# The job summary prints the artifact name and the exact download and install
# commands; the same steps are in .ai/knowledge/ryeos/development/build-and-test.md.
#
# Inputs beyond the bundle set:
#   build_profile=release (default)  what ships. `test` is release optimisation
#                          plus the claude-code adapter's test-only stub driver;
#                          it is for throwaway test nodes only. The manifest always
#                          records `build_profile`, release included.
#   base=runner (default)  build on the ubuntu-latest runner itself; binaries
#                          link against the runner's glibc (2.39).
#   base=bookworm          run the populate (and so every Rust build) inside the
#                          rust:1.95-slim-bookworm image Dockerfile.release pins,
#                          so the binaries need glibc 2.36 or older, then prove
#                          they start in debian:bookworm-slim with no dev
#                          libraries. sccache is not used inside the container.
#   extra_bins             space-separated cargo package names (for example
#                          ryeos-chat-stub) built with `cargo build --release -p`
#                          in the same environment and added to the artifact's
#                          target/release and manifest. A package that does not
#                          produce a binary of its own name fails the job.
on:
  workflow_dispatch:
    inputs:
      bundle_set:
        description: "Bundle set to populate (the installer's --bundle-set)"
        required: true
        default: standard
        type: choice
        options:
          - standard
          - development
          - central-host
          - standard-central-auth
          - local-inference
          - hosted-workflow
          - bundle-source
          - core
          - core-scheduling
          - core-workflow
          - core-knowledge
          - release-authority
      base:
        description: "Build environment: runner (ubuntu-latest glibc) or bookworm (pinned Debian 12 container, glibc 2.36 floor)"
        required: false
        default: runner
        type: choice
        options:
          - runner
          - bookworm
      build_profile:
        description: "Build profile passed to populate-bundles.sh: release (what ships) or test (release optimisation plus the claude-code adapter's test-only stub driver; for throwaway test nodes only)"
        required: false
        default: release
        type: choice
        options:
          - release
          - test
      extra_bins:
        description: "Space-separated cargo packages to build and ship beside the node binaries (e.g. ryeos-chat-stub)"
        required: false
        default: ""
        type: string
      label:
        description: "Optional short label shown in the run name"
        required: false
        default: ""
        type: string

run-name: "remote node build ${{ inputs.bundle_set }} ${{ inputs.build_profile }} ${{ inputs.label }} (${{ github.ref_name }})"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  # A compile whose sccache server dies mid-job runs rustc directly instead
  # of failing; .github/actions/sccache-or-plain covers a server that never starts.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ inputs.bundle_set }} ${{ inputs.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system dependencies
        run: |
          ./.ai/tools/ryeos/development/runner-host/lib/apt-update.sh
          sudo apt-get install -y --no-install-recommends libcap-dev libxkbcommon-dev binutils xz-utils pkg-config libssl-dev ca-certificates openssl python3 python3-yaml zstd jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master, pinned
        with:
          toolchain: 1.95.0

      - name: Set up sccache (plain rustc if it is down)
        uses: ./.github/actions/sccache-or-plain
        with:
          off: ${{ vars.SCCACHE_OFF == 'true' }}

      - name: Prepare the runner
        run: ./scripts/ci/prepare-runner.sh

      # The same call the installer makes for --populate --all: its default
      # development publisher key and owner label, the release profile.
      - name: Populate and sign the bundle set
        if: ${{ inputs.base != 'bookworm' }}
        env:
          BUNDLE_SET: ${{ inputs.bundle_set }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/ryeos-node-target
        run: |
          ./scripts/populate-bundles.sh \
            --key .dev-keys/PUBLISHER_DEV.pem \
            --owner "RyeOS Development" \
            --bundle-set "$BUNDLE_SET" --build-profile "$BUILD_PROFILE" --all

      # base=bookworm: the same populate call, run as root inside the pinned
      # Debian 12 Rust image with the checkout and target directory mounted.
      # The files it leaves behind are handed back to the runner user.
      - name: Populate and sign the bundle set (bookworm container)
        if: ${{ inputs.base == 'bookworm' }}
        env:
          BUNDLE_SET: ${{ inputs.bundle_set }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          EXTRA_BINS: ${{ inputs.extra_bins }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/ryeos-node-target
        run: |
          set -euo pipefail
          if [[ ! "$EXTRA_BINS" =~ ^[A-Za-z0-9_\ -]*$ ]]; then
            echo "extra_bins must be cargo package names separated by spaces" >&2
            exit 1
          fi
          mkdir -p "$CARGO_TARGET_DIR"
          script="$RUNNER_TEMP/bookworm-build.sh"
          cat > "$script" <<'INNER'
          set -euo pipefail
          trap 'chown -R "$HOST_UID:$HOST_GID" /work "$CARGO_TARGET_DIR" || true' EXIT
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl gzip openssl pkg-config libssl-dev tar xz-utils \
            libcap-dev binutils python3 python3-yaml python3-cryptography \
            libxkbcommon-dev git jq zstd
          git config --global --add safe.directory '*'
          ldd --version | sed -n 1p
          ./scripts/populate-bundles.sh \
            --key .dev-keys/PUBLISHER_DEV.pem \
            --owner "RyeOS Development" \
            --bundle-set "$BUNDLE_SET" --build-profile "$BUILD_PROFILE" --all
          for pkg in $EXTRA_BINS; do
            cargo build --release -p "$pkg"
            test -x "$CARGO_TARGET_DIR/release/$pkg" || {
              echo "package $pkg did not produce a binary named $pkg" >&2
              exit 1
            }
          done
          INNER
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$CARGO_TARGET_DIR:$CARGO_TARGET_DIR" \
            -v "${TMPDIR:-/tmp}:${TMPDIR:-/tmp}" \
            -v "$script:/bookworm-build.sh:ro" \
            -e BUNDLE_SET -e BUILD_PROFILE -e EXTRA_BINS -e CARGO_TARGET_DIR \
            -e TMPDIR="${TMPDIR:-/tmp}" \
            -e CARGO_TERM_COLOR -e RUST_BACKTRACE -e CARGO_INCREMENTAL \
            -e RYEOS_VCS_REF="$(git rev-parse --short=12 HEAD)" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            rust:1.95-slim-bookworm@sha256:d7482085ff5b415f84dba5647ae71606650bdef00db7aeb69f4b3d170c3e4082 \
            bash /bookworm-build.sh

      - name: Build extra binaries (runner)
        if: ${{ inputs.base != 'bookworm' && inputs.extra_bins != '' }}
        env:
          EXTRA_BINS: ${{ inputs.extra_bins }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/ryeos-node-target
        run: |
          set -euo pipefail
          if [[ ! "$EXTRA_BINS" =~ ^[A-Za-z0-9_\ -]*$ ]]; then
            echo "extra_bins must be cargo package names separated by spaces" >&2
            exit 1
          fi
          for pkg in $EXTRA_BINS; do
            cargo build --release -p "$pkg"
            test -x "$CARGO_TARGET_DIR/release/$pkg" || {
              echo "package $pkg did not produce a binary named $pkg" >&2
              exit 1
            }
          done

      - name: Pack the install artifact
        id: pack
        env:
          BUNDLE_SET: ${{ inputs.bundle_set }}
          BASE: ${{ inputs.base }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          EXTRA_BINS: ${{ inputs.extra_bins }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/ryeos-node-target
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          name="ryeos-node-${BUNDLE_SET}-${sha:0:12}"
          stage="$RUNNER_TEMP/node-pack"
          rm -rf "$stage"
          mkdir -p "$stage/target/release" "$RUNNER_TEMP/node-out"

          # The binaries the installer copies from <target>/release: its
          # required ones, the set's host-support ones, and lillux when built.
          # shellcheck source=scripts/pkg/bundle-sets.sh
          source scripts/pkg/bundle-sets.sh
          bins=(ryeosd ryeos lillux)
          mapfile -t support < <(ryeos_bundle_set_host_support_bins "$BUNDLE_SET")
          bins+=("${support[@]}")
          for b in "${bins[@]}"; do
            [[ -z "$b" ]] && continue
            if [[ -f "$CARGO_TARGET_DIR/release/$b" ]]; then
              install -m755 "$CARGO_TARGET_DIR/release/$b" "$stage/target/release/$b"
            elif [[ "$b" != lillux ]]; then
              echo "missing built binary: $b" >&2
              exit 1
            fi
          done

          # Extra packages requested through extra_bins: each must exist.
          for b in $EXTRA_BINS; do
            [[ -f "$CARGO_TARGET_DIR/release/$b" ]] || { echo "missing extra binary: $b" >&2; exit 1; }
            install -m755 "$CARGO_TARGET_DIR/release/$b" "$stage/target/release/$b"
          done

          # The populated bundle state of the checkout (everything the
          # installer reads from bundles/ that is not tracked source).
          ./scripts/ci/pack-bundle-state.sh "$stage/bundle-state.tar.zst"

          (cd "$stage/target/release" && sha256sum -- *) > "$stage/binaries.sha256"
          jq -n --arg sha "$sha" --arg set "$BUNDLE_SET" --arg ref "$GITHUB_REF_NAME" \
            --arg run "$GITHUB_RUN_ID" --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg profile "$BUILD_PROFILE" --rawfile sums "$stage/binaries.sha256" \
            '{commit:$sha, bundle_set:$set, build_profile:$profile, ref:$ref, run_id:$run, built_utc:$built,
              binaries:($sums | split("\n") | map(select(length>0) | split("  ") | {(.[1]): .[0]}) | add)}' \
            > "$stage/manifest.json"
          if [[ "$BASE" != runner || -n "$EXTRA_BINS" ]]; then
            jq --arg base "$BASE" --arg extra "$EXTRA_BINS" \
              '. + {base:$base, extra_bins:($extra | split(" ") | map(select(length>0)))}' \
              "$stage/manifest.json" > "$stage/manifest.new"
            mv "$stage/manifest.new" "$stage/manifest.json"
          fi
          cat "$stage/manifest.json"

          tar -C "$stage" --zstd -cf "$RUNNER_TEMP/node-out/$name.tar.zst" \
            manifest.json target bundle-state.tar.zst
          ls -l "$RUNNER_TEMP/node-out"
          {
            echo "name=$name"
            echo "file=$RUNNER_TEMP/node-out/$name.tar.zst"
            echo "stage=$stage"
          } >> "$GITHUB_OUTPUT"

      # base=bookworm: prove the packed binaries start on a bare Debian 12
      # image (no dev libraries) and that none needs a glibc newer than 2.36.
      - name: Verify the binaries start on bookworm
        if: ${{ inputs.base == 'bookworm' }}
        env:
          STAGE: ${{ steps.pack.outputs.stage }}
          EXTRA_BINS: ${{ inputs.extra_bins }}
        run: |
          set -euo pipefail
          sha12="$(git rev-parse --short=12 HEAD)"
          for f in "$STAGE"/target/release/*; do
            floor="$(objdump -T "$f" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1 || true)"
            echo "$(basename "$f") needs glibc <= ${floor:-none}"
            if [[ -n "$floor" && "$(printf '%s\n2.36\n' "$floor" | sort -V | tail -1)" != 2.36 ]]; then
              echo "$f needs glibc $floor, newer than bookworm's 2.36" >&2
              exit 1
            fi
          done
          cat > "$RUNNER_TEMP/bookworm-verify.sh" <<'INNER'
          set -euo pipefail
          ldd --version | sed -n 1p
          ryeos --version
          rev="$(ryeosd build-info --revision)"
          echo "ryeosd revision: $rev"
          test "$rev" = "$SHA12"
          for b in $EXTRA_BINS; do
            "$b" --help > /dev/null
            echo "$b --help ok"
          done
          INNER
          docker run --rm \
            -v "$STAGE/target/release:/node-bin:ro" \
            -v "$RUNNER_TEMP/bookworm-verify.sh:/verify.sh:ro" \
            -e PATH=/node-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e SHA12="$sha12" -e EXTRA_BINS \
            debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc \
            bash /verify.sh

      - name: Upload the install artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Print how to install it
        env:
          NAME: ${{ steps.pack.outputs.name }}
          BUNDLE_SET: ${{ inputs.bundle_set }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          {
            echo "## Node install artifact"
            echo
            echo "Artifact \`$NAME\` ($(stat -c %s "$FILE") bytes, kept 3 days), commit \`$GITHUB_SHA\`, bundle set \`$BUNDLE_SET\`."
            echo
            echo "Download and unpack into a fresh directory:"
            echo
            echo '```sh'
            echo "d=\$(mktemp -d) && gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY -n $NAME -D \"\$d\" && tar --zstd -xf \"\$d/$NAME.tar.zst\" -C \"\$d\""
            echo '```'
            echo
            echo "Install from a checkout of that commit (see build-and-test.md, install build on GitHub):"
            echo
            echo '```sh'
            echo "git worktree add --detach \"\$d/src\" $GITHUB_SHA && cd \"\$d/src\" && ./scripts/ci/unpack-bundle-state.sh \"\$d/bundle-state.tar.zst\""
            echo "./scripts/pkg/install-local-direct.sh --bundle-set $BUNDLE_SET --cargo-target-dir \"\$d/target\" --trust-source-publishers"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print the build environment and extra binaries
        if: ${{ inputs.base == 'bookworm' || inputs.extra_bins != '' }}
        env:
          NAME: ${{ steps.pack.outputs.name }}
          BASE: ${{ inputs.base }}
          EXTRA_BINS: ${{ inputs.extra_bins }}
        run: |
          {
            echo
            if [[ "$BASE" == bookworm ]]; then
              echo "Built in rust:1.95-slim-bookworm: every binary needs glibc 2.36 or older and was started in debian:bookworm-slim (ryeos --version, ryeosd build-info --revision matches the commit)."
            else
              echo "Built on the runner (ubuntu-latest): the binaries link against the runner's glibc, not bookworm's."
            fi
            if [[ -n "$EXTRA_BINS" ]]; then
              echo
              echo "Extra binaries in \`target/release/\` of the same archive: \`$EXTRA_BINS\`. After the unpack above, run \`\$d/target/release/<name>\`, for example \`\$d/target/release/ryeos-chat-stub script.yaml\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
