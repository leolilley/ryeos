name: probe durable root
on:
  push:
    branches: [work/release-dry-run]
    paths: [".github/workflows/probe-durable-root.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: probe
        run: docker buildx build --progress=plain -f .tmp-probe/Dockerfile .
