category: "claude-code"
version: "0.1.0"
executor_id: "@subprocess"
description: "Claude Code adapter profile for one RyeOS session-bound worker execution."
execution_protocol: protocol:ryeos/core/structured_session
external_product_slots: []
supported_target:
  os: linux
  arch: x86_64
  resources: []

# RLIMIT_NPROC is shared by the daemon's real UID rather than scoped to this
# process tree. The kind-owned compiler caps and freezes this signed override;
# RyeOS separately limits session groups and total dedicated workers.
session_resources:
  real_uid_process_limit: 4096

source:
  root: "lib/hosted"
  entry: "structured-session.profile.json"
  digest: "59ba82f270dc540355e2134239852d897c289a919bfc98d9ebede5417ed61846"

# The workload executable is this bundle's own signed binary, captured at
# admission. It is mounted in the execution runtime namespace so it never
# creates a mountpoint in the project copy.
external_content:
  - id: adapter
    kind: file
    bundle_binary: "bin:claude-code-adapter"
    mode: captured
    mount_root: execution_runtime
    mount: claude-code-adapter

config:
  command: "bin:core/ryeos-structured-session-bridge"
  args: ["${source.entry}"]
  env:
    PATH: ""
    LANG: "C"
    LC_ALL: "C"
  timeout_secs: 0
