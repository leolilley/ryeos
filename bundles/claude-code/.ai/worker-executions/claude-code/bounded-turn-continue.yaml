# ryeos:signed:2026-11-16T12:02:07Z:f0d567bc71e1ab0fccc3e7d9bf4f517592cd28fa1f2a018be50779eba7e70263:XdZL+j5msJCyGRUZCK8h6qmLFW6EgULcSwcVE9fnrJUBxpsvcct5pzFW1pzH9kwNlpgJvqHBfuTOdtJbWwn6Dg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "0.1.0"
category: claude-code
description: "Continue the upstream Claude Code conversation of a completed predecessor with one completion-fenced read-write turn, and retain its private candidate for owner review."
config:
  worker_ref: null
  environment_binding: environment
  required_credential_state: active
  route_set: continue
  allowed_effect_classes:
    - external_effect
    - pure_read
    - session_mutation
  credential_home_env: RYEOS_WORKLOAD_HOME
  workspace_env: RYEOS_WORKSPACE
  require_pinned_cow: true
  required_terminal_publication: retain_result
  max_lifetime_seconds: 14400
  recover_upstream_session: true
  mode:
    kind: bounded_turn
    # Resumes the completed predecessor's upstream conversation named by the
    # invocation's `continue_from`; no session is ever started.
    continuation: completed_predecessor
    turn_start_route: turn.start
    max_uncontacted_attempts: 3
  candidate_disposition: retained_for_review
  # The worker never calls back into RyeOS tools.
  workload_client_delegation_caps: []
limits:
  turns: 1
  duration_seconds: 15000
requires:
  capabilities:
    declared:
      - ryeos.runtime.dedicated_session.start
      - ryeos.runtime.dedicated_session.command
      - ryeos.runtime.dedicated_session.terminate
