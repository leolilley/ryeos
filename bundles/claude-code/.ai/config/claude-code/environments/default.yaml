category: claude-code/environments
schema: ryeos.worker_environment.v7
external_product_slots: []
worker_ref: worker:claude-code/hosted
external_content: []
configuration:
  executable_search: []
  # The model key and the gateway address are host-provided values. Only their
  # names are retained anywhere; the daemon reads the values at session start.
  process_environment:
    ANTHROPIC_API_KEY:
      kind: delivered_secret
      name: ANTHROPIC_API_KEY
    ANTHROPIC_BASE_URL:
      kind: delivered_secret
      name: ANTHROPIC_BASE_URL
    # Claude Code's own executable (not the workload executable, which is the
    # adapter). This is a placeholder absolute path: replace it with the path
    # the node's Claude Code install or realization is served at. The adapter
    # refuses to start a session when the path does not name a file.
    CLAUDE_CODE_EXECUTABLE:
      kind: literal
      value: /path/to/claude-code/bin/claude
    # The signed MCP server list the adapter writes as Claude Code's only MCP
    # configuration. Empty: no MCP server is reachable.
    CLAUDE_CODE_MCP_CONFIG:
      kind: literal
      value: '{"mcpServers":{}}'
credential_requirement:
  workload_family: claude-code
  required_state: active
  subject_projection_contract: ryeos.credential.delivered_secret.v1
portable_state_contract: ryeos.worker_session.restore.v1
workload_client: null
