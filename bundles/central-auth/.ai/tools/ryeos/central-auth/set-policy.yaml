version: "0.1.0"
category: "ryeos/central-auth"
name: "set-policy"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.ryeos.central-auth.set-policy"]
description: "Store the central-auth role/capability policy for a realm."

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "set-policy"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    policy:
      type: object
      description: "Policy object with roles, allowed_capabilities and login_throttle {max_failures, window_secs, lockout_secs}."
  required: [realm_id, policy]
