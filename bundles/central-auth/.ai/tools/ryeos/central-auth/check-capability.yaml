version: "0.1.0"
category: "ryeos/central-auth"
name: "check-capability"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.ryeos.central-auth.check-capability"]
description: "Verify a session token and check one required capability."

requires:
  capabilities:
    manifest:
      runtime_authority:
        state_home:
          namespace:
            from_param: realm_id
          access: read_write

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "check-capability"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    session_token:
      type: string
    required_capability:
      type: string
  required: [realm_id, session_token, required_capability]
