# ryeos:signed:2026-07-27T09:00:06Z:74bfd2b96ee67e09b16911053143e8961f46d9bf38ac40e1a4235854a6603982:EAY4chXiGW/9HaBD9xlAJcvAFN+HeAgH31cSGIgvXlyLs9LbG/YxQOtHwL8CPH8poht8MYfd+17/S4+srGwvBA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "0.1.0"
category: "ryeos/central-auth"
name: "check-capability"
executor_id: "@subprocess"
required_caps: ["ryeos.execute.tool.ryeos.central-auth.check-capability"]
description: "Verify a session token and check one required capability."

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "check-capability"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root used for .ai/state/central-auth storage."
    runtime_state_dir:
      type: string
      description: "Optional absolute central-auth runtime state dir override."
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. tv-tracker."
    session_token:
      type: string
    required_capability:
      type: string
  required: [realm_id, session_token, required_capability]
