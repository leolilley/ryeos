# ryeos:signed:2026-07-27T09:00:06Z:33e7f0bfc3058f29f6357e680988c5de3d7ad72f7a215ee61b1de533c64fdbcf:h3hLleAeOGqU1HVH8xi8MI2O0dWFzRG/SJyxfzFrK2sreXOlVbjuiEcyKkLkvmiHNYm+nkIF3Cqf1iq6Rg8GAQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "0.1.0"
category: "ryeos/central-auth"
name: "verify-session"
executor_id: "@subprocess"
required_caps: ["ryeos.execute.tool.ryeos.central-auth.verify-session"]
description: "Verify a session token and optionally check one required capability."

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "verify-session"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root used for .ai/state/central-auth storage."
    runtime_state_dir:
      type: string
      description: "Optional absolute central-auth runtime state dir override."
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. tv-tracker."
    session_token:
      type: string
    required_capability:
      type: string
  required: [realm_id, session_token]
