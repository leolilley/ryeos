# ryeos:signed:2026-09-05T00:45:23Z:f38b611a34b359732e7a45c4a5a58b2a1adfadff900dc45250b4d1b792bb03cf:kARWpChd65S5SZ9QEaEqs8USNVwmOg5edvLIu1I5hEDmewmXO7Q/wKIFhRr34ydddSeNL1Jbud/ssOsfIzBLCw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "0.1.0"
category: "ryeos/central-auth"
name: "create-invite"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.ryeos.central-auth.create-invite"]
description: "Create a high-entropy one-time invite code for a realm."

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "create-invite"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root used for .ai/state/central-auth storage."
    runtime_state_dir:
      type: string
      description: "Optional absolute central-auth runtime state dir override."
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. tv-tracker."
    roles:
      type: array
      items: { type: string }
      default: []
    capabilities:
      type: array
      items: { type: string }
      default: []
    ttl_secs:
      type: integer
      default: 86400
    max_uses:
      type: integer
      default: 1
  required: [realm_id]
