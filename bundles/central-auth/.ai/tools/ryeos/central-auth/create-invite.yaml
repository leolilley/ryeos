version: "0.1.0"
category: "ryeos/central-auth"
name: "create-invite"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.ryeos.central-auth.create-invite"]
description: "Create a high-entropy one-time invite code for a realm."

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "create-invite"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root used for .ai/state/central-auth storage."
    runtime_state_dir:
      type: string
      description: "Optional absolute central-auth runtime state dir override."
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    roles:
      type: array
      items: { type: string }
      default: []
    capabilities:
      type: array
      items: { type: string }
      default: []
    ttl_secs:
      type: integer
      default: 86400
    max_uses:
      type: integer
      default: 1
  required: [realm_id]
