# ryeos:signed:2026-11-13T00:43:18Z:37e087dfcc6d917064568bf0bbb2268d720191f24edc78099aa443a4b9c56ede:M1Xl7giA9ufNWj3nwrpKdBcdaSIDIJJMcmv2U6qUyAhXXVBpr9Lze1G3Da8ou/ARVbBOhtpubDjNw3lOZVaIAQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "0.1.0"
category: "ryeos/central-auth"
name: "create-invite"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.ryeos.central-auth.create-invite"]
description: "Create a high-entropy one-time invite code for a realm."

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "create-invite"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    roles:
      type: array
      items: { type: string }
      default: []
    capabilities:
      type: array
      items: { type: string }
      default: []
    ttl_secs:
      type: integer
      default: 86400
    max_uses:
      type: integer
      default: 1
  required: [realm_id]
