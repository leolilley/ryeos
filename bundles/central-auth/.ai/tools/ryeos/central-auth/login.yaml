version: "0.1.0"
category: "ryeos/central-auth"
name: "login"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.ryeos.central-auth.login"]
description: "Validate credentials or redeem an invite and issue an opaque session token."

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "login"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root used for .ai/state/central-auth storage."
    runtime_state_dir:
      type: string
      description: "Optional absolute central-auth runtime state dir override."
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    method:
      type: string
      enum: [passphrase, invite]
      default: passphrase
    principal_id:
      type: string
    display_name:
      type: string
      description: "Required for invite redemption."
    passphrase:
      type: string
    invite_code:
      type: string
      description: "Required for invite redemption."
    ttl_secs:
      type: integer
      default: 28800
  required: [realm_id, method]
