# ryeos:signed:2026-10-12T21:49:53Z:2c50a1308867421f2d60603b78af700952296a6d0e24ae79cdb06beef242830f:a1xp/mecdmFE9XwO/t2e5lxUkHr4m3NtZ9X16Xk6k9WYRnNBS5tYJYzenfLFsiYBU/hgw8ebs0iUcJeBKiI+Dw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "0.1.0"
category: "ryeos/central-auth"
name: "create-principal"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.ryeos.central-auth.create-principal"]
description: "Create a central-auth principal with roles, capabilities, and optional passphrase."

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "create-principal"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root used for .ai/state/central-auth storage."
    runtime_state_dir:
      type: string
      description: "Optional absolute central-auth runtime state dir override."
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    principal_id:
      type: string
    display_name:
      type: string
    roles:
      type: array
      items: { type: string }
      default: []
    capabilities:
      type: array
      items: { type: string }
      default: []
    passphrase:
      type: string
    bootstrap:
      type: boolean
      default: false
    replace:
      type: boolean
      default: false
    disabled:
      type: boolean
      default: false
  required: [realm_id, principal_id, display_name]
