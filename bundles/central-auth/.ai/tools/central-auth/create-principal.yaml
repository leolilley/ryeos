version: "0.1.0"
category: "central-auth"
name: "create-principal"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.central-auth.create-principal"]
description: "Create a central-auth principal with roles, capabilities, and optional passphrase."

requires:
  capabilities:
    manifest:
      runtime_authority:
        state_home:
          namespace:
            from_param: realm_id
          access: read_write

env_config:
  interpreter:
    type: local_binary
    binary: python
    candidates: [python3]
    search_paths: []
    var: RYE_PYTHON
    path_candidates: [python3]
  env:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"

config:
  command: "${interpreter}"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "create-principal"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    principal_id:
      type: string
    display_name:
      type: string
    roles:
      type: array
      items: { type: string }
      default: []
    capabilities:
      type: array
      items: { type: string }
      default: []
    passphrase:
      type: string
    bootstrap:
      type: boolean
      default: false
    replace:
      type: boolean
      default: false
    disabled:
      type: boolean
      default: false
  required: [realm_id, principal_id, display_name]
