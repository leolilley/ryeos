version: "0.1.0"
category: "central-auth"
name: "set-policy"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.central-auth.set-policy"]
description: "Store the central-auth role/capability policy for a realm."

requires:
  capabilities:
    manifest:
      runtime_authority:
        state_home:
          namespace:
            from_param: realm_id
          access: read_write

env_config:
  interpreter:
    type: local_binary
    binary: python
    candidates: [python3]
    search_paths: []
    var: RYE_PYTHON
    path_candidates: [python3]
  env:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"

config:
  command: "${interpreter}"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "set-policy"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    policy:
      type: object
      description: "Policy object with roles, allowed_capabilities and login_throttle {max_failures, window_secs, lockout_secs}."
  required: [realm_id, policy]
