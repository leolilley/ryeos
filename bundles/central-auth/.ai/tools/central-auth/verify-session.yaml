version: "0.1.0"
category: "central-auth"
name: "verify-session"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.central-auth.verify-session"]
description: "Verify a session token and optionally check one required capability."

requires:
  capabilities:
    manifest:
      runtime_authority:
        state_home:
          namespace:
            from_param: realm_id
          access: read_write

env_config:
  interpreter:
    type: local_binary
    binary: python
    candidates: [python3]
    search_paths: []
    var: RYE_PYTHON
    path_candidates: [python3]
  env:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"

config:
  command: "${interpreter}"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "verify-session"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    session_token:
      type: string
    required_capability:
      type: string
  required: [realm_id, session_token]
