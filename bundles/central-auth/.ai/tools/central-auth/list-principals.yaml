version: "0.1.0"
category: "central-auth"
name: "list-principals"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.central-auth.list-principals"]
description: "Read-only roster of the realm's accounts: id, display_name, roles, disabled. Never returns passphrases or secrets; fails with state_corrupt rather than skip an unreadable account. With actor_principal_id (an enabled operator under the policy's principal_management), each entry also says whether that operator may manage it."

requires:
  capabilities:
    manifest:
      runtime_authority:
        state_home:
          namespace:
            from_param: realm_id
          access: read_write

env_config:
  interpreter:
    type: local_binary
    binary: python
    candidates: [python3]
    search_paths: []
    var: RYE_PYTHON
    path_candidates: [python3]
  env:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"

config:
  command: "${interpreter}"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "list-principals"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    actor_principal_id:
      type: string
      description: "Operator viewing the roster; adds manageable / protected_reason per entry."
  required: [realm_id]
