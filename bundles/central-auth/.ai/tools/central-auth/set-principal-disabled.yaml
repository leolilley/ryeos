version: "0.1.0"
category: "central-auth"
name: "set-principal-disabled"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.central-auth.set-principal-disabled"]
description: "Disable or re-enable one account an operator may manage, idempotent per request_id. Disabling invalidates every earlier session of that account. Changes nothing else about the account."

requires:
  capabilities:
    manifest:
      runtime_authority:
        state_home:
          namespace:
            from_param: realm_id
          access: read_write

env_config:
  interpreter:
    type: local_binary
    binary: python
    candidates: [python3]
    search_paths: []
    var: RYE_PYTHON
    path_candidates: [python3]
  env:
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"

config:
  command: "${interpreter}"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "set-principal-disabled"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    actor_principal_id:
      type: string
      description: "Enabled operator making the change (holds principal_management.operator_capability)."
    principal_id:
      type: string
      description: "Account to disable or re-enable."
    disabled:
      type: boolean
    request_id:
      type: string
      description: "Caller-chosen idempotency key, [A-Za-z0-9][A-Za-z0-9._-]{0,127}; a retry with the same key resumes or replays."
  required: [realm_id, actor_principal_id, principal_id, disabled, request_id]
