version: "0.1.0"
category: "central-auth"
name: "login"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.central-auth.login"]
description: "Validate credentials or redeem an invite and issue an opaque session token."

requires:
  capabilities:
    manifest:
      runtime_authority:
        state_home:
          namespace:
            from_param: realm_id
          access: read_write

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "login"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
    method:
      type: string
      enum: [passphrase, invite]
      default: passphrase
    principal_id:
      type: string
    display_name:
      type: string
      description: "Required for invite redemption."
    passphrase:
      type: string
    client_address:
      type: string
      description: "Optional client network address seen by the app backend; throttled alongside principal_id."
    invite_code:
      type: string
      description: "Required for invite redemption."
    ttl_secs:
      type: integer
      default: 28800
  required: [realm_id, method]
