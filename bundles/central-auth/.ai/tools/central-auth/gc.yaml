version: "0.1.0"
category: "central-auth"
name: "gc"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["ryeos.execute.tool.central-auth.gc"]
description: "Full sweep: remove expired sessions, exhausted or expired invites, and stale login-failure records. Login and verify-session also purge a bounded sample on every call."

requires:
  capabilities:
    manifest:
      runtime_authority:
        state_home:
          namespace:
            from_param: realm_id
          access: read_write

config:
  command: "python3"
  args:
    - "${tool_dir}/lib/central_auth.py"
    - "gc"
  input_data: "${params_json}"
  timeout_secs: 15

config_schema:
  type: object
  properties:
    realm_id:
      type: string
      description: "Realm/app namespace, e.g. example-app."
  required: [realm_id]
