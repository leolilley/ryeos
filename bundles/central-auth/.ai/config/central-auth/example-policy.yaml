category: "central-auth"
version: "0.1.0"
description: "Example central-auth policy for a sample application."

realm_id: example-app
policy:
  roles:
    viewer:
      capabilities:
        - example-app.ratings.read
    analyst:
      capabilities:
        - example-app.ratings.read
        - example-app.ai.chat
    admin:
      capabilities:
        - example-app.ratings.read
        - example-app.ratings.write
        - example-app.ai.chat
        - example-app.admin
  allowed_capabilities:
    - example-app.ratings.read
    - example-app.ratings.write
    - example-app.ai.chat
    - example-app.admin
  login_throttle:
    max_failures: 5
    window_secs: 900
    lockout_secs: 900
