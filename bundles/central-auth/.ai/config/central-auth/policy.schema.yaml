# ryeos:signed:2026-11-16T00:19:46Z:91690f6dcabd52a2289750f9303607f19615b8698737225d084bc9ee29542b8f:8iMixiEi+CT9O4s9Y+e1UT4WhQjmkisOAzRyFJaHUFVdzckQ1AGtTjEk44NtHpPWnO1PauwPbcxkhyEEUzyHCw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "central-auth"
version: "0.1.0"
description: "JSON-schema-style contract for central-auth realm policies."

type: object
required:
  - roles
  - allowed_capabilities
  - login_throttle
properties:
  roles:
    type: object
    additionalProperties:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          items:
            type: string
  allowed_capabilities:
    type: array
    items:
      type: string
  login_throttle:
    type: object
    additionalProperties: false
    required:
      - max_failures
      - window_secs
      - lockout_secs
    properties:
      max_failures:
        type: integer
        minimum: 1
        description: "Failed passphrase logins per principal (and per client_address, when given) within window_secs before a lockout."
      window_secs:
        type: integer
        minimum: 1
      lockout_secs:
        type: integer
        minimum: 1
  principal_management:
    type: object
    additionalProperties: false
    description: "Optional. Lets an operator list accounts with manageability and disable or re-enable them (set-principal-disabled). Without it those requests are refused with principal_management_unconfigured."
    required:
      - operator_capability
      - managed_roles
    properties:
      operator_capability:
        type: string
        description: "Capability (in allowed_capabilities) that marks an operator. Always protected: no operator manages another."
      managed_roles:
        type: array
        minItems: 1
        items:
          type: string
        description: "Roles an operator may manage. A manageable account has only these roles and no direct capabilities."
      protected_capabilities:
        type: array
        items:
          type: string
        description: "Capabilities whose holders are never manageable, in addition to operator_capability."
