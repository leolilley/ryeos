category: "central-auth"
version: "0.1.0"
description: "JSON-schema-style contract for central-auth realm policies."

type: object
required:
  - roles
  - allowed_capabilities
  - login_throttle
properties:
  roles:
    type: object
    additionalProperties:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          items:
            type: string
  allowed_capabilities:
    type: array
    items:
      type: string
  login_throttle:
    type: object
    additionalProperties: false
    required:
      - max_failures
      - window_secs
      - lockout_secs
    properties:
      max_failures:
        type: integer
        minimum: 1
        description: "Failed passphrase logins per principal (and per client_address, when given) within window_secs before a lockout."
      window_secs:
        type: integer
        minimum: 1
      lockout_secs:
        type: integer
        minimum: 1
