# Execution config — system defaults
# Override per-project: .ai/config/execution/execution.yaml
category: "execution"
version: "2.0.0"
schema_version: "2.0.0"

# Defaults applied to all tool executions
defaults:
  timeout: 86400
  max_steps: 100
  max_concurrency: 10
  # Cancellation policy applied when the daemon kills a running tool.
  # Read by `NativeAsyncHandler` when the tool declares
  # `native_async: true`. Tools that supply the rich form
  # (`native_async: { cancel_mode, graceful_shutdown_secs }`) override
  # these per-tool. Modes: "graceful" (SIGTERM, wait, SIGKILL) | "hard"
  # (SIGKILL immediately).
  cancellation_mode: "graceful"
  cancellation_grace_secs: 5

# Per-item overrides, keyed first by canonical kind and then bare item id.
# items:
#   tool:
#     "my/scraper/tool":
#       timeout: 600
#       cancellation_grace_secs: 30

# Generic root-history default. The node's own signed config layer may replace
# this complete block. No retention age exists in Rust; omitting all signed
# history blocks resolves Durable as well. An optional `minimum_terminal_for`
# bounds both the finite node default and trusted item-authored overrides; a
# node default below that minimum is invalid at boot.
history:
  default_retention: durable
  item_authored_retention: allow

# Other node-scoped valves — read by the daemon at boot from bundle layers plus
# the node's own tree (<app_root>/.ai/config/execution/execution.yaml),
# which is the operator's overlay. Per-launch policy reads use the project
# as overlay and never read this section, so a project cannot set
# node-wide limits.
node:
  # Ceiling on launched-and-live launch-window members across ALL fanouts on
  # this node (a member is a child chain; see the graph foreach
  # `max_concurrency` launch window). The node may replace this signed default,
  # but project and item layers cannot widen it.
  max_live_fanout: 8
