category: ryeos/core/records
version: "1.0.0"
description: The node's signed capability report, a single record signed by the node key.

# One record kind. The node reads it through the verifier named here, so a
# record the node would refuse at launch admission is never served as good.
record_kind: capability_report
storage:
  type: node_file
  path: ".ai/state/node-capability-report.json"
  format: json
verifier: node_signed_json_digest
key: singleton
holder: null
summary:
  - /schema
  - /generated_at
  - /composition/host_class
max_bytes: 1048576
freshness: node_policy_generation
collections:
  - name: provided
    from: /provided
    key_field: name
  - name: missing
    from: /missing
    key_field: name
  - name: floor_met
    from: /floor/met_by
    key_field: label
  - name: floor_unmet
    from: /floor/unmet
    key_field: label
  - name: capacity
    from: /capacity
    key_field: name
