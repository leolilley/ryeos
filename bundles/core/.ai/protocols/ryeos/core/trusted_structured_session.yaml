kind: protocol
name: trusted_structured_session
category: ryeos/core
abi_version: v1
description: Session-bound structured subprocess for a node-authorized trusted process-group placement.
stdin:
  shape: opaque
stdout:
  shape: opaque_bytes
  mode: terminal
env_injections: []
capabilities:
  allows_pushed_head: false
  allows_target_site: false
  allows_detached: false
lifecycle:
  mode: managed
callback_channel: none
session:
  process_mode: exclusive_session
  cleanup_authority: trusted_process_group
  workspace_authority: runtime_workspace
  network_authority: node_policy
  runtime_env_allowlist:
    - RYEOS_WORKLOAD_HOME
    - RYEOS_WORKLOAD_EXECUTABLE
    - RYEOS_WORKSPACE
    - RYEOS_STRUCTURED_SESSION_ROUTE_SET
    - RYEOS_STRUCTURED_SESSION_EFFECT_CLASSES
    - RYEOS_STRUCTURED_SESSION_PROFILE_HASH
    - RYEOS_STRUCTURED_SESSION_ROUTE_FIXED_PARAMS
    - RYEOS_SESSION_PROCESS_ENVIRONMENT
    - RYEOS_SESSION_SECRET_FD
  readiness_identity_env: RYEOS_SESSION_BOOT_IDENTITY
  channel: inherited_unix_socket
  channel_env: RYEOS_SESSION_FD
  framing: u32_be_json
  wire_protocol: ryeos.structured-session
  wire_version: 2
  max_frame_bytes: 16777216
holding:
  requires_guarantees:
    - { name: sessions:trusted_process_group, accept: [trusted] }
  filesystem_authority: node_policy
  root_settlement: trusted_process_group_absent
