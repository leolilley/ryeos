kind: protocol
name: trusted_structured_session
category: ryeos/core
abi_version: v1
description: Session-bound structured subprocess for a node-authorized trusted process-group placement.
stdin:
  shape: opaque
stdout:
  shape: opaque_bytes
  mode: terminal
env_injections: []
capabilities:
  allows_pushed_head: false
  allows_target_site: false
  allows_detached: false
lifecycle:
