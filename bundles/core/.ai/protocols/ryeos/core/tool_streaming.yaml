kind: protocol
name: tool_streaming
category: ryeos/core
abi_version: v1
description: Tool with streaming stdout chunks; daemon reads length-prefixed JSON frames during execution.
stdin:
  # Input remains the ordinary signed executor plan's input_data. Framing
  # changes stdout interpretation, not command, environment, stdin or mounts.
  shape: opaque
stdout:
  shape: streaming_chunks
  mode: streaming
env_injections:
  - { name: RYE_THREAD_ID, source: thread_id }
  - { name: RYE_PROJECT_PATH, source: project_path }
capabilities:
  allows_pushed_head: true
  allows_target_site: true
  allows_detached: false
lifecycle:
  mode: managed
callback_channel: none
