kind: protocol
name: runtime
category: ryeos/core
abi_version: v1
description: Native runtime spawn. LaunchEnvelope on stdin, RuntimeResult on stdout, callback channel.
stdin:
  shape: launch_envelope
stdout:
  shape: runtime_result
  mode: terminal
env_injections:
  - { name: RYEOSD_SOCKET_PATH, source: callback_socket_path }
