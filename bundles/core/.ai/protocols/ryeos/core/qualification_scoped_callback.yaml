# ryeos:signed:2026-11-13T00:27:41Z:720f61dfb23004a17460b6fb173db50b56f16f8ce84b8e61a97c643d7d27cbd8:G8EkDqlRtcV1YksMluzpESqTdMxutZVpsOjQ2GiZx5LaWR3ixkdAH+JwXZaOGbuGcX0CEB5luyHpvWTfsNSgAQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: protocol
name: qualification_scoped_callback
category: ryeos/core
abi_version: v1
description: Dedicated direct verifier callback protocol for one daemon-owned scoped producer.
stdin:
  shape: opaque
stdout:
  shape: opaque_bytes
  mode: terminal
env_injections:
  - { name: RYE_THREAD_ID, source: thread_id }
  - { name: RYE_PROJECT_PATH, source: project_path }
  - { name: RYEOSD_SOCKET_PATH, source: callback_socket_path }
  - { name: RYEOSD_CALLBACK_TOKEN, source: callback_token }
  - { name: RYEOSD_THREAD_ID, source: thread_id }
  - { name: RYEOSD_PROJECT_STATE_SCOPE, source: project_state_scope }
  - { name: RYEOSD_THREAD_AUTH_TOKEN, source: thread_auth_token }
# A qualification verifier on the pinned-snapshot project lane runs against the exact snapshot the subject was
# captured from, so its project source is a pushed head. The capability is open only to an item that declares that
# lane (project_lane: pinned_snapshot); remote and detached dispatch stay closed.
capabilities:
  allows_pushed_head: true
  pushed_head_requires_declaration: true
  allows_target_site: false
  allows_detached: false
lifecycle:
  mode: managed
callback_channel: runtime_socket
qualification_callback: scoped_producer
execution_evidence:
  handler: handler:ryeos/core/scoped-qualification-execution-evidence
  config: {}
  limits:
    max_request_bytes: 2097152
    max_response_bytes: 2097152
    max_events: 128
    max_event_bytes: 65536
    max_calls: 1
    max_call_bytes: 65536
