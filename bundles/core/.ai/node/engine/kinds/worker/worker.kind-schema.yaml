    max_cpu_seconds: 3600
    real_uid_process_limit: 512
    resource_overrides_path: [session_resources]
    max_real_uid_process_limit: 4096
    ready_timeout_ms: 600000
    request_timeout_ms: 3600000
    idle_timeout_ms: 1800000
  external_content:
    realization_derived: effective_external_realizations
    allowed_roots: ["bundle:own"]
    allowed_mount_roots: [project, execution_runtime]
    max_declarations: 8
    large_content:
      max_total_bytes: 17179869184
formats:
  - extensions: [".yaml", ".yml"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"
inventory_policy:
  admission:
    capability_template: "ryeos.execute.{kind}.{bare_id}"
  required_metadata: [executor_id]
composer: handler:ryeos/core/identity
composed_value_contract:
  root_type: mapping
  required:
    category: {type: single, prim: string}
    version: {type: single, prim: string}
    executor_id: {type: single, prim: string}
    config: {type: single, prim: mapping}
    external_content: {type: single, prim: sequence}
    external_product_slots: {type: single, prim: sequence}
    source: {type: single, prim: mapping}
    supported_target: {type: single, prim: mapping}
  optional:
    description: {type: single, prim: string}
    session_resources: {type: single, prim: mapping}
    # A worker states its subprocess protocol either as the single
    # `execution_protocol` or as the `execution_protocols` list of admissible
    # protocols, never both; the node picks the one whose holding it meets.
    execution_protocol: {type: single, prim: string}
    execution_protocols: {type: single, prim: sequence}
    filesystem_authority: {type: single, prim: string}
    resource_authority: {type: single, prim: string}
runtime:
  handlers:
    - type: config
    - type: env_config
    - type: config_resolve
    - type: execution_params
  ignored_keys:
    - category
    - version
    - description
    - executor_id
    - execution_protocol
    - execution_protocols
    - external_content
    - external_product_slots
    - source
    - supported_target
    - session_resources
    - filesystem_authority
    - resource_authority
metadata:
  rules:
    name:
      from: filename
      required: true
      match: filename
    version:
      from: path
      key: version
    category:
      from: path
      key: category
      required: true
      match: path
    description:
      from: path
      key: description
    executor_id:
      from: path
      key: executor_id
