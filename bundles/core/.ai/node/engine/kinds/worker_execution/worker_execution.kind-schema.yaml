# ryeos:signed:2026-11-11T02:56:41Z:2fb6833976d8b70a851eb73f1fbbda892e250081e3bae0069472ce1a40ef495a:bAGHBzx6qBwk/31hFc+m0OkyePliv5VqDCC9FW8eFzNKUQNnlDw7a18c6qhNdgSzo8lwpYk5XKF4VGOl0C9OCQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "engine/kinds/worker_execution"
inventory_policy:
  admission:
    capability_template: "ryeos.execute.{kind}.{bare_id}"
version: "1.0.0"
location:
  directory: worker-executions
resolution: []
effective_trust:
  include_references: false
# Which spaces and trust classes may supply a launch root of this kind.
# Only signed bundles supply this kind; a project or node file is ignored.
launch_trust:
  allowed_spaces: [bundle]
  allowed_trust: [trusted_bundle]
  operator_may_admit: []
execution:
  delegate:
    via: runtime_registry
  thread_profile:
    name: worker_execution
    root_executable: true
    supports_interrupt: false
    supports_continuation: true
    supports_operator_followup: false
  hooks:
    authored_path: [hooks]
    plan_derived: effective_hook_plan
    events:
      worker_execution_terminal:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event, status]
        allowed_results: [discard, observation]
formats:
  - extensions: [".yaml", ".yml"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"
composer: handler:ryeos/core/identity
composer_config:
  policy_facts:
    - name: effective_caps
      path: [requires, capabilities, declared]
      expect: array_of_strings
composed_value_contract:
  root_type: mapping
  required:
    version: {type: single, prim: string}
    category: {type: single, prim: string}
    config: {type: single, prim: mapping}
    requires: {type: single, prim: mapping}
  optional:
    description: {type: single, prim: string}
    hooks: {type: single, prim: mapping}
    limits: {type: single, prim: mapping}
metadata:
  rules:
    name:
      from: filename
      required: true
    version:
      from: path
      key: version
    category:
      from: relative_dir
      required: true
    description:
      from: path
      key: description
