# ryeos:signed:2026-09-16T22:32:47Z:b180472550fc6b13226c8668f3d99b70264940bebd83de7c3f1dcfd153b48f1e:J9aaTw9+BVLq+wwVlAPYNWPLcS+dQB4Bbx09f3xNrvIlZ8DDKcl0yS4nYRR3OQ6YFIsowkMXvLzRwNi+bRWvCQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "engine/kinds/tool"
version: "1.3.0"
location:
  directory: tools
  excluded_directories: [lib]
effective_trust:
  include_references: false
resolution: []
execution:
  source_closure:
    derived: effective_source_closure
    location:
      type: item_namespace
    testimony: owner_signed_files
    max_files: 4096
    max_total_bytes: 67108864
    max_file_bytes: 8388608
    max_depth: 64
  # Kind-owned location of the author's durable-effect ceiling. Generic
  # dispatch consumes only this signed mechanical projection; it never names
  # or interprets the tool document's `effects` field directly.
  effect_class_ceiling:
    path: [effects]
  # Generic shared-workspace relationship for workload-delegated children.
  # Absence on an item is deny-all for that surface. This is not inferred from
  # durable effects: replay semantics cannot grant workspace mutation.
  workspace_access:
    path: [workspace_access]
  # Generic per-execution network narrowing. Ordinary tools deliberately
  # retain the node-policy ceiling when this optional composed field is absent;
  # development build/test items author `isolated` explicitly.
  network_authority_ceiling:
    path: [network_authority]
    default: node_policy
  # Captured content is an irreversible ceiling over node/parent host mounts.
  # The default for an ordinary tool is owned here, never by its dispatcher.
  filesystem_authority_ceiling:
    path: [filesystem_authority]
    default: node_policy
  # Direct opaque producers and evaluators use the same signed target
  # contract as resident workers. Ordinary tools omit it and request no
  # constrained execution resource.
  target:
    path: [supported_target]
    required: false
    limits:
      max_requirements: 1
      max_resource_count: 1
      max_facts_per_requirement: 16
  resource_authority_ceiling:
    path: [resource_authority]
    default: node_policy
  terminator:
    kind: subprocess
    # The item must select its complete subprocess wire from this closed
    # kind-owned allowlist. This is the existing generic protocol-selection
    # path: callback-free build/test tools use `opaque`, while tools that
    # actually need daemon callbacks say so explicitly. Never infer callback
    # authority from a tool name, executable, or caller.
    protocol:
      from_composed: [execution_protocol]
      allowed:
        - protocol:ryeos/core/tool_callback
        - protocol:ryeos/core/opaque
        - protocol:ryeos/core/tool_streaming
  thread_profile:
    name: tool_run
    root_executable: true
    supports_interrupt: false
    supports_continuation: false
  aliases:
    "@subprocess": "tool:ryeos/core/subprocess/execute"
    "@method_dispatch": "tool:ryeos/core/method-dispatch/execute"
  # An ordinary tool is a complete RyeOS execution and may therefore own its
  # exact retained input/runtime content. This is the child-local environment
  # boundary; managed parent launch preparers must not retain speculative
  # environments for tools that may be dispatched later.
  external_content:
    realization_derived: effective_external_realizations
    allowed_roots: [project_files]
    allowed_mount_roots: [project, execution_runtime]
    max_declarations: 8
    large_content:
      max_total_bytes: 68719476736
formats:
  - extensions: [".py"]
    parser: parser:ryeos/core/python/tool-header
    signature:
      prefix: "#"
      after_shebang: true
  - extensions: [".sh"]
    parser: parser:ryeos/core/shell/tool-header
    signature:
      prefix: "#"
      after_shebang: true
  - extensions: [".yaml", ".yml"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"
  - extensions: [".js", ".ts", ".mjs", ".cjs"]
    parser: parser:ryeos/core/javascript/javascript
    signature:
      prefix: "//"
  - extensions: [".json"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"
# Empty by design — tool fields (executor_id, tool_type, etc.) are
# extracted via metadata.rules from kind-specific keys in parser_config,
# not enforced at the kind-level shape.
# Identity composer — this kind has no multi-document composition (no extends chain, no inheritance). Items are loaded as-is.
inventory_schema_keys: [input_schema, parameters, config_schema]
inventory_policy:
  admission:
    capability_template: "ryeos.execute.{kind}.{bare_id}"
  required_metadata: [executor_id]
composer: handler:ryeos/core/identity
composed_value_contract:
  root_type: mapping
  required: {}
  optional:
    # Structured runtime capability requirements. The daemon mints the
    # requested manifest-backed subset into the callback token at launch —
    # this is NOT self-grantable authority like `required_caps`.
    requires:
      type: single
      prim: mapping
    # Author-vouched effect class for this item: `sealed` | `recorded` |
    # `live`. At dispatch a caller may not claim a stronger durable class
    # than the item declares here — a tool that writes outside its result
    # envelope declares `live`, and no graph node can then record it, because
    # replay serves the stored result and would silently skip the writes.
    # Absent means live/ineligible. Durable replay is never inferred.
    effects:
      type: single
      prim: string
    workspace_access:
      type: single
      prim: string
    # Closed mechanical launch ceiling projected by the signed kind schema.
    # This never grants network access: `node_policy` preserves the parent/node
    # ceiling, while `isolated` can only narrow it.
    network_authority:
      type: single
      prim: string
    filesystem_authority:
      type: single
      prim: string
    # Explicit subprocess wire and bearer boundary. Absence is not a fallback:
    # an attempted execution fails protocol selection.
    execution_protocol:
      type: single
      prim: string
    source_scope:
      type: single
      prim: mapping
    external_content:
      type: single
      prim: array
    external_product_slots:
      type: single
      prim: array
    supported_target:
      type: single
      prim: mapping
    resource_authority:
      type: single
      prim: string
runtime:
  # Tool invocation selectors remain ordinary schema-validated input. The
  # shared runtime template may project one scalar `params` value into one
  # argv/environment value; never add a tool/development-specific argv builder
  # or command-multiplexer execution path here or in generic dispatch.
  handlers:
    - type: config
    - type: env_config
    - type: config_resolve
    - type: execution_params
    - type: native_async
    - type: native_resume
  # Keys that are NOT runtime blocks (metadata fields, header). Engine
  # ignores these during runtime block dispatch. Anything else not
  # claimed by a registered handler is a hard `UnknownRuntimeBlock`
  # error.
  ignored_keys:
    - version
    - category
    - description
    - executor_id
    - tool_type
    - required_secrets
    - name
    # `required_caps` is extracted into metadata and enforced by
    # the service/native-runtime/subprocess dispatch paths.
    # Ignored here (runtime block parser) so tool YAMLs may declare
    # it without triggering UnknownRuntimeBlock.
    - required_caps
    # `requires` is the structured runtime-capability requirement block,
    # extracted into metadata and consumed by the launch path to mint
    # callback caps. Ignored here (runtime block parser) so tool YAMLs may
    # declare it without triggering UnknownRuntimeBlock.
    - requires
    # `effects` is the item's author-vouched effect class (sealed | recorded
    # | live), read from the composed value by the daemon dispatcher to bound
    # what durable class a caller may claim for this item. Ignored here
    # (runtime block parser) so items may declare it without triggering
    # UnknownRuntimeBlock.
    - effects
    # Consumed only through the kind-owned workspace-access projection above.
    # Dispatch must not grow tool/provider-specific interpretations of it.
    - workspace_access
    # Consumed by the kind-owned network-authority projection above; it is not
    # a runtime-handler block.
    - network_authority
    - filesystem_authority
    # Mechanically selected through execution.terminator.protocol above.
    - execution_protocol
    # Signed executor-chain policy for adjacent source admission. The daemon
    # consumes this before plan compilation; it is not a runtime handler.
    - source_scope
    # Consumed by the kind-owned external-content admission contract above;
    # it is not a runtime-handler block.
    - external_content
    - external_product_slots
    - supported_target
    - resource_authority
    # `config_schema` is validated as a pre-pass against the user's
    # ROOT tool item (see plan_builder.rs::build_plan and
    # runtime/config_schema.rs). Wrapper / runtime YAMLs may declare
    # their own `config_schema` for documentation — the engine
    # deliberately does not enforce them at chain compile time. On
    # terminal/internal tools such as `ryeos/core/subprocess/execute`,
    # `config_schema` documents the wrapper `config:` shape, not a
    # public direct-call parameter surface.
    - config_schema
    # TODO: handlers for these blocks land in subsequent phases.
    - execution_owner
    - native_resume
    # `method_dispatch` configures a method-dispatch wrapper tool's target
    # method/ref. Extracted into metadata.extra by the rule below and read by
    # the method-dispatch terminal executor; ignored here (runtime block parser)
    # so wrappers may declare it without triggering UnknownRuntimeBlock.
    - method_dispatch
    # `terminal_executor` is the typed descriptor a terminal executor tool
    # (`executor_id: null`) declares to select its execution routine
    # (subprocess vs method_dispatch). Read by the dispatcher's chain-terminal
    # resolver, not by a runtime handler; ignored here so terminal tools carrying
    # it don't trip UnknownRuntimeBlock during plan compilation.
    - terminal_executor
metadata:
  # Tool YAML files use plain keys (`category`, `version`, etc.). Tool
  # Python files use a comment-YAML `# ryeos-tool:` header that parses
  # to the same plain-key shape. Downstream rules — and the path
  # validator — therefore see ONE shape regardless of source format.
  rules:
    name:
      from: filename
      required: true
      match: filename
    version:
      from: path
      key: version
    executor_id:
      from: path
      key: executor_id
    description:
      from: path
      key: description
    category:
      from: path
      key: category
      required: true
      match: path
    required_secrets:
      from: path_string_seq
      key: required_secrets
    required_caps:
      from: path_string_seq
      key: required_caps
    # Carry the structured `requires:` block verbatim into metadata.extra so
    # the launch path can mint the requested manifest-backed callback caps.
    requires:
      from: path_value
      key: requires
    # Carry the `method_dispatch:` block verbatim into metadata.extra so the
    # method-dispatch terminal executor can read the target method/ref_kind.
    method_dispatch:
      from: path_value
      key: method_dispatch
