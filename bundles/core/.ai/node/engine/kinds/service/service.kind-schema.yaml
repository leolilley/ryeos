# ryeos:signed:2026-11-24T11:23:42Z:3886e41c8aa972a1d94ab77e16b1385bf15b52934ef8fb14515f481799e92d7d:r6VvUk5t0X7HDhZH9Kx3QngAJxRdfVEMfZYrNDJZKOwN0DaidCDs+9x1tjqh+cLK+tkTx+zWAMmkDnBjW7NaCA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "engine/kinds/service"
inventory_policy:
  admission:
    capability_template: "ryeos.execute.{kind}.{bare_id}"
version: "1.0.0"
location:
  directory: services
effective_trust:
  include_references: false
resolution: []
# Which spaces and trust classes may supply a launch root of this kind.
# Only signed bundles supply this kind; a project or node file is ignored.
launch_trust:
  allowed_spaces: [bundle]
  allowed_trust: [trusted_bundle]
  operator_may_admit: []
execution:
  terminator:
    kind: in_process
    registry: services
    capabilities:
      # The in-process executor implements the frozen generic terminal
      # projection contract for both success and handler-error outcomes.
      durable_result_projection: true
  thread_profile:
    name: service_run
    root_executable: true
    supports_interrupt: false
    supports_continuation: false
  # Generic engine contract: resolve the optional authored policy from the
  # verified composed service value. No service/ref branch consumes it.
  history_policy:
    composed_path: history
  # Generic engine contract for the durable representation of successful
  # results and handler errors. Omission on an item retains the full terminal.
  result_policy:
    composed_path: result_retention
formats:
  - extensions: [".yaml", ".yml"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"
# Identity composer — service items are loaded as-is.
composer: handler:ryeos/core/identity
composed_value_contract:
  root_type: mapping
  required:
    endpoint: { type: single, prim: string }
  optional:
    name: { type: single, prim: string }
    version: { type: single, prim: string }
    availability:
      type: single
      prim: string
      enum: [both, daemon_only, local, stopped_node]
    local_execute: { type: single, prim: string }
    required_caps:
      type: single
      prim: sequence
      elements: { type: single, prim: string }
    description: { type: single, prim: string }
    record_thread: { type: single, prim: boolean }
    result_retention:
      type: single
      prim: string
      enum: [full, digest_only]
    state_access:
      type: single
      prim: string
      enum: [read_write, read_only_existing, projection_rebuild]
    # Atomic authored mapping. Omission delegates to the signed node default;
    # there is no kind- or service-specific fallback.
    history:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required:
          retention:
            type: single
            prim: mapping
            contract:
              root_type: mapping
              required:
                terminal_for: { type: single, prim: string }
    # What each caller class may see of this service's answer. The operator sees
    # it whole; a field in no tier is the operator's alone. `free_text` lists
    # leaves that can carry a path, probe output or a key and may not appear in
    # a wider tier. `interim_free_text` names free-text leaves a principal still
    # receives because the seat that owns the answer reads them today; each is a
    # reviewed exception that a later milestone removes. A service with no block
    # discloses nothing to another class.
    disclosure:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        optional:
          principal:
            type: single
            prim: sequence
            elements: { type: single, prim: string }
          public:
            type: single
            prim: sequence
            elements: { type: single, prim: string }
          free_text:
            type: single
            prim: sequence
            elements: { type: single, prim: string }
          interim_free_text:
            type: single
            prim: sequence
            elements: { type: single, prim: string }
    ui_read_only: { type: single, prim: boolean }
    ui_dispatch:
      type: single
      prim: string
      enum: [verified, session_local]
    ui_result_effect:
      type: single
      prim: string
      enum: [surface_opening, resume_particular_view_set, resume_particular_surface]
    schema: { type: single, prim: mapping }
metadata:
  rules:
    name:
      from: filename
      required: true
    version:
      from: path
      key: version
    category:
      from: relative_dir
      required: true
    endpoint:
      from: path
      key: endpoint
    required_caps:
      from: path_string_seq
      key: required_caps
    description:
      from: path
      key: description
    record_thread:
      from: path_value
      key: record_thread
    state_access:
      from: path
      key: state_access
    disclosure:
      from: path_value
      key: disclosure
    ui_read_only:
      from: path_value
      key: ui_read_only
    ui_dispatch:
      from: path
      key: ui_dispatch
    ui_result_effect:
      from: path
      key: ui_result_effect
    schema:
      from: path_value
      key: schema
