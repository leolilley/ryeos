# ryeos:signed:2026-08-25T01:31:18Z:21034eac233430d7db17c2cb614cda2c3f592161a41ea5149b5e91017579260a:kCyTtZMahYGL/e9sLPVgJFnIeXv3SeiqGsPssfAjOU2A5WOg97CrK0IxMWQYNkQy06E4f5o3xArkShkBPc+yDw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "engine/kinds/service"
version: "1.0.0"
location:
  directory: services
effective_trust:
  include_references: false
resolution: []
execution:
  terminator:
    kind: in_process
    registry: services
    capabilities:
      # The in-process executor implements the frozen generic terminal
      # projection contract for both success and handler-error outcomes.
      durable_result_projection: true
  thread_profile:
    name: service_run
    root_executable: true
    supports_interrupt: false
    supports_continuation: false
  # Generic engine contract: resolve the optional authored policy from the
  # verified composed service value. No service/ref branch consumes it.
  history_policy:
    composed_path: history
  # Generic engine contract for the durable representation of successful
  # results and handler errors. Omission on an item retains the full terminal.
  result_policy:
    composed_path: result_retention
formats:
  - extensions: [".yaml", ".yml"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"
# Identity composer — service items are loaded as-is.
composer: handler:ryeos/core/identity
composed_value_contract:
  root_type: mapping
  required:
    endpoint: { type: single, prim: string }
  optional:
    name: { type: single, prim: string }
    version: { type: single, prim: string }
    availability:
      type: single
      prim: string
      enum: [both, daemon_only, local, stopped_node]
    local_execute: { type: single, prim: string }
    required_caps:
      type: single
      prim: sequence
      elements: { type: single, prim: string }
    description: { type: single, prim: string }
    record_thread: { type: single, prim: boolean }
    result_retention:
      type: single
      prim: string
      enum: [full, digest_only]
    state_access:
      type: single
      prim: string
      enum: [read_write, read_only_existing, projection_rebuild]
    # Atomic authored mapping. Omission delegates to the signed node default;
    # there is no kind- or service-specific fallback.
    history:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required:
          retention:
            type: single
            prim: mapping
            contract:
              root_type: mapping
              required:
                terminal_for: { type: single, prim: string }
    ui_read_only: { type: single, prim: boolean }
    ui_dispatch:
      type: single
      prim: string
      enum: [verified, session_local]
    schema: { type: single, prim: mapping }
metadata:
  rules:
    name:
      from: filename
      required: true
    version:
      from: path
      key: version
    category:
      from: relative_dir
      required: true
    endpoint:
      from: path
      key: endpoint
    required_caps:
      from: path_string_seq
      key: required_caps
    description:
      from: path
      key: description
    record_thread:
      from: path_value
      key: record_thread
    state_access:
      from: path
      key: state_access
    ui_read_only:
      from: path_value
      key: ui_read_only
    ui_dispatch:
      from: path
      key: ui_dispatch
    schema:
      from: path_value
      key: schema
