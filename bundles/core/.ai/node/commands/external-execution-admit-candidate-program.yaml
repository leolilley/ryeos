tokens: [external-execution, admit-candidate-program]
description: Derive the admitted candidate program and runtime content qualification binding for a published content qualification without writing state
arguments:
  - name: required_claims
    kind: json
    positional: 5
    required: true
    arity: one
    description: Sorted unique claim names the binding will require of the published testimony; passed as --required-claims <json>
  - name: remote_testimony
    kind: json
    positional: 6
    required: false
    arity: optional
    description: JSON object naming the local acceptance (acceptance_hash, acceptance_policy_ref) of a remote content testimony; omit for a local content qualification. Passed as --remote-testimony <json>
forms:
  - slots:
      - field: activation_ref
      - field: coordinate_id
      - field: attestation_hash
      - field: runtime_manifest_hash
help:
  usage: ryeos external-execution admit-candidate-program <activation-ref> <coordinate-id> <attestation-hash> <runtime-manifest-hash> --required-claims <json> [--remote-testimony <json>]
  examples:
    - ryeos external-execution admit-candidate-program config:codex/external-authoring-activation <coordinate-id> <attestation-hash> <runtime-manifest-hash> --required-claims '["bounded_candidate_capture","candidate_only_execution"]'
dispatch:
  kind: execute_ref
  execute: service:external-execution/admit-candidate-program
