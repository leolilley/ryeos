tokens:
- remote
- admit
description: Claim a one-time admission token on a configured remote node, as this node or (with --as-principal) as yourself
help:
  usage: "ryeos remote admit --remote <name> --token <token> --scopes <scope> [--scopes <scope>...] [--label <label>] [--as-principal]"
  examples:
    - "ryeos remote admit --remote prod --token <one-time-token> --scopes ryeos.execute.service.objects/has"
    - "ryeos remote admit --as-principal --remote hosted --token <one-time-token> --scopes ryeos.execute.service.remote/run"
parameter_binding:
  mode: tail_object
  flag_key_normalization: hyphen_to_underscore
dispatch:
  kind: local_handler
  handler: remote_admit
  bootstrap: false
