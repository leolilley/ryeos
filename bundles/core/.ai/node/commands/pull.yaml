description: Fetch, verify and stage a published bundle from a link, checking the node key and record hash you were given. The bundle is staged, not installed; it takes effect at the next start by a signed operation. A host that is, or resolves to, a loopback, private, link-local or metadata address is refused, and so is a host an egress proxy would carry (its address cannot be checked from here; list it in NO_PROXY). --allow-internal true accepts both, for a node pulling from inside its own network
