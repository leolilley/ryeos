tokens:
- pull
description: Install a published bundle from a link, checking the node key and record hash you were given. A host that is, or resolves to, a loopback, private, link-local or metadata address is refused, and so is a host an egress proxy would carry (its address cannot be checked from here; list it in NO_PROXY). --allow-internal true accepts both, for a node pulling from inside its own network. The publisher key to pin is the one the pull prints, never a PUBLISHER_TRUST.toml inside the pulled bundle
help:
  usage: "ryeos pull <https://host/published/id> --node fp:<node key fingerprint> --expect <record hash> [--allow-internal true]"
  examples:
    - "ryeos pull https://example.com/published/0123456789abcdef0123456789abcdef --node fp:<node key fingerprint> --expect <record hash> [--allow-internal true]"
forms:
- slots:
  - field: url
    matcher: string
parameter_binding:
  mode: tail_object
  flag_key_normalization: hyphen_to_underscore
dispatch:
  kind: execute_ref
  execute: service:bundle/pull
