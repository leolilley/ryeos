tokens: [credential-profile, create]
description: "Create one node-private credential profile; --activation fixes how it becomes usable, either a login ceremony or the delivered secrets it names"
human_terminal_only: true
arguments:
  - name: activation
    kind: json
    positional: 1
    required: true
    arity: one
    description: 'Activation source as JSON: {"kind":"ceremony"} or {"kind":"delivered_secret","names":["NAME",...]}; fixed for the life of the profile'
forms:
  - slots:
      - field: profile_id
parameter_binding:
  mode: tail_object
  flag_key_normalization: hyphen_to_underscore
