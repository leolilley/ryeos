  usage: "ryeos credential-profile create <profile-id> --activation '<json>'"
  examples:
    - "ryeos credential-profile create personal --activation '{\"kind\":\"ceremony\"}'"
    - "ryeos credential-profile create keyed --activation '{\"kind\":\"delivered_secret\",\"names\":[\"API_KEY\"]}'"
dispatch:
  kind: execute_ref
  execute: service:credential-profiles/create
  availability: daemon
