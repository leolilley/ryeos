tokens:
- endorse
description: Endorse items the node's authoring key signed so the node trusts them, signing with your operator key in this CLI
help:
  usage: "ryeos --project <path> endorse --item <ref|path>... | --standing --kind <kind>... [--lifetime-secs <seconds>]"
  examples:
    - "ryeos --project . endorse --item view:acme/home --item surface:acme/main"
    - "ryeos --project . endorse --standing --kind knowledge --lifetime-secs 604800"
project:
  resolution: required
  default: discover_upward_ai
  bind_parameter: project_path
parameter_binding:
  mode: tail_object
  flag_key_normalization: hyphen_to_underscore
dispatch:
  kind: local_handler
  handler: endorse_items
  bootstrap: false
