# ryeos:signed:2026-10-23T01:20:17Z:74e8b995dc709f1ec3ec3b6dafad0dbd0b6c0e9a5be582e23e8d56b54161521f:GhynKoPzVimRgigMBqXV3zbyo56hr7KfKqfQI7daTyajSVcfWKsleZ0gQa1UTznAdbP2fV/UzES4cj4Wp9WkDw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
tokens: [external-content, export-qualification-testimony]
description: Export a local qualification as a signed testimony and submit it to a configured pinned remote
arguments:
  - name: content
    kind: json
    positional: 3
    required: false
    arity: optional
    description: Content lane only; JSON object naming the activated content as activation_ref, coordinate_id and manifest_hash. Passed as --content <json>; omitted for a product qualification
forms:
  - slots:
      - field: remote
      - field: qualification_hash
      - field: acceptance_policy_ref
help:
  usage: "ryeos external-content export-qualification-testimony <remote> <qualification-hash> <acceptance-policy-ref> [--content <json>]"
  examples:
    - "ryeos external-content export-qualification-testimony hosted <qualification-hash> config:render/snapshot-acceptance-policy"
    - "ryeos external-content export-qualification-testimony hosted <qualification-hash> config:codex/runtime-acceptance-policy --content '{\"activation_ref\":\"config:codex/runtime-activation\",\"coordinate_id\":\"<coordinate-id>\",\"manifest_hash\":\"<manifest-hash>\"}'"
dispatch:
  kind: execute_ref
  execute: service:external-content/export-qualification-testimony
