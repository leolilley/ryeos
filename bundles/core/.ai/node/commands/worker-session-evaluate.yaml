# ryeos:signed:2026-11-28T19:50:32Z:a54d4fcdb762c888fa752f0e631eb8ae83dfc26a9e76de44e04173c72d2c9b4d:zbgrt4BJV39uZfTvbZYTBq0INTJSlBuEUrmjHlsnJ/QudMEaJkFfPt0+TYgFID5iUK2jexVoVM3VdiE8FmkwBg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
tokens: [worker, session, evaluate]
description: "Start an independent evaluation of one frozen, validated candidate with an evaluator item you name; there is no default evaluator"
help:
  usage: "ryeos worker session evaluate <chain-root-id> <candidate-snapshot-hash> <candidate-validation-hash> <evaluator-item-ref> --input '<json object>'; the object carries launch_id (L- and 32 hex characters, minted by you) and, as evaluator_parameters, whatever the evaluator takes (the shipped unchecked evaluator takes the candidate and base snapshot hashes and refuses unless accept_unchecked is true); an optional evaluator_base_config_ref names a config item the daemon reads from the BASE snapshot, judges under the project's trust rules and seals into the evaluator's parameters as base_config (the declared-checks evaluator takes it and accepts only on the checks it declares); with it the daemon also seals changed_paths, the paths the candidate changed against its base, computed from the two verified snapshot trees, for the changed_paths_within and changed_paths_count checks; a caller never supplies base_config or changed_paths itself"
  examples:
    - "ryeos worker session evaluate T-1 <candidate> <validation> tool:ryeos/core/evaluate/declared --input '{\"launch_id\":\"L-<32 hex>\",\"evaluator_base_config_ref\":\"config:ryeos/core/evaluate/checks\",\"evaluator_parameters\":{\"candidate_snapshot_hash\":\"<candidate>\",\"base_snapshot_hash\":\"<base>\"}}'"
    - "ryeos worker session evaluate T-1 <candidate> <validation> tool:ryeos/core/evaluate/unchecked --input '{\"launch_id\":\"L-<32 hex>\",\"evaluator_parameters\":{\"candidate_snapshot_hash\":\"<candidate>\",\"base_snapshot_hash\":\"<base>\",\"accept_unchecked\":true}}'"
forms:
  - slots:
      - field: chain_root_id
      - field: candidate_snapshot_hash
      - field: candidate_validation_hash
      - field: evaluator_item_ref
        matcher: canonical_ref
parameter_binding:
  mode: tail_object
  input_flag: input
  flag_key_normalization: hyphen_to_underscore
dispatch:
  kind: execute_ref
  execute: service:worker-executions/start-candidate-evaluation
  availability: daemon
