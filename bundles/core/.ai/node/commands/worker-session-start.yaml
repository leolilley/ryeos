# ryeos:signed:2026-11-26T02:47:10Z:8f4a55b3c389db2c56799e6b5afe27a24ee32104da82023ce56d3d884fbdda0c:tOyISrg4pbs6sirulRdP0y/kPMpnB9LIZ342M8Op+WV0OmDoaUL2K2cw2epOvMbEmWT4nPHXZtiMKLCKk7a3DA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
tokens: [worker, session, start]
description: "Start a hosted worker session from the principal's pushed project HEAD and a signed portable environment: name the worker execution item, the credential profile and the environment; --current-head is required and --async is recommended"
help:
  usage: "ryeos --project <path> worker session start <worker-execution-ref> <credential-profile-id> --environment <config-ref> --async --current-head"
  examples:
    - "ryeos --project . worker session start worker_execution:codex/session personal --environment config:codex/environments/default --async --current-head"
forms:
  - slots:
      - field: item_ref
        matcher: canonical_ref
      - field: credential_profile_id
project:
  resolution: required
  default: discover_upward_ai
  request_project_path: true
parameter_binding:
  mode: tail_object
  flag_key_normalization: hyphen_to_underscore
control_flags:
  - flag: async
    help: "Return after durable accepted launch"
    binding: launch_mode_accepted
  - flag: current-head
    help: "Resolve the principal's pushed project HEAD into a retained copy-on-write generation"
    binding: pin_current_head_at_admission
  - flag: environment
    help: "Bind the signed portable worker environment"
    binding: ref_binding
    ref_binding_name: environment
dispatch:
  kind: direct_execute_item_ref
  item_ref_arg: item_ref
  validate_only: false
  availability: daemon
