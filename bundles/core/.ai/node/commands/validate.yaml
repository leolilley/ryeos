tokens:
- validate
description: "Resolve and validate an executable item through its complete threadless admission path without creating a thread or contacting its runtime."
forms:
- slots:
  - field: item_ref
    matcher: canonical_ref
dispatch:
  kind: direct_execute_item_ref
  item_ref_arg: item_ref
  validate_only: true
  availability: both
project:
  resolution: optional
  default: discover_upward_ai
  no_project_flag: true
  request_project_path: true
parameter_binding:
  mode: tail_object
  input_flag: input
  single_json_object_arg: true
  flag_key_normalization: hyphen_to_underscore
control_flags:
- flag: current-head
  help: "Validate the current immutable project HEAD and its exact target-local bindings"
  binding: pin_current_head_at_admission
- flag: no-operator-vault
  help: "Validate without operator-vault exposure in project-environment authority"
  binding: exclude_operator_vault
- flag: method
  help: "Method selector for method-dispatch kinds; sets call.method"
  binding: call_method
- flag: args
  help: "Method args as a JSON object; sets call.args"
  binding: call_args
- flag: state-root
  help: "Resolve runtime state under this path while retaining threadless validation"
  binding: state_root
- flag: ref-binding
  help: "Bind a secondary execution ref as name=canonical-ref; repeat for multiple bindings"
  binding: ref_binding
