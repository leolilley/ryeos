# ryeos:signed:2026-08-24T11:56:58Z:f0d7334ea801ceaa21a8590a259f755bf876ce52354c63238dedbb2c48d07d1d:lcnWdSGPCBPOnj0mYPk+qrtENURyqKHjFJmmvm4CbwqGGv52gswLv4qePEOX3g0cW1GhP8So+PnsqoEqTJo8CA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
tokens:
- execute
description: "Execute an item (tool, directive, service, graph). On a terminal, streams the live execution log then prints the final result; --no-stream/--json print only the buffered JSON result (also the default when piped), and --stream forces streaming even when piped."
forms:
- slots:
  - field: item_ref
    matcher: canonical_ref
dispatch:
  kind: direct_execute_item_ref
  item_ref_arg: item_ref
  validate_only: false
  availability: both
project:
  resolution: optional
  default: discover_upward_ai
  no_project_flag: true
  request_project_path: true
parameter_binding:
  mode: tail_object
  input_flag: input
  single_json_object_arg: true
  flag_key_normalization: hyphen_to_underscore
control_flags:
- flag: async
  help: "Accepted/background launch for root-executable refs; retains a launch_id before submission and returns the authoritative thread_id after handoff"
  binding: launch_mode_accepted
- flag: stream
  help: "Force the live execution stream on (even when piped)"
  binding: stream_on
- flag: no-stream
  help: "Print the buffered JSON result instead of the live stream"
  binding: stream_off
  aliases:
  - json
- flag: debug-raw
  help: "Attach a debug block (resolved cmd/args/env keys + raw stdio) to the result"
  binding: debug_raw
- flag: pin-project
  help: "Capture the complete project at admission and execute from a retained daemon-owned copy-on-write generation"
  binding: pin_project_at_admission
- flag: current-head
  help: "Execute from the current principal project HEAD in a retained daemon-owned copy-on-write generation"
  binding: pin_current_head_at_admission
- flag: method
  help: "Method selector for method-dispatch kinds (e.g. knowledge query); sets call.method"
  binding: call_method
- flag: args
  help: "Method args as a JSON object; sets call.args"
  binding: call_args
- flag: state-root
  help: "Place runtime state (thread state, transcripts) under this path instead of the project; resolution still runs against the project source"
  binding: state_root
- flag: ref-binding
  help: "Bind a secondary execution ref as name=canonical-ref; repeat for multiple bindings"
  binding: ref_binding
