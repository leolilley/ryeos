name: core
version: "0.5.0"
description: "Engine foundation: kind schemas, handlers, parsers, services, tools"
requires_kinds: []
owns_namespaces:
  - ryeos/core
# What AI-only project sync carries from a project's `.ai` tree. Item kinds
# core ships are declared by kind (the root is that kind's location.directory);
# the rest are explicit roots. Every node composes the union of its installed
# bundles' declarations; floors (secrets, node-owned state) are enforced in
# code and a declaration that touches one is refused at preflight.
sync_include:
  - kind: tool
  - kind: parser
  - kind: handler
  - kind: protocol
  - kind: revision
  - root: .ai/manifest.source.yaml
    shape: file
  - root: .ai/manifest.yaml
    shape: file
  - root: .ai/directives
    shape: directory
  - root: .ai/graphs
    shape: directory
  - root: .ai/knowledge
    shape: directory
  - root: .ai/node/engine/kinds
    shape: directory
  - root: .ai/node/commands
    shape: directory
  - root: .ai/config/agent
    shape: directory
  - root: .ai/config/execution
    shape: directory
  - root: .ai/config/directive-runtime
    shape: directory
  - root: .ai/config/ryeos-runtime
    shape: directory
  - root: .ai/config/development
    shape: directory
  - root: .ai/config/schedules
    shape: directory
runtime_authority:
  project_snapshots: [status, log, show, create]
isolation_backends:
  - id: linux-lillux
    protocol: ryeos.isolation-adapter/v16
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    adapter: ryeos-lillux-isolation-adapter
    artifacts: {}
    capabilities:
      - filesystem.private_root
      - filesystem.fd_read_only
      - filesystem.fd_writable
      - filesystem.ordered_overlays
      - filesystem.fixed_parent_views
      - filesystem.project_workspace_cow
      - filesystem.workspace_delta
      - filesystem.private_tmp
      - filesystem.pid_namespace_proc
      - devices.minimal
      - devices.character_grant
      - environment.exact
      - network.host
      - network.isolated
      - process.isolated_pid_namespace
      - process.original_namespace_terminal_reporting
      - process.target_pid_reporting
      - lifecycle.shared_process_group
      - process.target_limits
      - process.nested_sandbox
      - ipc.target_unix_stream
      - ipc.target_sealed_payload
