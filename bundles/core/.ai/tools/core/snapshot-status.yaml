# ryeos:signed:2026-09-05T00:45:20Z:9d760582441b31c93bd74056bd61a032e29a554964707801be96cdb617466299:4Mu6AdEWoGWAKRaYEtBFdKyJEdsHXqQeUGw/Zgw+GHLESvw5QHRGtlBYJBGa7aaVQPh1vlTkEFBBIYMr5vInAA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
category: "core"
name: "snapshot-status"
required_caps: ["ryeos.read.project.live"]
requires:
  capabilities:
    manifest:
      runtime_authority:
        project_snapshots: [status]
description: "Compare the project worktree with the principal's local snapshot head. The worktree scan is timeboxed by default and returns partial results (scan_complete: false) instead of blocking."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "snapshot"
    - "status"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 60

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root path"
    include_unchanged:
      type: boolean
      description: "Include unchanged files in the changes list"
      default: false
    time_budget_ms:
      type: integer
      description: "Worktree scan budget in milliseconds; 0 disables the cap and scans the full worktree"
      default: 5000
      minimum: 0
  required: [project_path]
