# ryeos:signed:2026-09-05T00:45:19Z:4b20333fa24db2be32eff51b38d138a03b74223a3875ad517eed02dc1b308cfa:N5rKNwiRpmlbFIEg7OrJZ9ect0vlemKNhlA0BlY/nQl4NGiwZtMmuqp/OlD/M9hzdBW12pTXRLwja6AhDUnXCw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
category: "core"
name: "snapshot-log"
required_caps: ["ryeos.read.project.live"]
requires:
  capabilities:
    manifest:
      runtime_authority:
        project_snapshots: [log]
description: "Show recent snapshots from the principal's local project head."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "snapshot"
    - "log"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 60

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root path"
    limit:
      type: integer
      description: "Maximum snapshots to return"
      default: 20
  required: [project_path]
