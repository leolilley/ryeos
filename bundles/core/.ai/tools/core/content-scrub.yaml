version: "1.0.0"
executor_id: "@subprocess"
category: "core"
name: "content-scrub"
requires:
  capabilities:
    manifest:
      runtime_authority:
        large_content: [scrub]
description: "Re-verify every stored large object chunk by chunk and report typed integrity findings."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "content-scrub"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 3600

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root (parent of .ai/). Defaults to caller cwd."
