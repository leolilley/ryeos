# ryeos:signed:2026-08-11T02:28:20Z:0d8cbfbe9a02c87cae323598339f624d8c0fba5a27c35dbf791148b516522bdc:SGOwb9ohrVMqtK/K2Hs6jZQNRX4t08/eEvmIkI8hz/i041kcpZJvZR8N/QFr2Rc8c5s2cQy6I/0+vl8mSiEwAw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
executor_id: "@subprocess"
category: "core"
name: "snapshot-show"
required_caps: ["ryeos.read.project.live"]
requires:
  capabilities:
    manifest:
      runtime_authority:
        project_snapshots: [show]
description: "Show metadata for a local snapshot object."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "snapshot"
    - "show"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 60

config_schema:
  type: object
  properties:
    snapshot_hash:
      type: string
      description: "Snapshot hash to inspect"
    project_path:
      type: string
      description: "Optional project root path used to include head/deployed relation flags"
  required: [snapshot_hash]
