# ryeos:signed:2026-09-05T00:45:19Z:93fcb7c5214f8775eb176723b28bce970845747197414685260c766210f1ff8d:F0r23dIwByYCNbu/GS79TCdAhlLCgUSsk4LJ0BQltNKRIdIoAXaT68Cn73LyBsvaLDDCuvHrJcmwxcNy3yR+BQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
category: "core"
name: "snapshot-show"
required_caps: ["ryeos.read.project.live"]
requires:
  capabilities:
    manifest:
      runtime_authority:
        project_snapshots: [show]
description: "Show metadata for a local snapshot object."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "snapshot"
    - "show"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 60

config_schema:
  type: object
  properties:
    snapshot_hash:
      type: string
      description: "Snapshot hash to inspect"
    project_path:
      type: string
      description: "Optional project root path used to include head/deployed relation flags"
  required: [snapshot_hash]
