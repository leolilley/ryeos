# ryeos:signed:2026-07-30T00:35:10Z:7046016027e5bdaf38fc73627ac6e0dc0aa9aeca32c4cceb3881a637b1ee2bce:GLxKA1u/+C4TXZbiSmqL3wkth5u61N8qKX31vJifAry02AKzlpsmnPxBiDUsYzXLQPyvd8QCvlOxmKZwzqHYCw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
executor_id: "@subprocess"
category: "core"
name: "snapshot-create"
required_caps: ["ryeos.write.project.live"]
requires:
  capabilities:
    manifest:
      runtime_authority:
        project_snapshots: [create]
description: "Create a local project snapshot from the current worktree."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "snapshot"
    - "create"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 120

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root path"
    message:
      type: string
      description: "Snapshot message"
    allow_empty:
      type: boolean
      description: "Create even when the manifest matches the current head"
      default: false
  required: [project_path]
