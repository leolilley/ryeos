# ryeos:signed:2026-09-05T00:45:19Z:72d339ebcbf255f69fea05065254d5c034dcb839ce130909ad8d682a92bb6de6:Jhrg0GMSjta2XYdzC8djV0bul2TRm1Qx3V7YTsWk1yU7KzQPqwDosLB3ZRiA6YVBvtsUW3IUKVaeMiqlVRVXBA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
category: "core"
name: "snapshot-create"
required_caps: ["ryeos.write.project.live"]
requires:
  capabilities:
    manifest:
      runtime_authority:
        project_snapshots: [create]
description: "Create a local project snapshot from the current worktree."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "snapshot"
    - "create"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 120

config_schema:
  type: object
  properties:
    project_path:
      type: string
      description: "Project root path"
    message:
      type: string
      description: "Snapshot message"
    allow_empty:
      type: boolean
      description: "Create even when the manifest matches the current head"
      default: false
  required: [project_path]
