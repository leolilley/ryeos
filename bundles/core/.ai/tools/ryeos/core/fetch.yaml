# ryeos:signed:2026-09-05T00:45:20Z:35a0560d27243ae88a4bb369fe264d521ac3c411cf2fd2f6a800f9ce07249c5a:htysFp16q/iq2ECS2Vpp96Auw2eMq4is3SOLc1jfZQUwm1QhceGrdpFf1fRVHRqaX+wHOzoMjoE8ftGfdmTkDA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "ryeos/core"
name: "fetch"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: ["bundle.read"]
description: "Resolve, optionally verify, and read an item via the engine"

config:
  command: "bin:ryeos-core-tools"
  args:
    - "fetch"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 60

config_schema:
  type: object
  properties:
    item_ref:
      type: string
      description: "Canonical ref to fetch (e.g. tool:ryeos/core/fetch)"
    with_content:
      type: boolean
      description: "Include the full file content in the report"
      default: false
    verify:
      type: boolean
      description: "Also verify trust status"
      default: false
    project_path:
      type: string
      description: "Project root path"
  required: [item_ref]
