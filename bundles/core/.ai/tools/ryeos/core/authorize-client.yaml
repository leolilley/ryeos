# ryeos:signed:2026-08-24T16:23:27Z:f79268cf9eedebe89a1ac11cec61dd55019d87268cd6def05a545cfac11f7284:n//UoM81iK6dUtYSaq61wJPHXs/PfBXPVkBm1CdjBtrSCmL1DoNmyxTLQ9zEB1xsneuFp3khFdVEMSHf6pOpAA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
executor_id: "@subprocess"
category: "ryeos/core"
name: "authorize-client"
required_caps: ["ryeos.execute.tool.ryeos.core.authorize-client"]
description: "Reconcile one exact authorized-key grant with node-signed stopped-node authority."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "authorize-client"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 30

config_schema:
  type: object
  properties:
    public_key:
      type: string
      description: "Raw 32-byte Ed25519 public key encoded as standard base64."
    scopes:
      type: string
      description: "Comma-separated exact canonical scopes. Wildcards are rejected."
    label:
      type: string
      description: "Human-readable grant label."
      default: "cli-authorized"
    merge_scopes:
      type: boolean
      description: "Union requested scopes with an incumbent same-class grant."
      default: false
    origin_site_id:
      type: string
      description: "Allowed forwarding site. Presence selects the remote_operator principal class."
    allow_semantic_conversion:
      type: boolean
      description: "Explicitly permit an incumbent class or origin transition while the daemon state lock is held."
      default: false
  required: [public_key, scopes]
