# ryeos:signed:2026-08-09T05:54:22Z:00e12d5e4efb4c299cd674a92b59bd76ee567fdfc675654730014e82bce948e7:5/g5MWgiZKoPXyPqLu242esMlzCndgiaxCxYeMNSLpv2veR6UVLHJ+fId/Y1Um12j+/+DIJChhPOaOXXxcsvAQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
executor_id: "@subprocess"
category: "ryeos/core"
name: "admission-token"
required_caps: ["ryeos.execute.tool.ryeos.core.admission-token"]
description: "Mint a one-time node-local admission token for remote bootstrap."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "admission-token"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 30

config_schema:
  type: object
  properties:
    system_space_dir:
      type: string
      description: "Target node system space root. Defaults to RYEOS_APP_ROOT."
    scopes:
      type: string
      description: "Comma-separated scopes this token may grant."
    label:
      type: string
      description: "Optional default label for the eventual authorized-key entry."
    ttl_secs:
      type: number
      description: "Token lifetime in seconds. Defaults to 600."
      default: 600
  required: [scopes]
