# ryeos:signed:2026-09-05T00:45:20Z:3a60565795068ab202ed19134443d7f1253ed1c118bad0302e5cafcd52e8f565:N60kSKdMvGTHmeGZ/yBm+5r6UnLwczLseLI7SDkzUFIRYxFDdePK+btXjddCx9UbZeNQ7OwhuxIcD0+JgOC2Dg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "ryeos/core/bundle"
name: "sign"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: []
description: "Sign all signable items in a bundle source tree and rebuild binary manifest sidecars when needed."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "bundle-sign"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 300

config_schema:
  type: object
  properties:
    source:
      type: string
      description: "Bundle source directory containing .ai/."
    registry_root:
      type: string
      description: "Optional registry/dependency root supplying kind schemas, parsers, and handlers. May be repeated via registry_roots."
    registry_roots:
      type: array
      items:
        type: string
      description: "Optional registry/dependency roots supplying kind schemas, parsers, and handlers."
  required: [source]
