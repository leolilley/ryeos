category: "ryeos/core/bundle"
name: "manifest-sign"
executor_id: "@subprocess"
required_caps: []
description: "Generate and sign .ai/manifest.yaml from .ai/manifest.source.yaml without running the full publish pipeline."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "manifest-sign"
    - "--stdin-json"
  input_data: "{params_json}"
  timeout_secs: 120

config_schema:
  type: object
  properties:
    source:
      type: string
      description: "Bundle source directory containing .ai/."
    name:
      type: string
      description: "Effective bundle id the manifest must carry (first bare-id segment of the bundle's item refs). Defaults to the name declared by .ai/manifest.source.yaml."
  required: [source]
