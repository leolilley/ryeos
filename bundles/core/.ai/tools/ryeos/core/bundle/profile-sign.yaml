category: "ryeos/core/bundle"
name: "profile-sign"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
required_caps: []
description: "Sign an init profile in place with a publisher key. The profile is validated first; the key is the app root's operator key unless a key file path is given."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "profile-sign"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 60

config_schema:
  type: object
  properties:
    profile:
      type: string
      description: "Init profile file, .ai/node/init/profiles/<name>.yaml."
    key:
      type: string
      description: "Signing key PEM file path. Defaults to the app root's operator signing key."
  required: [profile]
