# ryeos:signed:2026-07-27T09:00:06Z:14672fd2daff72c90a1fe431970ccd3277c15eed9f29f3d2557007ea18523438:7kMPtNbUzQO91YRN4qXkjVsrhr0NGas0yV8wMdjO+kx5dnqJAXAv9bE0PsrXki3xvYqtHCwPsV1Bl8Y2oAXfBA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "ryeos/core/bundle"
name: "publish"
executor_id: "@subprocess"
required_caps: []
description: "Full bundle release pipeline: bootstrap-sign, rebuild CAS, sign items, generate manifest, emit trust doc."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "build"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 300

config_schema:
  type: object
  properties:
    source:
      type: string
      description: "Bundle source directory containing .ai/."
    registry_root:
      type: string
      description: "Optional registry root supplying kind schemas and parsers. Defaults to source."
    registry_roots:
      type: array
      description: "Optional registry/dependency roots to include during validation."
    owner:
      type: string
      description: "Owner label for PUBLISHER_TRUST.toml. Defaults to local-dev."
    name:
      type: string
      description: "Effective bundle id the manifest must carry (first bare-id segment of the bundle's item refs). Defaults to the name declared by .ai/manifest.source.yaml."
    skip_unsignable:
      type: boolean
      description: "Report and skip items that fail to sign instead of aborting. Produces a PARTIAL publish (partial: true, skipped_unsignable: [...]) and suppresses the trust doc."
      default: false
    allow_namespace_mismatch:
      type: boolean
      description: "Publish even when an item's effective bundle id diverges from a runtime-authority manifest's name. Default false (such a mismatch is fatal because the daemon rejects runtime-cap minting)."
      default: false
    no_trust_doc:
      type: boolean
      description: "Suppress writing PUBLISHER_TRUST.toml."
      default: false
  required: [source]
