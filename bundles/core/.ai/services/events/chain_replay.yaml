category: "events"
name: "chain_replay"
kind: service
endpoint: events.chain_replay
ui_read_only: true
state_access: read_only_existing
record_thread: false
required_caps: []
schema:
  chain_root_id: string
  after_chain_seq: integer?
  limit: integer?
description: "Replay events for a chain (by chain_root_id)"
disclosure:
  principal:
    - "/events/*/event_id"
