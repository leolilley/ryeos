kind: service
endpoint: project.apply-published
required_caps: ["ryeos.execute.service.project/apply-published"]
schema:
  project_name: string
  base_snapshot_hash: string
  result_snapshot_hash: string
  checkout: string?
description: "Apply a published result (the difference between the snapshot it was authored against and the snapshot it produced) to the caller's registered checkout. Only paths the result changes are checked; every conflict is reported at once and nothing is written when there is one; nothing is merged. A caller who is not the operator sees each conflict's reason and the counts, not the conflicting paths"
disclosure:
  principal:
    - "/applied"
    - "/code"
    - "/files_updated"
    - "/files_deleted"
    - "/total"
    - "/truncated"
    - "/base_snapshot_hash"
    - "/result_snapshot_hash"
    - "/conflicts/*/reason"
  free_text:
    - "/conflicts/*/path"
  max_result_bytes: 262144
  max_items: 256
