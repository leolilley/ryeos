description: "Remove staged bundles while the node runs: the stages named by `digests`, every stage whose signed apply was refused (`apply_refused`), or every stage plus the crash remnants and stale temporary directories of the staging area (`all`; a younger temporary directory may be a transfer in flight and is never touched). Exactly one selector. There is no age selector. Only the node's admitted operator may clear, whatever capability another key holds. The answer lists what was removed and what stays; nothing is written to the offline ledger."
# Clearing is an operator act; a principal or unauthenticated caller is shaped to an empty answer.
