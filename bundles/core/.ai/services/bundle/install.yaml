description: "Install or replace a downstream bundle (NOT core; core is the packaged base laid down at system_data_dir). Copies source_path into <system_space_dir>/.ai/bundles/<name>/ and registers it. Preflight verifies signatures and metadata anchoring before mutation. Stopped-node authority is required; use --replace to update an existing installed bundle. Use --preserve-runtime-artifacts when replacing from a sparse source that omits installed runtime artifacts such as .ai/bin, .ai/objects, or .ai/refs. A replacement that would leave installed node bindings pinning artifacts it removes is refused (replacement_strands_bindings) unless invalidate_bindings names each stranded binding as <section>/<id>."
