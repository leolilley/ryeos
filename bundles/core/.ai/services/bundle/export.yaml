kind: service
endpoint: bundle.export
required_caps: ["ryeos.execute.service.bundle/export"]
schema:
  bundle_name: string
description: "Export an installed bundle as CAS objects. Walks the bundle directory tree, ingests every file into the node's CAS, and returns a manifest of file hashes. Each file records exactly mode 0o644 or 0o755 (the executable bit is the only content); the answer names its format, ryeos.bundle-export/v2."
disclosure:
  principal:
    - "/format"
    - "/bundle_name"
    - "/file_count"
    - "/total_bytes"
    - "/entries/*/kind"
    - "/entries/*/path"
    - "/entries/*/hash"
    - "/entries/*/size"
    - "/entries/*/mode"
  free_text:
    - "/bundle_path"
  max_items: 4096
  max_result_bytes: 8388608
