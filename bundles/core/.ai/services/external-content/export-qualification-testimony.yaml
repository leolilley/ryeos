description: "Origin-side export of one exact local qualification (product lane, or content lane when `content` names the activation_ref, coordinate_id and manifest_hash of the activated content). The node holds no operator key, so this is two steps: without `signed_testimony` it returns {remote, qualification_hash, acceptance_policy_ref, coordinate_id, unsigned_testimony}, the exact statement the operator signs; with `signed_testimony` (that statement plus the operator's signature, made by `ryeos external-content export-qualification-testimony`) it verifies the signature against the operator identity the node pins, submits the testimony to the pinned node remote under the named acceptance policy, and returns {remote, qualification_hash, acceptance_policy_ref, testimony_hash, acceptance_hash, coordinate_id, reused_existing, testimony}"
