description: Derive the consumer qualification context and consumer execution context from admitted inputs for an exact subject manifest; read-only, requires an admitted operator, and writes no state. The response also carries consumer_verifier_selections, a scenario-id keyed map holding for every remote Worker scenario of the policy the exact protected verifier selection (scenario_source_digest, verifier_artifact_hash, archive_budget) its consumer launch requires; archive_budget is the smallest allowance holding that scenario's delivery plus a fixed input-record and framing allowance, not a daemon-enforced default. Write that map alone as the JSON file passed to snapshot-qualification-compose --consumer-verifiers
