description: "Derive the consumer qualification context and consumer execution context from admitted inputs for an exact subject manifest. Worker form: {policy_ref, relationship_ref, subject_manifest_hash}. The relationship is derived, not named: it is the unique relationship in the relationship Config whose consumer is the policy's worker_ref and whose qualification policy is policy_ref (none or several is refused), and the response names the policy_ref and the derived relationship_name; read-only, requires an admitted operator, and writes no state. The response also carries consumer_verifier_selections, a scenario-id keyed map with one entry for every policy scenario that selects a remote verifier (Worker and probe scenarios), each holding the scenario_source_digest and verifier_artifact_hash its consumer launch recomputes and requires exactly. Each archive_budget is a proposed allowance, not a daemon selection: it is computed from the exact archive inventory that scenario's delivery builds (retained products and their manifest records for a Worker scenario, signed archive members for a probe scenario) with the accepted input record charged at its contract maximum. The operator signs the allowance into the profile and may choose another that validates. More than 8 verifier-selecting scenarios are refused. Write the consumer_verifier_selections object alone as the JSON file passed to snapshot-qualification-compose --consumer-verifiers. Probe form: {policy_ref, subject_manifest_hash} for a policy with no consumer execution context (its remote scenarios ship a probe input, not a Worker request); the response carries policy_ref, subject_manifest_hash and the same consumer_verifier_selections, and a policy with a consumer context, a non-probe remote scenario or no remote scenario is refused"
# Operator-only: the handler requires the admitted (or local configured) operator.
