description: "Derive the consumer qualification context and consumer execution context from admitted inputs for an exact subject manifest; read-only, requires an admitted operator, and writes no state. The response also carries consumer_verifier_selections, a scenario-id keyed map with one entry for every policy scenario that selects a remote verifier (Worker and probe scenarios), each holding the scenario_source_digest and verifier_artifact_hash its consumer launch recomputes and requires exactly. Each archive_budget is a proposed allowance, not a daemon selection: it is computed from the exact archive inventory that scenario's delivery builds (retained products and their manifest records for a Worker scenario, signed archive members for a probe scenario) with the accepted input record charged at its contract maximum. The operator signs the allowance into the profile and may choose another that validates. More than 8 verifier-selecting scenarios are refused. Write the consumer_verifier_selections object alone as the JSON file passed to snapshot-qualification-compose --consumer-verifiers"
