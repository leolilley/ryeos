    - "/endorsements/*/received_at"
    - "/endorsements/*/in_force"
    - "/endorsements/*/revoked/revoked_at"
    - "/endorsements/*/target/type"
    - "/endorsements/*/target/kinds"
    - "/endorsements/*/target/not_after"
    - "/endorsements/*/target/items/*/kind"
    - "/endorsements/*/target/items/*/digest"
  free_text:
    - "/endorsements/*/endorser"
    - "/endorsements/*/via"
    - "/endorsements/*/target/items/*/item_ref"
    - "/endorsements/*/revoked/revoked_by"
    - "/endorsements/*/revoked/reason"
