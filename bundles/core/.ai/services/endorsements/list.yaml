kind: service
endpoint: endorsements.list
required_caps: ["ryeos.execute.service.endorsements/list"]
schema:
  project: string?
description: "List the recorded endorsements with their targets, endorsers, times and whether each is in force or revoked, and the current ledger head."
disclosure:
  principal:
    - "/endorsements/*/endorsement_digest"
    # The canonical project identity (`pid:v1:<owner hex>/<validated name>`); the owner filter means a principal sees only projects it owns.
    - "/endorsements/*/project"
