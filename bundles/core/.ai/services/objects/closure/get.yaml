kind: service
endpoint: objects.closure.get
required_caps: ["ryeos.execute.service.objects/closure/get"]
result_retention: digest_only
schema:
  root: object
  roots: string[]
  max_objects: number?
  max_blobs: number?
  max_object_bytes: number?
  max_total_object_bytes: number?
  max_blob_bytes: number?
  max_total_blob_bytes: number?
  max_response_bytes: number?
  max_links_per_object: number?
  allow_incomplete: boolean?
  allow_untransported_large_objects: boolean?
description: "Retrieve every present object and blob in a schema-defined CAS closure within node object_closure policy"
disclosure:
  principal:
    - "/closure/roots"
    - "/closure/complete"
    - "/closure/object_hashes"
    - "/closure/blob_hashes"
    - "/closure/large_object_hashes"
    - "/closure/missing_objects/*/hash"
    - "/closure/missing_objects/*/referenced_by"
    - "/closure/missing_blobs/*/hash"
    - "/closure/missing_blobs/*/referenced_by"
    - "/closure/malformed_objects/*/hash"
    - "/closure/unsupported_objects/*/hash"
    - "/closure/unsupported_objects/*/kind"
    - "/closure/counts/objects"
    - "/closure/counts/blobs"
    - "/closure/counts/large_objects"
    - "/closure/counts/missing_objects"
    - "/closure/counts/missing_blobs"
    - "/closure/counts/malformed_objects"
    - "/closure/counts/unsupported_objects"
    - "/object_bytes"
    - "/blob_bytes"
    - "/entries/*/hash"
    - "/entries/*/kind"
  free_text:
    - "/closure/malformed_objects/*/reason"
  interim_free_text:
    - "/entries/*/value"  # removed by: m4
    - "/entries/*/data"  # removed by: m4
  max_items: 4096
  max_result_bytes: 8388608
