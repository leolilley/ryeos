    - "/entries/*/hash"
    - "/entries/*/kind"
    - "/blob_chunk/hash"
    - "/blob_chunk/kind"
    - "/blob_chunk/offset"
    - "/blob_chunk/total_size"
    - "/blob_chunk/eof"
    - "/large_object_chunk/hash"
    - "/large_object_chunk/kind"
    - "/large_object_chunk/offset"
    - "/large_object_chunk/total_size"
    - "/large_object_chunk/eof"
  interim_free_text:
    - "/entries/*/value"  # removed by: m4
    - "/entries/*/data"  # removed by: m4
    - "/blob_chunk/data"  # removed by: m4
    - "/large_object_chunk/data"  # removed by: m4
  max_items: 4096
  max_result_bytes: 8388608
