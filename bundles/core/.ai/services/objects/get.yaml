kind: service
endpoint: objects.get
required_caps: ["ryeos.execute.service.objects/get"]
schema:
  root: object
  object_hashes: string[]?
  blob_hashes: string[]?
  blob_chunk: object?
  large_object_chunk: object?
description: "Retrieve typed CAS object/blob batches, one bounded blob chunk, or one bounded large-object chunk served from the large-object tier, only for hashes reachable from the named root (project_head, thread_result, bundle_export, placement, admitted_subject or catalog_publication); refuses anything else with object_not_in_scope"
disclosure:
