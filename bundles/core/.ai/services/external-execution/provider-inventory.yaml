description: "List, read only, the sandboxes and snapshots the provider holds for one installed binding's owner scope (binding is <section>/<id>, an external_execution or runtime_snapshot_production binding), using its adapter and vault credential. Each row is joined with the node's journals and classed known_live, leaked (the node's record ended, the provider still runs it), unknown (no node record) or gone (the node holds it open, the provider no longer runs it). Nothing is deleted. The result is stored as a node-signed receipt whose digest settle-unknown-allocation cites."
