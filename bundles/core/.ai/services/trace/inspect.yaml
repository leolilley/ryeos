category: "trace"
name: "inspect"
kind: service
version: "1.0.0"
endpoint: trace.inspect
availability: both
required_caps: []
schema:
  thread_id: string?
  chain_root_id: string?
  after_chain_seq: integer?
  limit: integer?
description: "Inspect a thread or chain as normalized durable trace events with verifiable event refs."
disclosure:
  principal:
    - "/scope/chain_root_id"
    - "/scope/thread_id"
    - "/events/*/event_ref"
    - "/events/*/event_type"
    - "/events/*/ts"
    - "/next_cursor"
  free_text:
    - "/events/*/raw_event"
    - "/events/*/state_anchor"
    - "/state_anchors"
    - "/warnings"
