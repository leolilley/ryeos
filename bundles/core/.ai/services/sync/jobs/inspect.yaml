# ryeos:signed:2026-11-24T13:50:08Z:9fb39599efc0b0715e6c514693abd7c339f6ce1597b8bab5cd1f43d6bc32f9c7:+WSvs+/Qm9jVtatMHvN84yC8qwJZBpPs+qY3bDeP9wAByp95r1B2aIaxkwrsAbMDySTdPGoIfy+20y/OUkmXDA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
endpoint: sync.jobs.inspect
required_caps: ["ryeos.execute.service.sync/jobs/inspect"]
schema:
  job_id: string
description: "Inspect one durable distributed sync job"
# job/operation, uploaded_hashes and fetched_hashes are left unlisted: operator-only (retry authority, long lists).
disclosure:
  principal:
    - "/status"
    - "/job_id"
    - "/attempt_retention"
    - "/job/job_id"
    - "/job/operation_type"
    - "/job/state"
    - "/job/phase"
    - "/job/attempt_count"
    - "/job/max_attempts"
    - "/job/created_at"
    - "/job/updated_at"
    - "/job/finished_at"
    - "/attempts/*/attempt_id"
    - "/attempts/*/job_id"
    - "/attempts/*/attempt_number"
    - "/attempts/*/worker_id"
    - "/attempts/*/state"
    - "/attempts/*/phase"
    - "/attempts/*/started_at"
    - "/attempts/*/updated_at"
    - "/attempts/*/finished_at"
  free_text:
    - "/job/peer"
    - "/job/last_error"
    - "/job/result"
    - "/job/roots"
    - "/job/heads"
    - "/attempts/*/error"
    - "/attempts/*/result"
  max_items: 1024
  max_result_bytes: 1048576
