# ryeos:signed:2026-11-26T00:50:54Z:94804ab1e5fa42efb14419b0fe29d6d977050d7791a631ec68065f3496565cc4:TwQ6ks91wBlsdxpMLb8W1RX9lPW+0b5FX+/lHcvDYNZ65Ly/qK9/dHt/C9dI+VJk3g1kYY2mTOMkJTBAOapkBg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
endpoint: sync.jobs.inspect
required_caps: ["ryeos.execute.service.sync/jobs/inspect"]
schema:
  job_id: string
description: "Inspect one durable distributed sync job"
# job/operation, uploaded_hashes and fetched_hashes are left unlisted: operator-only (retry authority, long lists).
disclosure:
  principal:
    - "/status"
    - "/job_id"
    - "/attempt_retention"
    - "/job/job_id"
    - "/job/operation_type"
    - "/job/state"
    - "/job/phase"
    - "/job/attempt_count"
    - "/job/max_attempts"
    - "/job/created_at"
    - "/job/updated_at"
    - "/job/finished_at"
    - "/job/roots"
    - "/job/heads"
    - "/job/uploaded_hashes"
    - "/job/fetched_hashes"
    - "/attempts/*/attempt_id"
    - "/attempts/*/job_id"
    - "/attempts/*/attempt_number"
    - "/attempts/*/worker_id"
    - "/attempts/*/state"
    - "/attempts/*/phase"
    - "/attempts/*/started_at"
    - "/attempts/*/updated_at"
    - "/attempts/*/finished_at"
  free_text:
    - "/job/peer"
    - "/job/last_error"
    - "/job/result"
    - "/attempts/*/error"
    - "/attempts/*/result"
  max_items: 1024
  max_result_bytes: 1048576
