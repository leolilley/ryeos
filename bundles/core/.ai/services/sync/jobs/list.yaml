kind: service
endpoint: sync.jobs.list
required_caps: ["ryeos.execute.service.sync/jobs/list"]
schema:
  state: string?
  limit: number?
description: "List durable distributed sync jobs with optional state filtering"
# uploaded_hashes and fetched_hashes are left unlisted: operator-only, they can be very long lists.
disclosure:
  principal:
    - "/jobs/*/job_id"
    - "/jobs/*/operation_type"
    - "/jobs/*/state"
    - "/jobs/*/phase"
    - "/jobs/*/attempt_count"
    - "/jobs/*/max_attempts"
    - "/jobs/*/created_at"
    - "/jobs/*/updated_at"
    - "/jobs/*/finished_at"
    - "/jobs/*/roots"
    - "/jobs/*/heads"
    - "/jobs/*/uploaded_hashes"
    - "/jobs/*/fetched_hashes"
  free_text:
    - "/jobs/*/peer"
    - "/jobs/*/last_error"
    - "/jobs/*/result"
  max_items: 4096
  max_result_bytes: 1048576
