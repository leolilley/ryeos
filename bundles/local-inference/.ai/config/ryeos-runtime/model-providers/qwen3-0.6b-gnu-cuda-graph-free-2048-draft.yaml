# UNSIGNED DRAFT; funded pricing/admission must be supplied by integration owner.
category: ryeos-runtime/model-providers
family: chat_completions
transport:
  kind: admitted_local_worker
  execute: worker:local-inference/qwen3-0.6b-gnu-cuda-graph-free-2048-draft
  effect_class_ceiling: live
auth: {}
schemas:
  accounting:
    require_usage: true
  messages:
    role_map:
      user: user
      assistant: assistant
      system: system
      tool: tool
    content_key: content
    system_message:
      mode: message_role
    tool_result:
      role: tool
      wrap_mode: direct
      block_template:
        tool_call_id: '{tool_call_id}'
        content: '{content}'
    tool_call_block_template:
      id: '{id}'
      type: function
      function:
        name: '{name}'
        arguments: '{input_json}'
  tools:
    template:
      type: function
      function:
        name: '{name}'
        description: '{description}'
        parameters: '{schema}'
  streaming:
    mode: delta_merge
    metadata:
      usage:
        path: usage
        input_tokens_path: input_tokens
        output_tokens_path: output_tokens
        reasoning_tokens_path: reasoning_tokens
        reasoning_included_in_output: true
        aggregation: latest_snapshot
        single_snapshot: true
      finish_reason_path: finish_reason
      response_id_path: response_id
  output_limit:
    path: max_tokens
    semantics: provider_native_output_tokens
  reasoning:
    mode:
      path: enable_thinking
      values:
        enabled: true
        disabled: false
body_template:
  model: '{model}'
  messages: '{messages}'
  tools: '{tools}'
  stream: '{stream}'
  stream_options:
    include_usage: true
body_extra:
  max_tokens: 8
  temperature: 0.0
  seed: 0
  enable_thinking: false
extra:
  setup:
    display_name: GNU CUDA graph-free compatibility DRAFT
    priority: 0
    credential: null
    models:
    - name: qwen3-0.6b
      display_name: Qwen3 0.6B
      context_window: 2048
  available_models:
    local:
    - qwen3-0.6b
