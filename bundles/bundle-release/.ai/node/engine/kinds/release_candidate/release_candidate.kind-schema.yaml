    signature:
      prefix: "#"
# A release candidate is a signed, non-executable record naming one exact
# populated bundle tree. The body is one canonical-JSON document (valid YAML)
# whose `digest` is the SHA-256 of the record without that field. The engine
# treats it as an opaque signed document; its meaning is owned by the
# bundle-release tooling.
composer: handler:ryeos/core/identity
composed_value_contract:
  root_type: mapping
  required:
    schema: { type: single, prim: string }
    digest: { type: single, prim: string }
    bundle: { type: single, prim: string }
    version: { type: single, prim: string }
    generation_inputs: { type: single, prim: mapping }
    items: { type: single, prim: mapping }
    unsigned: { type: single, prim: mapping }
    closure: { type: single, prim: mapping }
    authority: { type: single, prim: mapping }
  optional:
    native:
      type: union
      prims: [mapping, "null"]
    predecessor:
      type: union
      prims: [string, "null"]
metadata:
