version: "1.0.0"
category: ryeos/bundle-release
description: Build exactly one non-core bundle and all payloads selected by the ownership contract into a clean captured output.
effects: live
product_recipe: config:bundle-release/native-build-products
config:
  start: build
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    additionalProperties: false
    required: [release_input]
    properties:
      release_input: {type: object}
  state: {}
  nodes:
    build:
      action:
        item_id: tool:ryeos/bundle-release/native-build
        params:
          release_input: "${inputs.release_input}"
      assign: {build: "${result}"}
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.build}"
