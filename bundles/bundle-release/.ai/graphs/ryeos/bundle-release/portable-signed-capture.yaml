# ryeos:signed:2026-09-23T04:20:49Z:d2d3087d12a927bbc0847acdcde6678ceba2b7eaac599ebd1afb34ab8b5ababf:GDIb/DkWVnfJdzZnI5s+AtjMVTKnOhfaSTw6Q4OTEOlEN2eTP2Xy9LrnB1O2YMCA3br5OCi6ic0RBO8uxG54CA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
category: ryeos/bundle-release
description: Materialize a publisher-signed portable bundle tree as a second admitted product.
effects: live
external_product_slots:
  - {id: python, relationship_ref: config:bundle-release/execution-environment-products, relationship: python_to_portable_signed_capture, kind: tree, mount_root: execution_runtime, mount: python-gnu}
  - id: unsigned_bundle
    relationship_ref: config:bundle-release/portable-build-products
    relationship: portable_bundle_to_signed_capture
    kind: tree
    mount_root: execution_runtime
    mount: unsigned-native-bundle
product_recipe: config:bundle-release/portable-signed-capture-products
requires:
  capabilities:
    declared:
      - ryeos.execute.config.bundle-release/execution-environment-products
      - ryeos.execute.config.bundle-release/execution-tool-products
      - ryeos.execute.tool.ryeos/bundle-release/portable-signed-capture
config:
  start: capture
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    additionalProperties: false
    required: [release_input, materialization_result_hash, signed_tree_manifest_hash, manifest_item_hash, signed_manifest, child_product_selections]
    properties:
      release_input: {type: object}
      child_product_selections: {type: array, minItems: 1, maxItems: 8}
      materialization_result_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
      signed_tree_manifest_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
      manifest_item_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
      signed_manifest: {type: string}
  state: {}
  nodes:
    capture:
      action:
        item_id: tool:ryeos/bundle-release/portable-signed-capture
        ref_bindings: {}
        product_selections: "${inputs.child_product_selections}"
        params:
          release_input: "${inputs.release_input}"
          materialization_result_hash: "${inputs.materialization_result_hash}"
          signed_tree_manifest_hash: "${inputs.signed_tree_manifest_hash}"
          manifest_item_hash: "${inputs.manifest_item_hash}"
          signed_manifest: "${inputs.signed_manifest}"
      assign: {capture: "${result}"}
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.capture}"
