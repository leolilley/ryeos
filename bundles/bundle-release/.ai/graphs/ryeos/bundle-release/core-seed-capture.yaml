# ryeos:signed:2026-09-23T04:20:49Z:263cc01a378ab574caae0177550a778bee82f1b1045ddc335393b0ccbbd53164:QOCGovxeHFwfRNZno3HeWd5SWRVD9ZEnuF79SJWLbUN4B+D3GQ6nNkhZiRIXSz0rdSliut47ynjiWcViuWiXCQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
category: ryeos/bundle-release
description: Capture the admitted unsigned Core seed with only its exact publisher-signed manifest changed.
effects: live
external_product_slots:
  - {id: python, relationship_ref: config:bundle-release/execution-environment-products, relationship: python_to_core_seed_capture, kind: tree, mount_root: execution_runtime, mount: python-gnu}
  - id: unsigned_core
    relationship_ref: config:bundle-release/core-seed-build-products
    relationship: core_seed_to_signed_capture
    kind: tree
    mount_root: execution_runtime
    mount: unsigned-core-seed
product_recipe: config:bundle-release/core-seed-capture-products
requires:
  capabilities:
    declared:
      - ryeos.execute.config.bundle-release/execution-environment-products
      - ryeos.execute.config.bundle-release/execution-tool-products
      - ryeos.execute.tool.ryeos/bundle-release/core-seed-capture
config:
  start: capture
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    additionalProperties: false
    required: [release_input, materialization_result_hash, signed_tree_manifest_hash, manifest_item_hash, signed_manifest, child_product_selections]
    properties:
      release_input: {type: object}
      child_product_selections: {type: array, minItems: 1, maxItems: 8}
      materialization_result_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
      signed_tree_manifest_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
      manifest_item_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
      signed_manifest: {type: string}
  state: {}
  nodes:
    capture:
      action:
        item_id: tool:ryeos/bundle-release/core-seed-capture
        ref_bindings: {}
        product_selections: "${inputs.child_product_selections}"
        params:
          release_input: "${inputs.release_input}"
          materialization_result_hash: "${inputs.materialization_result_hash}"
          signed_tree_manifest_hash: "${inputs.signed_tree_manifest_hash}"
          manifest_item_hash: "${inputs.manifest_item_hash}"
          signed_manifest: "${inputs.signed_manifest}"
      assign: {capture: "${result}"}
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.capture}"
