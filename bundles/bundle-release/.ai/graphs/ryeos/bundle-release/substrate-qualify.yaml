version: "1.0.0"
category: ryeos/bundle-release
description: Run the exact substrate release verifier against the admitted receipt-only captured product.
effects: live
external_product_slots:
  - id: subject
    relationship_ref: config:bundle-release/substrate-build-products
    relationship: substrate_release_to_qualification
    kind: tree
    mount_root: execution_runtime
    mount: substrate-release
config:
  start: qualify
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    additionalProperties: false
    properties: {}
  state: {}
  nodes:
    qualify:
      action:
        item_id: tool:ryeos/bundle-release/substrate-qualify
        params: {}
      assign: {qualification: "${result}"}
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.qualification}"
