version: "1.0.0"
category: ryeos/bundle-release
description: Run the exact native bundle verifier against the admitted captured producer product.
effects: live
external_product_slots:
  - id: subject
    relationship_ref: config:bundle-release/signed-capture-products
    relationship: signed_native_bundle_to_release_qualification
    kind: tree
    mount_root: execution_runtime
    mount: native-bundle
config:
  start: qualify
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    additionalProperties: false
    required: [release_input, release_input_digest, captured_tree_manifest_hash, manifest_item_hash]
    properties:
      release_input: {type: object}
      release_input_digest: {type: string, pattern: "^[0-9a-f]{64}$"}
      captured_tree_manifest_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
      manifest_item_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
  state: {}
  nodes:
    qualify:
      action:
        item_id: tool:ryeos/bundle-release/native-qualify
        params:
          release_input: "${inputs.release_input}"
          release_input_digest: "${inputs.release_input_digest}"
          captured_tree_manifest_hash: "${inputs.captured_tree_manifest_hash}"
          manifest_item_hash: "${inputs.manifest_item_hash}"
      assign: {qualification: "${result}"}
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.qualification}"
