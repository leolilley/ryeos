version: "1.0.0"
category: ryeos/bundle-release
description: Produce one captured receipt binding a measured host image to its qualified Core generation.
effects: live
product_recipe: config:bundle-release/substrate-build-products
config:
  start: build
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    additionalProperties: false
    required: [receipt]
    properties:
      receipt: {type: object}
  state: {}
  nodes:
    build:
      action:
        item_id: tool:ryeos/bundle-release/substrate-build
        params:
          receipt: "${inputs.receipt}"
      assign: {build: "${result}"}
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.build}"
