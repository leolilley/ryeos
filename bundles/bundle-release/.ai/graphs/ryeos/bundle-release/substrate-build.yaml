version: "1.0.0"
category: ryeos/bundle-release
description: Produce one captured receipt binding a measured host image to its qualified Core generation.
effects: live
external_product_slots:
  - {id: python, relationship_ref: config:bundle-release/execution-environment-products, relationship: python_to_substrate_build, kind: tree, mount_root: execution_runtime, mount: python-gnu}
product_recipe: config:bundle-release/substrate-build-products
requires:
  capabilities:
    declared:
      - ryeos.execute.config.bundle-release/execution-environment-products
      - ryeos.execute.config.bundle-release/execution-tool-products
      - ryeos.execute.tool.ryeos/bundle-release/substrate-build
config:
  start: build
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    additionalProperties: false
    required: [receipt, child_product_selections]
    properties:
      receipt: {type: object}
      child_product_selections: {type: array, minItems: 1, maxItems: 8}
  state: {}
  nodes:
    build:
      action:
        item_id: tool:ryeos/bundle-release/substrate-build
        ref_bindings: {}
        product_selections: "${inputs.child_product_selections}"
        params:
          receipt: "${inputs.receipt}"
      assign: {build: "${result}"}
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.build}"
