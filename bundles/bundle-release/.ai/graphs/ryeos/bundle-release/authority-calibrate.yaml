# ryeos:signed:2026-09-29T01:29:18Z:0f328a2ec3947915be557c94a83f527f5d0c967143ad2b9a208d80d2bcd4d4f9:GpbB5TAzmYB9isTfUbzHCegYY2yBrq1WRunqFnLp+6wb2gkDXC069JGiLJ/FZf0X7Gd94sVPXDW7iJsSSq/YDA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.1.0"
category: ryeos/bundle-release
description: Run the bounded pre-policy authority calibration against one verified RyeOS ProjectSnapshot without contacting a catalog or publisher.
effects: live
requires:
  capabilities:
    declared:
      - ryeos.execute.config.bundle-release/core-seed-build-products
      - ryeos.execute.config.bundle-release/core-seed-capture-products
      - ryeos.execute.config.bundle-release/execution-environment-products
      - ryeos.execute.config.bundle-release/execution-tool-products
      - ryeos.execute.config.bundle-release/native-build-products
      - ryeos.execute.config.bundle-release/native-qualification
      - ryeos.execute.config.bundle-release/portable-build-products
      - ryeos.execute.config.bundle-release/portable-qualification
      - ryeos.execute.config.bundle-release/portable-signed-capture-products
      - ryeos.execute.config.bundle-release/signed-capture-products
      - ryeos.execute.config.bundle-release/substrate-build-products
      - ryeos.execute.service.external-content/launch-product-qualification
      - ryeos.execute.service.bundle-release/authority-calibrate
      - ryeos.execute.tool.ryeos/bundle-release/core-seed-build
      - ryeos.execute.tool.ryeos/bundle-release/core-seed-capture
      - ryeos.execute.tool.ryeos/bundle-release/core-seed-qualify
      - ryeos.execute.tool.ryeos/bundle-release/native-build
      - ryeos.execute.tool.ryeos/bundle-release/native-qualify
      - ryeos.execute.tool.ryeos/bundle-release/portable-build
      - ryeos.execute.tool.ryeos/bundle-release/portable-qualify
      - ryeos.execute.tool.ryeos/bundle-release/portable-signed-capture
      - ryeos.execute.tool.ryeos/bundle-release/signed-capture
      - ryeos.execute.tool.ryeos/bundle-release/substrate-build
      - ryeos.execute.tool.ryeos/bundle-release/substrate-qualify
config:
  start: calibrate
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    additionalProperties: false
    required: [project_path, source_snapshot_hash, execution_environment]
    properties:
      project_path: {type: string}
      source_snapshot_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
      execution_environment:
        type: object
        additionalProperties: false
        required: [python_runtime, platform, cargo_vendor, static_link_inputs]
        properties:
          python_runtime: {$ref: "#/$defs/product_selection"}
          platform: {$ref: "#/$defs/product_selection"}
          cargo_vendor: {$ref: "#/$defs/product_selection"}
          static_link_inputs: {$ref: "#/$defs/product_selection"}
    $defs:
      product_selection:
        type: object
        additionalProperties: false
        required: [product_witness_hash, qualification_attestation_hash]
        properties:
          product_witness_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
          qualification_attestation_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
  state: {}
  nodes:
    calibrate:
      action:
        item_id: service:bundle-release/authority-calibrate
        ref_bindings: {}
        params:
          project_path: "${inputs.project_path}"
          source_snapshot_hash: "${inputs.source_snapshot_hash}"
          execution_environment: "${inputs.execution_environment}"
      assign: {calibration: "${result}"}
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.calibration}"
