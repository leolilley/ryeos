version: "1.0.0"
category: ryeos/bundle-release
description: Run the bounded pre-policy authority calibration against one clean source snapshot without contacting a catalog or publisher.
effects: live
requires:
  capabilities:
    declared:
      - ryeos.execute.config.bundle-release/core-seed-build-products
      - ryeos.execute.config.bundle-release/core-seed-capture-products
      - ryeos.execute.config.bundle-release/native-build-products
      - ryeos.execute.config.bundle-release/signed-capture-products
      - ryeos.execute.config.bundle-release/substrate-build-products
      - ryeos.execute.service.bundle-release/authority-calibrate
config:
  start: calibrate
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    additionalProperties: false
    required: [project_path, source_snapshot_hash]
    properties:
      project_path: {type: string}
      source_snapshot_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
  state: {}
  nodes:
    calibrate:
      action:
        item_id: service:bundle-release/authority-calibrate
        ref_bindings: {}
        params:
          project_path: "${inputs.project_path}"
          source_snapshot_hash: "${inputs.source_snapshot_hash}"
      assign: {calibration: "${result}"}
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.calibration}"
