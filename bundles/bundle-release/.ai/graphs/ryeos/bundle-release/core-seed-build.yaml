version: "1.0.1"
category: ryeos/bundle-release
description: Build the exact unsigned Core generation that will seed a measured RyeOS substrate.
effects: live
external_product_slots:
  - {id: python, relationship_ref: config:bundle-release/execution-environment-products, relationship: python_to_core_seed_build, kind: tree, mount_root: execution_runtime, mount: python-gnu}
  - {id: platform, relationship_ref: config:bundle-release/execution-environment-products, relationship: platform_to_core_seed_build, kind: tree, mount_root: execution_runtime, mount: platform}
  - {id: cargo-vendor, relationship_ref: config:bundle-release/execution-environment-products, relationship: cargo_vendor_to_core_seed_build, kind: tree, mount_root: execution_runtime, mount: cargo-vendor}
  - {id: static-link-inputs, relationship_ref: config:bundle-release/execution-environment-products, relationship: static_link_inputs_to_core_seed_build, kind: tree, mount_root: execution_runtime, mount: static-link-inputs}
product_recipe: config:bundle-release/core-seed-build-products
requires:
  capabilities:
    declared:
      - ryeos.execute.config.bundle-release/execution-environment-products
      - ryeos.execute.config.bundle-release/execution-tool-products
      - ryeos.execute.tool.ryeos/bundle-release/core-seed-build
config:
  start: build
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    additionalProperties: false
    required: [release_input, child_product_selections]
    properties:
      release_input: {type: object}
      child_product_selections: {type: array, minItems: 1, maxItems: 8}
  state: {}
  nodes:
    build:
      action:
        item_id: tool:ryeos/bundle-release/core-seed-build
        ref_bindings: {}
        product_selections: "${inputs.child_product_selections}"
        params: {release_input: "${inputs.release_input}"}
      assign: {build: "${result}"}
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.build}"
