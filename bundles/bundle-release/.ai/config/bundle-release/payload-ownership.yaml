# ryeos:signed:2026-10-15T23:40:48Z:43823d5a37b8e34c9924e78a0c15f1a39976916cc28bc89e2715051b381a93d7:lBw8vK+UkplB3qV3ld0J23t9USUwrmoLsRV+BwMtkY5I+cQJ1T/0ViCThGAOeNe+ADjt4OCOYupKoJIS1VJcCA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: bundle-release
version: "2.0.0"
description: Exact publisher-authored ownership of native payloads, Cargo feature compositions and daemon-linked host features by RyeOS bundle.
payload_ownership:
  schema: ryeos.bundle_payload_ownership.v2
  kind: bundle_payload_ownership
  # Daemon-linked Cargo packages that receive every selected bundle host feature.
  host_packages: [ryeos-api, ryeos-cli, ryeosd]
  # Payload Cargo packages built with --no-default-features; they build with
  # exactly their selected features.
  no_default_features_packages: [ryeos-handler-bins]
  # Cargo feature implications per package. A feature implied by another
  # selected feature is dropped from the derived selection.
  feature_implications:
    ryeos-handler-bins:
      directive-handlers: [core-handlers, extends-composer]
      graph-handlers: [core-handlers, extends-composer]
  # Bundles that own no native payload and contribute no host feature.
  data_only_bundles: [bundle-release, bundle-source, central-auth, local-inference, opencode]
  # Payload-free bundles that contribute daemon-linked host features.
  host_only_bundles:
    - bundle_name: scheduling
      bundle_sets: [central-host, core-scheduling, full, hosted-workflow, local-inference, release-artifacts, release-authority, standard, standard-central-auth]
      host_features: [scheduling]
  bundles:
    - bundle_name: browser
      bundle_sets: [full, release-artifacts, release-authority]
      host_features: []
      payloads:
        - binary: ryeos-browser-tools
          cargo_package: ryeos-browser-tools
          build_class: release
          cargo_features: []
    - bundle_name: codex
      bundle_sets: [f5r-controller, full, hosted-workflow, release-artifacts, release-authority]
      host_features: []
      payloads:
        - binary: codex-runtime-verifier
          cargo_package: ryeos-codex-runtime-verifier
          build_class: static
          cargo_features: []
        - binary: ryeos-codex-external-configuration
          cargo_package: ryeos-codex-external-configuration
          build_class: static
          cargo_features: []
        - binary: ryeos-codex-guest-runtime-producer
          cargo_package: ryeos-codex-guest-runtime-producer
          build_class: static
          cargo_features: []
        - binary: ryeos-external-candidate-connector
          cargo_package: ryeos-external-candidate-connector
          build_class: static
          cargo_features: []
        - binary: ryeos-external-guest-occurrence-owner
          cargo_package: ryeos-external-guest-occurrence-owner
          build_class: static
          cargo_features: []
        - binary: ryeos-external-guest-runtime-producer
          cargo_package: ryeos-external-guest-runtime-producer
          build_class: static
          cargo_features: []
    - bundle_name: core
      bundle_sets: [bundle-source, central-host, core, core-scheduling, f5r-controller, full, hosted-workflow, local-inference, release-artifacts, release-authority, standard, standard-central-auth]
      host_features: []
      payloads:
        - binary: rye-composer-identity
          cargo_package: ryeos-handler-bins
          build_class: release
          cargo_features: [core-handlers]
