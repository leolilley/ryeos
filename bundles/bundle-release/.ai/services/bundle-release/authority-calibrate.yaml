kind: service
name: authority-calibrate
version: "1.0.0"
description: Execute the fixed, operator-only native, Core seed, and substrate calibration lanes and retain one node-authenticated calibration run; this service cannot finalize, authorize, compose, or publish a release.
endpoint: bundle_release.authority_calibrate
ui_read_only: false
state_access: read_write
record_thread: true
availability: daemon_only
