category: ryeos/bundle-release
name: portable-build
version: "1.0.0"
description: Materialize one exact portable bundle using only the admitted Python runtime.
executor_id: tool:ryeos/bundle-release/runtime
execution_protocol: protocol:ryeos/core/opaque
effects: live
filesystem_authority: captured_execution
network_authority: isolated
external_product_slots:
  - {id: python, relationship_ref: config:bundle-release/execution-tool-products, relationship: python_to_portable_build_tool, kind: tree, mount_root: execution_runtime, mount: python-gnu}
env_config:
  interpreter: {type: realization_member, realization_id: python, relative_path: python/bin/python3.14}
config:
  command: "${interpreter}"
  args: ["-I", "-B", ".ai/tools/ryeos/bundle-release/lib/native-build.py"]
  input_data: "${params_json}"
  timeout_secs: 7200
input_schema:
  type: object
  additionalProperties: false
  required: [release_input]
  properties:
    release_input: {type: object}
