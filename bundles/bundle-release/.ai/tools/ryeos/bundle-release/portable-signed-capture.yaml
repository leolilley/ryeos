category: ryeos/bundle-release
name: portable-signed-capture
version: "1.0.0"
description: Apply the exact publisher-signed manifest to an admitted portable bundle.
executor_id: tool:ryeos/bundle-release/runtime
execution_protocol: protocol:ryeos/core/opaque
effects: live
filesystem_authority: captured_execution
network_authority: isolated
external_product_slots:
  - {id: python, relationship_ref: config:bundle-release/execution-tool-products, relationship: python_to_portable_signed_capture_tool, kind: tree, mount_root: execution_runtime, mount: python-gnu}
  - {id: unsigned_bundle, relationship_ref: config:bundle-release/portable-build-products, relationship: portable_bundle_to_signed_capture_tool, kind: tree, mount_root: execution_runtime, mount: unsigned-native-bundle}
env_config:
  interpreter: {type: realization_member, realization_id: python, relative_path: python/bin/python3.14}
config:
  command: "${interpreter}"
  args: ["-I", "-B", {source_member: "lib/signed-capture.py"}]
  input_data: "${params_json}"
  timeout_secs: 300
