category: ryeos/bundle-release
name: native-build
version: "1.0.0"
description: Materialize one exact non-core bundle and all of its owned native payloads into a fresh captured product root.
executor_id: "@subprocess"
execution_protocol: protocol:ryeos/core/opaque
effects: live
filesystem_authority: captured_execution
network_authority: isolated
source_scope:
  location: item_namespace
  load_roots: [item_directory]
  materialization: read_only
config:
  command: /usr/bin/python3
  args: ["${tool_dir}/lib/native-build.py"]
  input_data: "${params_json}"
  timeout_secs: 7200
input_schema:
  type: object
  additionalProperties: false
  required: [release_input]
  properties:
    release_input: {type: object}
