category: ryeos/bundle-release
name: core-seed-build
version: "1.0.2"
description: Materialize the initial Core bundle from pinned source into a fresh captured product root, using RyeOS-verified payload ownership.
executor_id: tool:ryeos/bundle-release/runtime
execution_protocol: protocol:ryeos/core/opaque
effects: live
filesystem_authority: captured_execution
network_authority: isolated
external_product_slots:
  - {id: python, relationship_ref: config:bundle-release/execution-tool-products, relationship: python_to_core_seed_build_tool, kind: tree, mount_root: execution_runtime, mount: python-gnu}
  - {id: platform, relationship_ref: config:bundle-release/execution-tool-products, relationship: platform_to_core_seed_build_tool, kind: tree, mount_root: execution_runtime, mount: platform}
  - {id: cargo-vendor, relationship_ref: config:bundle-release/execution-tool-products, relationship: cargo_vendor_to_core_seed_build_tool, kind: tree, mount_root: execution_runtime, mount: cargo-vendor}
  - {id: static-link-inputs, relationship_ref: config:bundle-release/execution-tool-products, relationship: static_link_inputs_to_core_seed_build_tool, kind: tree, mount_root: execution_runtime, mount: static-link-inputs}
env_config:
  interpreter: {type: realization_member, realization_id: python, relative_path: python/bin/python3.14}
config_resolve:
  type: strict_signed_project_bundle
  bundle_name: bundle-release
  config_path: bundles/bundle-release/.ai/config/bundle-release/payload-ownership.yaml
config:
  command: "${interpreter}"
  args: ["-I", "-B", {source_member: "lib/core-seed-build.py"}]
  input_data: "${params_json}"
  timeout_secs: 7200
input_schema:
  type: object
  additionalProperties: false
  required: [release_input]
  properties:
    release_input: {type: object}
