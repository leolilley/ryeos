    mount_root: execution_runtime
    mount: substrate-release
env_config:
  interpreter: {type: realization_member, realization_id: python, relative_path: python/bin/python3.14}
config:
  command: "${interpreter}"
  args: ["-I", "-B", {source_member: "lib/substrate-qualify.py"}]
  input_data: "${params_json}"
  timeout_secs: 60
