tokens:
- scheduler
- register
description: >-
  Create or update a schedule spec. The input object must explicitly provide
  schedule_id, item_ref, ref_bindings, schedule_type, expression, params, timezone,
  misfire_policy, overlap_policy, lateness_grace_secs, enabled, capabilities, and
  execution_policy;
  execution_policy is required and project_root is optional only for projectless execution.
  Optional bounds: limits (a per-fire ceiling of turns, tokens, spend_usd, spawns,
  depth, duration_seconds), max_fires and expires_at (an RFC 3339 instant). A schedule
  that reaches max_fires or expires_at pauses itself.
arguments:
- name: params
  kind: json
  positional: 1
  required: false
  description: JSON object passed to the scheduled item
parameter_binding:
  mode: tail_object
  input_flag: input
  single_json_object_arg: true
  flag_key_normalization: hyphen_to_underscore
defaults:
  ref_bindings: {}
dispatch:
  kind: execute_ref
  execute: service:scheduler/register
