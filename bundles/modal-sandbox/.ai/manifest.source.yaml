    supervisor: ryeos-external-candidate-supervisor
    launcher: ryeos-external-candidate-launcher
    provider_spec:
      path: specs/provider-spec.json
      sha256: "73f7a4a949efc6486fced7c0aa564fda7e65398ae6347a92937bbd5ca663f096"
    settings_schema_digest: "1789a6c8cd8d26db144511effbbc1478426e2a116aa5284f992c6d31eaef6095"
    capabilities:
      - exact_allocation_reconciliation
      - authoritative_no_occurrence
