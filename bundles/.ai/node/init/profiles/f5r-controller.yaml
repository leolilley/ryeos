# ryeos:signed:2026-10-21T01:58:27Z:25accfa25c979388d8b929fc8e2093b5339d400a717f2ae06bc47c15f71a0bf9:bBfrIhhVpq3h3Ov2CfLOSlrTcAZhuQE1kBGk2E1UnLfm65EoB3I+x1hVucYM77HadUBO1MF9h3XIBmNHzJpdDQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
# Controller of remote Codex authoring leases: runs the Codex app server
# and the render-sandbox lease adapter, and runs no schedules.
schema: 1
exact_bundles:
  - codex
  - core
  - graph
  - knowledge
  - render-sandbox
policies:
  bundle_publication:
    schema: 2
    # Publication is disabled until the operator installs measured release authority.
    catalogs: []

  # Explicit local capacity issuance; admission/signing and operation proof remain open.
  # The account is root/node-bound and cannot be reminted by policy refresh.
  native_capacity:
    schema: 6
    issuance_nonce: "33c88bbc57daa7c765d0fc460459d25a"
    allowance:
      # Sixteen finite 64-MiB incarnations plus 72-KiB bounded control/redo reserve.
      storage_bytes: 1073815552
      host_control_storage_bytes: 50331648
      allocator_steps: 320000000
      connection_tickets: 1024
      cleanup_steps: 25600000
    incarnation:
      units:
        storage_bytes: 67108864
        host_control_storage_bytes: 3145728
        allocator_steps: 20000000
        connection_tickets: 64
        cleanup_steps: 1600000
      maximum_occupancy_ms: 7200000
      cleanup_occupancy_ms: 120000
      rollover_drain_margin_ms: 90000
      # Finite syscall-attempt allowance; no cleanup-success guarantee.
      host_release_steps: 64
      # Explicit share of cleanup_steps; never duplicates the paid envelope.
      outside_cleanup_steps: 1310720
    # Burned durably per recovery attempt; never native allocation credit.
    recovery:
      maximum_attempts: 32
      work_per_attempt: 65536
      control_storage_bytes: 262144
      maximum_duration_ms: 120000
    # Each epoch is a fresh allowance under the same issuance; nothing is refunded.
    renewal:
      at_orderly_rollover: true
      operator_reissue: true
      maximum_epochs: null

  accounting:
    schema: 2
    issue_acceptance_window_ms: 60000
  command_registration:
    schema: 1
    claim_rules:
      - claim:
          kind: command.root
          value: help
        required_caps:
          - ryeos.register.command.root.help
      - claim:
          kind: command.root
          value: init
        required_caps:
          - ryeos.register.command.root.init
      - claim:
          kind: command.root
          value: start
        required_caps:
          - ryeos.register.command.root.start
      - claim:
          kind: command.root
          value: stop
        required_caps:
          - ryeos.register.command.root.stop
      - claim:
          kind: command.root
          value: node
        required_caps:
          - ryeos.register.command.root.node
      - claim:
          kind: command.root
          value: system
        required_caps:
          - ryeos.register.command.root.system
      - claim:
          kind: command.root
          value: identity
        required_caps:
          - ryeos.register.command.root.identity
      - claim:
          kind: command.root
          value: execute
        required_caps:
          - ryeos.register.command.root.execute
      - claim:
          kind: command.root
          value: codex
        required_caps:
          - ryeos.register.command.root.codex
      - claim:
          kind: command.dispatch.kind
          value: direct_execute_item_ref
        required_caps:
          - ryeos.register.command.dispatch.direct_execute_item_ref
      - claim:
          kind: command.dispatch.kind
          value: local_handler
        required_caps:
          - ryeos.register.command.dispatch.local_handler
    system_source_caps:
      - ryeos.register.command.dispatch.direct_execute_item_ref
      - ryeos.register.command.dispatch.local_handler
      - ryeos.register.command.root.execute
      - ryeos.register.command.root.help
      - ryeos.register.command.root.identity
      - ryeos.register.command.root.init
      - ryeos.register.command.root.node
      - ryeos.register.command.root.start
      - ryeos.register.command.root.stop
      - ryeos.register.command.root.system
    bundle_source_caps:
      codex:
        - ryeos.register.command.root.codex
      core:
        - ryeos.register.command.dispatch.direct_execute_item_ref
        - ryeos.register.command.dispatch.local_handler
        - ryeos.register.command.root.execute
        - ryeos.register.command.root.help
        - ryeos.register.command.root.identity
        - ryeos.register.command.root.init
        - ryeos.register.command.root.node
        - ryeos.register.command.root.start
        - ryeos.register.command.root.stop
        - ryeos.register.command.root.system
      render-sandbox: []
      graph:
        - ryeos.register.command.dispatch.direct_execute_item_ref
      knowledge: []
  execution:
    schema: 4
    max_live_fanout: 8
    max_private_materialization_copy_bytes: 17179869184
    host_env_passthrough: []
    workload_client: null
    producer_resource_ceiling: null
    resource_authority: null
    # Remote Codex leases this controller may hold: at most two at once. Each
    # lease runs for its placement binding's execution timeout, which may not
    # exceed four hours, and that whole lifetime is reserved before the
    # provider is contacted. About eight lease-hours may be reserved across
    # any 24 hours. A lease beyond either bound is refused, not queued. A turn
    # starts on a lease only when the lease outlives the turn's deadline by
    # ten minutes, the time to freeze, export and import its result; a lease
    # that cannot is terminated.
    external_lease_budget:
      max_concurrent_leases: 2
      max_lease_lifetime_seconds: 14400
      daily_lease_seconds: 28800
      turn_end_margin_seconds: 600
  object_closure:
    schema: 1
    max_roots: 256
    max_objects: 32768
    max_blobs: 32768
    max_object_bytes: 33554432
    max_total_object_bytes: 67108864
    max_blob_bytes: 134217728
    max_total_blob_bytes: 134217728
    max_response_bytes: 268435456
    max_links_per_object: 100000
  thread_history:
    schema: 1
    default_retention: durable
    item_authored_retention: allow
    minimum_terminal_for: null
  maintenance:
    schema: 5
    # Process-scoped native envelopes for stopped-node maintenance, keyed by
    # operation class. A class absent here is refused.
    offline_native:
      external-content-bindings:
        max_native_storage_bytes: 33554432
        max_native_allocator_steps: 20000000
        max_native_connections: 8
        max_operation_millis: 300000
        max_cleanup_millis: 60000
        max_cleanup_steps: 400000
      replay-indexes:
        max_native_storage_bytes: 33554432
        max_native_allocator_steps: 20000000
        max_native_connections: 8
        max_operation_millis: 300000
        max_cleanup_millis: 60000
        max_cleanup_steps: 400000
      standalone-state:
        max_native_storage_bytes: 67108864
        max_native_allocator_steps: 2000000000
        max_native_connections: 48
        max_operation_millis: 3600000
        max_cleanup_millis: 120000
        max_cleanup_steps: 3000000
      external-supervisor-journal:
        max_native_storage_bytes: 67108864
        max_native_allocator_steps: 2000000000
        max_native_connections: 16
        max_operation_millis: 4860000
        max_cleanup_millis: 120000
        max_cleanup_steps: 3000000
    offline_reset:
      max_retained_operations: 4
      max_source_roles: 13
      max_copied_bytes: 268435456
      max_retained_destination_bytes: 536870912
      max_read_bytes: 2147483648
      max_sql_vm_steps: 20000000
      max_memory_bytes: 67108864
      max_native_storage_bytes: 50331648
      # Native SQL charges this budget as well as max_sql_vm_steps, so it must
      # cover the whole SQL ceiling plus the host's allocation and cleanup
      # quotes for the storage and connections here (about 1.6M together).
      max_native_allocator_steps: 24000000
      max_native_connections: 64
      max_operation_millis: 300000
      max_cleanup_millis: 60000
      max_cleanup_steps: 1024
      max_recovery_record_bytes: 2097152
    schedules: []
  hosted:
    schema: 1
    admission_enabled: false
    admission_token_ttl_secs: null
    allow_loopback_http: true
  isolation:
    schema: 1
    policy:
      version: 10
      # Host classes this profile supports. The deployment names one at
      # init (`ryeos init --host-class`), and the node runs under that
      # class's floor and isolation lane from then on. A class names the
      # kind of host the node runs on, not a strength: `local` is a host the
      # operator runs, `hosted` is a hosting provider's container. What a
      # class requires is this profile's own; the same class carries a
      # different floor and lane in another profile.
      host_classes:
        hosted:
          # A hosting provider's container (Railway, a Render service, plain
          # Docker). It has no qualified per-job process scopes and commonly no
          # swap and no CAP_IPC_LOCK, so the floor accepts a resident region
          # proven only by the absence of swap at startup (residency:swap_absent),
          # which a later swapon ends. Jobs die with the node because the node is
          # pid 1 of its container, or its parent is a pid 1 named in
          # enclosure_inits; the trusted_init names carry that weaker grade and
          # the report names which proof met each entry. Jobs run without a
          # sandbox. Codex app servers run in the trusted direct process-group
          # lane on this class as on `local`: a host with no qualified per-job
          # scope cannot hold them in one, so the floor requires a trusted
          # process-group termination proof instead, and the lane makes no
          # hard-containment claim.
          requires_capabilities: [{any_of: [accounting, residency:swap_absent]}, {name: recovery:enclosure_trusted_init, accept: [measured, trusted]}, storage:durable_root, {name: termination:enclosure_trusted_init, accept: [measured, trusted]}, {name: termination:process_group, accept: [trusted]}, time]
          process_scopes:
            mode: unconfigured
          trusted_process_group_sessions: true
          mode: disabled
          backend: null
          proc_filesystem: empty
        local:
          # A host the operator runs the controller on directly.
          # Vault secrets, the node identity, the credential home and the
          # restart-inhibit record live under the app root, so every class
          # requires storage:durable_root. Codex app servers run in the trusted
          # direct process-group lane, which needs a trusted process-group
          # termination proof. Remote Codex authoring also requires that the
          # controller's jobs die with it and that a restart proves the old
          # generation's jobs dead, so the floor requires the enclosure
          # termination and recovery proofs: the node is pid 1 of a container
          # enclosure, or its parent is a pid 1 named in enclosure_inits. An
          # operator's host where the node runs under a service manager outside
          # such an enclosure cannot prove them and refuses at boot; run the
          # controller there in a container (Docker or Podman with one of the
          # trusted inits, or the node as pid 1). The floor also requires
          # strict `accounting`, a resident region proven by memory locking,
          # so that container needs CAP_IPC_LOCK and a memlock limit large
          # enough for the region. A container deployment that cannot lock
          # memory declares `hosted` instead, whose floor accepts the absence
          # of swap in place of the lock.
          requires_capabilities: [accounting, {any_of: [recovery:enclosure, recovery:enclosure_trusted_init], accept: [measured, trusted]}, storage:durable_root, {any_of: [termination:enclosure, termination:enclosure_trusted_init], accept: [measured, trusted]}, {name: termination:process_group, accept: [trusted]}, time]
          process_scopes:
            mode: unconfigured
          # The same trusted direct process-group lane as `hosted`: it admits
          # direct process-group cleanup and makes no hard-containment claim.
          trusted_process_group_sessions: true
          mode: disabled
          backend: null
          proc_filesystem: empty
        hosted_enforced:
          # The `hosted` floor on a provider container whose kernel allows
          # user, pid and mount namespaces (Render services do): the enforced
          # backend proves them when it resolves at boot, and jobs that
          # declare captured filesystem or isolated network authority run in
          # the namespace sandbox. Guest product production needs exactly
          # that lane. The host still has no qualified per-job process scopes,
          # so Codex app servers keep the trusted direct process-group lane.
          requires_capabilities: [{any_of: [accounting, residency:swap_absent]}, {name: recovery:enclosure_trusted_init, accept: [measured, trusted]}, storage:durable_root, {name: termination:enclosure_trusted_init, accept: [measured, trusted]}, {name: termination:process_group, accept: [trusted]}, time]
          process_scopes:
            mode: unconfigured
          trusted_process_group_sessions: true
          mode: enforce
          backend:
            bundle: core
            implementation: linux-lillux
          proc_filesystem: pid_namespace
      # Inits trusted to exit when their only child exits. When the node's
      # parent is pid 1 and pid 1 is one of these, the node's exit is trusted
      # to end its container, so a new container on the same boot proves
      # the old one's jobs dead. A node that is pid 1 proves this itself.
      enclosure_inits: [catatonit, dumb-init, tini]
      filesystem:
        live_project:
          mode: fixed_parents
          limits:
            max_entries: 2048
            max_depth: 64
        readable:
          - "{node_public_identity}"
          - "{daemon_socket}"
          - "{bundle_roots}"
          - "{node_trusted_keys}"
          - "{verified_code}"
        writable:
          - "{project}"
          - "{checkpoint_dir}"
      network:
        mode: host
        runtime_files: []
      environment:
        allow:
          - "*"
      limits:
        open_files: 1024
        stdout_bytes: 8388608
        stderr_bytes: 8388608
        verified_artifact_file_bytes: 67108864
        verified_artifact_total_bytes: 268435456
        verified_artifact_files: 4096
  ingest_ignore:
    schema: 2
    patterns:
      - "*.pyc"
      - ".DS_Store"
      - ".env"
      - ".git/"
      - ".hg/"
      - ".svn/"
      - ".venv/"
      - "/.ai/config/remotes/"
      - "__pycache__/"
      - "node_modules/"
      - "target/"
  external_content:
    schema: 1
    roots: {}
    limits:
      max_depth: 8
      max_entries: 64
      max_file_bytes: 268435456
      max_total_bytes: 536870912
      store_budget_bytes: 1073741824
      minimum_free_bytes: 1073741824
    # The controller activates only the pinned Codex package, one archive
    # from releases.openai.com within its own declared bounds, so these are
    # the standard profile's limits: none of the wider development-product
    # limits or GitHub release hosts a hosted workflow node admits.
    managed_activation:
      enabled: true
      limits:
        allow_online: true
        allowed_https_hosts:
          - releases.openai.com
        max_redirects: 0
        max_archives: 1
        max_compressed_bytes: 134217728
        max_expanded_bytes: 335544320
        max_members: 64
        max_member_bytes: 268435456
        max_concurrent_activations: 1
        cache_budget_bytes: 536870912
        store_budget_bytes: 1073741824
        minimum_free_bytes: 1073741824
        max_attempts: 3
  persistent_sessions:
    schema: 1
    enabled: true
    limits:
      max_pool_groups: 4
      max_total_processes: 4
      max_total_address_space_bytes: 68719476736
      max_total_cpu_seconds: 14400
      max_real_uid_process_limit: 4096
      max_open_streams: 32
      max_active_streams: 4
      max_active_streams_per_subject: 1
      max_stream_backlog_bytes: 16777216
      max_total_backlog_bytes: 67108864
  # Provider-delivered environment names this node takes out of its own
  # environment at startup and delivers only through authorized secret
  # delivery. Model commands in the recipient can read a delivered value.
  provider_environment:
    schema: 2
    names:
      - name: OPENAI_API_KEY
        recipients:
          principals: []
          # Grant this exact capability to the receiving principal; a
          # wildcard grant such as `*` or `ryeos.receive.*` does not satisfy
          # a recipient capability.
          capabilities:
            - ryeos.receive.provider_env.openai_api_key
  ui_browser_sessions:
    schema: 4
    max_session_bootstrap_bytes: 4194304
    max_live_binding_attachments_per_session: 16
    max_presentations_per_session: 16
    max_surface_instances_per_presentation: 16
    shared_presentation:
      max_declaration_bytes: 65536
      max_dialogs: 16
      max_initial_surfaces: 16
      max_label_bytes: 128
      max_mount_id_bytes: 64
    seat:
      kind: seat_session
      max_replay_frame_events: 64
      max_replay_frame_bytes: 4194304
  ui_inspection:
    schema: 1
    max_event_limit: 500
    max_facet_page_events: 64
    max_facet_page_bytes: 524288
    max_facet_pages_per_thread: 8
    max_facet_pages_total: 64
