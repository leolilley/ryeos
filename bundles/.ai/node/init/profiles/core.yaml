  # Explicit local capacity issuance; admission/signing and operation proof remain open.
  # The account is root/node-bound and cannot be reminted by policy refresh.
  native_capacity:
    schema: 6
    issuance_nonce: "33c88bbc57daa7c765d0fc460459d25a"
    allowance:
      # Sixteen finite 64-MiB incarnations plus 72-KiB bounded control/redo reserve.
      storage_bytes: 1073815552
      host_control_storage_bytes: 50331648
      allocator_steps: 320000000
      connection_tickets: 1024
      cleanup_steps: 25600000
    incarnation:
      units:
        storage_bytes: 67108864
        host_control_storage_bytes: 3145728
        allocator_steps: 20000000
        connection_tickets: 64
        cleanup_steps: 1600000
      maximum_occupancy_ms: 7200000
      cleanup_occupancy_ms: 120000
      rollover_drain_margin_ms: 90000
      # Finite syscall-attempt allowance; no cleanup-success guarantee.
      host_release_steps: 64
      # Explicit share of cleanup_steps; never duplicates the paid envelope.
      outside_cleanup_steps: 1310720
    # Burned durably per recovery attempt; never native allocation credit.
    recovery:
      maximum_attempts: 32
      work_per_attempt: 65536
      control_storage_bytes: 262144
      maximum_duration_ms: 120000
    # Each epoch is a fresh allowance under the same issuance; nothing is refunded.
    renewal:
