  isolation:
    schema: 1
    policy:
      version: 10
      # Host classes this profile supports. The deployment names one at
      # init (`ryeos init --host-class`), and the node runs under that
      # class's floor and isolation lane from then on. A class names the
      # kind of host the node runs on, not a strength: `local` is a host the
      # operator runs, `hosted` is a hosting provider's container. What a
      # class requires is this profile's own; the same class carries a
      # different floor and lane in another profile.
      host_classes:
        hosted:
          # A hosting provider's container (Railway, a Render service, plain
          # Docker). It has no qualified per-job process scopes and commonly no
          # swap and no CAP_IPC_LOCK, so the floor accepts a resident region
          # proven only by the absence of swap at startup (residency:swap_absent),
          # which a later swapon ends. Jobs die with the node because the node is
          # pid 1 of its container, or its parent is a pid 1 named in
          # enclosure_inits; the trusted_init names carry that weaker grade and
          # the report names which proof met each entry. Jobs run without a
          # sandbox.
          requires_capabilities: [{any_of: [accounting, residency:swap_absent]}, {name: recovery:enclosure_trusted_init, accept: [measured, trusted]}, storage:durable_root, {name: termination:enclosure_trusted_init, accept: [measured, trusted]}, time]
          process_scopes:
            mode: unconfigured
          trusted_process_group_sessions: false
          mode: disabled
          backend: null
          proc_filesystem: empty
        local:
          # A host whose supervisor delegates qualified per-job process scopes
          # (runit, or the OCI hook): jobs run sandboxed in their own scope.
          # Capabilities this node must prove on its host before it starts.
          # `ryeos node doctor` shows what the host proves and what is missing.
          requires_capabilities: [accounting, limits:scope, recovery:scope, storage:durable_root, termination:scope, time]
          process_scopes:
            # The protected host-runtime binding supplies the opaque qualified
            # Lillux provider. Policy never contains native cgroup coordinates.
            mode: required
            control_timeout_ms: 5000
          # This profile requires qualified Lillux scopes. It must never select the
          # weaker trusted direct-process-group worker lifecycle.
          trusted_process_group_sessions: false
          mode: enforce
          backend:
            bundle: core
            implementation: linux-lillux
          proc_filesystem: pid_namespace
      # Inits trusted to exit when their only child exits. When the node's
      # parent is pid 1 and pid 1 is one of these, the node's exit is trusted
      # to end its container, so a new container on the same boot proves
      # the old one's jobs dead. A node that is pid 1 proves this itself.
      enclosure_inits: [catatonit, dumb-init, tini]
      filesystem:
        live_project:
          mode: fixed_parents
          limits:
            max_entries: 2048
            max_depth: 64
        readable:
          - "{node_public_identity}"
          - "{daemon_socket}"
          - "{bundle_roots}"
          - "{node_trusted_keys}"
          - "{verified_code}"
        writable:
          - "{project}"
          - "{checkpoint_dir}"
      network:
        mode: host
        runtime_files:
          - source: /etc/resolv.conf
            destination: /etc/resolv.conf
            max_bytes: 65536
          - source: /etc/hosts
            destination: /etc/hosts
            max_bytes: 65536
          - source: /etc/ssl/certs/ca-certificates.crt
            destination: /etc/ssl/certs/ca-certificates.crt
            max_bytes: 4194304
          - source: /etc/ssl/certs/ca-certificates.crt
            destination: /etc/ssl/cert.pem
            max_bytes: 4194304
      environment:
        allow:
          - "*"
      limits:
        open_files: 4096
        stdout_bytes: 8388608
        stderr_bytes: 8388608
        verified_artifact_file_bytes: 268435456
        verified_artifact_total_bytes: 1073741824
        verified_artifact_files: 4096
