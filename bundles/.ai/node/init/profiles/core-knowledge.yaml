        max_result_bytes: 4096
        max_items: 4
      # The pending approvals of a hosted work chain, as the Approvals view
      # reads them. The service already answers only for a chain the caller
      # owns. Each approval keeps its identifiers, digest, state, times and the
      # public part of its requested authority.
      - target: service:worker-executions/approvals
        classes: [local_operator, hosted_principal]
        keep:
          - /approvals/*/chain_root_id
          - /approvals/*/placement_thread_id
          - /approvals/*/approval_id
          - /approvals/*/worker_boot_epoch
          - /approvals/*/request_digest
          - /approvals/*/operation_class
          - /approvals/*/requested_authority/accept_allowed
          - /approvals/*/requested_authority/display
          - /approvals/*/state
          - /approvals/*/expires_at_ms
          - /approvals/*/created_at_ms
        max_result_bytes: 262144
        max_items: 256
      # The signed revision history of one item of the seat's own project. The
      # project is pinned to the session's bound project, so a seat never names
      # a path of its own, and a session with no project reads nothing. A record
      # keeps its identifiers, digests, time, signer, verification status and
      # the provenance keys that name no filesystem path. Failure detail text,
      # the head failure reason and the provenance path are left out, and so is
      # any field a later release adds until an entry names it. The list carries
      # no item bytes. The record read keeps the signed item bytes inline for
      # diff and revert preview; authored UI items are far below the bound, and a
      # record that exceeds it is refused whole, never cut. Unverified records
      # stay withheld: a seat may not ask for them.
      - target: service:revisions/list
        classes: [local_operator, hosted_principal]
        pin:
          project_path: "@session:project_root"
        keep:
          - /item_ref
          - /total
          - /sound
          - /file
          - /head/status
          - /head/seq
          - /head/head_seq
          - /head/tip_seq
          - /next_cursor
          - /records/*/seq
          - /records/*/hash
          - /records/*/verify/status
          - /records/*/verify/scheme
          - /records/*/verify/signer
          - /records/*/verify/reason
          - /records/*/unrecorded_change_before
          - /records/*/tombstone
          - /records/*/recorded_at
          - /records/*/actor/fingerprint
          - /records/*/actor/role
          - /records/*/before_digest
          - /records/*/after_digest
          - /records/*/file_ext
          - /records/*/provenance/authored_by
          - /records/*/provenance/action
          - /records/*/provenance/thread_id
          - /records/*/provenance/invocation_id
          - /records/*/provenance/parent_item_ref
          - /records/*/provenance/authoring_capability
          - /records/*/provenance/target_ref
          - /records/*/provenance/content_digest
        max_result_bytes: 524288
        max_items: 200
      - target: service:revisions/get
        classes: [local_operator, hosted_principal]
        pin:
          project_path: "@session:project_root"
        deny_params: [include_unverified]
        keep:
          - /item_ref
          - /total
          - /sound
          - /file
          - /head/status
          - /head/seq
          - /head/head_seq
          - /head/tip_seq
          - /record/seq
          - /record/hash
          - /record/verify/status
          - /record/verify/scheme
          - /record/verify/signer
          - /record/verify/reason
          - /record/unrecorded_change_before
          - /record/tombstone
          - /record/recorded_at
          - /record/actor/fingerprint
          - /record/actor/role
          - /record/before_digest
          - /record/after_digest
          - /record/file_ext
          - /record/provenance/authored_by
          - /record/provenance/action
          - /record/provenance/thread_id
          - /record/provenance/invocation_id
          - /record/provenance/parent_item_ref
          - /record/provenance/authoring_capability
          - /record/provenance/target_ref
          - /record/provenance/content_digest
          - /record/body/previous
          - /record/body/content
        max_result_bytes: 1048576
        max_items: 16
