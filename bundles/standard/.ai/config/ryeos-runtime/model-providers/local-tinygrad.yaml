# ryeos:signed:2026-08-11T02:28:27Z:cdbf66a92109278ed8fc92f32f67cc301612b69cfb66c9f8d5f27f2907f7ea93:FNHCXdSG5v080FbLBPLlwq3j5VEwmawXcNETSYEJCAWSSk7oiBL7n2Uhi5Mos3ZInC/PuOrdmzTJiBGsqnJpBg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "ryeos-runtime/model-providers"
family: chat_completions
transport:
  kind: admitted_local_worker
  execute: worker:standard/local-tinygrad
  effect_class_ceiling: recorded
auth: {}
schemas:
  accounting: {require_usage: true}
  messages:
    role_map: {user: user, assistant: assistant, system: system, tool: tool}
    content_key: content
    system_message: {mode: message_role}
    tool_result:
      role: tool
      wrap_mode: direct
      block_template:
        tool_call_id: "{tool_call_id}"
        content: "{content}"
    tool_call_block_template:
      id: "{id}"
      type: function
      function:
        name: "{name}"
        arguments: "{input_json}"
  tools:
    template:
      type: function
      function:
        name: "{name}"
        description: "{description}"
        parameters: "{schema}"
  streaming:
    mode: delta_merge
    metadata:
      usage:
        path: usage
        input_tokens_path: input_tokens
        output_tokens_path: output_tokens
        reasoning_tokens_path: reasoning_tokens
        reasoning_included_in_output: true
        aggregation: latest_snapshot
        single_snapshot: true
      finish_reason_path: finish_reason
      response_id_path: response_id
  output_limit: {path: max_tokens, semantics: provider_native_output_tokens}
  reasoning:
    mode:
      path: enable_thinking
      values: {enabled: true, disabled: false}
body_template:
  model: "{model}"
  messages: "{messages}"
  tools: "{tools}"
  stream: "{stream}"
  stream_options:
    include_usage: true
body_extra:
  max_tokens: 256
pricing:
  explicitly_free: true
  input_per_million: "0"
  output_per_million: "0"
extra:
  setup:
    display_name: Local Tinygrad
    priority: 85
    credential: null
    models:
      - {name: qwen3-0.6b, display_name: Qwen3 0.6B, context_window: 2048}
  available_models:
    local: [qwen3-0.6b]
