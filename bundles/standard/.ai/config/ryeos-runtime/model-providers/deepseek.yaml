category: "ryeos-runtime/model-providers"
family: chat_completions
base_url: "https://api.deepseek.com"
auth:
  env_var: DEEPSEEK_API_KEY
  header_name: Authorization
  prefix: "Bearer "
headers:
  Content-Type: application/json
schemas:
  accounting: {require_usage: true}
  messages:
    role_map: {user: user, assistant: assistant, system: system, tool: tool}
    content_key: content
    system_message: {mode: message_role}
    tool_result:
      role: tool
      wrap_mode: direct
      block_template:
        tool_call_id: "{tool_call_id}"
        content: "{content}"
    tool_call_block_template:
      id: "{id}"
      type: function
      function:
        name: "{name}"
        arguments: "{input_json}"
  tools:
    template:
      type: function
      function:
        name: "{name}"
        description: "{description}"
        parameters: "{schema}"
  streaming:
    mode: delta_merge
    metadata:
      usage:
        path: usage
        input_tokens_path: prompt_tokens
        output_tokens_path: completion_tokens
        reasoning_tokens_path: completion_tokens_details.reasoning_tokens
        reasoning_included_in_output: true
        aggregation: latest_snapshot
        single_snapshot: true
      finish_reason_path: choices.0.finish_reason
      response_id_path: id
      error:
        path: error
        message_path: message
        code_path: code
        finish_reasons: [content_filter, insufficient_system_resource]
  output_limit: {path: max_tokens, semantics: provider_native_output_tokens}
body_template:
  model: "{model}"
  messages: "{messages}"
  tools: "{tools}"
  stream: "{stream}"
  stream_options:
    include_usage: true
profiles:
  - name: deepseek-v4-pro-spend
    match: [deepseek-v4-pro]
    spend_authority:
      billing_principal: deepseek-api-key
      credential_authority_generation: gen-1
      pricing_contract_subject: deepseek-standard-api-2026-07
      tariff:
        schema_version: 1
        currency: usd
        pricing_generation: deepseek-2026-07
        input_per_million: "0.435"
        output_per_million: "0.87"
        covered_dimensions: [input_tokens, output_tokens]
  - name: deepseek-v4-flash-spend
    match: [deepseek-v4-flash]
    spend_authority:
      billing_principal: deepseek-api-key
      credential_authority_generation: gen-1
      pricing_contract_subject: deepseek-standard-api-2026-07
      tariff:
        schema_version: 1
        currency: usd
        pricing_generation: deepseek-2026-07
        input_per_million: "0.14"
        output_per_million: "0.28"
        covered_dimensions: [input_tokens, output_tokens]
pricing:
  models:
    deepseek-v4-pro:   {input_per_million: "0.435", output_per_million: "0.87"}
    deepseek-v4-flash: {input_per_million: "0.14", output_per_million: "0.28"}
extra:
  stream_url: "/chat/completions"
  setup:
    display_name: DeepSeek
    priority: 22
    credential: {label: API key, secret_name: DEEPSEEK_API_KEY, input: secret}
    help_url: https://platform.deepseek.com/api_keys
    validation: {ref: "service:model-providers/validate", url: "https://api.deepseek.com/models", timeout_seconds: 15}
    models:
      - {name: deepseek-v4-pro, display_name: DeepSeek V4 Pro, context_window: 1000000, recommended: true}
      - {name: deepseek-v4-flash, display_name: DeepSeek V4 Flash, context_window: 1000000}
  available_models:
    flagship: [deepseek-v4-pro]
    fast: [deepseek-v4-flash]
