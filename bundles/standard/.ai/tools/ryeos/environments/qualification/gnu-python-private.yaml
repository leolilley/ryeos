        def read_regular(path, limit, expected_bytes=None, expected_sha256=None):
            fd = os.open(path, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW)
            try:
                before = os.fstat(fd)
                if not stat.S_ISREG(before.st_mode):
                    raise SystemExit("private GNU evidence is not a regular file")
                chunks, total = [], 0
