env_config:
  interpreter:
    type: realization_member
    realization_id: producer-python
    # The bootstrap Python is a dynamically linked musl artifact. Execute it
    # through its admitted loader rather than depending on an ambient
    # /lib/ld-musl-x86_64.so.1 inside the isolated mount namespace.
    relative_path: lib/ld-musl-x86_64.so.1
config:
  command: "${interpreter}"
  args:
