# ryeos:signed:2026-08-02T07:16:40Z:42c07922d3bc70230678cdca5d2b8a676e79463de1e631151468d88ba0165ee6:ZcfN87RMODxaRxakSFfmGgs2jX0nvqqgaSTuJ7n6wUoculHY2+/GOabzgNwfrtOjC7JpmPoFANpxCkWnNtmbBg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: runtime
serves: directive
default: true
binary_ref: bin/x86_64-unknown-linux-gnu/ryeos-directive-runtime
abi_version: "v1"
required_caps:
  - runtime.execute
launch_contract:
  primary_allowed_kinds:
    - directive
  primary_allowed_spaces:
    - bundle
    - project
  primary_allowed_trust:
    - trusted_bundle
    - trusted_project
  ref_bindings:
    model:
      required: true
      allowed_kinds:
        - directive
      allowed_spaces:
        - bundle
        - project
      allowed_trust:
        - trusted_bundle
        - trusted_project
  preparation:
    kind: handler
    handler: handler:ryeos/standard/directive-launch
    config: {}
    execution_cache: content_addressed
  config_inputs:
    model_routing:
      kind: item
      id: ryeos-runtime/model_routing
      required: false
      merge: deep_merge
      allowed_spaces:
        - bundle
        - project
        - node
      allowed_trust:
        - trusted_bundle
        - trusted_project
        - trusted_node
    model_providers:
      kind: catalog
      prefix: ryeos-runtime/model-providers
      required: true
      entry_merge: deep_merge
      allowed_spaces:
        - bundle
        - node
      allowed_trust:
        - trusted_bundle
        - trusted_node
    execution:
      kind: item
      id: ryeos-runtime/execution
      required: false
      merge: deep_merge
      allowed_spaces:
        - bundle
        - project
        - node
      allowed_trust:
        - trusted_bundle
        - trusted_project
        - trusted_node
  financial_authority:
    kind: provider_accounting_authority_v1
  secret_policy:
    max_requirements: 4
    allowed_names:
      - ANTHROPIC_API_KEY
      - DEEPSEEK_API_KEY
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - ZAI_API_KEY
      - ZEN_API_KEY
  required_runtime_data:
    - provider_snapshot
  runtime_facts:
    provider_id: {required: true, kind: string, max_bytes: 128}
    model_name: {required: true, kind: string, max_bytes: 256}
    context_window: {required: true, kind: integer, max_bytes: 32}
    sampling: {required: true, kind: json, max_bytes: 4096}
    reasoning: {required: true, kind: json, max_bytes: 4096}
    matched_profile: {required: false, kind: string, max_bytes: 128}
    # Limits cover canonical JSON, including the two quotes around each 64-byte digest.
    config_hash: {required: true, kind: string, max_bytes: 66}
    config_value_digest: {required: true, kind: string, max_bytes: 66}
    config_sources: {required: true, kind: json, max_bytes: 4096}
    authority_digest: {required: true, kind: string, max_bytes: 66}
    spend_bound: {required: true, kind: string, max_bytes: 32}
description: "Interprets directive workflows by orchestrating LLM threads"
