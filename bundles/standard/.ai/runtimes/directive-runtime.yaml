# ryeos:signed:2026-08-11T02:28:43Z:c6e9482bd96cbf9c3f6c22e0fbe82640b5189598f5cfe052203bf02962a457e8:QqnIbiWYoxbGwxCwtWRdjCLed7Ds1Ansqp4nNcNiakbxDVlXDMJUbj4K0VugTWR+LgIaLLqTpkrDPDL+wIhSDQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: runtime
serves: directive
default: true
binary_ref: bin/x86_64-unknown-linux-gnu/ryeos-directive-runtime
abi_version: "v3"
required_caps:
  - runtime.execute
launch_contract:
  primary_allowed_kinds:
    - directive
  primary_allowed_spaces:
    - bundle
    - project
  primary_allowed_trust:
    - trusted_bundle
    - trusted_project
  ref_bindings:
    model:
      required: true
      allowed_kinds:
        - directive
      allowed_spaces:
        - bundle
        - project
      allowed_trust:
        - trusted_bundle
        - trusted_project
  preparation:
    kind: handler
    handler: handler:ryeos/standard/directive-launch
    config: {}
    execution_cache: content_addressed
  config_inputs:
    model_routing:
      kind: item
      id: ryeos-runtime/model_routing
      required: false
      merge: deep_merge
      allowed_spaces:
        - bundle
        - project
        - node
      allowed_trust:
        - trusted_bundle
        - trusted_project
        - trusted_node
    model_providers:
      kind: catalog
      prefix: ryeos-runtime/model-providers
      required: true
      entry_merge: deep_merge
      allowed_spaces:
        - bundle
        - node
      allowed_trust:
        - trusted_bundle
        - trusted_node
    execution:
      kind: item
      id: ryeos-runtime/execution
      required: false
      merge: deep_merge
      allowed_spaces:
        - bundle
        - project
        - node
      allowed_trust:
        - trusted_bundle
        - trusted_project
        - trusted_node
  execution_dependencies:
    max_dependencies: 1
    allowed_kinds:
      - worker
    allowed_spaces:
      - bundle
    allowed_trust:
      - trusted_bundle
  content_dependencies:
    max_dependencies: 0
    allowed_bindings: []
    max_targets_per_dependency: 0
    max_executable_search_entries: 0
    external_content: null
  financial_authority:
    kind: accounting
  external_effect_authority:
    kind: external
  secret_policy:
    max_requirements: 4
    allowed_names:
      - ANTHROPIC_API_KEY
      - DEEPSEEK_API_KEY
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - ZAI_API_KEY
      - ZEN_API_KEY
  required_runtime_data:
    - provider_snapshot
  runtime_facts:
    provider_id: {required: true, kind: string, max_bytes: 128}
    model_name: {required: true, kind: string, max_bytes: 256}
    context_window: {required: true, kind: integer, max_bytes: 32}
    sampling: {required: true, kind: json, max_bytes: 4096}
    reasoning: {required: true, kind: json, max_bytes: 4096}
    matched_profile: {required: false, kind: string, max_bytes: 128}
    # Limits cover canonical JSON, including the two quotes around each 64-byte digest.
    config_hash: {required: true, kind: string, max_bytes: 66}
    config_value_digest: {required: true, kind: string, max_bytes: 66}
    config_sources: {required: true, kind: json, max_bytes: 4096}
    authority_digest: {required: true, kind: string, max_bytes: 66}
    spend_bound: {required: true, kind: string, max_bytes: 32}
limits:
  config_identity: directive-runtime/limits
  contract: directive-runtime/v1
  dimensions:
    tool_calls: 4294967295
    provider_request_body_bytes: 1073741824
observability:
  child_records:
    latency_profiling_enabled:
      schema_version: 1
      clock_domain: directive_process_monotonic
      max_records: 1
      max_record_bytes: 4096
    directive_context_composition:
      schema_version: 1
      clock_domain: directive_process_monotonic
      max_records: 1
      max_record_bytes: 65536
    directive_prompt_source_composition:
      schema_version: 1
      clock_domain: directive_process_monotonic
      max_records: 1
      max_record_bytes: 65536
    directive_provider_call_timing:
      schema_version: 5
      clock_domain: directive_process_monotonic
      max_records: 127
      max_record_bytes: 65536
    directive_runtime_stage_timing:
      schema_version: 6
      clock_domain: directive_process_monotonic
      max_records: 1
      max_record_bytes: 65536
    directive_provider_request_profile:
      schema_version: 1
      clock_domain: directive_process_monotonic
      max_records: 127
      max_record_bytes: 65536
description: "Interprets directive workflows by orchestrating LLM threads"
