# ryeos:signed:2026-07-24T09:36:55Z:6fcd5bc752a5b9e4c26bbc6b8cea87289cb8a7103cc6c7d9b3f396e76f07da13:slukQ0oK3hIm0As2KJk9Ga3x026FBYqMZsOG4NSWJZnShB8ZRBfG6lQhy0NeOkp6USOT566CWzCpxoNIDxRrAA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: runtime
serves: directive
default: true
binary_ref: bin/x86_64-unknown-linux-gnu/ryeos-directive-runtime
abi_version: "v1"
required_caps:
  - runtime.execute
launch_contract:
  primary_allowed_kinds:
    - directive
  primary_allowed_spaces:
    - bundle
    - project
  primary_allowed_trust:
    - trusted_bundle
    - trusted_project
  ref_bindings:
    model:
      required: true
      allowed_kinds:
        - directive
      allowed_spaces:
        - bundle
        - project
      allowed_trust:
        - trusted_bundle
        - trusted_project
  preparation:
    kind: handler
    handler: handler:ryeos/standard/directive-launch
    config: {}
  config_inputs:
    model_routing:
      kind: item
      id: ryeos-runtime/model_routing
      required: false
      merge: deep_merge
      allowed_spaces:
        - bundle
        - project
      allowed_trust:
        - trusted_bundle
        - trusted_project
    model_providers:
      kind: catalog
      prefix: ryeos-runtime/model-providers
      required: true
      entry_merge: deep_merge
      allowed_spaces:
        - bundle
      allowed_trust:
        - trusted_bundle
    execution:
      kind: item
      id: ryeos-runtime/execution
      required: false
      merge: deep_merge
      allowed_spaces:
        - bundle
        - project
      allowed_trust:
        - trusted_bundle
        - trusted_project
  financial_authority:
    kind: provider_accounting_authority_v1
  secret_policy:
    max_requirements: 4
    allowed_names:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - OPENROUTER_API_KEY
      - ZAI_API_KEY
      - ZEN_API_KEY
  required_runtime_data:
    - provider_snapshot
  runtime_facts:
    provider_id: {required: true, kind: string, max_bytes: 128}
    model_name: {required: true, kind: string, max_bytes: 256}
    context_window: {required: true, kind: integer, max_bytes: 32}
    sampling: {required: true, kind: json, max_bytes: 4096}
    matched_profile: {required: false, kind: string, max_bytes: 128}
    # Limits cover canonical JSON, including the two quotes around each 64-byte digest.
    config_hash: {required: true, kind: string, max_bytes: 66}
    config_value_digest: {required: true, kind: string, max_bytes: 66}
    config_sources: {required: true, kind: json, max_bytes: 4096}
    authority_digest: {required: true, kind: string, max_bytes: 66}
    spend_bound: {required: true, kind: string, max_bytes: 32}
description: "Interprets directive workflows by orchestrating LLM threads"
