# ryeos:signed:2026-08-11T02:28:23Z:9fd2f6f2fe461a94734ba682814c56f24b31bd29779d38adb7b5676c44402d63:omdNZZHs4+ZK3GCaxGnMFZ+Pn8veNQRcuyF/i6aQvAU4o6Ath2NSQ6gKNT809j3aweVzebpOBOHV6XiaSahuAg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "engine/kinds/graph"
version: "1.0.0"
location:
  directory: graphs
resolution:
  - step: resolve_extends_chain
effective_trust:
  include_references: false
execution:
  # Explicit delegation to the runtime registry. The dispatcher will
  # call `RuntimeRegistry::lookup_for("graph")` to find the default
  # runtime serving this kind (today: `runtime:graph-runtime`).
  # Without this `delegate` block the dispatcher refuses to consult
  # the registry — there is no implicit fallback.
  delegate:
    via: runtime_registry
  thread_profile:
    name: graph_run
    root_executable: true
    # A graph walker has NO interrupt contract. There is no in-flight signal a
    # running segment-walk honors and reseals as a partial turn (the way a
    # directive folds SIGUSR1 into an `interrupted: true` cognition_out).
    # Declaring interrupt support would let `allowed_actions` offer — and
    # `commands/submit` accept — an `interrupt` command the walker cannot
    # service, i.e. undefined behavior. So the profile withholds it:
    # `allowed_actions(graph_run, running, …)` omits `interrupt` and
    # `commands/submit` refuses it (belt), and no client surfaces an interrupt
    # control for a graph (suspenders). To stop a graph, cancel or kill it. See
    # .ai/knowledge/ryeos/development/steering-graph-interrupt-and-cancel-path.md.
    supports_interrupt: false
    # A graph self-continues by MACHINE only: when a segment-step budget is
    # exhausted the walker checkpoints the frontier and a machine successor
    # resumes it from that checkpoint. So the kind IS continuation-capable.
    supports_continuation: true
    # But a graph folds no conversation, so an operator follow-up
    # (threads.input) has nowhere to deliver input — it is refused. Graph
    # *follow* — a graph driving and polling a CHILD's continuation to terminal —
    # is a separate capability and grants the parent no operator follow-up.
    supports_operator_followup: false
  hooks:
    authored_path: [config, hooks]
    plan_derived: effective_hook_plan
    events:
      graph_started:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event, graph_id, graph_run_id, state, inputs]
        allowed_results: [discard, observation]
      graph_step_completed:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event, graph_id, graph_run_id, node, step, status, state, error]
        allowed_results: [discard, observation]
      graph_completed:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event, graph_id, graph_run_id, status, settled, steps, success, state, inputs]
        allowed_results: [discard, observation]
  # Items of this kind may declare top-level `external_content`: content
  # outside the signed closure that must be captured into CAS at admission
  # and executed from its realization. The reserved derived slot carries the
  # realized set into the effective digest; descendants inherit it.
  external_content:
    realization_derived: effective_external_realizations
    allowed_roots: [project_files]
    max_declarations: 4
  effective_validator:
    handler: handler:ryeos/core/graph-effective-validator
    config: {}
formats:
  - extensions: [".yaml", ".yml"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"
composer: handler:ryeos/core/extends-chain
composer_config:
  extends_field: extends
  fields:
    - name: version
      strategy: root_verbatim
      required: true
      expect_value_type: string
    - name: category
      strategy: root_verbatim
      required: true
      expect_value_type: string
    - name: description
      strategy: replace_root_last
      expect_value_type: string
    # Shallow root-last mapping merge. Each config key is inherited or
    # replaced atomically; node maps and hook lists are never deep-merged.
    - name: config
      strategy: dict_merge_root_last
      required: true
      expect_value_type: mapping
    - name: requires
      strategy: narrow_requires_capabilities
      expect_value_type: mapping
    # Atomic inherit-or-replace: a child's declaration replaces the inherited
    # set entirely; explicit `[]` declares none and is preserved as such.
    - name: external_content
      strategy: replace_root_last
      expect_value_type: array
  policy_facts:
    - name: effective_caps
      path: [requires, capabilities, declared]
      expect: array_of_strings
composed_value_contract:
  root_type: mapping
  required:
    version:
      type: single
      prim: string
    category:
      type: single
      prim: string
    config:
      type: single
      prim: mapping
  optional:
    extends:
      type: union
      prims: [string, "null"]
    description:
      type: single
      prim: string
    # Unified capability requirements narrowed across every direct ancestor
    # edge and finally bounded by the signed manifest at launch.
    requires:
      type: single
      prim: mapping
    external_content:
      type: single
      prim: array
metadata:
  rules:
    name:
      from: filename
      required: true
    version:
      from: path
      key: version
    description:
      from: path
      key: description
    category:
      from: relative_dir
      required: true
    executor_id:
      from: path
      key: executor_id
