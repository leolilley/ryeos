# ryeos:signed:2026-09-14T22:49:51Z:0ecaa2653ad6921aef6834719fa0cc57ae21fa3b3cce187ce02fffdad0bc9545:+zEkRumg5HtWMCk5utIYmuTz5esthpdqNN6BKJjsOztD124fXVC5TVMFhAz8D415zPM4G2TEVqUqEO9StaZkDg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "engine/kinds/surface"
version: "1.0.0"
location:
  directory: surfaces

formats:
  - extensions: [".yaml", ".yml"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"

composer: handler:ryeos/core/extends-chain
resolution:
  - step: resolve_extends_chain
    field: extends
    max_depth: 16
effective_trust:
  include_references: false
composer_config:
  extends_field: extends
  fields:
    - name: tiling
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: tiles
      strategy: replace_root_last
      expect_value_type: sequence
    - name: slots
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: style
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: input
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: sources
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: ambient
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: affordances
      strategy: keyed_seq_merge_root_last
      key: id
      expect_value_type: array
    - name: instruments
      strategy: keyed_seq_merge_root_last
      key: id
      expect_value_type: array
    - name: capabilities
      strategy: narrow_against_parent_effective
      expect_value_type: mapping
    # replace_root_last, not keyed merge: entries may be bare view refs
    # (legacy flat form) and the keyed merge silently drops keyless items.
    - name: library
      strategy: replace_root_last
      expect_value_type: array
    - name: backdrop
      strategy: replace_root_last
      expect_value_type: string
    - name: overlays
      strategy: dict_merge_root_last
      expect_value_type: mapping

composed_value_contract:
  root_type: mapping
  required: {}
  optional:
    tiling:
      type: single
      prim: mapping
    tiles:
      type: single
      prim: sequence
    slots:
      type: single
      prim: mapping
    style:
      type: single
      prim: mapping
    extends:
      type: union
      prims: [string, "null"]
    input:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required:
          route:
            type: single
            prim: mapping
            contract:
              root_type: mapping
              required:
                invoke:
                  type: single
                  prim: mapping
                  contract:
                    root_type: mapping
                    required:
                      type: { type: single, prim: string }
                      ref: { type: single, prim: string }
                    optional: {}
                bindings:
                  type: single
                  prim: mapping
                  contract:
                    root_type: mapping
                    required:
                      input_parameter: { type: single, prim: string }
                    optional:
                      thread_target_parameter: { type: single, prim: string }
                      interrupt_intent_parameter: { type: single, prim: string }
              optional:
                params: { type: single, prim: mapping }
                requires_project: { type: single, prim: boolean }
        optional: {}
    sources:
      type: mapping
      values:
        type: single
        prim: mapping
        contract:
          root_type: mapping
          required:
            ref: { type: single, prim: string }
          optional:
            role: { type: single, prim: string }
            params: { type: single, prim: mapping }
            collection: { type: single, prim: string }
            refresh: { type: single, prim: mapping }
            dynamic_parameters:
              type: single
              prim: sequence
              elements: { type: single, prim: string }
            activation:
              type: single
              prim: string
              enum: [initial, on_demand]
            requires_project: { type: single, prim: boolean }
    ambient:
      type: single
      prim: mapping
    affordances:
      type: single
      prim: sequence
      elements:
        type: single
        prim: mapping
        contract:
          root_type: mapping
          required:
            id: { type: single, prim: string }
          optional:
            label: { type: single, prim: string }
            category: { type: single, prim: string }
            icon: { type: single, prim: string }
            producer:
              type: single
              prim: string
              enum: [selection, input, tokens]
            requires_project: { type: single, prim: boolean }
            invoke:
              type: single
              prim: mapping
              contract:
                root_type: mapping
                required:
                  plane:
                    type: single
                    prim: string
                    enum: [ui, rye]
                optional:
                  ref: { type: single, prim: string }
                  args: { type: single, prim: mapping }
                  tokens:
                    type: single
                    prim: sequence
                    elements: { type: single, prim: string }
                  facet: { type: single, prim: string }
                  value: { type: single, prim: any }
                  merge: { type: single, prim: mapping }
                  open_view: { type: single, prim: string }
                  drill: { type: single, prim: boolean }
                  notice: { type: single, prim: string }
    instruments:
      type: single
      prim: sequence
    capabilities:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required:
          sources: { type: single, prim: sequence, elements: { type: single, prim: string } }
          affordances: { type: single, prim: sequence, elements: { type: single, prim: string } }
        optional: {}
    # Grouped `{ group, views }` entries are canonical; bare `view:` ref
    # strings remain accepted (the launcher shelves them under their
    # path-derived group).
    library:
      type: single
      prim: sequence
      elements:
        type: union
        prims: [string, mapping]
    backdrop:
      type: single
      prim: string
    overlays:
      type: single
      prim: mapping

metadata:
  rules:
    name:
      from: filename
      required: true
      match: filename
    version:
      from: path
      key: version
    description:
      from: path
      key: description
    category:
      from: relative_dir
      required: true
