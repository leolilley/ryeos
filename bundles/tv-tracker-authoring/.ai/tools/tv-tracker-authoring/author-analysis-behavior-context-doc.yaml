# ryeos:signed:2026-07-27T09:00:08Z:b20895a3c915c822b4ffc02630f32b0d7d727cd1f4fb5d1893881f20e593d83d:I/ouhjQ3Ao39IpnwjaEUh9tn7qeGkR5uolQlCwkhMSG6rd3TkkF1OnEkvXI+dAaephimK6uC9WJ2/wLPtiVDCQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "0.1.0"
category: "tv-tracker-authoring"
name: "author-analysis-behavior-context-doc"
executor_id: "@subprocess"
description: "Author the signed tv-tracker AnalysisBehavior context doc via the daemon runtime.author_item callback. Authority is scoped to this one doc; the daemon signs (this wrapper never holds a key)."

requires:
  capabilities:
    manifest:
      runtime_authority:
        item_authoring:
          - kind: knowledge
            namespace: apps/tv-tracker/AnalysisBehavior

config:
  command: "bin:core/ryeos-core-tools"
  args:
    - "author-item"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 30

config_schema:
  type: object
  properties:
    item_ref:
      type: string
      enum: ["knowledge:apps/tv-tracker/AnalysisBehavior"]
    content:
      type: string
      description: "Unsigned item body. Must not contain a signature line or ryeos:authored: marker."
    mode:
      type: string
      enum: ["create", "upsert"]
      default: "upsert"
    format_ext:
      type: string
      default: ".md"
    expected_digest:
      type: string
      description: "CAS guard — the incumbent authored content_digest. Required for guarded saves."
  required: [item_ref, content]
