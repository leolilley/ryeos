# ryeos:signed:2026-08-04T10:21:26Z:44894f666d42c9ca72e1830ae3e81f77d14c56ab1669742548013ac0e006d43f:oo+4IFr9JVylc7lr0rYwsb8sRyAm6jaoatxO4IFxxXFrcP5NxlwL/GSE/+W8bBN3sp8gaUIOchNqtYO8sLXyAg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: ryeos-ui-status
version: "1.0.0"
description: >-
  Magit-style status lens — a foldable, sectioned overview of the node:
  running threads, installed bundles, and node status. One center lens you
  read and act from: Enter on a thread aims the foot input at it.

widget: sections
sources:
  threads:
    ref: service:threads/list
    params: {}
  bundles:
    ref: service:bundle/list
    params: {}
  node:
    ref: service:node/status
    params: {}
affordances:
  - id: aim-input
    label: Aim input here
    invoke:
      plane: ui
      facet: input.route
      merge:
        thread: "{record.thread_id}"
sections:
  - title: Threads
    source_channel: threads
    collection: threads
    projection:
      primary: item_ref
      meta: status
      tone:
        field: status
        map:
          running: accent
          created: accent
          failed: danger
          cancelled: warn
          completed: good
        default: neutral
    activate: aim-input
  - title: Bundles
    source_channel: bundles
    collection: bundles
    projection:
      primary: name
      meta: version
  - title: Node
    source_channel: node
    projection:
      primary: version
      meta: site_id
refresh:
  on_hint: [thread, activity]
