name: project-threads
title: Observed Project Threads
version: "1.0.0"
description: >-
  Bounded observed active-project thread history. The page does not prove
  exhaustive membership. Running, failed, cancelled, and completed threads may
  appear, with the
  input acting as the active/status/kind/source filter instead of separate
  active-only views.

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/threads/list
    params:
      project: current
      project_path: "@session:project_root"
      limit: 200
      sort: watch
    requires_project: true
    collection: threads
    coverage: coverage
projections:
  columns:
    - label: thread
      field: thread_id
    - label: kind
      field: kind
      present: words
    # The table carries the readable leaf; the full canonical ref remains in
    # expanded detail.
    - label: item
      field: item_ref
      present: leaf
    - label: project
      field: project.name
      fallback: node
    - label: status
      field: status
      present: words
    - label: created
      field: created_at
      present: time_date
  expand:
    fields: [thread_id, chain_root_id, project.name, project.path, item_ref, requested_by, created_at]
  tone:
    field: status
    map:
      running: accent
      # A queued (created/accepted) thread sits calm — only genuinely
      # RUNNING rows breathe, so a fanned-out cohort backlog reads as a
      # queue, not a wall of live activity.
      created: neutral
      accepted: neutral
      failed: danger
      killed: danger
      timed_out: danger
      cancelled: warn
      completed: good
    default: neutral
selection:
  activate: watch
affordances:
  - id: watch
    label: Inspect execution
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
      drill: true
  - id: tree
    label: Tree
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/thread/tree
      drill: true
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
  - id: compare-left
    label: Compare as left
    invoke:
      plane: ui
      facet: comparison
      merge:
        left_thread_id: "{record.thread_id}"
  - id: compare-right
    label: Compare as right
    invoke:
      plane: ui
      facet: comparison
      merge:
        right_thread_id: "{record.thread_id}"
  - id: cancel
    label: Cancel
    invoke:
      plane: rye
      ref: service:commands/submit
      args:
        thread_id: "{record.thread_id}"
        command_type: cancel
      notice: "Cancelled {result.thread_id}."
input:
  id: filter
  feeds:
    fields:
      - { param: active, label: active }
      - { param: status, label: status }
      - { param: kind, label: kind }
      - { param: requested_by, label: source }
    debounce_ms: 120
refresh:
  on_hint: [thread, activity]
