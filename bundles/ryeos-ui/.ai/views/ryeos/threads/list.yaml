# ryeos:signed:2026-10-19T22:29:41Z:90bac0b0fc78d10b87e55c8076ccd47d48a88e3ef3638bf8821b463844feb47b:RP05zxU47P5d8XS10gt223ZquImBp/Xg3K9T7ecBd66I+P6h0GGbnox3g3OVJk5J85knazCYihGYrGIUkta4DQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: threads-list
title: Observed Threads
version: "1.0.0"
description: Bounded observed thread candidates; an empty page does not prove no retained work exists

widget: table
# Operator watch dashboard: the UI-ryeos-ui (operator-scoped) thread list, ordered
# active-first then newest (sort: watch), applied before the limit so the most
# relevant rows always show.
sources:
  default:
    ref: service:ui/ryeos-ui/threads/list
    params:
      limit: 200
      sort: watch
    collection: threads
    coverage: coverage
projections:
  columns:
    - label: thread
      field: thread_id
    - label: kind
      field: kind
      present: words
    # The table carries the readable leaf; the full canonical ref remains in
    # expanded detail.
    - label: item
      field: item_ref
      present: leaf
    - label: project
      field: project.name
      fallback: node
    - label: status
      field: status
      present: words
    - label: created
      field: created_at
      present: time_date
  expand:
    fields: [thread_id, chain_root_id, project.name, project.path, item_ref, requested_by, created_at]
  tone:
    field: status
    map:
      running: accent
      # Queued threads sit calm; only RUNNING rows breathe.
      created: neutral
      failed: danger
      cancelled: warn
      completed: good
    default: neutral
# Enter inspects the exact execution subject; generic thread kinds need not
# expose a conversation or an input route.
selection:
  activate: watch
affordances:
  - id: watch
    label: Inspect execution
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
      drill: true
  - id: tree
    label: Tree
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/thread/tree
      drill: true
  # Inspect swaps the center lens to the thread's detail sections. Write the
  # selected thread FIRST (the detail sources read @facet:selection.thread_id),
  # then open the lens — the P1 open_view ordering guarantees the facet is set
  # before the new lens fetches.
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
  # Row-specific cancel through the ONE ryeos-ui cancel path: the audited command
  # channel `service:commands/submit` with `command_type: cancel`. It carries
  # the per-thread ownership check and writes a command record, unlike the raw
  # cancel services. Args reach the daemon as /execute parameters (the token
  # path would drop them), so `{record.thread_id}` targets THIS row rather than
  # the route head. See .ai/knowledge/ryeos/development/steering-graph-interrupt-and-cancel-path.md.
  - id: cancel
    label: Cancel
    invoke:
      plane: rye
      ref: service:commands/submit
      args:
        thread_id: "{record.thread_id}"
        command_type: cancel
      # Success copy lives in view data, not the reducer: rendered against the
      # command record ({result.<field>}) when the submit succeeds.
      notice: "Cancelled {result.thread_id}."
# Inline live filter: typing narrows the list (substring) as you type; the buffer
# feeds ONE source param (empty buffer = unfiltered), and Tab cycles which field it
# targets — status → kind → source (requested_by). No `submit:`, so this is a live
# filter — Enter activates the focused row (watches it), it does not submit. When
# the list lens is focused, printable keys edit this filter rather than the foot
# route input — the watch dashboard filters, it doesn't compose.
input:
  id: filter
  feeds:
    fields:
      - { param: status, label: status }
      - { param: kind, label: kind }
      - { param: requested_by, label: source }
    debounce_ms: 120
refresh:
  on_hint: [thread, activity]
