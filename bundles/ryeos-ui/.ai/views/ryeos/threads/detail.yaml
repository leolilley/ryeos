name: thread-detail
version: "1.0.0"
description: >-
  Thread detail lens for one signed execution subject. Coverage rows distinguish
  unavailable collections from verified empty evidence.

widget: sections
title: Thread
sources:
  detail:
    ref: service:ui/ryeos-ui/thread/inspect
    params:
      thread_id: "@facet:selection.thread_id"

sections:
  # Summary: the whole `thread` sub-record projected to one row (item + status),
  # toned by status so the header reads at a glance.
  - title: Summary
    source_channel: detail
    collection: thread
    projection:
      primary: item_ref
      meta: status
      tone:
        field: status
        map:
          running: accent
          created: accent
          failed: danger
          cancelled: warn
          completed: good
        default: neutral

  # The retained launch project root is signed. The project display summary is
  # an operational projection and is not part of this inspection response.
  - title: Project
    source_channel: detail
    collection: thread
    projection:
      primary: project_root
      meta: current_site_id

  - title: Evidence coverage
    source_channel: detail
    collection: evidence_coverage
    projection:
      primary: subject
      meta: reason
      tone:
        field: state
        map: { unavailable: warn, available: good }
        default: neutral

  # Audit posture reads an exact-subject node-signed audit record when
  # available. Coverage applies to that record; the verified executor identity
  # may still appear in Execution when the audit record is unavailable.
  - title: Execution posture coverage
    source_channel: detail
    collection: execution_coverage
    projection:
      primary: state
      meta: reason
  - title: Execution
    source_channel: detail
    collection: execution_meta
    projection:
      primary: label
      meta: value

  # The containment fact the launch recorded: whether isolation was enforced
  # for this run, read from the admitted realization as stored. A thread with no
  # admitted record says so; nothing here is a default.
  - title: Isolation enforced
    source_channel: detail
    collection: launch_facts
    projection:
      primary: state
      meta: properties.isolation_enforced
      tone:
        field: properties.isolation_enforced
        map: { "true": good, "false": warn }
        default: neutral
      expand:
        fields: [state, reason, properties.isolation_enforced, properties.isolation_policy_digest, properties.isolation_backend_inspection_digest]

  # Rows are `{label, value}`: the name leads (primary) and the figure follows
  # (meta), as in every other section.
  # Chain-wide settled usage from the projection (its coverage row is in
  # Evidence coverage); not signed testimony.
  - title: Usage
    source_channel: detail
    collection: usage
    projection:
      primary: label
      meta: value

  # Null outcome fields are explained by the signed snapshot coverage below;
  # a terminal status alone is not an outcome or a successful result.
  - title: Outcome coverage
    source_channel: detail
    collection: outcome_coverage
    projection:
      primary: state
      meta: reason
      expand:
        fields: [state, reason, thread_status]
  - title: Outcome
    source_channel: detail
    collection: result
    projection:
      primary: outcome_code
      meta: error
      tone:
        field: outcome_code
        map:
          ok: good
          error: danger
        default: neutral

  # Positive signed artifact evidence; an empty list is not an exhaustive claim.
  - title: Artifacts
    source_channel: detail
    collection: artifacts
    projection:
      identity: artifact_id
      primary: artifact_type
      meta: artifact_id
      expand:
        fields: [artifact_id, artifact_type, metadata]

# Re-fetch whenever the selected thread changes (the inspect affordance writes
# selection.thread_id before opening this lens).
refresh:
  on_facet: selection
