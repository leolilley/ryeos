name: attention-panel
title: Attention
version: "1.0.0"
description: The principal's attention queue as a panel. Enter acknowledges the selected item, which hides it until it has new activity; decisions stay in the Work and Review views.

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/work/attention
    params: { limit: 200 }
    collection: attention

projections:
  columns:
    - { label: kind, field: kind, present: words }
    - { label: item, field: title }
    - { label: detail, field: detail.summary, present: words }
    - { label: state, field: state, present: words }
  expand:
    fields: [subject.chain_root_id, subject.thread_id, since_ms, expires_at_ms, detail, actions]
  tone:
    field: tone
    map: { warn: warn, danger: danger }
    default: neutral

selection:
  activate: acknowledge

affordances:
  - id: acknowledge
    label: Acknowledge
    category: Triage
    producer: selection
    enabled_when: { field: actions.acknowledge, equals: true }
    disabled_reason: This kind of item is decided, not hidden; open it from Review.
    invoke:
      plane: rye
      ref: service:ui/ryeos-ui/work/acknowledge
      args:
        item_id: "{record.id}"
      notice: Acknowledged. It returns if it has new activity.

refresh:
  on_hint: [thread, activity]
  after_invoke: true
