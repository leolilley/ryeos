name: assistant-work-overview
title: Overview
version: "1.0.0"
description: Current placement and retained execution summary for the selected durable work

widget: sections
sources:
  detail:
    ref: service:ui/ryeos-ui/thread/inspect
    params:
      thread_id: "@facet:selection.work.thread"

sections:
  - title: Work
    source_channel: detail
    collection: thread
    projection:
      primary: item_ref
      meta: status
      tone:
        field: status
        map:
          running: accent
          created: accent
          failed: danger
          killed: danger
          timed_out: danger
          cancelled: warn
          completed: good
        default: neutral
  - title: Project
    source_channel: detail
    collection: thread
    projection:
      primary: project_root
      meta: current_site_id
  - title: Placement
    source_channel: detail
    collection: thread
    projection:
      primary: current_site_id
      meta: origin_site_id
  - title: Evidence coverage
    source_channel: detail
    collection: evidence_coverage
    projection:
      primary: subject
      meta: reason
      tone:
        field: state
        map: { unavailable: warn, available: good }
        default: neutral
  - title: Outcome
    source_channel: detail
    collection: result
    projection:
      primary: outcome_code
      meta: error
      tone:
        field: outcome_code
        map: { ok: good, error: danger }
        default: neutral

refresh:
  on_facet: selection
  on_hint: [thread, activity]
