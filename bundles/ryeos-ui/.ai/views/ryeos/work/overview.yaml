name: assistant-work-overview
title: Overview
version: "1.0.0"
description: Current placement and retained execution summary for the selected durable work

widget: sections
sources:
  detail:
    ref: service:ui/ryeos-ui/thread/inspect
    params:
      thread_id: "@facet:selection.work.thread"

sections:
  - title: Work
    source_channel: detail
    collection: thread
    projection:
      primary: item_ref
      meta: status
      tone:
        field: status
        map:
          running: accent
          created: accent
          failed: danger
          killed: danger
          timed_out: danger
          cancelled: warn
          completed: good
        default: neutral
  - title: Project
    source_channel: detail
    collection: thread
    projection:
      primary: project.name
      meta: project.path
  - title: Placement
    source_channel: detail
    collection: thread
    projection:
      primary: current_site_id
      meta: origin_site_id
  - title: Usage
    source_channel: detail
    collection: usage
    projection:
      primary: value
      meta: label
  - title: Outcome
    source_channel: detail
    collection: result
    projection:
      primary: outcome_code
      meta: error
      tone:
        field: outcome_code
        map: { ok: good, error: danger }
        default: neutral

refresh:
  on_facet: selection
  on_hint: [thread, activity]
