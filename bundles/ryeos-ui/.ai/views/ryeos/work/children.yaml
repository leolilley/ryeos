name: assistant-work-children
title: Children
version: "1.0.0"
description: Exact execution-tree closure for the selected work placement

widget: sections
sources:
  default:
    ref: service:ui/ryeos-ui/thread/tree
    params:
      thread_id: "@facet:selection.work.thread"
      max_depth: 16
      max_nodes: 500

sections:
  - title: Coverage
    source_channel: default
    collection: coverage
    projection:
      primary: state
      meta: reason
      expand:
        fields: [root_thread_id, retained, truncated]
      tone:
        field: state
        map: { complete: good, truncated: warn, unselected: neutral }
        default: neutral
  - title: Threads
    source_channel: default
    collection: threads
    projection:
      primary: item_ref
      meta: status
      expand:
        fields: [thread_id, chain_root_id, kind, tree.relation, tree.depth, current_site_id, origin_site_id]
      tone:
        field: status
        map: { running: accent, failed: danger, killed: danger, timed_out: danger, cancelled: warn, completed: good }
        default: neutral

refresh:
  on_facet: selection
  on_hint: [thread, activity]
