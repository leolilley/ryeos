name: assistant-work-candidate
title: Candidate
version: "1.0.0"
description: Exact retained candidate, completion, validation, and evaluator evidence without inferred success

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/work/candidate
    params:
      thread_id: "@facet:selection.work.thread"
    collection: candidates

projections:
  columns:
    - { label: state, field: state, present: words }
    - { label: candidate, field: candidate_snapshot_hash }
    - { label: accepted, field: evaluation_accepted, fallback: pending }
    - { label: disposition, field: candidate_disposition, present: words }
  expand:
    fields:
      - chain_root_id
      - placement_thread_id
      - candidate_snapshot_hash
      - base_snapshot_hash
      - candidate_validation_hash
      - candidate_evaluation_hash
      - evaluation_accepted
      - evaluator_item_ref
      - evaluator_definition_digest
      - evaluator_result_digest
      - publication_result
      - terminal_reason
      - completion
  tone:
    field: evaluation_accepted
    map: { "true": good, "false": danger }
    default: neutral

refresh:
  on_facet: selection
  on_hint: [thread, activity]
