name: assistant-work-evidence
title: Evidence
version: "1.0.0"
description: Retained execution facts for the selected work placement without inferred success

widget: sections
sources:
  detail:
    ref: service:ui/ryeos-ui/thread/inspect
    params:
      thread_id: "@facet:input.route.thread"

sections:
  - title: Execution
    source_channel: detail
    collection: execution_meta
    projection:
      primary: value
      meta: label
  - title: Outcome
    source_channel: detail
    collection: result
    projection:
      primary: outcome_code
      meta: error
      tone:
        field: outcome_code
        map: { ok: good, error: danger }
        default: neutral
  - title: Artifacts
    source_channel: detail
    collection: artifacts
    projection:
      primary: artifact_type
      meta: uri
  - title: Follow
    source_channel: detail
    collection: follow
    projection:
      primary: value
      meta: label
  - title: Children
    source_channel: detail
    collection: children
    projection:
      primary: item_ref
      meta: status
      tone:
        field: status
        map:
          running: accent
          created: accent
          failed: danger
          killed: danger
          timed_out: danger
          cancelled: warn
          completed: good
        default: neutral

refresh:
  on_facet: input.route
  on_hint: [thread, activity]
