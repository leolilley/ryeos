name: assistant-work-evidence
title: Evidence
version: "1.0.0"
description: Retained execution facts for the selected work placement without inferred success

widget: sections
sources:
  detail:
    ref: service:ui/ryeos-ui/thread/inspect
    params:
      thread_id: "@facet:selection.work.thread"

sections:
  - title: Evidence coverage
    source_channel: detail
    collection: evidence_coverage
    projection:
      primary: subject
      meta: reason
      tone:
        field: state
        map: { unavailable: warn, available: good }
        default: neutral
  - title: Execution posture coverage
    source_channel: detail
    collection: execution_coverage
    projection:
      primary: state
      meta: reason
      tone:
        field: state
        map: { available: good, unavailable: warn }
        default: neutral
  - title: Execution
    source_channel: detail
    collection: execution_meta
    projection:
      primary: value
      meta: label
  - title: Outcome coverage
    source_channel: detail
    collection: outcome_coverage
    projection:
      primary: state
      meta: reason
      expand:
        fields: [state, reason, thread_status]
  - title: Outcome
    source_channel: detail
    collection: result
    projection:
      primary: outcome_code
      meta: error
      tone:
        field: outcome_code
        map: { ok: good, error: danger }
        default: neutral
  - title: Artifacts
    source_channel: detail
    collection: artifacts
    projection:
      identity: artifact_id
      primary: artifact_type
      meta: artifact_id
      expand:
        fields: [artifact_id, artifact_type, metadata]

refresh:
  on_facet: selection
  on_hint: [thread, activity]
