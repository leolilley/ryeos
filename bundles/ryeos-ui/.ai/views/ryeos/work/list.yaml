# ryeos:signed:2026-11-19T05:58:47Z:63faf0df2b18047c4ddddc96a2d54f7089bc8270d904c51a02dc88ef89f2eefd:stscxKKbYWSwXuI/GWCvgXh6NSpMmX+LweAjQm05bSg82EKnB5Cu23ZxMYeQdt36pek+ux8J1tRIkdZUSLoVCw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: assistant-work
title: Work
version: "1.0.0"
description: Principal-scoped logical work grouped by durable chain root

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/work/list
    params: { limit: 200 }
    collection: work
projections:
  columns:
    - { label: status, field: phase.state_code, present: words, role: status }
    - { label: work, field: item_ref, present: leaf, role: ref }
    - { label: project, field: project.name, fallback: node, role: text }
    - { label: attention, field: attention_count }
    - { label: updated, field: observed_at, present: time_date, role: time }
  expand:
    fields: [coordinate.chain_root_id, placement.thread_id, placement.origin_site_id, placement.current_site_id, placement_count, attention, item_ref, kind, phase.category, phase.state_code, project.name, project.path, owner_principal_id, observed_at]
  tone:
    field: phase.state_code
    map: { running: accent, failed: danger, killed: danger, timed_out: danger, cancelled: warn, completed: good }
    default: neutral
selection:
  activate: overview
affordances:
  - id: talk
    label: Talk to work
    invoke:
      plane: ui
      facet: input.route
      merge:
        thread: "{record.placement.thread_id}"
        chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/thread/transcript
      drill: true
  - id: overview
    label: Overview
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement.thread_id}"
          chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/work/overview
      drill: true
  - id: children
    label: Children
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement.thread_id}"
          chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/work/children
      drill: true
  - id: evidence
    label: Evidence
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement.thread_id}"
          chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/work/evidence
      drill: true
  - id: approvals
    label: Approvals
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement.thread_id}"
          chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/work/approvals
      drill: true
  - id: candidate
    label: Candidate
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement.thread_id}"
          chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/work/candidate
      drill: true
refresh:
  on_hint: [thread, activity]
