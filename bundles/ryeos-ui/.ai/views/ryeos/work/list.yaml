# ryeos:signed:2026-09-15T01:11:43Z:088ab21cdc0ba3f87507e88baa5179dad47749907fcc1913b25a766b5000d14d:VLrs3ubtPG3QdEShHB2jc6o2PGVPE/PmmNEydwT05qwJW3KzztkHMLyp5NkD2axqh+lngMfugtQ2jn2rHGmdBg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: assistant-work
title: Work
version: "1.0.0"
description: Principal-scoped logical work grouped by durable chain root

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/work/list
    params: { limit: 200 }
    collection: work
projections:
  columns:
    - { label: status, field: phase.state_code, present: words }
    - { label: work, field: item_ref, present: leaf }
    - { label: project, field: project.name, fallback: node }
    - { label: updated, field: observed_at, present: time_date }
  expand:
    fields: [coordinate.chain_root_id, placement.thread_id, placement.origin_site_id, placement.current_site_id, placement_count, item_ref, kind, phase.category, phase.state_code, project.name, project.path, owner_principal_id, observed_at]
  tone:
    field: phase.state_code
    map: { running: accent, failed: danger, killed: danger, timed_out: danger, cancelled: warn, completed: good }
    default: neutral
selection:
  activate: overview
affordances:
  - id: talk
    label: Talk to work
    invoke:
      plane: ui
      facet: input.route
      merge:
        thread: "{record.placement.thread_id}"
        chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/thread/transcript
      drill: true
  - id: overview
    label: Overview
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement.thread_id}"
          chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/work/overview
      drill: true
  - id: children
    label: Children
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement.thread_id}"
          chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/work/children
      drill: true
  - id: evidence
    label: Evidence
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement.thread_id}"
          chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/work/evidence
      drill: true
  - id: approvals
    label: Approvals
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement.thread_id}"
          chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/work/approvals
      drill: true
  - id: candidate
    label: Candidate
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement.thread_id}"
          chain_root: "{record.coordinate.chain_root_id}"
      open_view: view:ryeos/work/candidate
      drill: true
refresh:
  on_hint: [thread, activity]
