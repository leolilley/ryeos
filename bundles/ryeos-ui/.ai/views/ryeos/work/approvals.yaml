name: assistant-work-approvals
title: Approvals
version: "1.0.0"
description: Exact pending approval requests owned by the selected hosted work

widget: table
sources:
  default:
    ref: service:worker-executions/approvals
    params:
      chain_root_id: "@facet:input.route.chain_root"
    collection: approvals

projections:
  columns:
    - { label: operation, field: operation_class, present: words }
    - { label: state, field: state, present: words }
    - { label: expires, field: expires_at_ms }
  expand:
    fields:
      - chain_root_id
      - approval_id
      - placement_thread_id
      - worker_boot_epoch
      - request_digest
      - operation_class
      - requested_authority
      - state
      - expires_at_ms
      - created_at_ms
  tone:
    field: state
    map: { pending: warn }
    default: neutral

refresh:
  on_facet: input.route
  on_hint: [thread, activity]
