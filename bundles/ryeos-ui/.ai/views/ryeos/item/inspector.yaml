# ryeos:signed:2026-11-18T11:51:40Z:d97fc536465e41fb8d8a8f073bf90bbb205edeb994fbef60f1d673050216450a:ziyU5XVUwMnyfJPjjmeWYKfK9SQVsK4ke9DYWKjOkwaRnfQ/D6JYVc11xoN00RfKk4/ozfTDbR+1KjABhO0NBw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: item-inspector
version: "1.0.0"
description: Key-value inspection of the selection — an item (provenance first), or an inspected summary (an error terminal's full event)

widget: key_value
# An inspect intent can write an inline `selection.summary` ({title, detail})
# — e.g. Enter on a failed feed line stages the full structured error. When
# present it renders directly (no round trip); otherwise the view falls back to
# the item-inspect fetch below against `selection.item`.
facet: selection.summary
sources:
  default:
    ref: service:ui/ryeos-ui/item/inspect
    params:
      canonical_ref: "@facet:selection.item"
      include_raw: false
      include_effective: true
projections:
  detail:
    - item.title
    - item.canonical_ref
    - item.title_source
    - item.item_kind
    - item.space
    - item.executable
    - item.trust
    - item.shadowed
    - effective
    - effective_coverage.state
    - effective_coverage.reason
    - raw_coverage.state
    - raw_coverage.reason
    # Inline event summaries use a separate response shape.
    - title
    - detail
refresh:
  on_facet: selection
