# ryeos:signed:2026-09-14T10:03:09Z:8e302696b05d68e3f9bb107aa38e43c98dc90e38de002ec6f0a9409fc1091cd8:PDweNrwYCA8r5s/0qeGtWVcNIIw4jTQ+P6BQmPsnH/iKkRVo83PRuQTmCrkMpKv3G5DTe/4FdJJiZi6ltKhdCA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: item-inspector
version: "1.0.0"
description: Key-value inspection of the selection — an item (provenance first), or an inspected summary (an error terminal's full event)

widget: key_value
# An inspect intent can write an inline `selection.summary` ({title, detail})
# — e.g. Enter on a failed feed line stages the full structured error. When
# present it renders directly (no round trip); otherwise the view falls back to
# the item-inspect fetch below against `selection.item`.
facet: selection.summary
sources:
  default:
    ref: service:ui/ryeos-ui/item/inspect
    params:
      canonical_ref: "@facet:selection.item"
      include_raw: false
      include_effective: true
      project_path: "@session:project_root"
    requires_project: true
projections:
  detail:
    - canonical_ref
    - kind
    - signer
    - version
    - description
    - title
    - detail
refresh:
  on_facet: selection
