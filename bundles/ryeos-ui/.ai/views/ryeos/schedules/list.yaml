# ryeos:signed:2026-10-19T22:29:40Z:f5b6f852bba7b99eaf1f8a03b52e571476dfa08224b7ab640638d4a2fb00ac5e:C412+MFyPLpuBaU4bqvQD75wNx1j2us4DPQ7w4gCtZgx0Estpo2T8LJ1RpV77S1rDFJ2HHNTGjV6mQioR7FiBw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: schedules-list
title: My schedules
version: "1.0.0"
description: Schedules owned by the authenticated caller across projects; an empty list does not mean the node has no schedules

widget: table
sources:
  default:
    ref: service:scheduler/list
    params: {}
    collection: schedules
projections:
  columns:
    - label: schedule
      field: schedule_id
    - label: item
      field: item_ref
    - label: expression
      field: expression
    - label: enabled
      field: enabled
  tone:
    field: enabled
    map:
      "true": good
      "false": warn
    default: neutral
# Selecting a row is read-only. Pause/resume remain explicit affordances.
affordances:
  - id: pause
    label: Pause
    invoke:
      plane: rye
      ref: service:commands/dispatch
      tokens: [scheduler, pause]
      args:
        schedule_id: "{record.schedule_id}"
  - id: resume
    label: Resume
    invoke:
      plane: rye
      ref: service:commands/dispatch
      tokens: [scheduler, resume]
      args:
        schedule_id: "{record.schedule_id}"
