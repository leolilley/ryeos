# ryeos:signed:2026-08-04T10:21:25Z:9c9ac80ccb57cafefc15760aba254237eb45572b8ede21b181ff90f3ace7cac9:gdhtrXQeEFJ13Z9KVXwc5k1PNjiN/W/EnEwohg64sAe0lGl1kNUJ6Xxv+0NwgpPGSsiWANofA/k87/wPxxWaAA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: schedules-list
version: "1.0.0"
description: Registered schedules and their state

widget: table
sources:
  default:
    ref: service:scheduler/list
    params: {}
    collection: schedules
projections:
  columns:
    - label: schedule
      field: schedule_id
    - label: item
      field: item_ref
    - label: expression
      field: expression
    - label: enabled
      field: enabled
  tone:
    field: enabled
    map:
      "true": good
      "false": warn
    default: neutral
selection:
  activate: pause
affordances:
  - id: pause
    label: Pause
    invoke:
      plane: rye
      tokens: [scheduler, pause]
      args:
        schedule_id: "{record.schedule_id}"
  - id: resume
    label: Resume
    invoke:
      plane: rye
      tokens: [scheduler, resume]
      args:
        schedule_id: "{record.schedule_id}"
