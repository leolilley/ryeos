name: input
version: "1.0.0"
description: The ryeos-ui chat box - an input buffer that dispatches through the engine route-fold

widget: text
input:
  id: line
  placeholder: Ask or run a command
  completion:
    ref: service:commands/list
    collection: commands
  # Inline @-mentions of substrate refs (the ryeos twist on file @-mentions):
  # type `@` to reference a thread; the hint shows its directive, Tab inserts
  # the thread handle. One source for now (threads); extensible to items/files.
  mentions:
    ref: service:threads/list
    collection: threads
    reference: thread_id
    label: item_ref
  command_submit: command_dispatch
  thread_control: thread_control
  submit: route
  # Semantic capability only (no physical keys): the central keymap maps
  # Tab/Shift+Tab to cycling the route target over [new conversation] +
  # open chains. Tab still completes slash-commands when one can be accepted.
  target:
    cycle: route_chains

# Shell-wide executable behavior remains ordinary signed view content. The
# clients submit only these binding coordinates and their typed producer data;
# they never select either service target or grant themselves its capability.
affordances:
  - id: command_dispatch
    label: Run command
    producer: tokens
    requires_project: false
    invoke:
      plane: rye
      ref: service:commands/dispatch
      args:
        tokens: "{tokens}"
        arguments: "{arguments}"
        ref_bindings: {}
        project_path: "@session:project_root_or_null"
  - id: thread_control
    label: Control thread
    producer: selection
    invoke:
      plane: rye
      ref: service:commands/submit
      args:
        thread_id: "{record.thread_id}"
        command_type: "{record.command_type}"
