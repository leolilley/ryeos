# ryeos:signed:2026-11-18T11:49:26Z:0530c3137944a7ae67651f71b803e735f839314adbb197465c0f3f04f7301c09:nV1jGChYBFAXaZnm/omwMGGZy6EZHNJUvNL89G6eZJ0Dszfe2kGC0lylQSPdgyBqjjKvxXGd5fBvERvdsRnNDg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: project-directives
title: Directives
version: "1.0.0"
description: Signed directives visible from the active project; selecting one sets the item that Inspector and Explain read

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/items/list
    params:
      kind: directive
      limit: 500
      project_path: "@session:project_root"
    collection: items
    coverage: coverage
    requires_project: true
projections:
  columns:
    - label: name
      field: title
    - label: item
      field: canonical_ref
      role: ref
    - label: space
      field: space
    - label: trust
      field: trust.class
  tone:
    field: trust.class
    map:
      trusted: good
      untrusted: danger
      unsigned: warn
      unknown: neutral
    default: neutral
selection:
  activate: inspect
affordances:
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/inspector
      drill: true
  - id: explain
    label: Explain
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/explain
