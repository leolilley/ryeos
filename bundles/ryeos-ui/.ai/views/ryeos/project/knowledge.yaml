# ryeos:signed:2026-11-18T07:27:32Z:4e4fbf54c9b18dacedb9b89b58820b0a037afc32ffc4d2b68f7052f7d69dde92:sysqz5JHEROU8cqCq/KLxLYstPds8AQ+pTign0u85tCtG4mgjvNlgQI9TgYBi3Ks0O6erWHZlPiq6gYFTvXbCw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: project-knowledge
title: Knowledge
version: "1.0.0"
description: Signed knowledge entries visible from the active project; selecting one sets the item that Inspector and Explain read

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/items/list
    params:
      kind: knowledge
      limit: 500
      project_path: "@session:project_root"
    collection: items
    coverage: coverage
    requires_project: true
projections:
  columns:
    - label: item
      field: canonical_ref
    - label: namespace
      field: namespace
    - label: space
      field: space
    - label: trust
      field: trust.class
  tone:
    field: trust.class
    map:
      trusted: good
      untrusted: danger
      unsigned: warn
      unknown: neutral
    default: neutral
selection:
  activate: inspect
affordances:
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/inspector
      drill: true
  - id: explain
    label: Explain
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/explain
