# ryeos:signed:2026-11-19T05:58:47Z:10a985714cb2dc5e4bb842b3832cb01f82cee9221f315cc8c4fdb052e823818a:LFvTmk599jqLfIYcNYXDYH4VgXJkO6eWRGwMRtNDklDPiq+X7S84jeGuEUtArN17dGoF+JAfpjsf/9+Z0gzmCw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: project-items
title: Items
version: "1.0.0"
description: Signed content visible from the active project

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/items/list
    params:
      limit: 500
      project_path: "@session:project_root"
    collection: items
    coverage: coverage
    requires_project: true
projections:
  columns:
    - label: item
      field: canonical_ref
      role: ref
    - label: kind
      field: item_kind
      role: kind
    - label: space
      field: space
    - label: trust
      field: trust.class
  tone:
    field: trust.class
    map:
      trusted: good
      untrusted: danger
      unsigned: warn
      unknown: neutral
    default: neutral
selection:
  activate: inspect
affordances:
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/inspector
      drill: true
  - id: explain
    label: Explain
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/explain
