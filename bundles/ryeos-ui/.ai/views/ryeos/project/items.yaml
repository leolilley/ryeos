# ryeos:signed:2026-09-14T10:03:09Z:86671c46763baf1e473cbfa79f3cda418037ff7617a8a39737709a9f989266bb:bzRa/J8JisMLgiIYsL0G+EnOKWFKNadgKx4/xIW8Og5QQTGwAEPbCzW61tkx8UguAN71LR06grUxSDAg8eg9CQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: project-items
title: Items
version: "1.0.0"
description: Signed content visible from the active project

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/items/list
    params:
      limit: 500
      project_path: "@session:project_root"
    collection: items
    requires_project: true
projections:
  columns:
    - label: item
      field: canonical_ref
    - label: kind
      field: item_kind
    - label: space
      field: space
    - label: trust
      field: trust.class
  tone:
    field: trust.class
    map:
      trusted: good
      untrusted: danger
      unsigned: warn
      unknown: neutral
    default: neutral
selection:
  activate: inspect
affordances:
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
  - id: explain
    label: Explain
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/explain
