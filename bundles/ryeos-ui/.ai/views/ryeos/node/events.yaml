# ryeos:signed:2026-08-04T10:21:25Z:6c32c2a0d67893ed3ba3f9854da66a03d3ed1d28296fd76b08b5f1025be061f3:J7QtEq5uwZ3GxDUWOoSEC4+NX0BJUmfWd4i7NucrcBaq03AaTu8L8yfXTY7zQR3sPxpOODY8WnRT5ONgsSV9Bw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: node-events
title: Events
version: "1.0.0"
description: Recent durable events across every thread on the node

widget: sections
sources:
  pulse:
    ref: service:ui/ryeos-ui/node/activity
    params:
      event_limit: 1
  recent:
    ref: service:ui/ryeos-ui/node/activity
    params:
      event_limit: 80
      exclude_types: ["seat.facet", "thread_usage", "cognition_out"]
affordances:
  - id: watch-thread
    label: Watch thread
    invoke:
      plane: ui
      facet: input.route
      merge:
        thread: "{record.thread_id}"
        chain_root: "{record.chain_root_id}"
      open_view: view:ryeos/thread/transcript
      drill: true
sections:
  - title: Pulse
    source_channel: pulse
    collection: pulse
    projection:
      primary: value
      meta: label
  - title: Recent
    source_channel: recent
    collection: events
    projection:
      primary: event_type
      meta: thread_id
      tone:
        field: event_type
        map:
          thread_failed: danger
          thread_killed: danger
          thread_timed_out: danger
          thread_cancelled: warn
          provider_retry: warn
          cost_untracked: warn
          thread_completed: good
          artifact_published: good
          thread_created: accent
          child_thread_spawned: accent
        default: neutral
    activate: watch-thread
refresh:
  on_hint: [thread, activity]
