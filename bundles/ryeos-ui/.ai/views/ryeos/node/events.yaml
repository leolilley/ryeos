name: node-events
title: Events
version: "1.0.0"
description: Bounded authenticated activity visible to the current caller, with explicit observation coverage

widget: sections
sources:
  pulse:
    ref: service:ui/ryeos-ui/node/activity
    params:
      event_limit: 1
  recent:
    ref: service:ui/ryeos-ui/node/activity
    params:
      event_limit: 80
      exclude_types: ["seat.facet", "thread_usage", "cognition_out"]
affordances:
  - id: watch-thread
    label: Inspect execution
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
      drill: true
sections:
  - title: Pulse
    source_channel: pulse
    collection: pulse
    projection:
      primary: value
      meta: label
  - title: Pulse coverage
    source_channel: pulse
    collection: pulse_coverage
    projection:
      primary: state
      meta: reason
  - title: Usage coverage
    source_channel: pulse
    collection: usage_coverage
    projection:
      primary: state
      meta: reason
  - title: Recent
    source_channel: recent
    collection: events
    projection:
      identity: event_hash
      primary: event_type
      meta: thread_id
      tone:
        field: event_type
        map:
          thread_failed: danger
          thread_killed: danger
          thread_timed_out: danger
          thread_cancelled: warn
          provider_retry: warn
          cost_untracked: warn
          thread_completed: good
          artifact_published: good
          thread_created: accent
          child_thread_spawned: accent
        default: neutral
    activate: watch-thread
  - title: Recent event coverage
    source_channel: recent
    collection: events_coverage
    projection:
      primary: state
      meta: reason
      tone:
        field: state
        map:
          failed: danger
          partial: warn
        default: neutral
refresh:
  on_hint: [thread, activity]
