# ryeos:signed:2026-11-18T05:28:58Z:07df86834b192abeb1e670d2731d9edf1a7fa6ebbbcd2b5638bdb1634d4f3257:GvYJdmx4L7CgLhz71lxHlQXT0J2oIsHOpEqPhyf20immsmi6kzaE1yvKtWCgtn7mN9sWY/xyZVFLPeJjQ13HBw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: node-machines
title: Machines
version: "1.0.0"
description: >-
  Which of your nodes share a boot, storage or account, as each node reports it.
  A group row names the machine and the grade of the grouping; its node rows say
  who answered and what each relation measured. Observation only: nothing here
  declares or changes a machine.

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/node/machines
    params: {}
    collection: rows
projections:
  hierarchy:
    id: id
    parent: parent
  columns:
    - { label: machine, field: name }
    - { label: place, field: place }
    - { label: state, field: state_text }
    - label: boot
      field: facts.boot.text
      tone:
        field: facts.boot.grade
        map: { measured: good, unknown: warn }
    - label: storage
      field: facts.storage.text
      tone:
        field: facts.storage.grade
        map: { measured: good, unknown: warn }
    - label: account
      field: facts.account.text
      tone:
        field: facts.account.grade
        map: { measured: good, unknown: warn }
    - { label: as of, field: as_of, present: time_date }
  expand:
    fields: [label, relations_text, facts_text, disagreeing_text, missing_text, node_id, as_of]
  tone:
    field: status
    map:
      declared_confirmed: good
      observed: good
      declared_contradicted: danger
      disagrees: danger
      cannot_tell: warn
      did_not_answer: warn
      not_granted: warn
    default: neutral
