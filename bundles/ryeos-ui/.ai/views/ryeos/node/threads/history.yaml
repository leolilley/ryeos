name: node-threads-history
title: Observed Operator Threads
version: "1.0.0"
description: >-
  Bounded threads visible to this admitted operator, not every owner on the
  node. An empty page is not proof of no retained work. The input acts as the
  active/status/kind/source filter instead of a separate active-only view.

widget: table
# The tile's right note: how the page is bounded and ordered, said plainly.
body:
  supplement:
    frame_detail: "200 at most · sorted by watch"
sources:
  default:
    ref: service:ui/ryeos-ui/threads/list
    params:
      limit: 200
      sort: watch
    collection: threads
    coverage: coverage
projections:
  columns:
    - label: thread
      field: thread_id
      role: id
    - label: kind
      field: kind
      role: kind
      present: words
      # The wire kind names the run; the table says what ran.
      labels:
        directive_run: directive
        graph_run: graph
        schedule_run: schedule
        tool_run: tool
        worker_run: worker
    # The table carries the readable leaf; the full canonical ref remains in
    # expanded detail.
    - label: item
      field: item_ref
      role: ref
      present: leaf
    - label: project
      field: project.name
      role: text
      fallback: node
    - label: status
      field: status
      role: status
      present: words
    - label: created
      field: created_at
      role: time
      # Today reads as the time of day, the day before as the word below,
      # older rows as time and date.
      present: time_relative
      labels:
        yesterday: yesterday
  expand:
    fields: [thread_id, chain_root_id, project.name, project.path, item_ref, requested_by, created_at]
  tone:
    field: status
    map:
      running: accent
      # A queued (created/accepted) thread sits calm — only genuinely
      # RUNNING rows breathe, so a fanned-out cohort backlog reads as a
      # queue, not a wall of live activity.
      created: neutral
      accepted: neutral
      failed: danger
      killed: danger
      timed_out: danger
      cancelled: warn
      completed: good
    default: neutral
selection:
  activate: watch
affordances:
  - id: watch
    label: Inspect execution
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
      drill: true
  - id: tree
    label: Tree
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/thread/tree
      drill: true
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
input:
  id: filter
  feeds:
    fields:
      - { param: active, label: active }
      - { param: status, label: status }
      - { param: kind, label: kind }
      - { param: requested_by, label: source }
    debounce_ms: 120
refresh:
  on_hint: [thread, activity]
