# ryeos:signed:2026-10-19T22:29:40Z:91c1782536778b0f7d87a6f8d6df6a1564f778c91b9920edec6dacc750e2b1d0:AM3GDR/5iKnE6HOLiJbJoIJCMZG1S+BKpAG8Gm6uaMuzTkS8EuvtaYbSmqybjJuqnuCxwU6PYebGB4aUpmNYBQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: node-threads-history
title: Observed Operator Threads
version: "1.0.0"
description: >-
  Bounded threads visible to this admitted operator, not every owner on the
  node. An empty page is not proof of no retained work. The input acts as the
  active/status/kind/source filter instead of a separate active-only view.

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/threads/list
    params:
      limit: 200
      sort: watch
    collection: threads
    coverage: coverage
projections:
  columns:
    - label: thread
      field: thread_id
    - label: kind
      field: kind
      present: words
    # The table carries the readable leaf; the full canonical ref remains in
    # expanded detail.
    - label: item
      field: item_ref
      present: leaf
    - label: project
      field: project.name
      fallback: node
    - label: status
      field: status
      present: words
    - label: created
      field: created_at
      present: time_date
  expand:
    fields: [thread_id, chain_root_id, project.name, project.path, item_ref, requested_by, created_at]
  tone:
    field: status
    map:
      running: accent
      # A queued (created/accepted) thread sits calm — only genuinely
      # RUNNING rows breathe, so a fanned-out cohort backlog reads as a
      # queue, not a wall of live activity.
      created: neutral
      accepted: neutral
      failed: danger
      killed: danger
      timed_out: danger
      cancelled: warn
      completed: good
    default: neutral
selection:
  activate: watch
affordances:
  - id: watch
    label: Inspect execution
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
      drill: true
  - id: tree
    label: Tree
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/thread/tree
      drill: true
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
input:
  id: filter
  feeds:
    fields:
      - { param: active, label: active }
      - { param: status, label: status }
      - { param: kind, label: kind }
      - { param: requested_by, label: source }
    debounce_ms: 120
refresh:
  on_hint: [thread, activity]
