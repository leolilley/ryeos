name: development-occurrence
title: Occurrence
version: "1.0.0"
description: Exact selected execution occurrence with directly connected retained evidence and coverage

widget: sections
sources:
  detail:
    ref: service:ui/ryeos-ui/execution/occurrence
    params:
      thread_id: "@facet:selection.work.thread"
      occurrence_id: "@facet:selection.execution.entity_id"

sections:
  - title: Occurrence
    source_channel: detail
    collection: occurrence
    projection:
      primary: label
      meta: status
      expand:
        fields: [id, kind, canonical_ref, effective_definition_digest, attributes.thread.id, attributes.graph_run_id, attributes.node, attributes.step, attributes.attempt, attributes.iteration, event_ref, provenance]
  - title: Direct evidence
    source_channel: detail
    collection: evidence
    projection:
      primary: label
      meta: kind
      expand:
        fields: [id, status, event_ref, artifact_ref, attributes, provenance]
  - title: Relationships
    source_channel: detail
    collection: relations
    projection:
      primary: kind
      meta: target_id
      expand:
        fields: [id, source_id, target_id, status, provenance]
  - title: Coverage
    source_channel: detail
    collection: coverage
    projection:
      primary: state
      meta: warning_count
      expand:
        fields: [truncated, warnings]

refresh:
  on_facet: selection.execution
  on_hint: [thread, activity]
