# ryeos:signed:2026-09-19T04:02:47Z:645b607b37dcc3781e156ac1cabd831847d13c3e426ecc3c2a79b2bfd953cee3:NCeTiBoub5VRrleRHfEGEwiv2Y5rlVZD3O44wF1piuLsxl6t8ncGoFuukbh81UYGWXgucq3f/3zlQdg9Lij3AQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: development-explorer
title: Explorer
version: "1.0.0"
description: Durable work navigator for the development view set

widget: rows
sources:
  default:
    ref: service:ui/ryeos-ui/work/list
    params: { limit: 200 }
    collection: work
projections:
  primary: item_ref
  secondary: project.name
  meta: phase.state_code
  tone:
    field: phase.state_code
    map: { running: accent, failed: danger, killed: danger, timed_out: danger, cancelled: warn, completed: good }
    default: neutral
selection:
  activate: inspect
affordances:
  - id: inspect
    label: Inspect work
    invoke:
      plane: ui
      facet: selection.work
      merge:
        thread: "{record.placement.thread_id}"
        chain_root: "{record.coordinate.chain_root_id}"
refresh:
  on_hint: [thread, activity]
