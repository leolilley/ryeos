name: development-change
title: Change
version: "1.0.0"
description: Recorded diff of the changed file chosen in the review's file list, derived by the daemon from the retained candidate of the selected work

widget: diff
sources:
  default:
    ref: service:ui/ryeos-ui/work/candidate/diff
    params:
      thread_id: "@facet:selection.work.thread"
      path: "@facet:selection.change.path"

projections:
  basis: basis
  files: files
  omitted_files: omitted_files
  # A run of unchanged lines longer than twice fold_after folds; a diff with
  # more lines than collapse_lines opens with its file closed; lines_shown holds the rest
  # of a file behind a row that opens it. Every word a row or label carries is
  # one of these.
  diff:
    fold_after: 3
    collapse_lines: 40
    files_shown: 8
    lines_shown: 120
    words:
      basis.requested: requested
      basis.reported: reported
      basis.recorded: recorded
      basis.not_applied: requested, not applied
      note.requested: what the call asked for
      note.not_applied: the call failed
      note.reported: what the tool said it did
      note.recorded: from the retained snapshot
      op.add: added
      op.modify: modified
      op.delete: deleted
      op.rename: renamed
      renamed_to: renamed to
      change_to: change to
      file: file
      files: files
      added: added
      removed: removed
      hunk: hunk
      hunks: hunks
      line: line
      lines: lines
      bytes: bytes
      unchanged_line: unchanged line
      unchanged_lines: unchanged lines
      line.added: added
      line.removed: removed
      line.unchanged: unchanged
      line.note: note
      more_line: more line
      more_lines: more lines
      more_file: more file
      more_files: more files
      more_row: more row
      more_rows: more rows
      not_shown: not shown
      binary: binary
      reason.lines: limit
      reason.total: limit
      reason.bytes: limit
      reason.window: open the raw events for the whole change
      reason.too_large: file too large
      reason.files: limit
      copy_notice: Copied the bounded display, not the file
      copy_note: Copy is the bounded display, not the file.
      empty: No changes
      unavailable: The change could not be read
      unavailable.path_not_changed: This path is not a change of the candidate
      unavailable.path_not_shown: This path is not shown as a change
      unavailable.candidate_not_captured: No candidate has been captured yet
      unavailable.not_dedicated_session: This work has no retained candidate

refresh:
  on_facet: selection
  on_hint: [thread, activity]
