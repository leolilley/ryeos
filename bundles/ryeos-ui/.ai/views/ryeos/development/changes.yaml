name: development-changes
title: Changes
version: "1.0.0"
description: Exact retained candidate changes for the work selected as this view set's conversation route

widget: sections
sources:
  detail:
    ref: service:ui/ryeos-ui/work/candidate
    params:
      thread_id: "@facet:selection.work.thread"

sections:
  - title: Availability
    source_channel: detail
    collection: availability
    projection:
      primary: state
      meta: reason
      tone:
        field: state
        map: { available: good, pending: accent, unavailable: warn }
        default: neutral
  - title: Working changes
    source_channel: detail
    collection: change_summary
    projection:
      primary: state
      meta: total
      expand:
        fields: [reason, added, modified, deleted, truncated]
      tone:
        field: state
        map: { available: good, unavailable: warn }
        default: neutral
  - title: Files
    source_channel: detail
    collection: changes
    projection:
      primary: path
      meta: change
      expand:
        fields: [base_file_hash, candidate_file_hash]
      tone:
        field: change
        map: { added: good, modified: warn, deleted: danger }
        default: neutral
  - title: Candidate
    source_channel: detail
    collection: candidates
    projection:
      primary: candidate_snapshot_hash
      meta: candidate_disposition
      expand:
        fields: [base_snapshot_hash, candidate_validation_hash, evaluation_accepted]
      tone:
        field: evaluation_accepted
        map: { "true": good, "false": danger }
        default: neutral

refresh:
  on_facet: selection.work
  on_hint: [thread, activity]
