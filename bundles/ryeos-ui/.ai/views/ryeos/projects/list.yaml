# ryeos:signed:2026-08-04T10:21:25Z:997f68bc79c40074cadfa7b2e7094e66b98904c0877001146ace6d86653151da:KMn2WBJooHJHbjKkXXp1etGvofDpADOT9QGfXb+YKK7dxNAcNOqP3ZnCIgn++k+q4ZALmOilqX0eR6DOEe1zAw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: projects-list
title: Projects
version: "1.0.0"
description: >-
  Registered project contexts for this operator. The current TUI project is
  marked in-row; Enter opens a project so current-project lenses and foot-input
  launches retarget to that root.

widget: table
sources:
  default:
    ref: service:projects/list
    params:
      project_path: ""
    collection: projects
projections:
  columns:
    - label: current
      field: current
      tone:
        field: current
        map:
          "true": accent
    - label: saved
      field: registered
    - label: name
      field: name
    - label: root
      field: root
    - label: exists
      field: exists
    - label: added
      field: added_at
  expand:
    fields: [local_id, name, root, current, registered, exists, tags, added_at]
  tone:
    field: current
    map:
      "true": accent
    default: neutral
selection:
  activate: open-project
affordances:
  - id: open-project
    label: Open project
    invoke:
      plane: rye
      ref: service:projects/open
      args:
        local_id: "{record.local_id}"
      notice: "Opened {result.project.name}."
refresh:
  on_hint: [project]
