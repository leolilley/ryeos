name: projects-list
title: Projects
version: "1.0.0"
description: >-
  Registered project contexts for this operator. Opening admits a new project
  Surface in the existing presentation without retargeting other mounted Views
  or their inputs. Registration is a separate explicitly admitted operation.

widget: sections
sources:
  default:
    ref: service:projects/list
affordances:
  - id: open-project
    label: Open project
    enabled_when: { field: registered, equals: true }
    presentation_operation: surface_opening
    invoke:
      plane: rye
      ref: service:projects/open
      args:
        placement: { kind: new_surface }
        local_id: "{record.local_id}"
        selection:
          kind: authored
          surface_ref: surface:ryeos/ui/project
        creation_request_id: "{record.creation_request_id}"
      notice: "Opened {result.project.name}."
  - id: register-project
    label: Register project
    invoke:
      plane: rye
      ref: service:projects/add
      args:
        root: "{record.root}"
      notice: "Registered {result.project.name}."
  - id: open-project-surface
    label: Open project Surface
    presentation_operation: surface_opening
    invoke:
      plane: rye
      ref: service:projects/open
      args:
        placement: { kind: new_surface }
        local_id: "{record.local_id}"
        selection:
          kind: authored
          surface_ref: "{record.surface_ref}"
        creation_request_id: "{record.creation_request_id}"
      notice: "Opened {record.title}."
sections:
  - title: Registered projects
    source_channel: default
    collection: projects
    projection:
      primary: name
      meta: root
    activate: open-project
  - title: Project-owned Surfaces
    source_channel: default
    collection: project_surfaces
    projection:
      primary: title
      meta: project_name
    activate: open-project-surface
  - title: Surface discovery
    source_channel: default
    collection: project_surface_notices
    projection:
      primary: label
refresh:
  on_hint: [project]
