# ryeos:signed:2026-11-17T06:42:40Z:9e5584c8d38e95a53f15c6c6a5ef29806424408eadc5085842fa541a524ee166:OinNz60zG57UJzKTmne94Q3adQevLmMTFOF5sEIQqsCMu/XR4wxfDzGMIa2myZfTiCpvVDaD2kXCS1A3+4HMCQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: chain-timeline
version: "1.0.0"
description: Timeline of the input route's conversation chain, folded by the daemon's timeline service

widget: timeline
sources:
  default:
    ref: service:ui/ryeos-ui/timeline/thread
    params:
      chain_root_id: "@facet:input.route.chain_root"
      limit: "@facet:timeline.window.limit|200"
    collection: items
    dynamic_parameters: [since_chain_seq]
  raw:
    ref: service:ui/ryeos-ui/timeline/raw
    role: timeline_raw
    params:
      chain_root_id: "@facet:input.route.chain_root"
      from_chain_seq: ""
      to_chain_seq: ""
    dynamic_parameters: [from_chain_seq, to_chain_seq]
    activation: on_demand
    refresh: {}
projections:
  expand:
    fields:
      - id
      - type
      - state
      - thread
      - slots.body
      - slots.detail
      - slots.reason
      - slots.tool
      - slots.target
# Activating the "N older" line widens the window: the service names the wider
# limit and the affordance writes it to the facet the source reads.
selection:
  activate: older
affordances:
  - id: older
    label: Load older
    invoke:
      plane: ui
      facet: timeline.window
      value:
        limit: "{record.next_limit}"
refresh:
  on_hint: thread
