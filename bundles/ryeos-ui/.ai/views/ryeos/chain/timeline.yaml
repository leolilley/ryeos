# ryeos:signed:2026-11-16T21:15:27Z:fc5fdd2e140817070194e2e3983daae98c304bd8c9311d69f4e09cdd0c8a3629:Whv6/X6qY8l7dmItLG6p3k80hWToFDf2E4qd9VAqp+m6HDWJ4TisKKqh4obhI2S7f0R/Y2ZtX03IcbyWCDJrCw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: chain-timeline
version: "1.0.0"
description: Timeline of the input route's conversation chain, folded by the daemon's timeline service

widget: timeline
sources:
  default:
    ref: service:ui/ryeos-ui/timeline/thread
    params:
      chain_root_id: "@facet:input.route.chain_root"
      limit: "200"
    collection: items
  raw:
    ref: service:ui/ryeos-ui/timeline/raw
    role: timeline_raw
    params:
      chain_root_id: "@facet:input.route.chain_root"
      from_chain_seq: ""
      to_chain_seq: ""
    dynamic_parameters: [from_chain_seq, to_chain_seq]
    activation: on_demand
    refresh: {}
projections:
  expand:
    fields:
      - id
      - type
      - state
      - thread
      - slots.body
      - slots.detail
      - slots.reason
      - slots.tool
      - slots.target
refresh:
  on_hint: thread
