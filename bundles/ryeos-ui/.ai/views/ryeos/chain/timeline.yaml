name: chain-timeline
version: "1.0.0"
description: Timeline of the input route's conversation chain, folded by the daemon's timeline service

widget: timeline
sources:
  default:
    ref: service:ui/ryeos-ui/timeline/thread
    params:
      chain_root_id: "@facet:input.route.chain_root"
      limit: "@facet:timeline.window.limit|200"
    collection: items
    dynamic_parameters: [since_chain_seq]
  raw:
    ref: service:ui/ryeos-ui/timeline/raw
    role: timeline_raw
    params:
      chain_root_id: "@facet:input.route.chain_root"
      from_chain_seq: ""
      to_chain_seq: ""
    dynamic_parameters: [from_chain_seq, to_chain_seq]
    activation: on_demand
    refresh: {}
projections:
  expand:
    fields:
      - id
      - type
      - state
      - thread
      - slots.body
      - slots.detail
      - slots.reason
      - slots.tool
      - slots.target
  # How a change block under an opened entry is drawn: a run of unchanged
  # lines longer than twice fold_after folds, a block with more diff lines
  # than collapse_lines opens with its files closed, and files_shown and lines_shown hold
  # the rest behind a row that opens it. Every word a diff row or label
  # carries is one of these.
  diff:
    fold_after: 3
    collapse_lines: 40
    files_shown: 8
    lines_shown: 120
    words:
      basis.requested: requested
      basis.reported: reported
      basis.recorded: recorded
      basis.not_applied: requested, not applied
      note.requested: what the call asked for
      note.not_applied: the call failed
      note.reported: what the tool said it did
      note.recorded: from the retained snapshot
      op.add: added
      op.modify: modified
      op.delete: deleted
      op.rename: renamed
      renamed_to: renamed to
      change_to: change to
      file: file
      files: files
      added: added
      removed: removed
      hunk: hunk
      hunks: hunks
      line: line
      lines: lines
      bytes: bytes
      unchanged_line: unchanged line
      unchanged_lines: unchanged lines
      line.added: added
      line.removed: removed
      line.unchanged: unchanged
      line.note: note
      more_line: more line
      more_lines: more lines
      more_file: more file
      more_files: more files
      more_row: more row
      more_rows: more rows
      not_shown: not shown
      binary: binary
      reason.lines: limit
      reason.total: limit
      reason.bytes: limit
      reason.window: open the raw events for the whole change
      reason.too_large: file too large
      reason.files: limit
      copy_notice: Copied the bounded display, not the file
# Activating the "N older" line widens the window: the service names the wider
# limit and the affordance writes it to the facet the source reads.
selection:
  activate: older
affordances:
  - id: older
    label: Load older
    invoke:
      plane: ui
      facet: timeline.window
      value:
        limit: "{record.next_limit}"
  # Answering a docked pending ask: the digest-fenced service the approvals
  # views call. A client lists these beside an ask only where the surface
  # admits them. The record is the ask's own fields plus the chain id.
  - id: accept
    label: Approve
    producer: selection
    visible_when:
      all:
        - { field: type, equals: ask }
        - { field: state, equals: pending }
    enabled_when: { field: accept_allowed, equals: true }
    disabled_reason: This approval request cannot be accepted; decline it or inspect its authority.
    invoke:
      plane: rye
      ref: service:worker-executions/resolve-approval
      args:
        chain_root_id: "{record.chain_root_id}"
        approval_id: "{record.approval_id}"
        request_digest: "{record.request_digest}"
        accept: true
      notice: Approval accepted
  - id: decline
    label: Decline
    producer: selection
    visible_when:
      all:
        - { field: type, equals: ask }
        - { field: state, equals: pending }
    invoke:
      plane: rye
      ref: service:worker-executions/resolve-approval
      args:
        chain_root_id: "{record.chain_root_id}"
        approval_id: "{record.approval_id}"
        request_digest: "{record.request_digest}"
        accept: false
      notice: Approval declined
refresh:
  on_hint: thread
