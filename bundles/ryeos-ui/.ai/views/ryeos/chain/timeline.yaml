# ryeos:signed:2026-11-16T07:56:53Z:5531e0f9b41b5729f3aa4934fbb1a048a70ec417d5d5e5dec705cb8a95406bba:GKvsxujeEAKzs6tyci1PddRPhmmpSQJalvSX5hPnak0Vbjgb025csogeJdThS34utJ2TV2MnvkRsJs/psoAmAg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: chain-timeline
version: "1.0.0"
description: Timeline of the input route's conversation chain, folded by the daemon's timeline service

widget: timeline
sources:
  default:
    ref: service:ui/ryeos-ui/timeline/thread
    params:
      chain_root_id: "@facet:input.route.chain_root"
      limit: "200"
    collection: items
projections:
  expand:
    fields:
      - id
      - type
      - state
      - thread
      - slots.body
      - slots.detail
      - slots.reason
      - slots.tool
      - slots.target
refresh:
  on_hint: thread
