name: assistant-review-history
title: Decision history
version: "1.0.0"
description: Settled, expired, and stale hosted-worker approval decisions

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/work/approval-history
    params: { limit: 200, project: current }
    collection: history

projections:
  columns:
    - { label: operation, field: operation_class, present: words }
    - { label: decision, field: decision, fallback: none, present: words }
    - { label: state, field: state, present: words }
    - { label: resolved, field: resolved_at_ms }
  expand:
    fields: [chain_root_id, placement_thread_id, approval_id, worker_boot_epoch, request_digest, requested_authority, decision_principal, created_at_ms, delivery_settled_at_ms]
  tone:
    field: state
    map: { delivery_settled: good, expired: warn, stale_epoch: neutral }
    default: neutral

selection:
  activate: inspect_work
affordances:
  - id: inspect_work
    label: Open work
    producer: selection
    invoke:
      plane: ui
      facet: input.route
      merge:
        thread: "{record.placement_thread_id}"
        chain_root: "{record.chain_root_id}"
      open_view: view:ryeos/work/overview
      drill: true

refresh:
  on_hint: [thread, activity]
