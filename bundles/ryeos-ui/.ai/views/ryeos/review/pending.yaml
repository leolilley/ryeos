name: assistant-review
title: Review
version: "1.0.0"
description: The principal's attention queue, every item that needs the operator in one shape

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/work/attention
    params: { limit: 200, project: current }
    collection: attention

projections:
  columns:
    - { label: kind, field: kind, present: words }
    - { label: item, field: title }
    - { label: detail, field: detail.summary, present: words }
    - { label: state, field: state, present: words }
    - { label: expires, field: expires_at_ms }
  expand:
    fields: [subject.chain_root_id, subject.thread_id, since_ms, detail, actions]
  tone:
    field: tone
    map: { warn: warn, danger: danger }
    default: neutral

affordances:
  - id: inspect_work
    label: Open work
    category: Open
    producer: selection
    visible_when: { field: actions.open, equals: true }
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.subject.thread_id}"
          chain_root: "{record.subject.chain_root_id}"
      open_view: view:ryeos/work/overview
      drill: true
  - id: accept
    label: Approve
    category: Decide
    producer: selection
    visible_when:
      all:
        - { field: kind, equals: approval }
        - { field: state, equals: pending }
    enabled_when: { field: actions.accept, equals: true }
    disabled_reason: This approval request cannot be accepted; decline it or inspect its authority.
    invoke:
      plane: rye
      ref: service:worker-executions/resolve-approval
      args:
        chain_root_id: "{record.subject.chain_root_id}"
        approval_id: "{record.detail.approval_id}"
        request_digest: "{record.detail.request_digest}"
        accept: true
      notice: Approval accepted
  - id: decline
    label: Decline
    category: Decide
    producer: selection
    visible_when:
      all:
        - { field: kind, equals: approval }
        - { field: state, equals: pending }
    enabled_when: { field: actions.decline, equals: true }
    invoke:
      plane: rye
      ref: service:worker-executions/resolve-approval
      args:
        chain_root_id: "{record.subject.chain_root_id}"
        approval_id: "{record.detail.approval_id}"
        request_digest: "{record.detail.request_digest}"
        accept: false
      notice: Approval declined
  - id: acknowledge
    label: Acknowledge
    category: Triage
    producer: selection
    visible_when: { field: actions.acknowledge, equals: true }
    invoke:
      plane: rye
      ref: service:ui/ryeos-ui/work/acknowledge
      args:
        item_id: "{record.id}"
      notice: Acknowledged. It returns if it has new activity.

refresh:
  on_hint: [thread, activity]
  after_invoke: true
