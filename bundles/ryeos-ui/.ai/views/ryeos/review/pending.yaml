name: assistant-review
title: Review
version: "1.0.0"
description: Exact principal-scoped attention awaiting an operator decision

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/work/attention
    params: { limit: 200, project: current }
    collection: attention

projections:
  columns:
    - { label: kind, field: kind, present: words }
    - { label: operation, field: operation_class, present: words }
    - { label: state, field: state, present: words }
    - { label: expires, field: expires_at_ms }
  expand:
    fields: [chain_root_id, placement_thread_id, approval_id, worker_boot_epoch, request_digest, requested_authority, created_at_ms]
  tone:
    field: state
    map: { pending: warn }
    default: neutral

affordances:
  - id: inspect_work
    label: Open work
    producer: selection
    invoke:
      plane: ui
      facet: input.route
      merge:
        thread: "{record.placement_thread_id}"
        chain_root: "{record.chain_root_id}"
      open_view: view:ryeos/work/overview
      drill: true
  - id: accept
    label: Approve
    producer: selection
    visible_when:
      all:
        - { field: kind, equals: worker_approval }
        - { field: state, equals: pending }
    enabled_when: { field: requested_authority.accept_allowed, equals: true }
    disabled_reason: This approval request cannot be accepted; decline it or inspect its authority.
    invoke:
      plane: rye
      ref: service:worker-executions/resolve-approval
      args:
        chain_root_id: "{record.chain_root_id}"
        approval_id: "{record.approval_id}"
        request_digest: "{record.request_digest}"
        accept: true
      notice: Approval accepted
  - id: decline
    label: Decline
    producer: selection
    visible_when:
      all:
        - { field: kind, equals: worker_approval }
        - { field: state, equals: pending }
    invoke:
      plane: rye
      ref: service:worker-executions/resolve-approval
      args:
        chain_root_id: "{record.chain_root_id}"
        approval_id: "{record.approval_id}"
        request_digest: "{record.request_digest}"
        accept: false
      notice: Approval declined

refresh:
  on_hint: [thread, activity]
