# ryeos:signed:2026-09-14T10:03:09Z:b2ff585b07afa2eecec8f4b81eefae104f98122e9f9537814467cfffce633372:rT2/lnwXNTAJQ45S1MSO9ctnbRREA9Xvie4yEpj++F1GAq5Cv8/6BjH65ZlkYml7b2OQ1ogE2rOfIiWYyA3TBQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: items-space
title: Item Space
version: "1.0.0"
description: The item space - signed content across system, user, and project

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/items/list
    params:
      limit: 500
      project_path: "@session:project_root"
    collection: items
    requires_project: true
projections:
  columns:
    - label: item
      field: canonical_ref
    - label: kind
      field: item_kind
    - label: space
      field: space
    - label: trust
      field: trust.class
  tone:
    field: trust.class
    map:
      trusted: good
      untrusted: danger
      unsigned: warn
      unknown: neutral
    default: neutral
selection:
  activate: inspect
affordances:
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
  # Explain swaps the center lens to the item's "why" read: write the selected
  # item FIRST (the explain sources read @facet:selection.item), then open the
  # lens — the open_view ordering guarantees the facet is set before the new
  # lens fetches service:items/effective.
  - id: explain
    label: Explain
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/explain
