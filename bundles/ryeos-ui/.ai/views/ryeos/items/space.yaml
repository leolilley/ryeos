# ryeos:signed:2026-11-19T05:58:46Z:3fa87cf8339647c5a00162a4a6afd5d776ae828cdbecd9a0ae27c0f1fbd1b304:zroEMZAjUOBB3Icn/4LR/HXyo8NsuAuqMZtbqnR42VgEIfuE+DpHNRYuppn2wRW1oMgGFUVcb/hXfjMI4TpHBA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: items-space
title: Item Space
version: "1.0.0"
description: Content visible to the admitted attachment, including its project only when present

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/items/list
    params:
      limit: 500
    collection: items
    coverage: coverage
projections:
  columns:
    - label: item
      field: canonical_ref
      role: ref
    - label: kind
      field: item_kind
      role: kind
    - label: space
      field: space
    - label: trust
      field: trust.class
  tone:
    field: trust.class
    map:
      trusted: good
      untrusted: danger
      unsigned: warn
      unknown: neutral
    default: neutral
selection:
  activate: inspect
affordances:
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/inspector
      drill: true
  # Explain swaps the center lens to the item's "why" read: write the selected
  # item FIRST (the explain sources read @facet:selection.item), then open the
  # lens — the open_view ordering guarantees the facet is set before the new
  # lens fetches service:items/effective.
  - id: explain
    label: Explain
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/explain
