# ryeos:signed:2026-08-04T10:21:25Z:9e6e2e7e30bc37ce94771543b6fcfb44126bb4aecd5b2a5e274e77e276e7b80e:OFGaO0dXiD3g12onk5e5hdIWXslE3KmqBfg3mSvJpbEdlwAG8uKdrzaT8Yj8+rsJgc+DTKdNq5ishqluLSDvBw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: items-space
title: Item Space
version: "1.0.0"
description: The item space - signed content across system, user, and project

widget: table
sources:
  default:
    ref: service:ui/ryeos-ui/items/list
    params:
      limit: 500
      project_path: ""
    collection: items
projections:
  columns:
    - label: item
      field: canonical_ref
    - label: kind
      field: item_kind
    - label: space
      field: space
    - label: trust
      field: trust.class
  tone:
    field: trust.class
    map:
      trusted: good
      untrusted: danger
      unsigned: warn
      unknown: neutral
    default: neutral
selection:
  activate: inspect
affordances:
  - id: inspect
    label: Inspect
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
  # Explain swaps the center lens to the item's "why" read: write the selected
  # item FIRST (the explain sources read @facet:selection.item), then open the
  # lens — the open_view ordering guarantees the facet is set before the new
  # lens fetches service:items/effective.
  - id: explain
    label: Explain
    invoke:
      plane: ui
      facet: selection
      value:
        item: "{record.canonical_ref}"
      open_view: view:ryeos/item/explain
