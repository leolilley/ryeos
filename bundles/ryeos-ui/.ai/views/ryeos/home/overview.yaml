# ryeos:signed:2026-11-17T06:37:39Z:937600ef21475101ee8e1dd60459f1c0bf912bbccafd7e9306bfeafeb710a90b:YrlJ0+JPI25AC9OBRlgFVxaDgu659jKZeqGCOoxhmhJlEpzSc+N8IYZ+qTi0LK1UnPrJitq5GjQ8KhyH+s5pAg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: assistant-home
title: Home
version: "1.0.0"
description: Current node activity and projects from existing authoritative read services

widget: sections
sources:
  active:
    ref: service:ui/ryeos-ui/threads/list
    params: { active: true, limit: 20, sort: watch }
    collection: threads
  movement:
    ref: service:ui/ryeos-ui/node/activity
    params:
      event_limit: 30
      exclude_types: ["seat.facet", "thread_usage", "cognition_out", "cognition_frame", "cognition_compaction"]
    collection: events
  attention:
    ref: service:ui/ryeos-ui/work/attention
    params: { limit: 20, project: current }
    collection: attention
  projects:
    ref: service:projects/list
    collection: projects
affordances:
  - id: watch-thread
    label: Inspect execution
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
      drill: true
  - id: open-attention
    label: Open work
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.subject.thread_id}"
          chain_root: "{record.subject.chain_root_id}"
      open_view: view:ryeos/work/overview
      drill: true
sections:
  - title: Needs attention
    source_channel: attention
    collection: attention
    projection:
      primary: title
      meta: detail.summary
      tone:
        field: tone
        map: { warn: warn, danger: danger }
        default: neutral
    activate: open-attention
  - title: Active executions
    source_channel: active
    collection: threads
    projection:
      primary: item_ref
      meta: status
    activate: watch-thread
  - title: Activity coverage
    source_channel: active
    collection: coverage
    projection:
      primary: state
      meta: reason
  - title: Recent movement
    source_channel: movement
    collection: events
    projection:
      identity: event_hash
      primary: event_type
      meta: thread_id
  - title: Projects
    source_channel: projects
    collection: projects
    projection:
      primary: name
      meta: root
  - title: Recent movement coverage
    source_channel: movement
    collection: events_coverage
    projection:
      primary: state
      meta: reason
      tone:
        field: state
        map:
          failed: danger
          partial: warn
        default: neutral
refresh:
  on_hint: [thread, activity, project]
