# ryeos:signed:2026-09-15T00:05:35Z:edcaf0872c5df636c78597ac4bdb2f079abb2ca22c192bf138c77515034cd182:4rFjhZWcdULpJ41sD+Q4dl8DZSAvkOVW9ehseK7mMcz8H5Xvz45X0vZ2sF0Ql3D0oP/DC61WqRBDrvrrg7mUAQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: assistant-home
title: Home
version: "1.0.0"
description: Current node activity and projects from existing authoritative read services

widget: sections
sources:
  active:
    ref: service:ui/ryeos-ui/threads/list
    params: { active: true, limit: 20, sort: watch }
    collection: threads
  movement:
    ref: service:ui/ryeos-ui/node/activity
    params:
      event_limit: 30
      exclude_types: ["seat.facet", "thread_usage", "cognition_out"]
    collection: events
  projects:
    ref: service:projects/list
    collection: projects
affordances:
  - id: watch-thread
    label: Watch thread
    invoke:
      plane: ui
      facet: input.route
      merge:
        thread: "{record.thread_id}"
        chain_root: "{record.chain_root_id}"
      open_view: view:ryeos/thread/transcript
      drill: true
sections:
  - title: Active executions
    source_channel: active
    collection: threads
    projection:
      primary: item_ref
      meta: status
    activate: watch-thread
  - title: Recent movement
    source_channel: movement
    collection: events
    projection:
      primary: event_type
      meta: thread_id
  - title: Projects
    source_channel: projects
    collection: projects
    projection:
      primary: name
      meta: root
refresh:
  on_hint: [thread, activity, project]
