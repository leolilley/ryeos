# ryeos:signed:2026-09-15T00:36:58Z:2dd793ae9b275f4d8d6f42ddae3c1f067418f9232d1ec19687410b310c699f42:saGIYROSUWMRFZJAJCZ4Wa4Qaj0CJrRKFqv4qvIRBj5eQSG5NyN3Ap2WC1X/SzMfW/yt0JU7pH+/dbhBoMosBA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: assistant-home
title: Home
version: "1.0.0"
description: Current node activity and projects from existing authoritative read services

widget: sections
sources:
  active:
    ref: service:ui/ryeos-ui/threads/list
    params: { active: true, limit: 20, sort: watch }
    collection: threads
  movement:
    ref: service:ui/ryeos-ui/node/activity
    params:
      event_limit: 30
      exclude_types: ["seat.facet", "thread_usage", "cognition_out"]
    collection: events
  attention:
    ref: service:ui/ryeos-ui/work/attention
    params: { limit: 20, project: current }
    collection: attention
  projects:
    ref: service:projects/list
    collection: projects
affordances:
  - id: watch-thread
    label: Watch thread
    invoke:
      plane: ui
      facet: input.route
      merge:
        thread: "{record.thread_id}"
        chain_root: "{record.chain_root_id}"
      open_view: view:ryeos/thread/transcript
      drill: true
  - id: review-attention
    label: Review request
    invoke:
      plane: ui
      facet: input.route
      merge:
        thread: "{record.placement_thread_id}"
        chain_root: "{record.chain_root_id}"
      open_view: view:ryeos/work/approvals
      drill: true
sections:
  - title: Needs attention
    source_channel: attention
    collection: attention
    projection:
      primary: operation_class
      meta: state
      tone:
        field: state
        map: { pending: warn }
        default: neutral
    activate: review-attention
  - title: Active executions
    source_channel: active
    collection: threads
    projection:
      primary: item_ref
      meta: status
    activate: watch-thread
  - title: Recent movement
    source_channel: movement
    collection: events
    projection:
      primary: event_type
      meta: thread_id
  - title: Projects
    source_channel: projects
    collection: projects
    projection:
      primary: name
      meta: root
refresh:
  on_hint: [thread, activity, project]
