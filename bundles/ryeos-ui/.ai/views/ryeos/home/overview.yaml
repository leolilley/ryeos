# ryeos:signed:2026-10-19T22:29:40Z:9246c8c03b3e2f03463e69697dd750d05c4b788140059c4ba9f54211419c8dc6:e5ipDEuKzdfcuW3n5kBtkuoo1c0mdXqmbFpu5KBLLgWqwrViuVtev4vqWAqkTojO/lH17w+QARnod7QJscJsBA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: assistant-home
title: Home
version: "1.0.0"
description: Current node activity and projects from existing authoritative read services

widget: sections
sources:
  active:
    ref: service:ui/ryeos-ui/threads/list
    params: { active: true, limit: 20, sort: watch }
    collection: threads
  movement:
    ref: service:ui/ryeos-ui/node/activity
    params:
      event_limit: 30
      exclude_types: ["seat.facet", "thread_usage", "cognition_out"]
    collection: events
  attention:
    ref: service:ui/ryeos-ui/work/attention
    params: { limit: 20, project: current }
    collection: attention
  projects:
    ref: service:projects/list
    collection: projects
affordances:
  - id: watch-thread
    label: Inspect execution
    invoke:
      plane: ui
      facet: selection
      value:
        thread_id: "{record.thread_id}"
      open_view: view:ryeos/threads/detail
      drill: true
  - id: review-attention
    label: Review request
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement_thread_id}"
          chain_root: "{record.chain_root_id}"
      open_view: view:ryeos/work/approvals
      drill: true
  - id: review-candidate
    label: Review candidate
    invoke:
      plane: ui
      facet: selection
      merge:
        work:
          thread: "{record.placement_thread_id}"
          chain_root: "{record.chain_root_id}"
      open_view: view:ryeos/work/candidate
      drill: true
sections:
  - title: Needs attention
    source_channel: attention
    collection: attention
    projection:
      primary: operation_class
      meta: state
      tone:
        field: state
        map: { pending: warn }
        default: neutral
    activate: review-attention
  - title: Active executions
    source_channel: active
    collection: threads
    projection:
      primary: item_ref
      meta: status
    activate: watch-thread
  - title: Activity coverage
    source_channel: active
    collection: coverage
    projection:
      primary: state
      meta: reason
  - title: Candidates to review
    source_channel: attention
    collection: candidates
    projection:
      primary: candidate_snapshot_hash
      meta: publication_result
      tone:
        field: publication_result
        map: { retained: warn, retained_for_review: warn }
        default: neutral
    activate: review-candidate
  - title: Recent movement
    source_channel: movement
    collection: events
    projection:
      identity: event_hash
      primary: event_type
      meta: thread_id
  - title: Projects
    source_channel: projects
    collection: projects
    projection:
      primary: name
      meta: root
  - title: Recent movement coverage
    source_channel: movement
    collection: events_coverage
    projection:
      primary: state
      meta: reason
      tone:
        field: state
        map:
          failed: danger
          partial: warn
        default: neutral
refresh:
  on_hint: [thread, activity, project]
