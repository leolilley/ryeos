# ryeos:signed:2026-11-16T07:56:53Z:bcb75690df67ebe9a7c2690f36b60e5224ecdfd96c16bef05770d87bef711075:2I9T3JzGJow46NQboKH0rnmrq37+0g+C2U2Y7BEHBlRbzvSUtL4R37pzj0rEQgQ8vK8xH4YOi3voWW/6MkUpAg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: thread-transcript
title: Activity
version: "1.0.0"
description: >-
  Coherent activity feed for the input route's durable work chain: operator
  intent, cognition, operations, children and outcomes, folded by the daemon's
  timeline service from the chain's events.

widget: timeline
sources:
  default:
    ref: service:ui/ryeos-ui/timeline/thread
    params:
      chain_root_id: "@facet:input.route.chain_root"
      limit: "200"
    collection: items
projections:
  expand:
    fields:
      - id
      - type
      - state
      - thread
      - slots.body
      - slots.detail
      - slots.reason
      - slots.tool
      - slots.target
refresh:
  on_hint: thread
