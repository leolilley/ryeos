# ryeos:signed:2026-11-16T20:59:24Z:7f964d5e784e89aaeed0a2026a712ab9f9ef7559faaac945016f49943e4274ab:5a91+zUEBzB3oPYVhOy/VjqpDTYbxFpwIrgb/dN+qIM/pEuxnAAGTuHnSHDfth5b/+EwQMQvxXez12AIVQYlDQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: thread-transcript
title: Activity
version: "1.0.0"
description: >-
  Coherent activity feed for the input route's durable work chain: operator
  intent, cognition, operations, children and outcomes, folded by the daemon's
  timeline service from the chain's events.

widget: timeline
sources:
  default:
    ref: service:ui/ryeos-ui/timeline/thread
    params:
      chain_root_id: "@facet:input.route.chain_root"
      limit: "@facet:timeline.window.limit|200"
    collection: items
projections:
  expand:
    fields:
      - id
      - type
      - state
      - thread
      - slots.body
      - slots.detail
      - slots.reason
      - slots.tool
      - slots.target
# Activating the "N older" line widens the window: the service names the wider
# limit and the affordance writes it to the facet the source reads.
selection:
  activate: older
affordances:
  - id: older
    label: Load older
    invoke:
      plane: ui
      facet: timeline.window
      value:
        limit: "{record.next_limit}"
refresh:
  on_hint: thread
