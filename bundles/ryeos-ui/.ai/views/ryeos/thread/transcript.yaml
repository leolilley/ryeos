# ryeos:signed:2026-11-16T21:15:27Z:5149b8a5a6750acbcd928dd62d04467cc2d4df237106a08ec2530737a2c15d0c:blq8y5XWOy8CBir9UthMtbNLNdhbCoiGIY6CkEUW9MiUFjAo/g3HsaemyyMEaOOML09CAwD/hbadXCiWp6UGBg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: thread-transcript
title: Activity
version: "1.0.0"
description: >-
  Coherent activity feed for the input route's durable work chain: operator
  intent, cognition, operations, children and outcomes, folded by the daemon's
  timeline service from the chain's events.

widget: timeline
sources:
  default:
    ref: service:ui/ryeos-ui/timeline/thread
    params:
      chain_root_id: "@facet:input.route.chain_root"
      limit: "200"
    collection: items
  raw:
    ref: service:ui/ryeos-ui/timeline/raw
    role: timeline_raw
    params:
      chain_root_id: "@facet:input.route.chain_root"
      from_chain_seq: ""
      to_chain_seq: ""
    dynamic_parameters: [from_chain_seq, to_chain_seq]
    activation: on_demand
    refresh: {}
projections:
  expand:
    fields:
      - id
      - type
      - state
      - thread
      - slots.body
      - slots.detail
      - slots.reason
      - slots.tool
      - slots.target
refresh:
  on_hint: thread
