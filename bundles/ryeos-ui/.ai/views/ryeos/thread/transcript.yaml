# ryeos:signed:2026-11-16T21:18:55Z:9acea084fd3111e5feec5fd60e20de53e248de543b1b3e5f53ee7e47e41ace74:D2rT7rmx7E8Ol6z+A10Vp4th3UhtcFmeutBiA0laGMh8A7vAOb8Apjad8gSjKaiR20xpl1b+hZDRUCRCQg8tDw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: thread-transcript
title: Activity
version: "1.0.0"
description: >-
  Coherent activity feed for the input route's durable work chain: operator
  intent, cognition, operations, children and outcomes, folded by the daemon's
  timeline service from the chain's events.

widget: timeline
sources:
  default:
    ref: service:ui/ryeos-ui/timeline/thread
    params:
      chain_root_id: "@facet:input.route.chain_root"
      limit: "200"
    collection: items
    dynamic_parameters: [since_chain_seq]
projections:
  expand:
    fields:
      - id
      - type
      - state
      - thread
      - slots.body
      - slots.detail
      - slots.reason
      - slots.tool
      - slots.target
refresh:
  on_hint: thread
