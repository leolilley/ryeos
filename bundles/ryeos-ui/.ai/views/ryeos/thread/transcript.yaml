# ryeos:signed:2026-11-17T04:34:06Z:780739aa81315478568cd50e9387f99771881a245b19e3f730577b7ea20a3160:kJxhB36B2lHaEnXYDhiBDgt2WSGzim41Bw9vlJD56fN0yURhWUoAuB8nJHb5teEjnHfOWWCmUuFSjtW5MibzCA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: thread-transcript
title: Activity
version: "1.0.0"
description: >-
  Coherent activity feed for the input route's durable work chain: operator
  intent, cognition, operations, children and outcomes, folded by the daemon's
  timeline service from the chain's events.

widget: timeline
sources:
  default:
    ref: service:ui/ryeos-ui/timeline/thread
    params:
      chain_root_id: "@facet:input.route.chain_root"
      limit: "@facet:timeline.window.limit|200"
    collection: items
    dynamic_parameters: [since_chain_seq]
projections:
  expand:
    fields:
      - id
      - type
      - state
      - thread
      - slots.body
      - slots.detail
      - slots.reason
      - slots.tool
      - slots.target
# Activating the "N older" line widens the window: the service names the wider
# limit and the affordance writes it to the facet the source reads.
selection:
  activate: older
affordances:
  - id: older
    label: Load older
    invoke:
      plane: ui
      facet: timeline.window
      value:
        limit: "{record.next_limit}"
refresh:
  on_hint: thread
