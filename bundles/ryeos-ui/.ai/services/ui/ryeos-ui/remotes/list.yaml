kind: service
name: ryeos-ui/remotes/list
version: "1.0.0"
description: List configured remotes for the active RyeOS UI project session.
endpoint: ui.ryeos.remotes.list
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /remotes/*/name
    - /remotes/*/pin_source
    - /remotes/*/pinned_at
    - /invalid_remotes/*/name
    - /invalid_remotes/*/code
  free_text:
    - /remotes/*/url
    - /remotes/*/principal_id
    - /remotes/*/config_path
    - /remotes/*/project_bindings
    - /invalid_remotes/*/config_path
    - /invalid_remotes/*/url
    - /invalid_remotes/*/error
    - /invalid_remotes/*/repair_hint
