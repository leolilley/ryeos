kind: service
name: ryeos-ui/node/machines
version: "1.0.0"
description: >-
  The node's locality groups as flat rows: one row per group and one per
  member beneath it, with the wording from the signed machines config. It
  shows only what service:node/locality/groups shows its caller.
endpoint: ui.ryeos.node.machines
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
required_caps:
  - ryeos.execute.service.node/locality/groups
disclosure:
  principal:
    - /schema
    - /as_of
    - /rows/*/id
    - /rows/*/parent
    - /rows/*/kind
    - /rows/*/node_id
    - /rows/*/member_kind
    - /rows/*/answer
    - /rows/*/status
    - /rows/*/state
    - /rows/*/state_text
    - /rows/*/place
    - /rows/*/as_of
    - /rows/*/declared
    - /rows/*/disagrees
    - /rows/*/this_computer
    - /rows/*/reason
    - /rows/*/code
    - /rows/*/facts/*/grade
    - /rows/*/facts/*/reason
  free_text:
    - /rows/*/disagreeing
    - /rows/*/declared_missing
    - /rows/*/facts/*/shared_with
    - /rows/*/facts/*/shared_with_names
  interim_free_text:
    - /rows/*/name  # removed by: m4
    - /rows/*/label  # removed by: m4
    - /rows/*/relations_text  # removed by: m4
    - /rows/*/disagreeing_text  # removed by: m4
    - /rows/*/missing_text  # removed by: m4
    - /rows/*/facts_text  # removed by: m4
    - /rows/*/facts/*/text  # removed by: m4
