# ryeos:signed:2026-11-24T11:14:52Z:b5f310a2f8009270f1c9fdf1576a5a9e29ff00289cdf4acbd553d8e54bcb90b8:4ehQRlSWzeJ60Gn/u20oFv17N6pr7Szke66noqzRcoEOhFn7ikne8Q62vl+t1BybyhCvGSs0OkwU8enbmhy9Ag==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
name: ryeos-ui/node/machines
version: "1.0.0"
description: >-
  The node's locality groups as flat rows: one row per group and one per
  member beneath it, with the wording from the signed machines config. It
  shows only what service:node/locality/groups shows its caller.
endpoint: ui.ryeos.node.machines
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
required_caps:
  - ryeos.execute.service.node/locality/groups
disclosure:
  principal:
    - /schema
    - /as_of
    - /rows/*/id
    - /rows/*/parent
    - /rows/*/kind
    - /rows/*/node_id
    - /rows/*/member_kind
    - /rows/*/answer
    - /rows/*/status
    - /rows/*/state
    - /rows/*/state_text
    - /rows/*/place
    - /rows/*/as_of
    - /rows/*/declared
    - /rows/*/disagrees
    - /rows/*/this_computer
    - /rows/*/reason
    - /rows/*/code
    - /rows/*/facts/*/grade
    - /rows/*/facts/*/reason
  free_text:
    - /rows/*/name
    - /rows/*/label
    - /rows/*/disagreeing
    - /rows/*/declared_missing
    - /rows/*/relations_text
    - /rows/*/disagreeing_text
    - /rows/*/missing_text
    - /rows/*/facts_text
    - /rows/*/facts/*/text
    - /rows/*/facts/*/shared_with
    - /rows/*/facts/*/shared_with_names
