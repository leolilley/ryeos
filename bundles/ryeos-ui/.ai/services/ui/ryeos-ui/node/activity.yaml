kind: service
name: ryeos-ui/node/activity
version: "1.0.0"
description: >-
  Caller-authorized activity observations: bounded thread status counts and
  authenticated recent events with explicit coverage. Counts are not node-wide
  totals; scoped signed usage accounting is reported unavailable.
endpoint: ui.ryeos.node.activity
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /schema_version
    - /pulse/*/label
    - /pulse/*/value
    - /coverage/state
    - /coverage/reason
    - /pulse_coverage/state
    - /pulse_coverage/reason
    - /pulse_coverage/observed_threads
    - /pulse_coverage/thread_limit
    - /events_coverage/state
    - /events_coverage/reason
    - /usage/*/label
    - /usage/*/value
    - /usage_coverage/state
    - /usage_coverage/reason
  free_text:
    - /events
