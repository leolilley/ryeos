# ryeos:signed:2026-11-24T11:14:52Z:5813cc6513d92d8326fb8a4ea99dd302332ee4c251244ddbbaf58990294d1b00:wP6vu/QEFnm9By17Uf8yRQfrdskK7AJpczUIMRaIFjeZdJ4TA9A17evLrI8X12ed9vBmwyGPNzLhSlCnze2VBg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
name: ryeos-ui/node/usage
version: "1.0.0"
description: >-
  Settled token and spend usage for the executions visible to the caller,
  as totals and one row per chain. Totals cover the observed chains only,
  never node-wide spend.
endpoint: ui.ryeos.node.usage
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /schema_version
    - /totals/*/label
    - /totals/*/value
    - /chains/*/chain_root_id
    - /chains/*/item_ref
    - /chains/*/status
    - /chains/*/updated_at
    - /chains/*/summary
    - /chains/*/input_tokens
    - /chains/*/output_tokens
    - /chains/*/spend_usd
    - /chains/*/completed_turns
    - /chains/*/thread_count
    - /coverage/state
    - /coverage/reason
    - /coverage/observed_threads
