kind: service
name: ryeos-ui/projects/list
version: "1.0.0"
description: List the local per-principal RyeOS UI project registry.
endpoint: ui.ryeos.projects.list
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /version
    - /projects/*/local_id
    - /projects/*/added_at
    - /projects/*/exists
    - /projects/*/current
    - /projects/*/registered
  free_text:
    - /projects/*/name
    - /projects/*/root
    - /projects/*/tags
