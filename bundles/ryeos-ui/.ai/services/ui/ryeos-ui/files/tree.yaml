kind: service
name: ryeos-ui/files/tree
version: "1.0.0"
description: Bounded file-space tree snapshot for RyeOS UI — constrained to session project roots with traversal caps and built-in heavy-directory skips.
endpoint: ui.ryeos.files.tree
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
# Paths and names are interim exceptions: the file browser reads them for the seat's own project.
disclosure:
  principal:
    - /truncated
    - /entries/*/is_dir
    - /entries/*/size
    - /entries/*/modified
  interim_free_text:
    - /entries/*/path  # removed by: m4
    - /entries/*/name  # removed by: m4
  max_items: 3072
  max_result_bytes: 2097152
