kind: service
name: ryeos-ui/files/list
version: "1.0.0"
description: Safe scoped file listing for RyeOS UI — constrained to session project root or project .ai directory. No arbitrary path access.
endpoint: ui.ryeos.files.list
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - "/root"
    - "/truncated"
    - "/entries/*/is_dir"
    - "/entries/*/size"
    - "/coverage/exhausted"
    - "/coverage/work_used"
    - "/coverage/max_work"
    - "/coverage/directory/coverage"
    - "/coverage/directory/names_read"
    - "/coverage/directory/reported"
    - "/coverage/directory/excluded"
    - "/coverage/directory/vanished"
    - "/coverage/directory/failed_entries"
    - "/coverage/directory/changed"
  free_text:
    - "/path"
    - "/entries/*/name"
    - "/coverage/directory/failure"
  max_items: 2048
  max_result_bytes: 1048576
