kind: service
required_caps: ["ryeos.execute.service.ui/ryeos-ui/surfaces/resume"]
name: ryeos-ui/surfaces/resume
version: "1.0.0"
description: Resume one principal-owned saved Surface with its explicit authored origin and all ordered particular tabs under fresh admission.
endpoint: ui.ryeos.surfaces.resume
availability: daemon_only
ui_dispatch: session_local
ui_result_effect: resume_particular_surface
schema:
  id: string
  expected_revision: integer
  view_set_expected_revision: integer
  creation_request_id: string
