kind: service
name: ryeos-ui/dimension/get
version: "1.0.0"
description: Returns the RyeOS UI Dimension projection — node identity, health, spaces, bundles, remotes, threads, schedules, and GC state.
endpoint: ui.ryeos.dimension.get
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - "/schema_version"
    - "/generated_at"
    - "/session/session_id"
    - "/session/surface_ref"
    - "/session/binding_digest"
    - "/session/posture"
    - "/local_node/identity/principal_id"
    - "/local_node/identity/fingerprint"
    - "/local_node/health/status"
    - "/threads/active_count"
    - "/schedules/total"
    - "/schedules/enabled"
    - "/gc/running"
  free_text:
    - "/session/user_principal_id"
    - "/local_node/status"
    - "/local_node/spaces"
    - "/local_node/bundles"
    - "/project"
    - "/remotes"
    - "/gc/recent_events"
