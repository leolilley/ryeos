kind: service
required_caps: ["ryeos.execute.service.ui/ryeos-ui/view-sets/resume"]
name: ryeos-ui/view-sets/resume
version: "1.0.0"
description: Re-resolve and resume one durable particular view set without restoring session authority.
endpoint: ui.ryeos.view-sets.resume
availability: daemon_only
ui_dispatch: session_local
ui_result_effect: resume_particular_view_set
schema:
  id: string
  expected_revision: integer
  surface_ref: string
