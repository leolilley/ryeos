kind: service
name: ryeos-ui/work/attention
version: "1.0.0"
description: Bounded principal/project attention items backed by exact domain projections.
endpoint: ui.ryeos.work.attention
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /schema_version
    - /attention/*/schema_version
    - /attention/*/id
    - /attention/*/kind
    - /attention/*/subject
    - /attention/*/title
    - /attention/*/tone
    - /attention/*/state
    - /attention/*/since_ms
    - /attention/*/expires_at_ms
    - /attention/*/actions
    - /attention/*/detail/approval_id
    - /attention/*/detail/worker_boot_epoch
    - /attention/*/detail/request_digest
    - /attention/*/detail/operation_class
    - /attention/*/detail/candidate_snapshot_hash
    - /attention/*/detail/candidate_validation_hash
    - /attention/*/detail/candidate_evaluation_hash
    - /attention/*/detail/item_ref
    - /attention/*/detail/status
    - /counts/total
    - /counts/by_kind
    - /counts/chains
    - /counts/chains_truncated
    - /running/count
    - /running/label
    - /running/tone
    - /running/chains
    - /running/chains_truncated
    - /running/items/*/id
    - /running/items/*/title
    - /running/items/*/tone
    - /running/items/*/item_ref
    - /running/items/*/subject
    - /running/items/*/state
    - /running/items/*/since_ms
  interim_free_text:
    - /attention/*/project_root  # removed by: m4
    - /attention/*/detail/summary  # removed by: per-chain publication
    - /attention/*/detail/requested_authority  # removed by: per-chain publication
    - /attention/*/detail/publication_result  # removed by: per-chain publication
    - /attention/*/detail/project_root  # removed by: m4
    - /counts/by_project  # removed by: m4
    - /running/by_project  # removed by: m4
    - /running/items/*/project_root  # removed by: m4
