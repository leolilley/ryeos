kind: service
name: ryeos-ui/work/approval-history
version: "1.0.0"
description: Bounded principal/project history of terminal hosted-worker approval projections.
endpoint: ui.ryeos.work.approval-history
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /schema_version
    - /history/*/schema_version
    - /history/*/kind
    - /history/*/chain_root_id
    - /history/*/placement_thread_id
    - /history/*/approval_id
    - /history/*/worker_boot_epoch
    - /history/*/request_digest
    - /history/*/operation_class
    - /history/*/state
    - /history/*/decision
    - /history/*/created_at_ms
    - /history/*/resolved_at_ms
    - /history/*/delivery_settled_at_ms
  interim_free_text:
    - /history/*/requested_authority  # removed by: per-chain publication
    - /history/*/decision_principal  # removed by: per-chain publication
