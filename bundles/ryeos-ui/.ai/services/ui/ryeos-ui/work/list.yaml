kind: service
name: ryeos-ui/work/list
version: "1.0.0"
description: Principal-scoped logical work summaries grouped by durable chain root.
endpoint: ui.ryeos.work.list
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /schema_version
    - /work/*/schema_version
    - /work/*/coordinate
    - /work/*/item_ref
    - /work/*/kind
    - /work/*/placement
    - /work/*/phase
    - /work/*/observed_at
    - /work/*/placement_count
    - /work/*/attention
    - /work/*/attention_count
    - /next_cursor
  free_text:
    - /work/*/owner_principal_id
    - /work/*/project
