kind: service
name: ryeos-ui/schedules/list
version: "1.0.0"
description: Schedule listing for RyeOS UI — returns schedules with last-fire and fire-count data.
endpoint: ui.ryeos.schedules.list
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /schedules/*/schedule_id
    - /schedules/*/item_ref
    - /schedules/*/schedule_type
    - /schedules/*/expression
    - /schedules/*/timezone
    - /schedules/*/enabled
    - /schedules/*/last_fire_at
    - /schedules/*/last_fire_status
    - /schedules/*/total_fires
  free_text:
    - /schedules/*/signer_fingerprint
