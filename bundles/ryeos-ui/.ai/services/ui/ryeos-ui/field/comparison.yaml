# ryeos:signed:2026-11-24T11:27:27Z:ba908ef0e61b37c26658291a356d2fd93ab30bdc9644fd182c0501a026de0653:tXCrIO+vvpeOEmi/25w1VtLrGyvnP5IgUXx1LQRzYwwsQVT+hqp0sryYnU2PiYEO0zdQ8YqIv3c0Jr1LMXz7AA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
name: ryeos-ui/field/comparison
version: "1.0.0"
description: Returns bounded exact-definition, execution-realization, and run-cost comparison facts for two authorized threads.
endpoint: ui.ryeos.field.comparison
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - "/schema_version"
    - "/source"
    - "/subject"
    - "/revision"
    - "/cursor"
    - "/replay"
    - "/truncated"
    - "/expansions"
    - "/entities/*/id"
    - "/entities/*/kind"
    - "/entities/*/label"
    - "/entities/*/parent_id"
    - "/entities/*/status"
    - "/entities/*/canonical_ref"
    - "/entities/*/source_content_digest"
    - "/entities/*/effective_definition_digest"
    - "/entities/*/admitted_launch_capsule_hash"
    - "/entities/*/event_ref"
    - "/entities/*/artifact_ref"
    - "/entities/*/provenance"
    - "/relations/*/id"
    - "/relations/*/kind"
    - "/relations/*/source_id"
    - "/relations/*/target_id"
    - "/relations/*/status"
    - "/relations/*/directed"
    - "/relations/*/provenance"
  interim_free_text:
    - "/entities/*/attributes"  # removed by: per-chain publication
    - "/relations/*/attributes"  # removed by: per-chain publication
    - "/previews"  # removed by: per-chain publication
    - "/metrics"  # removed by: per-chain publication
    - "/warnings"  # removed by: per-chain publication
  max_items: 1024
  max_result_bytes: 2097152
