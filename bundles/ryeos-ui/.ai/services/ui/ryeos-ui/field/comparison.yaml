    - "/cursor"
    - "/replay"
    - "/truncated"
    - "/expansions"
    - "/entities/*/id"
    - "/entities/*/kind"
    - "/entities/*/label"
    - "/entities/*/parent_id"
    - "/entities/*/status"
    - "/entities/*/canonical_ref"
    - "/entities/*/source_content_digest"
    - "/entities/*/effective_definition_digest"
    - "/entities/*/admitted_launch_capsule_hash"
    - "/entities/*/event_ref"
    - "/entities/*/artifact_ref"
    - "/entities/*/provenance"
    - "/relations/*/id"
    - "/relations/*/kind"
    - "/relations/*/source_id"
    - "/relations/*/target_id"
    - "/relations/*/status"
    - "/relations/*/directed"
    - "/relations/*/provenance"
  free_text:
