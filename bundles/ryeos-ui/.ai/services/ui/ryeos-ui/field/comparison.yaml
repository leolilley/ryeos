kind: service
name: ryeos-ui/field/comparison
version: "1.0.0"
description: Returns bounded exact-definition, execution-realization, and run-cost comparison facts for two authorized threads.
endpoint: ui.ryeos.field.comparison
ui_read_only: true
state_access: read_only_existing
