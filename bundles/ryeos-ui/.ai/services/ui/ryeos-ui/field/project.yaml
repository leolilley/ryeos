kind: service
name: ryeos-ui/field/project
version: "1.0.0"
description: Returns bounded signed-item and graph-definition facts for the admitted UI project.
endpoint: ui.ryeos.field.project
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - "/schema_version"
    - "/source"
    - "/subject"
    - "/revision"
    - "/cursor"
    - "/replay"
    - "/truncated"
    - "/expansions"
    - "/entities/*/id"
    - "/entities/*/kind"
    - "/entities/*/label"
    - "/entities/*/parent_id"
    - "/entities/*/status"
    - "/entities/*/canonical_ref"
    - "/entities/*/source_content_digest"
    - "/entities/*/effective_definition_digest"
    - "/entities/*/admitted_launch_capsule_hash"
    - "/entities/*/event_ref"
    - "/entities/*/artifact_ref"
    - "/entities/*/provenance"
    - "/relations/*/id"
    - "/relations/*/kind"
    - "/relations/*/source_id"
    - "/relations/*/target_id"
    - "/relations/*/status"
    - "/relations/*/directed"
    - "/relations/*/provenance"
  free_text:
    - "/entities/*/attributes"
    - "/relations/*/attributes"
    - "/previews"
    - "/metrics"
    - "/warnings"
  max_items: 12000
  max_result_bytes: 4194304
