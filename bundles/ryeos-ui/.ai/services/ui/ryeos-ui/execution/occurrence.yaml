kind: service
name: ryeos-ui/execution/occurrence
version: "1.0.0"
description: Bounded exact occurrence and directly connected retained evidence for an authorized execution thread.
endpoint: ui.ryeos.execution.occurrence
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - "/schema_version"
    - "/subject"
    - "/cursor"
    - "/occurrence/*/id"
    - "/occurrence/*/kind"
    - "/occurrence/*/label"
    - "/occurrence/*/parent_id"
    - "/occurrence/*/status"
    - "/occurrence/*/canonical_ref"
    - "/occurrence/*/source_content_digest"
    - "/occurrence/*/effective_definition_digest"
    - "/occurrence/*/admitted_launch_capsule_hash"
    - "/occurrence/*/event_ref"
    - "/occurrence/*/artifact_ref"
    - "/occurrence/*/provenance"
    - "/evidence/*/id"
    - "/evidence/*/kind"
    - "/evidence/*/label"
    - "/evidence/*/parent_id"
    - "/evidence/*/status"
    - "/evidence/*/canonical_ref"
    - "/evidence/*/source_content_digest"
    - "/evidence/*/effective_definition_digest"
    - "/evidence/*/admitted_launch_capsule_hash"
    - "/evidence/*/event_ref"
    - "/evidence/*/artifact_ref"
    - "/evidence/*/provenance"
    - "/relations/*/id"
    - "/relations/*/kind"
    - "/relations/*/source_id"
    - "/relations/*/target_id"
    - "/relations/*/status"
    - "/relations/*/directed"
    - "/relations/*/provenance"
    - "/coverage/*/state"
    - "/coverage/*/truncated"
    - "/coverage/*/warning_count"
  free_text:
    - "/occurrence/*/attributes"
    - "/relations/*/attributes"
  interim_free_text:
    - "/evidence/*/attributes"  # removed by: per-chain publication
    - "/coverage/*/warnings"  # removed by: per-chain publication
  max_items: 1024
  max_result_bytes: 2097152
