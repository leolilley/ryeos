kind: service
name: ryeos-ui/items/list
version: "1.0.0"
description: Enumerate real schema-backed RyeOS items across active spaces with filtering by kind, space, and query substring.
endpoint: ui.ryeos.items.list
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /schema_version
    - /counts/by_kind/*
    - /counts/by_space/*
    - /items/*/domain
    - /items/*/canonical_ref
    - /items/*/item_kind
    - /items/*/bare_id
    - /items/*/label
    - /items/*/title_source
    - /items/*/namespace
    - /items/*/space
    - /items/*/executable
    - /items/*/trust/class
  free_text:
    - /items/*/source_path
    - /items/*/trust/signer
    - /items/*/trust/reason
    - /items/*/shadowed
  interim_free_text:
    - /items/*/title  # removed by: m4
  max_items: 2048
  max_result_bytes: 2097152
