# ryeos:signed:2026-11-24T11:27:28Z:1d88a3dc3a8373e27067e47f79e693e0ae671ca2cde1f655a36aa25bc6eca4ee:dDzTivc92zmh9/0RSKqviilSg/0OtqFB9WcLQwRZ543gLvThwvkNewZ/nQt5FoSOom42f9J2iuF7L8TmQBTyDw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
name: ryeos-ui/timeline/raw
version: "1.0.0"
description: The raw durable events of one chain_seq range of an authorized chain, capped per call, behind a timeline item.
endpoint: ui.ryeos.timeline.raw
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /events/*/event_id
    - /events/*/event_hash
    - /events/*/chain_seq
    - /events/*/thread_id
    - /events/*/thread_seq
    - /events/*/event_type
    - /events/*/storage_class
    - /events/*/ts
    - /chain_root_id
    - /from_chain_seq
    - /to_chain_seq
    - /truncated
  interim_free_text:
    - /events/*/payload  # removed by: per-chain publication
    - /events/*/prev_chain_event_hash  # removed by: per-chain publication
    - /events/*/prev_thread_event_hash  # removed by: per-chain publication
  max_items: 256
  max_result_bytes: 1048576
