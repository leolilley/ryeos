# ryeos:signed:2026-11-25T06:59:45Z:0fe3a6f38802af1f663b21f7df6a03fd4f094e4fbd38d9909ecd462ad0d39722:wYfnlppk6d+xrSnxkFCBl1jVGz2CxhdBw7RsXNcpP0E2QNOaNg7KyrFAMfnYcNaLD+n67zK4qMSivuQ5fvPFAw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
name: ryeos-ui/timeline/raw
version: "1.0.0"
description: The raw durable events of one chain_seq range of an authorized chain, capped per call, behind a timeline item.
endpoint: ui.ryeos.timeline.raw
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /events/*/event_id
    - /events/*/event_hash
    - /events/*/chain_seq
    - /events/*/thread_id
    - /events/*/thread_seq
    - /events/*/event_type
    - /events/*/storage_class
    - /events/*/ts
    - /chain_root_id
    - /from_chain_seq
    - /to_chain_seq
    - /truncated
  interim_free_text:
    - /events/*/payload  # removed by: per-chain publication
    - /events/*/prev_chain_event_hash  # removed by: per-chain publication
    - /events/*/prev_thread_event_hash  # removed by: per-chain publication
  max_items: 4096
  max_result_bytes: 8388608
