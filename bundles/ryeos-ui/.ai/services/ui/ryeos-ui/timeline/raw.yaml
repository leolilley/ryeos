# ryeos:signed:2026-11-24T11:23:42Z:be182ab6101fa99260a9ecedb8caf825924d1c391bdc54e2b96e04fb94f04b92:bs+rfaIiB4KDzPrxJ8Pdq6uzaciJVwdcyqkBv5BvErFmJ1xB/hqEzfoDMmZxEptFJiTZy+HTvGSyHg9/Ah3VCQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
name: ryeos-ui/timeline/raw
version: "1.0.0"
description: The raw durable events of one chain_seq range of an authorized chain, capped per call, behind a timeline item.
endpoint: ui.ryeos.timeline.raw
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /events/*/event_id
    - /events/*/event_hash
    - /events/*/chain_seq
    - /events/*/thread_id
    - /events/*/thread_seq
    - /events/*/event_type
    - /events/*/storage_class
    - /events/*/ts
    - /chain_root_id
    - /from_chain_seq
    - /to_chain_seq
    - /truncated
  interim_free_text:
    - /events/*/payload  # removed by: per-chain publication
    - /events/*/prev_chain_event_hash  # removed by: per-chain publication
    - /events/*/prev_thread_event_hash  # removed by: per-chain publication
