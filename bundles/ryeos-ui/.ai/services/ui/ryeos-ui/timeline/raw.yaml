kind: service
name: ryeos-ui/timeline/raw
version: "1.0.0"
description: The raw durable events of one chain_seq range of an authorized chain, capped per call, behind a timeline item.
endpoint: ui.ryeos.timeline.raw
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /events/*/event_id
    - /events/*/event_hash
    - /events/*/chain_seq
    - /events/*/thread_id
    - /events/*/thread_seq
    - /events/*/event_type
    - /events/*/storage_class
    - /events/*/ts
    - /chain_root_id
    - /from_chain_seq
    - /to_chain_seq
    - /truncated
  free_text:
    - /events/*/payload
    - /events/*/prev_chain_event_hash
    - /events/*/prev_thread_event_hash
