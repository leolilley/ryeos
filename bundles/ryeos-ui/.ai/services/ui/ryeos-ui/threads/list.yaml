# ryeos:signed:2026-11-24T11:23:42Z:55b074e27c023c2f54847c1d54fcdb5e09f2f1d5850db5e1713194dc7ae053fd:X3YTdDT4RBaWdvfLLuZOH5ldY2mZgwj9Cbkriiuoxzg1AQwAJg2GZxv3Muy9/X4pfDE58Vxsw5WXrTklpETXBA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
name: ryeos-ui/threads/list
version: "1.0.0"
description: Thread listing for RyeOS UI — returns recent threads with status, kind, item_ref, and timestamps.
endpoint: ui.ryeos.threads.list
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /threads/*/thread_id
    - /threads/*/chain_root_id
    - /threads/*/kind
    - /threads/*/status
    - /threads/*/item_ref
    - /threads/*/launch_mode
    - /threads/*/current_site_id
    - /threads/*/origin_site_id
    - /threads/*/upstream_thread_id
    - /threads/*/successor_thread_id
    - /threads/*/created_at
    - /threads/*/updated_at
    - /threads/*/execution
    - /threads/*/pending
    - /threads/*/current_node
    - /coverage/state
    - /coverage/reason
  free_text:
    - /threads/*/title
    - /threads/*/facets
    - /threads/*/error
    - /threads/*/project_root
    - /threads/*/project_authority
    - /threads/*/admitted_launch_capsule_hash
    - /threads/*/follow
  interim_free_text:
    - /threads/*/project/name  # removed by: m4
    - /threads/*/project/path  # removed by: m4
    - /threads/*/requested_by  # removed by: m4
