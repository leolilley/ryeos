kind: service
name: ryeos-ui/threads/list
version: "1.0.0"
description: Thread listing for RyeOS UI — returns recent threads with status, kind, item_ref, and timestamps.
endpoint: ui.ryeos.threads.list
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /threads/*/thread_id chain_root_id kind status item_ref launch_mode current_site_id origin_site_id upstream_thread_id successor_thread_id created_at updated_at
    - /threads/*/execution
    - /threads/*/pending
    - /threads/*/current_node
    - /coverage/state
    - /coverage/reason
  free_text:
    - /threads/*/title
    - /threads/*/facets
    - /threads/*/error
    - /threads/*/requested_by
    - /threads/*/project_root
    - /threads/*/project
    - /threads/*/project_authority
    - /threads/*/admitted_launch_capsule_hash
    - /threads/*/follow
