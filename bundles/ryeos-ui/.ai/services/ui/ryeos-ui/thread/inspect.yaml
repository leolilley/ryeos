# ryeos:signed:2026-11-24T11:14:52Z:bbf55f2cd7319832e9404cb96a2301355a5099a1adda12312ded2fdc43e48364:Uu57j8l8viwtL+55uUsHVVBBgR7XivMtLm/zi99eANjC0u5i1MfKAs11Zm5yzSX96G/v9PgO2Z20JFpic4ARAA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
name: ryeos-ui/thread/inspect
version: "1.0.0"
description: Inspect one thread for RyeOS UI — returns detail, result, artifacts, children, facets, and recent events.
endpoint: ui.ryeos.thread.inspect
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /schema_version
    - /thread/thread_id
    - /thread/chain_root_id
    - /thread/kind
    - /thread/status
    - /thread/item_ref
    - /thread/executor_ref
    - /thread/launch_mode
    - /thread/current_site_id
    - /thread/origin_site_id
    - /thread/upstream_thread_id
    - /thread/created_at
    - /thread/updated_at
    - /thread/started_at
    - /thread/finished_at
    - /thread/execution
    - /outcome_coverage
    - /events_truncated
    - /pending
    - /usage/*/label
    - /usage/*/value
    - /execution_meta/*/label
    - /execution_meta/*/value
    - /execution_coverage
    - /launch_facts/*/state
    - /launch_facts/*/reason
    - /launch_facts/*/execution_realization_hash
    - /evidence_coverage
  free_text:
    - /thread/requested_by
    - /thread/project_root
    - /thread/project_authority
    - /thread/admitted_launch_capsule_hash
    - /thread/result_project_snapshot_hash
    - /thread/result_workspace_output_capture_hash
    - /result
    - /artifacts
    - /children
    - /facets
    - /events
    - /launch_facts/*/properties
    - /follow
    - /thread_meta
