kind: service
name: ryeos-ui/thread/tree
version: "1.0.0"
description: Bounded recursive execution ancestry for the focused RyeOS UI thread tree.
endpoint: ui.ryeos.thread.tree
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /root_thread_id
    - /truncated
    - /threads/*/thread_id chain_root_id kind status item_ref launch_mode current_site_id origin_site_id upstream_thread_id successor_thread_id created_at updated_at
    - /threads/*/execution
    - /threads/*/pending
    - /threads/*/current_node
    - /threads/*/tree/parent_thread_id
    - /threads/*/tree/relation
    - /threads/*/tree/depth
    - /threads/*/tree/has_children
    - /coverage/*/state
    - /coverage/*/reason
    - /coverage/*/root_thread_id
    - /coverage/*/retained
    - /coverage/*/truncated
  free_text:
    - /threads/*/title
    - /threads/*/facets
    - /threads/*/error
    - /threads/*/requested_by
    - /threads/*/project_root
    - /threads/*/project
    - /threads/*/project_authority
    - /threads/*/admitted_launch_capsule_hash
    - /threads/*/follow
