# ryeos:signed:2026-11-25T06:59:45Z:761815d9d36fbd3e2142aac32dae7cac6903e4ee08daa6bd46faedb8fcf45a45:7IE7anmjymwojoRklT81/f8tZNs9gSrNaVqcVUlf20rKXnpLTMCF2xLWy1rFceDfYVHWQ2DL/CJoE7h4vEAEAA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: service
name: ryeos-ui/thread/tree
version: "1.0.0"
description: Bounded recursive execution ancestry for the focused RyeOS UI thread tree.
endpoint: ui.ryeos.thread.tree
ui_read_only: true
state_access: read_only_existing
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - /root_thread_id
    - /truncated
    - /threads/*/thread_id
    - /threads/*/chain_root_id
    - /threads/*/kind
    - /threads/*/status
    - /threads/*/item_ref
    - /threads/*/launch_mode
    - /threads/*/current_site_id
    - /threads/*/origin_site_id
    - /threads/*/upstream_thread_id
    - /threads/*/successor_thread_id
    - /threads/*/created_at
    - /threads/*/updated_at
    - /threads/*/execution
    - /threads/*/pending
    - /threads/*/current_node
    - /threads/*/tree/parent_thread_id
    - /threads/*/tree/relation
    - /threads/*/tree/depth
    - /threads/*/tree/has_children
    - /coverage/*/state
    - /coverage/*/reason
    - /coverage/*/root_thread_id
    - /coverage/*/retained
    - /coverage/*/truncated
  free_text:
    - /threads/*/title
    - /threads/*/facets
    - /threads/*/error
    - /threads/*/project_root
    - /threads/*/project_authority
    - /threads/*/admitted_launch_capsule_hash
  interim_free_text:
    - /threads/*/project/name  # removed by: m4
    - /threads/*/project/path  # removed by: m4
    - /threads/*/requested_by  # removed by: m4
    - /threads/*/follow/role  # removed by: per-chain publication
    - /threads/*/follow/display_state  # removed by: per-chain publication
    - /threads/*/follow/phase  # removed by: per-chain publication
    - /threads/*/follow/follow_node  # removed by: per-chain publication
    - /threads/*/follow/child_thread_id  # removed by: per-chain publication
    - /threads/*/follow/child_chain_root_id  # removed by: per-chain publication
    - /threads/*/follow/child_terminal_status  # removed by: per-chain publication
    - /threads/*/follow/parent_successor_thread_id  # removed by: per-chain publication
    - /threads/*/follow/cohort/done  # removed by: per-chain publication
    - /threads/*/follow/cohort/expected  # removed by: per-chain publication
  max_items: 4096
  max_result_bytes: 8388608
