kind: service
name: seat-append
version: "1.0.0"
description: Append seat.* events to the session's running seat braid
endpoint: ui.seat.append
# Lifecycle routes preserve the authenticated browser context directly.
# session_local is reserved for invocation through a compiled UI binding.
ui_dispatch: verified
record_thread: false
availability: daemon_only
disclosure:
  principal:
    - "/producer_incarnation"
    - "/operation_id"
    - "/first_engine_seq"
    - "/last_engine_seq"
    - "/event_count"
    - "/payload_digest"
    - "/appended"
    - "/chain_seq"
    - "/receipt_thread_seq"
    - "/receipt_event_hash"
    - "/events_authority"
    - "/events/*/event_hash"
    - "/events/*/chain_root_id"
    - "/events/*/chain_seq"
    - "/events/*/thread_id"
    - "/events/*/thread_seq"
    - "/events/*/event_type"
    - "/events/*/durability"
    - "/events/*/ts"
    - "/events/*/prev_chain_event_hash"
    - "/events/*/prev_thread_event_hash"
  interim_free_text:
    - "/events/*/payload"  # removed by: m4
  max_result_bytes: 1048576
