# ryeos:signed:2026-11-26T01:30:21Z:04c232467ae28375d91833eb88312bdbf7fd3bd814c226a6484cea86aa3dbae4:+mg37DPQV/oWgCC4c/z7ZuPL3KmZ5uyq29j7+xdBA/NVRzuUf0+PskIdYNF+BpVhs+YJl3iZWHpzG50oyfErAA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: ryeos/ui
version: "1.0.0"
description: The sentence and tone a table's coverage line shows for each state and reason a service reports.
# A service reports coverage as codes: a state and a reason. A client reads
# this config through the coverage wording service and draws the sentence, in
# the tone, instead of the codes. Resolution:
#   1. A state this config does not list reads as `fallback`.
#   2. Otherwise a reason listed under `reasons` gives its own sentence.
#   3. Otherwise the state's own sentence under `states` is used.
# `reasons` also holds the sentences a view says in place of rows. A view names
# one under `body.empty`, and `empty` when it names none. They are plain
# sentences like the rest and need no service to report them.
# `reasons` also holds the sentence a seat's project chip draws when the seat
# is bound to a checkout that states no project, under `seat_project_<code>`
# for each of the four absence codes. A code with no entry here reads as the
# client's fixed "not known" line. The chip draws no sentence for a seat that
# states a project (it draws the name) or has none.
# Tone is one of none, good, warn, danger, accent. A sentence is plain, in
# normal case, and says what the page shows or does not show.
fallback:
  label: This page's coverage is not known.
  tone: none
states:
  complete:
    label: Everything this source holds is shown.
    tone: good
  observed:
    label: What was observed is shown. It may not be everything.
    tone: none
  partial:
    label: Part of what exists is shown.
    tone: warn
  failed:
    label: This source could not be read.
    tone: danger
  unavailable:
    label: This source is not available.
    tone: warn
  not_reported:
    label: This source did not report this list.
    tone: warn
  wrong_shape:
    label: This source reported this list in a form this page cannot read.
    tone: warn
  key_collision:
    label: This list was not shown because an entry already has the field its name would be stored in.
    tone: danger
# `limits` are bounds the client applies to what a source shows. `source_rows`
# is the most rows one source shows, whether it reports an array or a map; when
# rows are cut the source reads as `partial` with the reason `source_row_limit`,
# whose sentence may use `{limit}` (the bound) and `{total}` (rows that exist).
limits:
  source_rows: 500
reasons:
  source_row_limit:
    label: Showing the first {limit} of {total} rows.
    tone: warn
  contract_mismatch:
    label: This source answered in a form this page was not written for, so nothing from it is shown.
    tone: danger
  coverage_not_reported:
    label: This source did not say what it covers.
    tone: warn
  not_required:
    label: Not needed for this view.
    tone: none
  ready:
    label: Ready.
    tone: good
  unchanged:
    label: Nothing has changed since the last read.
    tone: none
  thread_running:
    label: The thread is still running, so this is not final.
    tone: warn
  thread_not_selected:
    label: Select a thread to see this.
    tone: none
  conflict:
    label: Two records disagree. Neither is shown as settled.
    tone: danger
  stale_ledger_head:
    label: This was read from an older record than the current one.
    tone: warn
  policy_unconfigured:
    label: This node has no policy set for this yet.
    tone: warn
  inline_value_limit:
    label: A value was too large to show in full.
    tone: warn
  candidate_retained:
    label: A candidate from this thread is held.
    tone: none
  audit_record_retained:
    label: The audit record for this thread is held.
    tone: good
  signed_scoped_usage_not_available:
    label: No signed usage is available for this scope.
    tone: warn
  signed_facet_map_not_proven:
    label: This view's selections have not been proved.
    tone: warn
  settled_usage_projection_not_signed_testimony:
    label: Usage shown is settled but is not signed testimony.
    tone: warn
  settled_usage_projection_for_authorized_observed_chains_not_node_totals:
    label: Usage covers the chains you may see, not the whole node.
    tone: warn
  projection_locator_not_exhaustive:
    label: The page does not prove exhaustive membership.
    tone: none
  authorized_subject_subset_not_totals:
    label: Counts cover what you may see, not the node's totals.
    tone: warn
  authorized_projection_subset_not_exhaustive:
    label: This shows what you may see, not everything.
    tone: warn
  kind_not_registered:
    label: This kind of item is not known to this node.
    tone: warn
  empty:
    label: Nothing observed yet.
    tone: none
  empty_project:
    label: Nothing observed in this project yet.
    tone: none
  seat_project_unregistered:
    label: This folder is not registered as a project, so no project is shown. Register the folder to show one.
    tone: none
  seat_project_owner_key_not_active:
    label: The key for this seat is not active, so no project is shown. Activate the key to show one.
    tone: warn
  seat_project_no_project_name:
    label: This folder's manifest names no project, so no project is shown. Add a name to its manifest.
    tone: none
  seat_project_checkout_name_changed:
    label: This folder's manifest now names a different project than it was registered under, so no project is shown. Register it again under the new name.
    tone: none
