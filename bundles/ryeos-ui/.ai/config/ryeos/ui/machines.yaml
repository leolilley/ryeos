category: ryeos/ui
version: "1.0.0"
description: The words the machines view shows for locality groups, nodes, answers and relations.

# Every sentence the machines service returns comes from here, keyed on the
# stable keys the locality comparison emits. A key that is not listed is shown
# as itself, never hidden and never guessed at. Templates take `{name}`
# placeholders that the service fills from the response; nothing else in the
# service carries wording.

# Joins names inside one sentence.
list_separator: ", "
# Joins the lines of one row's detail.
line_separator: "; "
# Marks the group that holds the node this client is attached to.
this_computer: This computer

# A group's state: the grade of the grouping, shown beside its name.
states:
  declared_confirmed: Named by you, confirmed this boot
  declared: Named by you
  declared_contradicted: Named by you, but these nodes report different boots
  observed: Same boot
  alone: On its own
  cannot_tell: Cannot tell
  # A declaration record that could not be used: unsigned, edited, signed by
  # another key, malformed, or naming a node another record names.
  declaration_invalid: Declaration unusable

# What a node's row says about the fan-out. `disagrees` is shown instead of
# `answered` for a node whose boot differs from the rest of a declared machine.
answers:
  answered: Answered
  did_not_answer: Did not answer
  not_granted: Not granted
  not_asked: Not asked
  disagrees: Reports a different boot

kinds:
  this: This node
  remote: Remote
  installed_not_connected: Installed here, not connected

# `boot` is one run of one kernel, not a machine: a reboot is a new boot.
# `storage` is one filesystem instance; different filesystems may share a disk.
relations:
  boot: Boot
  storage: Filesystem
  account: Account

# Why a node, or one of its relations, could not tell.
reasons:
  emulated_kernel: the kernel is emulated, so its boot id says nothing
  not_measurable: this host cannot measure it
  user_namespace: it runs in a nested user namespace, where a uid names nothing outside it
  not_reported: the node reported nothing for it
  timeout: no answer in time
  unreachable: could not be reached
  service_not_installed: the remote does not serve locality
  inbound_only: inbound-only remote, never dialled from here
  remote_invalid: the remote's pin failed verification
  remote_error: the remote answered with an error
  invalid_answer: the remote's answer was not valid locality facts
  site_mismatch: the remote answered as a different node than the one pinned
  unrecognised: the node reported something this client does not recognise

templates:
  # A node that did not answer: `{answer}` is the answers text.
  did_not_answer: "{answer}: {reason}"
  # One relation of one node.
  fact_shared: Shared with {names}
  fact_measured: Measured, no other node matches
  fact_unknown: "Cannot tell: {reason}"
  fact_unknown_bare: Cannot tell
  fact_line: "{relation}: {text}"
  # Group-level lines.
  relation_shared: "{relation}: {names} share it"
  relation_unknown: "{relation}: {names} cannot tell ({reason})"
  relation_unknown_bare: "{relation}: {names} cannot tell"
  disagreeing: "Reports a different boot: {names}"
  declared_missing: "Named but not seen: {names}"
