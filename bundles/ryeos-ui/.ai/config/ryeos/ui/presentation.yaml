category: ryeos/ui
version: "1.0.0"
description: Shared RyeOS browser presentation; Surface contents retain their own independent admission.
shared_presentation:
  schema: 1
  title: RyeOS
  launcher: launcher
  dialogs:
    - { id: launcher, title: Launch, view: "view:ryeos/ui/launcher" }
    - { id: shortcuts, title: Shortcuts, view: "view:ryeos/ui/shortcuts" }
    - { id: node, title: Node details, view: "view:ryeos/node/status" }
    - { id: session, title: Session details, view: "view:ryeos/ui/session-details" }
    - { id: surfaces, title: Surfaces, view: "view:ryeos/surfaces/list" }
    - { id: projects, title: Projects and Surfaces, view: "view:ryeos/projects/list" }
    - { id: view-sets, title: Saved view sets, view: "view:ryeos/view-sets/library" }
  docks: {}
  initial_surfaces:
    - { id: home, title: Home, surface: "surface:ryeos/ui/base-observe" }
  capabilities:
    sources:
      - ryeos.execute.service.node/status
      - ryeos.execute.service.projects/list
      - ryeos.execute.service.ui/ryeos-ui/config/get
      - ryeos.execute.service.ui/ryeos-ui/items/list
    affordances:
      - ryeos.execute.service.projects/open
      - ryeos.execute.service.projects/add
      - ryeos.execute.service.ui/ryeos-ui/config/update
      - ryeos.execute.service.ui/ryeos-ui/view-sets/resume
      - ryeos.execute.service.ui/session/surfaces/open
      - ryeos.execute.service.ui/ryeos-ui/surfaces/resume
