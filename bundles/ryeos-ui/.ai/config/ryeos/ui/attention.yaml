category: ryeos/ui
version: "1.0.0"
description: Which sources raise operator attention, and how thread statuses group for presentation.

# Each source names one store query the attention service implements
# (approvals_pending, candidates_ready, runs_failed) and the words its items
# carry. `statuses` lists the thread statuses runs_failed treats as failed;
# cancelled is left out because the operator asked for it.
sources:
  - { kind: approval, query: approvals_pending, title: Approval requested, tone: warn }
  - { kind: candidate, query: candidates_ready, title: Candidate ready for review, tone: warn }
  - { kind: failed_run, query: runs_failed, title: Run failed, tone: danger, statuses: [failed, timed_out] }

# Thread status to presentation category; a status not listed is unknown.
phase_categories:
  created: running
  accepted: running
  running: running
  continued: blocked
  completed: completed
  failed: failed
  cancelled: failed
  killed: failed
  timed_out: failed
