category: ryeos/ui
version: "1.0.0"
description: Which themes `system` follows, and the theme a node uses when nothing else names one.
# A principal's stored theme preference is a `theme:` item ref or `system`.
# `system` follows the platform's light or dark preference through the two
# themes below. `default` is the theme used where no platform preference is
# known. Each ref must name an installed theme.
system:
  dark: "theme:ryeos/night"
  light: "theme:ryeos/paper"
default: "theme:ryeos/night"
