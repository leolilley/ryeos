category: ryeos/ui
version: "1.1.0"
description: What a view or Surface authored in project space may bind.

# A view or Surface that comes from a project, rather than from an installed
# bundle, binds read sources only, and only the services named here. Each
# entry names one service exactly; a wildcard is refused when this file is
# loaded. The daemon reads this file from installed bundles only, so nothing
# a project ships can supply or widen it.
#
# A service belongs here only if what it returns is confined to the session's
# own project whatever parameters a view authors. `field/project` takes no
# project or thread selector: its scope is the session's project alone. The
# other three read threads. The daemon marks every source a project-authored
# item declares, and thread authorization then admits to such a source only
# threads of the session's own live project: never another project's thread,
# and never a projectless or pinned-generation thread, whoever launched it.
sources:
  - ryeos.execute.service.ui/ryeos-ui/field/project
  - ryeos.execute.service.ui/ryeos-ui/field/definition
  - ryeos.execute.service.ui/ryeos-ui/field/runs
  - ryeos.execute.service.ui/ryeos-ui/field/execution
