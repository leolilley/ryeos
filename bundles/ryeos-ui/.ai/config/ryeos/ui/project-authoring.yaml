category: ryeos/ui
version: "1.0.0"
description: What a view or Surface authored in project space may bind.

# A view or Surface that comes from a project, rather than from an installed
# bundle, binds read sources only, and only the services named here. Each
# entry names one service exactly; a wildcard is refused when this file is
# loaded. The daemon reads this file from installed bundles only, so nothing
# a project ships can supply or widen it.
#
# A service belongs here only if what it returns is confined to the session's
# own project whatever parameters a view authors. `field/project` takes no
# project or thread selector: its scope is the session's project alone.
#
# `field/definition`, `field/runs` and `field/execution` are left off. Each
# reads threads through the session's thread authorization, which admits a
# thread of the session's project and also any projectless or
# pinned-generation thread the session's principal launched. A project view
# could therefore read that principal's runs from outside the project by
# naming a thread id or by listing runs. They can be listed once that rule
# admits only threads of the session's project for a project-bound session.
sources:
  - ryeos.execute.service.ui/ryeos-ui/field/project
