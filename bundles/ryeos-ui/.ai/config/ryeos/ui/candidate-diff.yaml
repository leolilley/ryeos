category: ryeos/ui
version: "1.0.0"
description: How far the review diff of one retained candidate file may grow.

# A file larger than this on either side is reported by its size and not read.
# The daemon holds it under the most text it will diff, whatever is set here.
max_file_bytes: 262144

# Caps of the returned change set: one file per request, its diff lines, and
# the characters kept of one line before an elision mark. The change set's own
# byte ceiling applies on top.
caps:
  files: 1
  lines_per_file: 2000
  total_lines: 2000
  line_chars: 400
