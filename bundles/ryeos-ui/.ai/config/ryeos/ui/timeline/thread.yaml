# ryeos:signed:2026-11-18T05:09:15Z:cd937ecffb0ece674fd7c396003f2655f28625e9c84f66a48becbd8de376ee5d:UPIzhpd71qOez2Ss93Q4/4NqXVqAwqdvhHTJhzqPw/eC8z6liG8VOV6oPKW2fNFEClT7/JBZT7X3a2soMuFDBA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
# Thread timeline definition: how a chain's events fold into timeline items.
# Declarative data read by the timeline service; the fold engine names no event type itself.
category: ryeos/ui/timeline
version: "1.0.0"
description: How a chain's events fold into timeline items.

vocabulary:
  - {key: fetch, one: page, many: pages}
  - {key: other, one: operation, many: operations}
  - {key: system_event, one: system event, many: system events}

# Policy for grouping. Failed or alarming entries never hide inside a cluster or a
# folded turn; consecutive markers fold under the notice noun.
folds:
  escape: {states: [failed], tones: [danger]}
  group_states: [done, stopped]
  notice: system_event

# Threads linked into the viewed thread's story, in either direction.
spine:
  - {event: thread_continued, from: thread_id, to: payload.successor_thread_id}
  - {event: thread_created, from: payload.continuation_from, to: thread_id}

# The status lane: what the thread is doing now, read from entries' latest
# states, or from the chain's status. The first matching row wins, so the status
# row sits last; no match means idle.
lane:
  - {type: ask, state: pending, label: Waiting for approval}
  - {type: activity, state: retrying, label: Retrying}
  - {type: activity, state: running, label: Working}
  - {status: running, label: Working}

events:
  # Bookkeeping that contributes no entry, declared deliberately.
  thread_created: [{drop: true}]
  thread_started: [{drop: true}]
  as_launched_resolution: [{drop: true}]
  as_launched_ref_bindings: [{drop: true}]
  runtime_launch_facts: [{drop: true}]
  process_input_root_selected: [{drop: true}]
  provider_attempt_budget_transition_v1: [{drop: true}]
  stream_opened: [{drop: true}]
  thread_usage: [{drop: true}]

  # Daemon bookkeeping and evidence records: hashes, identities and routing the
  # person watching a thread does not act on. Each is a deliberate drop.
  edge_recorded: [{drop: true}]  # chain link between threads; child_thread_spawned draws the work
  worker_continuation_admitted: [{drop: true}]  # admission detail; worker_session.restored draws the resume
  continuation_requested: [{drop: true}]  # handshake step; thread_continued draws the continuation
  continuation_accepted: [{drop: true}]  # handshake step; thread_continued draws the continuation
  command_submitted: [{drop: true}]  # command-queue plumbing
  command_claimed: [{drop: true}]  # command-queue plumbing
  command_completed: [{drop: true}]  # command-queue plumbing
  launch_augmentation_cache_hit: [{drop: true}]  # cache evidence for the launch
  thread_facet_set: [{drop: true}]  # tag metadata, shown by the thread header rather than the flow
  subprocess_output_observed: [{drop: true}]  # raw output frames; tool results draw what was returned
  observation: [{drop: true}]  # journal-only runtime observation, not part of the story
  hook_observation_recorded: [{drop: true}]  # hook result evidence, hashes only
  project_observation_recorded: [{drop: true}]  # project observation evidence
  provider_call_observation_recorded: [{drop: true}]  # provider call evidence
  resource_budget_transition_v1: [{drop: true}]  # accounting evidence
  resource_precontact_budget_transition_v1: [{drop: true}]  # accounting evidence
  attention_acknowledged: [{drop: true}]  # triage record for the attention queue, not part of the run's story
  # Live stream fragments: the finished cognition_out and tool events carry the content.
  token_delta: [{drop: true}]
  stream_snapshot: [{drop: true}]
  stream_closed: [{drop: true}]
  cognition_reasoning: [{drop: true}]  # live reasoning delta; cognition_out carries the finished reasoning
  graph_foreach_iteration: [{drop: true}]  # journal-only; graph_foreach_started and the step activity draw the loop
  graph_branch_taken: [{drop: true}]  # routing between steps; each step draws its own activity

  # An entry marked text_streamed has its text in the live event stream (the
  # event's text parts), so a consumer printing that stream does not print it
  # again. A chunked input's chunks are not text parts and so are not marked.
  # Input the model is given. An operator or launch input opens an exchange with
  # its first text part; later text parts continue it and images draw a line.
  # Harness input is a notice, a compaction input a divider; context and the
  # turn marker add nothing to draw.
  cognition_in:
    # A large text input arrives in chunks: the first draws the message.
    - when: {has: payload.content_chunk}
      emit:
        - type: message
          when: {eq: [payload.chunk_index, 0], one_of: [payload.origin, [operator, launch]]}
          starts_exchange: true
          project:
            body: payload.content_chunk
            detail: {join: [{path: payload.chunk_count, prefix: "chunks: "}]}
    - when: {one_of: [payload.origin, [operator, launch]]}
      over: payload.parts
      emit:
        - type: message
          when: {eq: [item_index, 0], has: item.text}
          starts_exchange: true
          text_streamed: true
          project: {body: item.text}
        # An input that opens with an image still opens the exchange.
        - type: marker
          when: {eq: [item_index, 0], lacks: item.text}
          starts_exchange: true
          project:
            headline:
              join:
                - {path: item.media_type, prefix: "image · "}
                - {path: item.byte_length, format: bytes}
                - {path: item.width, prefix: "w "}
                - {path: item.height, prefix: "h "}
        - type: prose
          when: {eq: [item.type, text], ne: [item_index, 0]}
          text_streamed: true
          project: {body: item.text}
        - type: marker
          when: {eq: [item.type, image], ne: [item_index, 0]}
          project:
            headline:
              join:
                - {path: item.media_type, prefix: "image · "}
                - {path: item.byte_length, format: bytes}
                - {path: item.width, prefix: "w "}
                - {path: item.height, prefix: "h "}
    - when: {eq: [payload.origin, context]}
      drop: true
    - when: {has: payload.turn}
      drop: true
    - when: {eq: [payload.origin, compaction]}
      emit:
        - type: marker
          project: {headline: {join: [{path: payload.origin, prefix: "context "}]}}
    - when: {has: payload.origin}
      emit:
        - type: marker
          project: {headline: {join: [payload.origin, payload.kind]}}

  # One event may carry reasoning, text and tool calls: it emits an entry per
  # part. A tool call part draws nothing here; its tool_call_start does. A turn
  # an interrupt cut short ends with a marker.
  cognition_out:
    - over: payload.parts
      emit:
        - type: thought
          when: {eq: [item.type, reasoning], has: item.text}
          project: {body: item.text}
        - type: prose
          flow: true
          text_streamed: true
          when: {eq: [item.type, text]}
          project: {body: item.text}
        - type: marker
          key: [thread_id, payload.turn]
          when: {eq: [item_last, true], one_of: [payload.finish, [interrupted]]}
          tone: [{default: warn}]
          project: {headline: {join: [{path: payload.turn, prefix: "turn interrupted · "}]}}
        - type: marker
          key: [thread_id, payload.turn]
          when: {eq: [item_last, true], one_of: [payload.finish, [length]]}
          tone: [{default: warn}]
          project: {headline: {join: [{path: payload.turn, prefix: "turn cut at the output limit · "}]}}

  # The stable frame of a conversation is written once at launch.
  cognition_frame: [{drop: true}]

  # Reserved: compaction of the conversation, drawn as a divider.
  cognition_compaction:
    - emit:
        - type: marker
          project: {headline: {join: [{path: payload.reason, prefix: "context compacted · "}]}}

  # A continuation: the predecessor names its successor and why; the
  # successor's own record of the link adds nothing to draw.
  thread_continued:
    - when: {has: payload.successor_thread_id}
      emit:
        - type: marker
          project:
            headline: {join: [{path: payload.reason, prefix: "continued: "}]}
            target: payload.successor_thread_id
    - drop: true

  # An operator continued the thread on different bindings. The successor
  # records each change: a changed model names the model it now runs, and
  # any other binding is named as changed.
  launch_binding_rebound:
    - over: payload.changes
      emit:
        - type: marker
          when: {eq: [item.name, model]}
          tone: [{default: accent}]
          project: {headline: {join: [{path: payload.to_facts.model_name, prefix: "model changed to "}]}}
        - type: marker
          when: {ne: [item.name, model]}
          tone: [{default: accent}]
          project: {headline: {join: [{path: item.name, prefix: "binding changed: "}]}}

  # A failed thread writes two terminal events; both address one outcome entry.
  thread_failed:
    - when: {on_spine: true}
      emit:
        - type: outcome
          key: [thread_id]
          state: failed
          tone: [{default: danger}]
          project:
            headline: {first: [payload.outcome_code, payload.message]}
            reason: {first: [payload.message, payload.error.reason, payload.error.error, payload.error.summary, payload.error]}
            # What a retry would resend: the text of this thread's latest operator or
            # launch input.
            retry_input:
              lookup:
                event: cognition_in
                when: {one_of: [payload.origin, [operator, launch]]}
                array: payload.parts
                find: {field: type, equals: text}
                get: text

  thread_completed:
    - when: {on_spine: true}
      emit:
        - type: outcome
          key: [thread_id]
          state: completed
          tone: [{default: good}]
          project: {headline: payload.outcome_code}

  # A stop by the operator is not a failure. None of these can be continued,
  # so none offers a retry.
  thread_cancelled:
    - when: {on_spine: true}
      emit:
        - type: outcome
          key: [thread_id]
          state: stopped
          tone: [{default: warn}]
          project:
            headline: {first: [payload.outcome_code, payload.message]}
            reason: {first: [payload.message, payload.error.reason, payload.error]}

  thread_killed:
    - when: {on_spine: true}
      emit:
        - type: outcome
          key: [thread_id]
          state: killed
          tone: [{default: danger}]
          project:
            headline: {first: [payload.outcome_code, payload.message]}
            reason: {first: [payload.message, payload.error.reason, payload.error]}

  thread_timed_out:
    - when: {on_spine: true}
      emit:
        - type: outcome
          key: [thread_id]
          state: timed_out
          tone: [{default: danger}]
          project:
            headline: {first: [payload.outcome_code, payload.message]}
            reason: {first: [payload.message, payload.error.reason, payload.error]}

  # Graph steps. A step and its tool call are one activity: the key is the node
  # and step, which every graph event of the step carries.
  graph_node_retry:
    - emit:
        - type: activity
          key: [payload.node, payload.step]
          state: retrying
          tone: [{default: warn}]
          project: {detail: {join: [{path: payload.attempt, prefix: "attempt "}, {path: payload.attempts, prefix: "of "}]}}

  graph_started:
    - emit:
        - type: marker
          starts_exchange: true
          project: {headline: {join: [{path: payload.definition_ref, prefix: "graph "}]}}

  graph_foreach_started:
    - emit:
        - type: activity
          key: [payload.node, payload.step]
          state: running
          project: {detail: {join: [{path: payload.total, prefix: "items: "}]}}

  graph_step_started:
    - emit:
        - type: activity
          key: [payload.node, payload.step]
          state: running
          project: {headline: {join: [{path: payload.node, prefix: "step "}]}}

  graph_step_completed:
    - emit:
        - type: activity
          key: [payload.node, payload.step]
          state: {from: payload.status, map: {ok: done, retry: retrying}, default: failed}
          tone:
            - {field: payload.status, map: {ok: good, retry: warn}}
            - {default: danger}

  # The graph runtime also writes tool events for an action node: they update
  # the step's activity rather than adding a second one.
  tool_call_start:
    - when: {has: payload.graph_run_id}
      emit:
        - type: activity
          key: [payload.node, payload.step]
          counts_as: other
          project: {tool: payload.item_id}
    - emit:
        - type: activity
          key: [payload.operation_id]
          state: running
          counts_as: other
          project:
            headline: payload.tool
            detail: {lookup: {event: cognition_out, array: payload.parts, find: [call_id, payload.call_id], get: arguments}}
          # The call's arguments, for the tool's own presentation paths.
          inputs:
            arguments: {lookup: {event: cognition_out, array: payload.parts, find: [call_id, payload.call_id], get: arguments}}

  tool_call_result:
    - when: {has: payload.graph_run_id}
      emit:
        - type: activity
          key: [payload.node, payload.step]
          state: {from: payload.status, map: {ok: done}, default: failed}
    # The guard records what was done to the result; an error status or a
    # truncation raises the tone, and a repeat of an earlier result is named.
    - emit:
        - type: activity
          key: [payload.operation_id]
          state: {from: payload.status, map: {ok: done, error: failed}, default: failed}
          tone:
            - {field: payload.status, map: {error: danger}}
            - {default: good}
          project:
            badge:
              join:
                - {path: payload.guard.result_size_bytes, format: bytes}
                - payload.guard.truncated_reason
                - {path: payload.guard.duplicate_of, format: short_hash, prefix: "same as earlier "}
        - type: activity
          key: [payload.operation_id]
          when: {eq: [payload.status, ok], has: payload.guard.truncated_reason}
          tone: [{default: warn}]
        # The result text the model saw, for the tool's own presentation paths.
        # A cut result is not valid data, so it offers none.
        - type: activity
          key: [payload.operation_id]
          when: {eq: [payload.status, ok], lacks: payload.guard.truncated_reason}
          inputs: {result: payload.parts.0.text}

  # Work in another thread. The child's outcome is not in this chain, so the
  # link's state is unknown from here. The child's own presentation (a tool's
  # display hints, pinned at its launch) may fill the headline, detail and body
  # of the activity it runs under; the displaced headline stays as the tool.
  child_thread_spawned:
    - when: {has: payload.node}
      emit:
        - type: link
          key: [payload.child_thread_id]
          state: unknown
          parent: {type: activity, key: [payload.node, payload.step]}
          adopt:
            thread: payload.child_thread_id
            under: {type: activity, key: [payload.node, payload.step]}
            present:
              slots: {headline: 300, detail: 300, body: 4000}
              displace: {headline: tool}
          project: {headline: payload.item_id, target: payload.child_thread_id}
    - emit:
        - type: link
          key: [payload.child_thread_id]
          state: unknown
          parent: {type: activity, key: [payload.operation_id]}
          adopt:
            thread: payload.child_thread_id
            under: {type: activity, key: [payload.operation_id]}
            present:
              slots: {headline: 300, detail: 300, body: 4000}
              displace: {headline: tool}
          project: {headline: payload.item_id, target: payload.child_thread_id}

  # A followed child settled: its link takes the child's outcome and the
  # leading part of its result.
  child_thread_settled:
    - emit:
        - type: link
          key: [payload.child_thread_id]
          state: {from: payload.outcome_kind, map: {completed: done, cancelled: stopped, deadline: timed_out}, default: failed}
          tone:
            - {field: payload.outcome_kind, map: {completed: good, cancelled: warn}}
            - {default: danger}
          project:
            body: payload.result_summary
            badge: {join: [{path: payload.cost.total_usd, prefix: "$"}]}

  artifact_published:
    - when: {eq: [payload.artifact_type, graph_node_receipt]}
      drop: true
    - emit:
        - type: marker
          project: {headline: {join: [{path: payload.artifact_type, prefix: "artifact "}]}}

  graph_completed:
    - emit:
        - type: outcome
          key: [thread_id]
          state: completed
          tone: [{default: good}]
          project: {detail: {join: [{path: payload.steps, prefix: "steps: "}]}}

  # Provider and accounting notices.
  # A retry after a mid-stream cut voids the live fragments of that turn
  # published so far; the headline says so when any were emitted.
  provider_retry:
    - when: {ne: [payload.supersedes.output_events, 0]}
      emit:
        - type: marker
          tone: [{default: warn}]
          project:
            headline:
              join:
                - {path: payload.attempt, prefix: "provider retry, attempt "}
                - {path: payload.supersedes.output_events, prefix: "partial output superseded, live events: "}
            reason: payload.retry_advance.decision.reason.kind
    - emit:
        - type: marker
          tone: [{default: warn}]
          project:
            headline: {join: [{path: payload.attempt, prefix: "provider retry, attempt "}]}
            reason: payload.retry_advance.decision.reason.kind
  # A declared hook failed: worth a warning, since its observation is missing.
  hook_failed:
    - emit:
        - type: marker
          tone: [{default: warn}]
          project: {headline: {join: [{path: payload.failure_class, prefix: "hook failed: "}]}}
  cost_untracked:
    - emit:
        - type: marker
          tone: [{default: warn}]
          project: {headline: {join: [{path: payload.model, prefix: "cost untracked: "}]}, reason: payload.reason}
  milestone:
    - emit:
        - type: marker
          tone: [{default: accent}]
          project: {headline: {join: [payload.kind, {path: payload.node, prefix: "node "}]}}
  graph_follow_suspended:
    - emit:
        - type: activity
          key: [payload.node, payload.step]
          state: waiting
          project: {detail: {join: [{path: payload.item_id, prefix: "waiting on "}]}}
  seat.facet: [{drop: true}]

  # Hosted sessions. An approval is one entity: its request asks, and each
  # later event moves its state. A candidate likewise.
  hosted_session.turn_started:
    - emit:
        - type: marker
          tone: [{default: accent}]
          project: {headline: {join: [{path: payload.turn_id, prefix: "hosted turn started "}]}}
  hosted_session.turn_completed:
    - emit:
        - type: marker
          tone: [{default: good}]
          project: {headline: {join: [{path: payload.turn_id, prefix: "hosted turn completed "}]}}
  hosted_session.approval_requested:
    - emit:
        - type: ask
          key: [payload.approval_id]
          state: pending
          tone: [{default: warn}]
          # The fence a decision must echo: the approval's own id, the digest of
          # the request that was shown, and whether the contract admits accepting.
          project:
            headline: {join: [{path: payload.observation.operation_class, prefix: "approval requested: "}]}
            approval_id: payload.approval_id
            request_digest: payload.request_digest
            accept_allowed: payload.observation.accept_allowed
  hosted_session.approval_expired:
    - emit:
        - {type: ask, key: [payload.approval_id], state: expired, tone: [{default: warn}]}
  hosted_approval.decision_reserved:
    - emit:
        - type: ask
          key: [payload.approval_id]
          state: {from: payload.decision, map: {approve: approved, approved: approved, deny: denied, denied: denied}, default: decided}
          tone: [{default: accent}]
          project: {decision: payload.decision}
  hosted_approval.delivery_contacting:
    - emit:
        - {type: ask, key: [payload.approval_id], state: delivering}
  hosted_approval.delivery_unknown:
    - emit:
        - {type: ask, key: [payload.approval_id], state: delivery_unknown, tone: [{default: danger}]}
  hosted_approval.delivery_settled:
    - emit:
        - {type: ask, key: [payload.approval_id], state: delivered, tone: [{default: good}]}
  hosted_approval.delivery_expired:
    - emit:
        - {type: ask, key: [payload.approval_id], state: delivery_expired, tone: [{default: warn}]}
  worker_session.restored:
    - emit:
        - type: marker
          tone: [{default: accent}]
          project: {headline: "session restored", target: payload.successor_placement_thread_id}
  hosted_candidate.captured:
    - emit:
        - type: activity
          key: [payload.candidate_snapshot_hash]
          state: captured
          tone: [{default: accent}]
          project: {headline: {join: [{path: payload.candidate_snapshot_hash, format: short_hash, prefix: "candidate "}]}}
  hosted_candidate.qualified:
    - emit:
        - {type: activity, key: [payload.candidate_evaluation.candidate_snapshot_hash], state: qualified, tone: [{default: good}]}
  hosted_candidate.publication_reserved:
    - emit:
        - {type: activity, key: [payload.candidate_snapshot_hash], state: publishing}
  hosted_candidate.published:
    - emit:
        - {type: activity, key: [payload.candidate_snapshot_hash], state: published, tone: [{default: good}]}
  hosted_candidate.publication_not_applied:
    - emit:
        - {type: activity, key: [payload.candidate_snapshot_hash], state: not_applied, tone: [{default: warn}]}
  hosted_candidate.publication_superseded:
    - emit:
        - type: activity
          key: [payload.candidate_snapshot_hash]
          state: superseded
          tone: [{default: warn}]
          project: {detail: {join: [{path: payload.observed_head, format: short_hash, prefix: "head "}]}}
  hosted_candidate.publication_unknown:
    - emit:
        - {type: activity, key: [payload.candidate_snapshot_hash], state: unknown, tone: [{default: danger}]}
  hosted_candidate.discarded:
    - emit:
        - {type: activity, key: [payload.candidate_snapshot_hash], state: discarded}
  hosted_bounded_execution.terminal_outcome:
    - emit:
        - type: marker
          project: {headline: {join: [{path: payload.outcome.kind, prefix: "hosted execution: "}]}, reason: payload.terminal_reason}
