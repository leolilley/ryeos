# ryeos:signed:2026-10-20T19:22:30Z:4c5d16287cbd796f47edfe38fac5232997ceb565f2298c8ad895ce15677f0e82:2TZ8j/ACp+t/wHyRYud20V+uevjBmKzAFwr91iiTlvkeWjGfM8khrVWnCA6FTV3HyoftqpkMTWzW0obrT3p/Aw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "engine/kinds/surface"
version: "2.0.0"
location:
  directory: surfaces

formats:
  - extensions: [".yaml", ".yml"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"

composer: handler:ryeos/core/extends-chain
resolution:
  - step: resolve_extends_chain
    field: extends
    max_depth: 16
effective_trust:
  include_references: false
composer_config:
  extends_field: extends
  fields:
    - name: title
      strategy: replace_root_last
      expect_value_type: string
    - name: tiling
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: tiles
      strategy: replace_root_last
      expect_value_type: sequence
    - name: view_sets
      strategy: replace_root_last
      expect_value_type: sequence
    - name: dialogs
      strategy: replace_root_last
      expect_value_type: sequence
    - name: style
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: input
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: sources
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: ambient
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: affordances
      strategy: keyed_seq_merge_root_last
      key: id
      expect_value_type: sequence
    - name: instruments
      strategy: keyed_seq_merge_root_last
      key: id
      expect_value_type: sequence
    - name: capabilities
      strategy: narrow_against_parent_effective
      expect_value_type: mapping
    # replace_root_last, not keyed merge: group entries carry no `id` key,
    # so the keyed merge would silently drop them.
    - name: library
      strategy: replace_root_last
      expect_value_type: sequence
    - name: navigation
      strategy: keyed_seq_merge_root_last
      key: id
      expect_value_type: sequence
    - name: backdrop
      strategy: replace_root_last
      expect_value_type: string
    - name: launch_entry
      strategy: replace_root_last
      expect_value_type: boolean

composed_value_contract:
  root_type: mapping
  required: {}
  optional:
    title:
      type: single
      prim: string
    launch_entry:
      type: single
      prim: boolean
    tiling:
      type: single
      prim: mapping
    tiles:
      type: single
      prim: sequence
    view_sets:
      type: single
      prim: sequence
    dialogs:
      type: single
      prim: sequence
      elements:
        type: single
        prim: mapping
        contract:
          root_type: mapping
          required:
            id: { type: single, prim: string }
            title: { type: single, prim: string }
            view: { type: single, prim: string }
          optional: {}
    style:
      type: single
      prim: mapping
    extends:
      type: union
      prims: [string, "null"]
    input:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required:
          route:
            type: single
            prim: mapping
            contract:
              root_type: mapping
              required:
                invoke:
                  type: single
                  prim: mapping
                  contract:
                    root_type: mapping
                    required:
                      type: { type: single, prim: string }
                      ref: { type: single, prim: string }
                    optional: {}
                bindings:
                  type: single
                  prim: mapping
                  contract:
                    root_type: mapping
                    required:
                      input_parameter: { type: single, prim: string }
                    optional:
                      thread_target_parameter: { type: single, prim: string }
                      interrupt_intent_parameter: { type: single, prim: string }
              optional:
                params: { type: single, prim: mapping }
                requires_project: { type: single, prim: boolean }
        optional: {}
    sources:
      type: mapping
      values:
        type: single
        prim: mapping
        contract:
          root_type: mapping
          required:
            ref: { type: single, prim: string }
          optional:
            role: { type: single, prim: string }
            params: { type: single, prim: mapping }
            collection: { type: single, prim: string }
            refresh: { type: single, prim: mapping }
            dynamic_parameters:
              type: single
              prim: sequence
              elements: { type: single, prim: string }
            activation:
              type: single
              prim: string
              enum: [initial, on_demand]
            requires_project: { type: single, prim: boolean }
    ambient:
      type: single
      prim: mapping
    affordances:
      type: single
      prim: sequence
      elements:
        type: single
        prim: mapping
        contract:
          root_type: mapping
          required:
            id: { type: single, prim: string }
          optional:
            label: { type: single, prim: string }
            category: { type: single, prim: string }
            icon: { type: single, prim: string }
            producer:
              type: single
              prim: string
              enum: [selection, input, tokens]
            requires_project: { type: single, prim: boolean }
            invoke:
              type: single
              prim: mapping
              contract:
                root_type: mapping
                required:
                  plane:
                    type: single
                    prim: string
                    enum: [ui, rye]
                optional:
                  ref: { type: single, prim: string }
                  args: { type: single, prim: mapping }
                  tokens:
                    type: single
                    prim: sequence
                    elements: { type: single, prim: string }
                  facet: { type: single, prim: string }
                  value: { type: single, prim: any }
                  merge: { type: single, prim: mapping }
                  open_view: { type: single, prim: string }
                  drill: { type: single, prim: boolean }
                  notice: { type: single, prim: string }
    instruments:
      type: single
      prim: sequence
    capabilities:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required:
          sources: { type: single, prim: sequence, elements: { type: single, prim: string } }
          affordances: { type: single, prim: sequence, elements: { type: single, prim: string } }
        optional: {}
    # Every entry is a `{ group, views }` mapping.
    library:
      type: single
      prim: sequence
      elements:
        type: single
        prim: mapping
        contract:
          root_type: mapping
          required:
            group: { type: single, prim: string }
            views: { type: single, prim: sequence, elements: { type: single, prim: string } }
          optional: {}
    navigation:
      type: single
      prim: sequence
      elements:
        type: single
        prim: mapping
        contract:
          root_type: mapping
          required:
            id: { type: single, prim: string }
            label: { type: single, prim: string }
            view: { type: single, prim: string }
          optional: {}
    backdrop:
      type: single
      prim: string

metadata:
  rules:
    name:
      from: filename
      required: true
      match: filename
    version:
      from: path
      key: version
    description:
      from: path
      key: description
    category:
      from: relative_dir
      required: true
