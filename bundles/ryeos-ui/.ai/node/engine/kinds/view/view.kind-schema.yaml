# ryeos:signed:2026-11-23T02:56:35Z:1642b306fe88f7d1c2687acd4aeb2069d31659b463499909027a194b0b239ac7:lmnts5oH7SWTC4EbfYMnyU/5LTAzPrOa6KVFXT54CMQX4k6AubAXW0aZC0zuvpphebeptyOqOpEGxRyIHX7MBw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "engine/kinds/view"
version: "1.3.0"
# A project file may not take the ref of a view an installed bundle
# supplies. Resolution refuses the ref, naming both files, so a project can
# add its own views but never replace the node's.
project_shadowing: refuse
location:
  directory: views

formats:
  - extensions: [".yaml", ".yml"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"

composer: handler:ryeos/core/extends-chain
resolution:
  - step: resolve_extends_chain
    field: extends
    max_depth: 16
effective_trust:
  include_references: false
composer_config:
  extends_field: extends
  fields:
    - name: widget
      strategy: replace_root_last
      expect_value_type: string
      required: true
    - name: local_projection
      strategy: replace_root_last
      expect_value_type: string
    - name: sources
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: selection
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: projections
      strategy: dict_merge_root_last
      expect_value_type: mapping
    # Ordered section composition is an authored view body. Replacing the
    # complete sequence keeps source-channel/projection/activation entries
    # atomic instead of inheriting partial sections by position or title.
    - name: sections
      strategy: replace_root_last
      expect_value_type: sequence
    - name: body
      strategy: replace_root_last
    - name: presentation
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: facet
      strategy: replace_root_last
      expect_value_type: string
    - name: affordances
      strategy: keyed_seq_merge_root_last
      key: id
      expect_value_type: sequence
    - name: refresh
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: field_state
      strategy: replace_root_last
      expect_value_type: mapping
    # The signed picture a view draws behind its content. The mapping composes
    # atomically: a child never inherits half of a picture reference.
    - name: picture
      strategy: replace_root_last
      expect_value_type: mapping
    # Input declarations are authored view behavior. They must participate in
    # the effective-definition digest instead of being an uncomposed sidecar.
    - name: input
      strategy: dict_merge_root_last
      expect_value_type: mapping

composed_value_contract:
  root_type: mapping
  required:
    widget:
      type: single
      prim: string
  optional:
    local_projection:
      type: single
      prim: string
      enum: [launcher, shortcuts, session_details]
    extends:
      type: union
      prims: [string, "null"]
    sources:
      type: mapping
      values:
        type: single
        prim: mapping
        contract:
          root_type: mapping
          required:
            ref: { type: single, prim: string }
          optional:
            role: { type: single, prim: string }
            params: { type: single, prim: mapping }
            collection:
              type: union
              prims: [string, mapping]
            coverage: { type: single, prim: string }
            refresh: { type: single, prim: mapping }
            dynamic_parameters:
              type: single
              prim: sequence
              elements: { type: single, prim: string }
            activation:
              type: single
              prim: string
              enum: [initial, on_demand]
            requires_project: { type: single, prim: boolean }
    selection:
      type: single
      prim: mapping
    projections:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required: {}
        optional:
          # A table column may name what it holds. The client chooses font,
          # dimming, alignment and default width from the role; the view only
          # names the field. The set is closed because each role is a drawing
          # choice, not a policy.
          columns:
            type: single
            prim: sequence
            elements:
              type: single
              prim: mapping
              contract:
                root_type: mapping
                required: {}
                optional:
                  role:
                    type: single
                    prim: string
                    enum: [text, id, ref, path, kind, status, time, count, hash, action]
    sections:
      type: single
      prim: sequence
      elements:
        type: single
        prim: mapping
        contract:
          root_type: mapping
          required:
            title: { type: single, prim: string }
            source_channel: { type: single, prim: string }
          optional:
            collection:
              type: union
              prims: [string, mapping]
            projection: { type: single, prim: mapping }
            activate: { type: single, prim: string }
    body:
      type: single
      prim: any
    # Only a node-authored view may name a picture; the daemon drops it from
    # a project-authored view and records the attenuation.
    picture:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required:
          sha256: { type: single, prim: string }
          media_type:
            type: single
            prim: string
            enum: [image/png, image/jpeg, image/webp]
        optional: {}
    presentation:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required: {}
        optional:
          chrome:
            type: single
            prim: string
            enum: [none]
          background:
            type: single
            prim: string
            enum: [transparent]
          position: { type: single, prim: mapping }
    facet:
      type: single
      prim: string
    affordances:
      type: single
      prim: sequence
      elements:
        type: single
        prim: mapping
        contract:
          root_type: mapping
          required:
            id: { type: single, prim: string }
          optional:
            label: { type: single, prim: string }
            category: { type: single, prim: string }
            icon: { type: single, prim: string }
            producer:
              type: single
              prim: string
              enum: [selection, input, tokens]
            requires_project: { type: single, prim: boolean }
            visible_when: { type: single, prim: mapping }
            enabled_when: { type: single, prim: mapping }
            disabled_reason: { type: single, prim: string }
            invoke:
              type: single
              prim: mapping
              contract:
                root_type: mapping
                required:
                  plane:
                    type: single
                    prim: string
                    enum: [ui, rye]
                optional:
                  ref: { type: single, prim: string }
                  args: { type: single, prim: mapping }
                  tokens:
                    type: single
                    prim: sequence
                    elements: { type: single, prim: string }
                  facet: { type: single, prim: string }
                  operation:
                    type: single
                    prim: string
                    enum: [open_saved_view_set, save_active_view_set, save_particular_view_set, save_active_surface, save_particular_surface]
                  persist_affordance: { type: single, prim: string }
                  value: { type: single, prim: any }
                  merge: { type: single, prim: mapping }
                  open_view: { type: single, prim: string }
                  drill: { type: single, prim: boolean }
                  notice: { type: single, prim: string }
    refresh:
      type: single
      prim: mapping
    field_state:
      type: single
      prim: mapping
    input:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required:
          id: { type: single, prim: string }
        optional:
          local_filter: { type: single, prim: boolean }
          placeholder: { type: single, prim: string }
          target_label: { type: single, prim: string }
          submit: { type: single, prim: string }
          command_submit: { type: single, prim: string }
          thread_control: { type: single, prim: string }
          completion:
            type: single
            prim: mapping
            contract:
              root_type: mapping
              required:
                ref: { type: single, prim: string }
              optional:
                collection: { type: single, prim: string }
          mentions:
            type: single
            prim: mapping
            contract:
              root_type: mapping
              required:
                ref: { type: single, prim: string }
                reference: { type: single, prim: string }
              optional:
                collection: { type: single, prim: string }
                label: { type: single, prim: string }
          target:
            type: single
            prim: mapping
            contract:
              root_type: mapping
              required:
                cycle:
                  type: single
                  prim: string
                  enum: [route_chains]
              optional: {}
          feeds:
            type: single
            prim: mapping
            contract:
              root_type: mapping
              required: {}
              optional:
                param: { type: single, prim: string }
                debounce_ms: { type: single, prim: integer }
                fields:
                  type: single
                  prim: sequence
                  elements:
                    type: single
                    prim: mapping
                    contract:
                      root_type: mapping
                      required:
                        param: { type: single, prim: string }
                      optional:
                        label: { type: single, prim: string }
