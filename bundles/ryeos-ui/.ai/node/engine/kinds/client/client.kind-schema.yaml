# ryeos:signed:2026-11-11T02:56:41Z:1a253efd45413e288ebe458b37ce2221597f152a4302c403e91de212fb976667:1zoSuHsOpR2XRyYwfANyETlIB4/7e7qULYYIesyGtWK7t6/oMXWw0fWjZ56rTHtBGpEKEgX2g/5/IYexH3EQAQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "engine/kinds/client"
inventory_policy:
  admission:
    capability_template: "ryeos.execute.{kind}.{bare_id}"
version: "1.0.0"
location:
  directory: clients

effective_trust:
  include_references: false
resolution: []
# Which spaces and trust classes may supply a launch root of this kind.
# Only signed bundles supply this kind; a project or node file is ignored.
launch_trust:
  allowed_spaces: [bundle]
  allowed_trust: [trusted_bundle]
  operator_may_admit: []
execution:
  terminator:
    kind: subprocess
    protocol: protocol:ryeos/core/cli_exec
  thread_profile:
    name: client_run
    root_executable: true
    supports_interrupt: false
    supports_continuation: false
formats:
  - extensions: [".yaml", ".yml"]
    parser: parser:ryeos/core/yaml/yaml
    signature:
      prefix: "#"

composer: handler:ryeos/core/identity

composed_value_contract:
  root_type: mapping
  required:
    launch:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required:
          mode: { type: single, prim: string, enum: [cli_exec, daemon_ui] }
          binary_ref: { type: single, prim: string }
        optional:
          args: { type: single, prim: mapping }
    serves:
      type: single
      prim: mapping
      contract:
        root_type: mapping
        required:
          kind: { type: single, prim: string }
        optional:
          renderer: { type: single, prim: string }
  optional:
    version:
      type: single
      prim: string
    description:
      type: single
      prim: string
    capabilities:
      type: single
      prim: mapping

metadata:
  rules:
    name:
      from: filename
      required: true
      match: filename
    version:
      from: path
      key: version
    description:
      from: path
      key: description
    category:
      from: relative_dir
      required: true
