# ryeos:signed:2026-09-14T10:03:08Z:18197e30192f9289be718e1a57a178ee4519376db29411e7c99c49f484fe77bb:VuSTh3xgsTadPLAFgy+q5EuNLxlP7AomMdnS0belXuelWkNAMAddn8vhrG8PXAK+903JFCbsjk6yhIWC2TRlDQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
kind: client
name: surface-open
version: "1.0.0"
description: >-
  Verb-named terminal surface renderer. The `surface open` alias maps
  to verb `surface-open`, and client.open derives `client:ryeos/surface-open`
  from that verb. This descriptor wires the verb data-drivenly to the
  same TUI launcher that the `tui` verb uses.

serves:
  kind: surface
  renderer: terminal

launch:
  mode: cli_exec
  binary_ref: bin/{triple}/ryeos-tui
  args:
    surface: "--surface"
    surface_file: "--surface-file"
    mock: "--mock"
    project: "--project"

capabilities:
  requires_daemon: true
  owns_tty: true
  interactive: true
