# ryeos:signed:2026-10-19T22:29:40Z:18fcb47d54776b9deb23690b5dd6084cddac2457a15a38320937779ae9a41dbf:FyMpR0lnsqIOGeFCcOTRrr5v+IdpVosbX+BOWTi4nMrkJvhzveC1EQtIARu/zPHu2hAASqOAxv8n1k1iG8+2Ag==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: ryeos-ui-lens
title: Lens
version: "1.0.0"
description: Single-lens composition over the shared presentation model

capabilities:
  sources: ["ryeos.execute.service.*"]
  affordances: ["ryeos.execute.service.*"]

# Shell observations remain explicit on each independently composed surface;
# inheriting the base layout merely to obtain data authority would couple
# layout and execution contracts.
sources:
  dimension:
    ref: service:ui/ryeos-ui/dimension/get
    role: dimension
  projects:
    ref: service:projects/list
    role: projects
  topology:
    ref: service:ui/graph/topology
    role: topology
  items:
    ref: service:ui/ryeos-ui/items/list
    role: items
    params:
      limit: 1000
      project_path: "@session:project_root"
    dynamic_parameters: [query, kind]
    requires_project: true
  file_space:
    ref: service:ui/ryeos-ui/files/tree
    role: file_space
    params:
      root: project
      path: ""
      max_depth: 8
      max_entries: 3000
      project_path: "@session:project_root"
    dynamic_parameters: [root, path]
    requires_project: true
  file_read:
    ref: service:ui/ryeos-ui/files/read
    role: file_read
    params:
      root: project
      project_path: "@session:project_root"
      path: ""
    dynamic_parameters: [root, path]
    activation: on_demand
    requires_project: true
# Single lens: the center holds exactly one tile and opening a view REPLACES
# it rather than splitting. `compute_layout` renders the one tile full-bleed.
tiling:
  mode: single_lens
  master: { side: left, arrange: vertical, ratio: 1.0, count: 1 }
  stack: { arrange: vertical }
  insert: end

# Start with the splash View; opening another View replaces the current lens.
tiles:
  - "view:ryeos/backdrop/splash"

style:
  border: thin

backdrop: view:ryeos/backdrop/prism-shards

# The full lens set as the launcher's tree — each group a foldable header,
# every view under it launchable. Ctrl+←/→ cycles the flattened declared
# order. Views no group lists still surface: the engine appends them under
# path-derived groups, so nothing is unreachable.
library:
  - group: Inspection
    views:
      - view:ryeos/node/status
  - group: Threads
    views:
      - view:ryeos/threads/history
      - view:ryeos/node/threads/history
      - view:ryeos/thread/tree
      - view:ryeos/thread/transcript
      - view:ryeos/threads/detail
  - group: Project
    views:
      - view:ryeos/project/files
      - view:ryeos/project/items
      - view:ryeos/project/schedules
      - view:ryeos/items/space
  - group: Node
    views:
      - view:ryeos/projects/list
      - view:ryeos/node/events
      - view:ryeos/node/remotes
      - view:ryeos/node/bundles
      - view:ryeos/node/gc
      - view:ryeos/graph/topology
      - view:ryeos/commands/grammar

input:
  route:
    requires_project: true
    invoke:
      type: service
      ref: service:threads/input
    bindings:
      input_parameter: input
      thread_target_parameter: target
      interrupt_intent_parameter: intent
    params:
      target:
        kind: fresh
        item_ref: directive:ryeos/ops/base
        project_path: "@session:project_root"
        ref_bindings:
          model: directive:ryeos/ops/base

ambient:
  show_background: true
  opacity: 0.35

affordances:
  - id: view.threads
    label: Threads
    category: View
  - id: view.items
    label: Items
    category: View
  - id: view.files
    label: Files
    category: View
  - id: view.item_inspector
    label: Inspector
    category: View
  - id: view.graph
    label: Graph
    category: View
