# ryeos:signed:2026-09-14T10:03:09Z:a08b6a9314ddc886651fc491f77f1f979b4b5788a6a4db2ba83f00c866610ccb:mq7RZkAl5kd6gO9a5Y9IDIDqyvU79KXvYAGqUfI57ERQpsyOVlnLB57MyF5lIyD6OXOxSNWErJPUrfX7FS2vDw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: ryeos-ui-thread-crystal
version: "1.0.0"
description: Focused thread transcript over the live prism backdrop

capabilities:
  sources: ["ryeos.execute.service.*"]
  affordances: ["ryeos.execute.service.*"]

tiling:
  mode: single_lens
  master: { side: left, arrange: vertical, ratio: 1.0, count: 1 }
  stack: { arrange: vertical }
  insert: end

tiles:
  - "view:ryeos/thread/transcript"

slots:
  bottom: { content: "view:ryeos/input", open: true, size: 7 }
  top:    { content: "view:ryeos/node/status", open: true, size: 3 }

style:
  border: hidden

backdrop: view:ryeos/backdrop/prism-shards

library:
  - group: Threads
    views:
      - view:ryeos/threads/history
      - view:ryeos/node/threads/history
      - view:ryeos/thread/tree
  - group: Node
    views:
      - view:ryeos/node/events

input:
  route:
    requires_project: true
    invoke:
      type: service
      ref: service:threads/input
    bindings:
      input_parameter: input
      thread_target_parameter: target
      interrupt_intent_parameter: intent
    params:
      target:
        kind: fresh
        item_ref: directive:ryeos/ops/base
        project_path: "@session:project_root"
        ref_bindings:
          model: directive:ryeos/ops/base

ambient:
  show_background: true
  opacity: 0.35

affordances:
  - id: view.transcript
    label: Transcript
    category: View
  - id: view.threads
    label: Threads
    category: View
  - id: view.events
    label: Events
    category: View
