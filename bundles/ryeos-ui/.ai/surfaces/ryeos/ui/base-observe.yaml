# ryeos:signed:2026-11-13T09:43:35Z:1e274cf8db6c1364362069b9479228761719c70708036c0804984eb478ca10e0:BGP8nVp6n8CfdTaxHKnWc945zQQvwU4dHuMzMZv52laLKw8hQ3YHSKesvHvAiLNCaaMeLfb/Wi7tdICnOLG7Dg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: ryeos-ui-base-observe
title: Home
version: "2.0.0"
description: Observation-only browser Home over the Assistant's view sets; it reads the node and changes nothing.

extends: surface:ryeos/ui/assistant

capabilities:
  sources:
    - ryeos.execute.service.ui/ryeos-ui/*
    - ryeos.execute.service.node/status
    - ryeos.execute.service.projects/list
    - ryeos.execute.service.events/chain_replay
    - ryeos.execute.service.worker-executions/approvals
  affordances: []

view_sets:
  # Overview is the landing set: projects and sites at the left, the home
  # overview above recent threads and work. The rest are the Assistant's own.
  - schema: 2
    id: overview
    title: Overview
    root:
      type: split
      axis: horizontal
      ratio: 0.22
      first:
        type: group
        label: Projects
        views: ["view:ryeos/projects/list", "view:ryeos/sites/list"]
        active: 0
      second:
        type: split
        axis: vertical
        ratio: 0.6
        first:
          type: group
          views: ["view:ryeos/home/overview"]
          active: 0
        second:
          type: group
          label: Recent
          views: ["view:ryeos/threads/history", "view:ryeos/work/list"]
          active: 0
  - schema: 2
    id: development
    title: Development
    root:
      type: split
      axis: horizontal
      ratio: 0.13
      first:
        type: group
        label: Explorer
        views: ["view:ryeos/development/explorer", "view:ryeos/projects/list", "view:ryeos/project/files", "view:ryeos/sites/list"]
        active: 0
      second:
        type: split
        axis: horizontal
        ratio: 0.7
        first:
          type: group
          label: Worker
          views: ["view:ryeos/thread/conversation", "view:ryeos/thread/transcript", "view:ryeos/work/evidence", "view:ryeos/project/document"]
          active: 0
        second:
          type: split
          axis: vertical
          ratio: 0.55
          first:
            type: group
            label: Changes
            views: ["view:ryeos/development/changes", "view:ryeos/work/candidate", "view:ryeos/work/approvals"]
            active: 0
          second:
            type: group
            label: Execution
            views: ["view:ryeos/development/execution", "view:ryeos/development/occurrence", "view:ryeos/work/children", "view:ryeos/thread/tree"]
            active: 0
  - schema: 2
    id: work
    title: Work
    root:
      type: split
      axis: horizontal
      ratio: 0.22
      first:
        type: group
        label: Work
        views: ["view:ryeos/work/list"]
        active: 0
      second:
        type: group
        label: Detail
        views: ["view:ryeos/work/overview", "view:ryeos/work/children", "view:ryeos/work/evidence", "view:ryeos/work/candidate", "view:ryeos/work/approvals"]
        active: 0
  - schema: 2
    id: review
    title: Review
    root:
      type: group
      views: ["view:ryeos/review/pending", "view:ryeos/review/history"]
      active: 0

