name: ryeos-ui-assistant
version: "3.0.0"
description: Named tiled RyeOS view sets with contextual views and optional supporting slots

extends: surface:ryeos/ui/lens

tiling:
  mode: master_stack

tiles: []
# Explicitly remove the inherited single-lens slots. View-set seeds below
# own their placements; the overview has no global command/input strip.
slots: { top: null, bottom: null, left: null, right: null }

navigation: []
style:
  border: thin
  view_set_tabs: true

view_sets:
  # The first authored set is the initial set for a fresh seat. Keep the
  # principal's durable work list at the left and let one explicit "Talk to
  # work" affordance bind the conversation, changes and execution views to
  # the same placement. No renderer-owned sample project or thread is used.
  - id: development
    title: Development
    root:
      type: split
      axis: horizontal
      ratio: 0.13
      first:
        type: group
        label: Explorer
        views: ["view:ryeos/development/explorer", "view:ryeos/projects/list", "view:ryeos/project/files", "view:ryeos/sites/list"]
        active: 0
      second:
        type: split
        axis: horizontal
        ratio: 0.7
        first:
          type: group
          label: Worker
          views: ["view:ryeos/thread/conversation", "view:ryeos/thread/transcript", "view:ryeos/work/evidence", "view:ryeos/project/document"]
          active: 0
        second:
          type: split
          axis: vertical
          ratio: 0.55
          first:
            type: group
            label: Changes
            views: ["view:ryeos/development/changes", "view:ryeos/work/candidate", "view:ryeos/work/approvals"]
            active: 0
          second:
            type: group
            label: Execution
            views: ["view:ryeos/development/execution", "view:ryeos/work/children", "view:ryeos/thread/tree"]
            active: 0
  - id: overview
    title: Overview
    root:
      type: group
      views: ["view:ryeos/home/overview", "view:ryeos/sites/list", "view:ryeos/programs/list"]
      active: 0
  - id: work
    title: Work
    slots:
      left: { content: "view:ryeos/work/list", open: true, size: 205 }
    root:
      type: group
      views: ["view:ryeos/work/overview", "view:ryeos/work/children", "view:ryeos/work/evidence", "view:ryeos/work/candidate", "view:ryeos/work/approvals"]
      active: 0
  - id: review
    title: Review
    root:
      type: group
      views: ["view:ryeos/review/pending", "view:ryeos/review/history"]
      active: 0

library:
  - group: Assistant
    views:
      - view:ryeos/home/overview
      - view:ryeos/work/list
      - view:ryeos/work/overview
      - view:ryeos/thread/conversation
      - view:ryeos/thread/transcript
      - view:ryeos/thread/tree
      - view:ryeos/work/children
      - view:ryeos/work/evidence
      - view:ryeos/work/approvals
      - view:ryeos/work/candidate
      - view:ryeos/development/explorer
      - view:ryeos/development/changes
      - view:ryeos/development/execution
      - view:ryeos/review/pending
      - view:ryeos/review/history
      - view:ryeos/sites/list
      - view:ryeos/programs/list
  - group: Threads
    views:
      - view:ryeos/threads/history
      - view:ryeos/thread/tree
      - view:ryeos/thread/transcript
      - view:ryeos/threads/detail
  - group: Project
    views:
      - view:ryeos/project/files
      - view:ryeos/project/document
      - view:ryeos/project/items
      - view:ryeos/project/schedules
  - group: Execution
    views:
      - view:ryeos/graph/topology
      - view:ryeos/thread/tree
      - view:ryeos/thread/transcript
      - view:ryeos/work/overview
      - view:ryeos/work/children
      - view:ryeos/work/evidence
      - view:ryeos/work/candidate
      - view:ryeos/work/approvals
      - view:ryeos/development/execution
  - group: Node
    views:
      - view:ryeos/projects/list
      - view:ryeos/node/events
      - view:ryeos/node/remotes
      - view:ryeos/node/bundles
      - view:ryeos/node/gc
