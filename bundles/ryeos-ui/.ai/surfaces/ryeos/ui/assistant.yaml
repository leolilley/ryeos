name: ryeos-ui-assistant
version: "2.0.0"
description: Named tiled RyeOS view sets with contextual views and optional supporting slots

extends: surface:ryeos/ui/lens

tiling:
  mode: master_stack

tiles: []
# Explicitly remove the inherited single-lens slots. View-set seeds below
# own their placements; the overview has no global command/input strip.
slots: { top: null, bottom: null, left: null, right: null }

navigation: []
style:
  border: thin
  view_set_tabs: true

view_sets:
  - id: overview
    title: Overview
    root:
      type: group
      views: ["view:ryeos/home/overview", "view:ryeos/sites/list", "view:ryeos/programs/list"]
      active: 0
  - id: work
    title: Work
    slots:
      left: { content: "view:ryeos/work/list", open: true, size: 30 }
    root:
      type: split
      axis: horizontal
      ratio: 0.68
      first:
        type: group
        views: ["view:ryeos/thread/conversation", "view:ryeos/thread/transcript", "view:ryeos/work/evidence"]
        active: 0
      second:
        type: split
        axis: vertical
        ratio: 0.55
        first:
          type: group
          views: ["view:ryeos/work/candidate", "view:ryeos/work/approvals"]
          active: 0
        second:
          type: group
          views: ["view:ryeos/work/children", "view:ryeos/work/overview"]
          active: 0
  - id: review
    title: Review
    root:
      type: group
      views: ["view:ryeos/review/pending", "view:ryeos/review/history"]
      active: 0

library:
  - group: Assistant
    views:
      - view:ryeos/home/overview
      - view:ryeos/work/list
      - view:ryeos/work/overview
      - view:ryeos/thread/conversation
      - view:ryeos/thread/transcript
      - view:ryeos/thread/tree
      - view:ryeos/work/children
      - view:ryeos/work/evidence
      - view:ryeos/work/approvals
      - view:ryeos/work/candidate
      - view:ryeos/review/pending
      - view:ryeos/review/history
      - view:ryeos/sites/list
      - view:ryeos/programs/list
  - group: Threads
    views:
      - view:ryeos/threads/history
      - view:ryeos/thread/tree
      - view:ryeos/thread/transcript
      - view:ryeos/threads/detail
  - group: Project
    views:
      - view:ryeos/project/files
      - view:ryeos/project/items
      - view:ryeos/project/schedules
  - group: Node
    views:
      - view:ryeos/projects/list
      - view:ryeos/node/events
      - view:ryeos/node/remotes
      - view:ryeos/node/bundles
      - view:ryeos/node/gc
