name: ryeos-ui-base
title: Home
version: "1.0.0"
description: Neutral Home with an authored background; open independently admitted work through the shared launcher.

capabilities:
  sources: []
  affordances: []

# Home observes no domain merely because the browser was opened. Purpose-specific
# Surfaces declare their own Views, sources and operations when admitted.
sources: {}
library: []
affordances: []

tiling:
  mode: master_stack
  master: { side: right, arrange: vertical, ratio: 0.6, count: 1 }
  stack: { arrange: horizontal }
  insert: end

tiles: []

style:
  border: thin

backdrop: view:ryeos/backdrop/prism-shards

ambient:
  show_background: true
  opacity: 0.35
