name: ryeos-ui-base
version: "1.0.0"
description: RyeOS UI home space

capabilities:
  sources: ["ryeos.execute.service.*"]
  affordances: ["ryeos.execute.service.*"]

# Shell-wide observations are ordinary signed sources. Browser and terminal
# clients address these coordinates through the compiled session binding.
sources:
  dimension:
    ref: service:ui/ryeos-ui/dimension/get
    role: dimension
  projects:
    ref: service:projects/list
    role: projects
  topology:
    ref: service:ui/graph/topology
    role: topology
  items:
    ref: service:ui/ryeos-ui/items/list
    role: items
    params:
      limit: 1000
      project_path: "@session:project_root"
    dynamic_parameters: [query, kind]
    requires_project: true
  file_space:
    ref: service:ui/ryeos-ui/files/tree
    role: file_space
    params:
      root: project
      path: ""
      max_depth: 8
      max_entries: 3000
      project_path: "@session:project_root"
    dynamic_parameters: [root, path]
    requires_project: true
  file_read:
    ref: service:ui/ryeos-ui/files/read
    role: file_read
    params:
      root: project
      project_path: "@session:project_root"
      path: ""
    dynamic_parameters: [root, path]
    activation: on_demand
    requires_project: true

tiling:
  mode: master_stack
  master: { side: right, arrange: vertical, ratio: 0.6, count: 1 }
  stack: { arrange: horizontal }
  insert: end

# The base center starts empty — the backdrop scene (below) fills it
# until the operator opens a lens.
tiles: []

slots:
  bottom: { content: "view:ryeos/input", open: true, size: 7 }
  top:    { content: "view:ryeos/node/status", open: true, size: 3 }
  left: { content: "view:ryeos/threads/history", open: false, size: 32 }
  right: { content: "view:ryeos/item/inspector", open: false, size: 40 }

style:
  border: thin

backdrop: view:ryeos/backdrop/prism-shards

library:
  - group: Threads
    views:
      - view:ryeos/threads/history
      - view:ryeos/node/threads/history
      - view:ryeos/thread/tree
      - view:ryeos/thread/transcript
      - view:ryeos/threads/detail
  - group: Project
    views:
      - view:ryeos/project/files
      - view:ryeos/project/items
      - view:ryeos/project/schedules
      - view:ryeos/items/space
  - group: Node
    views:
      - view:ryeos/projects/list
      - view:ryeos/node/events
      - view:ryeos/node/remotes
      - view:ryeos/node/bundles
      - view:ryeos/node/gc
      - view:ryeos/commands/grammar

overlays:
  views:
    title: Views
    widget: table
    columns: [View, Description]
    source: { ref: "runtime:views/launchable" }
    hint: "type to filter views · enter to open · shift+enter for new tile"
  commands:
    title: Commands
    widget: palette
    source: { ref: "runtime:commands/available" }
    hint: "type to filter commands · enter to run"
  help:
    title: Help
    widget: table
    columns: [Topic, Open]
    source: { ref: "runtime:help" }
    hint: "type to filter help · esc to close"
  shortcuts:
    title: Shortcuts
    widget: table
    columns: [Keys, Intent]
    source: { ref: "runtime:shortcuts" }
    hint: "type to filter shortcuts · esc to close"

input:
  route:
    requires_project: true
    invoke:
      type: service
      ref: service:threads/input
    bindings:
      input_parameter: input
      thread_target_parameter: target
      interrupt_intent_parameter: intent
    params:
      target:
        kind: fresh
        item_ref: directive:ryeos/ops/base
        project_path: "@session:project_root"
        ref_bindings:
          model: directive:ryeos/ops/base

ambient:
  show_background: true
  opacity: 0.35

affordances:
  - id: view.graph
    label: Graph
    category: View
  - id: view.items
    label: Items
    category: View
  - id: view.files
    label: Files
    category: View
  - id: view.item_inspector
    label: Inspector
    category: View
  - id: view.threads
    label: Threads
    category: View
  - id: view.services
    label: Services
    category: View
