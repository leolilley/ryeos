# ryeos:signed:2026-11-08T06:41:17Z:526f0e9658d8248e5de539b306b2dc03a8f52f5e7b06216ceea6dec9d97c4ae5:KlV/FnfrkFBGv6qKHLTrdZAcBatFjtBCoN66kHFmVdyfcqBbd+xYC1SCzB1ejiFWODzXnfIFLhDwe6sLRM+DCw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: ryeos-ui-node
title: Node
version: "1.0.0"
description: Admitted node inspection with explicit execution subjects, registered project navigation and bounded maintenance observations

capabilities:
  sources:
    - ryeos.execute.service.node/status
    - ryeos.execute.service.bundle/list
    - ryeos.execute.service.projects/list
    - ryeos.execute.service.commands/list
    - ryeos.execute.service.ui/ryeos-ui/threads/list
    - ryeos.execute.service.ui/ryeos-ui/thread/inspect
    - ryeos.execute.service.ui/ryeos-ui/thread/tree
    - ryeos.execute.service.ui/ryeos-ui/node/activity
    - ryeos.execute.service.ui/ryeos-ui/item/inspect
    - ryeos.execute.service.ui/ryeos-ui/remotes/list
    - ryeos.execute.service.ui/ryeos-ui/gc/status
  affordances:
    - ryeos.execute.service.projects/open
    - ryeos.execute.service.projects/add

tiling:
  mode: master_stack
  master: { side: left, arrange: vertical, ratio: 0.5, count: 1 }
  stack: { arrange: vertical }
  insert: end

tiles:
  - "view:ryeos/node/threads/history"
  - "view:ryeos/projects/list"
  - "view:ryeos/node/events"

style:
  border: thin


library:
  - group: Inspection
    views:
      - view:ryeos/node/status
      - view:ryeos/item/inspector
  - group: Threads
    views:
      - view:ryeos/node/threads/history
      - view:ryeos/thread/tree
  - group: Node
    views:
      - view:ryeos/projects/list
      - view:ryeos/node/events
      - view:ryeos/node/remotes
      - view:ryeos/node/bundles
      - view:ryeos/node/gc
      - view:ryeos/commands/grammar

