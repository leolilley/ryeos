# ryeos:signed:2026-09-14T10:03:09Z:e2fe56953e5792d4e02410ade6828776e8d60a2e4651df0aede8f6653ea84ac2:tVdw7DqFpwcNYXhm8Ku4SSy0IIe6I7B1m9FGFIFZJieF8j786Rfommu+aRpKAJFTJi6wafl4sey9h4C9pYDtBQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: ryeos-ui-project
version: "1.0.0"
description: Active project explorer for files, signed items, and related execution

capabilities:
  sources: ["ryeos.execute.service.*"]
  affordances: ["ryeos.execute.service.*"]

tiling:
  mode: master_stack
  master: { side: left, arrange: vertical, ratio: 0.46, count: 1 }
  stack: { arrange: vertical }
  insert: end

tiles:
  - "view:ryeos/project/files"
  - "view:ryeos/project/items"
  - "view:ryeos/threads/history"
  - "view:ryeos/runs/comparison"

slots:
  bottom: { content: "view:ryeos/input", open: true, size: 7 }
  top:    { content: "view:ryeos/node/status", open: true, size: 3 }
  right:  { content: "view:ryeos/item/inspector", open: false, size: 40 }

style:
  border: thin

backdrop: view:ryeos/backdrop/prism-shards

library:
  - group: Threads
    views:
      - view:ryeos/threads/history
      - view:ryeos/thread/tree
      - view:ryeos/runs/comparison
  - group: Project
    views:
      - view:ryeos/project/files
      - view:ryeos/project/items
      - view:ryeos/project/schedules
      - view:ryeos/items/space

input:
  route:
    requires_project: true
    invoke:
      type: service
      ref: service:threads/input
    bindings:
      input_parameter: input
      thread_target_parameter: target
      interrupt_intent_parameter: intent
    params:
      target:
        kind: fresh
        item_ref: directive:ryeos/ops/base
        project_path: "@session:project_root"
        ref_bindings:
          model: directive:ryeos/ops/base

ambient:
  show_background: true
  opacity: 1.0

affordances:
  - id: view.files
    label: Files
    category: View
  - id: view.items
    label: Items
    category: View
  - id: view.threads
    label: Threads
    category: View
  - id: view.schedules
    label: Schedules
    category: View
  - id: view.item_inspector
    label: Inspector
    category: View
