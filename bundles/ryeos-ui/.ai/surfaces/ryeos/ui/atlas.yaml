name: ryeos-ui-atlas
version: "1.0.0"
description: RyeOS UI with a Three.js 2D namespace atlas background

capabilities:
  sources: ["ryeos.execute.service.*"]
  affordances: ["ryeos.execute.service.*"]

# Shell observations remain explicit on each independently composed surface;
# inheriting the base layout merely to obtain data authority would couple
# layout and execution contracts.
sources:
  dimension:
    ref: service:ui/ryeos-ui/dimension/get
    role: dimension
  projects:
    ref: service:projects/list
    role: projects
  topology:
    ref: service:ui/graph/topology
    role: topology
  items:
    ref: service:ui/ryeos-ui/items/list
    role: items
    params:
      limit: 1000
      project_path: "@session:project_root"
    dynamic_parameters: [query, kind]
    requires_project: true
  file_space:
    ref: service:ui/ryeos-ui/files/tree
    role: file_space
    params:
      root: project
      path: ""
      max_depth: 8
      max_entries: 3000
      project_path: "@session:project_root"
    dynamic_parameters: [root, path]
    requires_project: true
  file_read:
    ref: service:ui/ryeos-ui/files/read
    role: file_read
    params:
      root: project
      project_path: "@session:project_root"
      path: ""
    dynamic_parameters: [root, path]
    activation: on_demand
    requires_project: true
tiling:
  mode: master_stack
  master: { side: right, arrange: vertical, ratio: 0.6, count: 1 }
  stack: { arrange: horizontal }
  insert: end

tiles: []

slots:
  bottom: { content: "view:ryeos/input", open: true, size: 7 }
  left: { content: "view:ryeos/threads/history", open: false, size: 32 }
  right: { content: "view:ryeos/item/inspector", open: false, size: 40 }

style:
  border: thin

ambient:
  show_background: true
  opacity: 1.0
  mode: namespace_atlas
  atlas:
    style: flat_2d

affordances:
  - id: view.graph
    label: Graph
    category: View
  - id: view.atlas
    label: Atlas
    category: View
  - id: view.items
    label: Items
    category: View
  - id: view.files
    label: Files
    category: View
  - id: view.item_inspector
    label: Inspector
    category: View
  - id: view.threads
    label: Threads
    category: View
  - id: view.services
    label: Services
    category: View
