# ryeos:signed:2026-10-19T22:29:40Z:bb0ec143e878661f427cf39de94da42c0253ff764ebf50ad6afe495db3f0dae4:vXHIY4jkrCRlaOYGReqicewXkbN6HE9IxNa3HkPK2IK/j80AmEHbEEsVdpYBWjO+b8nAFZrFhfZqA1M3EjRGCg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
name: ryeos-ui-thread
title: Thread
version: "1.0.0"
description: Directive thread — watch and drive a single execution stream

capabilities:
  sources: ["ryeos.execute.service.*"]
  affordances: ["ryeos.execute.service.*"]

# Transcript inspection; conversation input is owned by an explicitly mounted View.
tiling:
  mode: master_stack
  master: { side: left, arrange: vertical, ratio: 1.0, count: 1 }
  stack: { arrange: vertical }
  insert: end

tiles:
  - "view:ryeos/thread/transcript"

style:
  border: thin

library:
  - group: Inspection
    views:
      - view:ryeos/item/inspector
  - group: Threads
    views:
      - view:ryeos/threads/history
      - view:ryeos/node/threads/history
      - view:ryeos/thread/tree
  - group: Project
    views:
      - view:ryeos/project/files
      - view:ryeos/project/items
      - view:ryeos/project/schedules
  - group: Node
    views:
      - view:ryeos/projects/list
      - view:ryeos/node/events

input:
  route:
    requires_project: true
    invoke:
      type: service
      ref: service:threads/input
    bindings:
      input_parameter: input
      thread_target_parameter: target
      interrupt_intent_parameter: intent
    params:
      target:
        kind: fresh
        item_ref: directive:ryeos/ops/base
        project_path: "@session:project_root"
        ref_bindings:
          model: directive:ryeos/ops/base

ambient:
  show_background: true
  opacity: 1.0

affordances:
  - id: view.threads
    label: Threads
    category: View
  - id: view.item_inspector
    label: Inspector
    category: View
