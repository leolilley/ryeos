category: codex/guest-runtime
version: "1.0.0"
description: Produce a credential-free guest occurrence owner from this bundle's signed executable
executor_id: "@subprocess"
execution_protocol: protocol:ryeos/core/opaque
effects: live
filesystem_authority: captured_execution
network_authority: isolated
external_content:
