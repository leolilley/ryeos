category: codex/qualification
version: "1.0.0"
description: >-
  Check the actual qualification command and an independent diagnostic through restricted daemon
  callbacks; propose finite claims for issuer corroboration. Runs as an ordinary node_policy tool, not
  captured_execution: it produces no filesystem product to capture and reads only its pinned read-only
  project root plus its admitted content and product slots, and captured execution requires enforced
  isolation, which the node this variant is selected on does not have. This is the verifier of the
  trusted variant (a node that does not enforce isolation and accepts trusted process-group sessions):
  it checks worker:codex/external-hosted-authoring-trusted-lane, which holds node_policy filesystem
  authority.
executor_id: "@subprocess"
execution_protocol: protocol:ryeos/core/qualification_consumer_callback
effects: live
# node_policy, not captured_execution: captured execution requires enforced isolation, which the node this variant is
# selected on lacks. This verifier produces no filesystem product, reads only its pinned read-only project root and
# admitted mounts, and does all of its work through the callback protocol.
filesystem_authority: node_policy
# The verifier runs against the exact pinned snapshot its subject was captured from, a pushed-head project source;
# the qualification callback protocol admits that only to a tool that declares it here.
project_lane: pinned_snapshot
required_caps: []
external_content:
  # Pinned musl CPython tree that runs the semantic checker; its members are
  # selected by the finite product contract passed in `args`.
  - id: checker-runtime
    kind: tree
    mode: pinned
    digest: 800d4969489634cc3bbc5774bd9e99a330cdc23bbc1fd0fd231ec6a88ca9acdf
    mount_root: execution_runtime
    mount: checker-runtime
external_product_slots:
  # The verifier inspects the unqualified witness through its own existing
  # composition edge. This does not admit the ordinary authoring Worker.
  - id: subject
    relationship_ref: config:codex/guest-runtime-products
    relationship: runtime_to_qualification_verifier_trusted_lane
    kind: tree
    mount_root: execution_runtime
    mount: codex-guest-runtime
  # The retained semantic checker source, selected by manifest hash in the
  # finite product contract.
  - id: checker-code
    relationship_ref: config:codex/semantic-checker-code-products
    relationship: checker_code_to_consumer_verifier_trusted_lane
    kind: tree
    mount_root: execution_runtime
    mount: checker-code
