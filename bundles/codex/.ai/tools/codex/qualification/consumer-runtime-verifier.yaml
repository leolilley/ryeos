# ryeos:signed:2026-11-11T17:22:18Z:2b13898d26fbdec87c09271b04b6a951078f188abcac23ca916ea6fdf605c553:pQ2SFKIMV+m+vLGo45tlyBkj+nckT8cRaMK60G262SBwGMtdKbpNR78H3DCRKU0Sh6bGdodk0KKIfmpVFNdfAQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: codex/qualification
version: "1.0.0"
description: >-
  Check the actual qualification command and an independent diagnostic through restricted daemon
  callbacks; propose finite claims for issuer corroboration. Runs as a captured_execution tool: it
  produces no filesystem product to capture and reads only its pinned read-only project root plus its
  admitted content and product slots. Its authority channel is the daemon callback, admitted to captured
  execution only because its protocol declares the captured-compatible callback class. This is the
  verifier of the contained variant: it checks worker:codex/external-hosted-authoring, which holds
  captured filesystem authority over a contained session.
executor_id: "@subprocess"
execution_protocol: protocol:ryeos/core/qualification_consumer_callback
effects: live
# captured_execution: this verifier produces no filesystem product, reads only its pinned read-only project root and
# admitted mounts, and does all of its work through the callback protocol, whose captured-compatible class admits
# exactly the daemon socket and the closed consumer-verification surface.
filesystem_authority: captured_execution
# The verifier runs against the exact pinned snapshot its subject was captured from, a pushed-head project source;
# the qualification callback protocol admits that only to a tool that declares it here.
project_lane: pinned_snapshot
required_caps: []
external_content:
  # Pinned musl CPython tree that runs the semantic checker; its members are
  # selected by the finite product contract passed in `args`.
  - id: checker-runtime
    kind: tree
    mode: pinned
    digest: 800d4969489634cc3bbc5774bd9e99a330cdc23bbc1fd0fd231ec6a88ca9acdf
    mount_root: execution_runtime
    mount: checker-runtime
external_product_slots:
  # The verifier inspects the unqualified witness through its own existing
  # composition edge. This does not admit the ordinary authoring Worker.
  - id: subject
    relationship_ref: config:codex/guest-runtime-products
    relationship: runtime_to_qualification_verifier
    kind: tree
    mount_root: execution_runtime
    mount: codex-guest-runtime
  # The retained semantic checker source, selected by manifest hash in the
  # finite product contract.
  - id: checker-code
    relationship_ref: config:codex/semantic-checker-code-products
    relationship: checker_code_to_consumer_verifier
    kind: tree
    mount_root: execution_runtime
    mount: checker-code
config:
  command: bin:codex-runtime-verifier
  # Immutable signed product data, separate from policy stdin. Regenerate the
  # third argument with lib/product-contract/build.py; never edit it by hand.
