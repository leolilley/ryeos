category: codex/qualification
version: "1.0.0"
description: Check the actual Q command and independent diagnostic through restricted daemon callbacks; propose finite claims for issuer corroboration.
executor_id: "@subprocess"
execution_protocol: protocol:ryeos/core/qualification_consumer_callback
effects: live
filesystem_authority: captured_execution
required_caps: []
external_product_slots:
  # The verifier inspects the unqualified witness through its own existing
  # composition edge. This does not admit the ordinary authoring Worker.
  - id: subject
    relationship_ref: config:codex/guest-runtime-products
    relationship: runtime_to_qualification_verifier
    kind: tree
    mount_root: execution_runtime
    mount: codex-guest-runtime
config:
  command: bin:codex-runtime-verifier
  args: [--consumer-controller]
  input_data: "${params_json}"
  timeout_secs: 300
config_schema:
  type: object
  additionalProperties: false
  required: [schema, controller, expected_command_output, responses_origin, outer_network, qualification_worker, external_candidate_qualification_context]
  properties:
    schema: {type: string, enum: [ryeos.codex.consumer_verifier.v4]}
    controller:
      type: object
      additionalProperties: false
      required: [scenario_id, maximum_duration_ms]
      properties:
        scenario_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        maximum_duration_ms: {type: integer, minimum: 1, maximum: 300000}
    expected_command_output: {type: string}
    responses_origin: {type: string}
    outer_network: {type: string, enum: [shared_guest_loopback]}
    qualification_worker:
      type: object
      additionalProperties: false
      required: [schema, environment_id, command, command_shell, command_presentation, cwd, output, exit_code, expected_final_content_b64]
      properties:
        schema: {type: string, enum: [ryeos.codex.q_command.v3]}
        environment_id: {type: string, enum: [ryeos-external-candidate]}
        command: {type: string, minLength: 1, maxLength: 4096}
        command_shell: {type: string, minLength: 1, maxLength: 1024}
        command_presentation: {type: string, minLength: 1, maxLength: 4096}
        cwd: {type: string, enum: [/workspace]}
        output: {type: string, minLength: 1, maxLength: 16384}
        exit_code: {type: integer, enum: [0]}
        expected_final_content_b64: {type: [string, "null"], maxLength: 87384}
    # The typed admitted-use parser checks this exact value against the sealed
    # purpose. It is data agreement, never caller-created admission authority.
    external_candidate_qualification_context: {type: object}
