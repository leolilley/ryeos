# ryeos:signed:2026-10-30T21:07:10Z:2a359cd804d41ffa6260c9462000a3158d5f764bdb53ec5f85943d1f9c706267:z3aQ7otyAyDYIaDfWc6X+quHIeS9CIMJFNK6VKkSfJ7oXat+bCLbz1CaWF2Pk8q9LAhtqgdviLywImxoHNTWAg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: codex/qualification
version: "1.0.0"
description: >-
  Prove in a restored guest, under an ephemeral key, that the subject guest owner speaks the pinned
  guest-inputs and launcher wire schemas; the claim binds the subject's owner executable digest and
  manifest hash, never the ephemeral probe manifest. The measured owner, supervisor and launcher
  executables performed the exchange under an ephemeral controller key and test configuration;
  operation under the real controller key, connection and credentials is proved by a live session, not
  by this claim. Runs as an ordinary node_policy tool, not captured_execution: it produces no
  filesystem product to capture, it reads only its pinned read-only project root plus its admitted
  content and product slots, and its authority channel is the daemon callback, which captured
  execution refuses by rule. Captured execution also requires an enforced isolation lane, while the
  Codex session it checks runs on the trusted process-group lane.
executor_id: "@subprocess"
execution_protocol: protocol:ryeos/core/qualification_consumer_callback
effects: live
# node_policy, not captured_execution: captured execution bounds the filesystem products of a tool under enforced
# isolation and may never hold daemon callback authority. This verifier produces no filesystem product, reads only
# its pinned read-only project root and admitted mounts, and does all of its work through the callback protocol.
filesystem_authority: node_policy
required_caps: []
external_product_slots:
  # The verifier inspects the unqualified guest owner through its own
  # composition edge; the product never leaves the node.
  - id: subject
    relationship_ref: config:codex/guest-owner-runtime-products
    relationship: owner_to_guest_wire_verifier
    kind: tree
    mount_root: execution_runtime
    mount: guest-owner-runtime
config:
  command: bin:codex/ryeos-guest-wire-verifier
  args: [--remote-probe-controller]
  input_data: "${params_json}"
  timeout_secs: 300
config_schema:
  type: object
  additionalProperties: false
  required: [schema, controller, claims_on_success, guest_inputs_schema, launcher_spec_schema]
  properties:
    schema: {type: string, enum: [ryeos.guest_wire_verifier.v1]}
    controller:
      type: object
      additionalProperties: false
      required: [scenario_id, maximum_duration_ms]
      properties:
        scenario_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        maximum_duration_ms: {type: integer, minimum: 1, maximum: 300000}
    claims_on_success:
      type: array
      items: {type: string, minLength: 1, maxLength: 128}
      minItems: 1
      maxItems: 8
    guest_inputs_schema: {type: integer, minimum: 1}
    launcher_spec_schema: {type: integer, minimum: 1}
