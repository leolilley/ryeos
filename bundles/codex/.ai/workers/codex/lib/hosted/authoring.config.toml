forced_login_method = "chatgpt"
cli_auth_credentials_store = "file"
model_provider = "openai"
mcp_servers = {}
check_for_update_on_startup = false
approval_policy = "on-request"
approvals_reviewer = "user"
# Pinned Codex 0.147.0 split-filesystem profile. Permission profiles do not
# compose with legacy sandbox_mode settings, so none are present here.
default_permissions = "ryeos-workspace-only"
web_search = "disabled"
allow_login_shell = false

[shell_environment_policy]
# Start from the bridge's admitted environment, then keep only this finite
# child-facing surface. `core` drops the broker endpoint before filters run.
inherit = "all"
ignore_default_excludes = false

[shell_environment_policy.filters]
"PATH" = "include"
"LANG" = "include"
"LC_ALL" = "include"
"LC_CTYPE" = "include"
"TERM" = "include"
"TZ" = "include"
"TMPDIR" = "include"
"GIT_CONFIG_NOSYSTEM" = "include"
"GIT_CONFIG_GLOBAL" = "include"
"GIT_PAGER" = "include"
"HOME" = "exclude"
"CODEX_HOME" = "exclude"
"DBUS_*" = "exclude"
"SSH_*" = "exclude"
"*PROXY" = "exclude"

[permissions.ryeos-workspace-only]
extends = ":workspace"

[permissions.ryeos-workspace-only.filesystem]
":root" = "deny"
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "deny"
# Process resources are pinned read-only runtime inputs, never project files.
"/ryeos/realizations/codex" = "read"
"/ryeos/realizations/codex-code-mode-host" = "read"
"/ryeos/realizations/codex-resources/bwrap" = "read"
"/ryeos/realizations/codex-resources/zsh/bin/zsh" = "read"
"/ryeos/realizations/codex-path/rg" = "read"
"/ryeos/realizations/authoring-tools" = "read"

[permissions.ryeos-workspace-only.filesystem.":workspace_roots"]
".ai/cache/ryeos-runtime" = "read"

[permissions.ryeos-workspace-only.network]
enabled = false

[agents]
enabled = false

[features]
apps = false
remote_plugin = false
hooks = false
multi_agent = false
memories = false
network_proxy = false
# RyeOS presents admitted executions as direct dynamic tools. Advertising the
# separate JavaScript host would make Codex request an unimplemented `exec`.
code_mode_host = false

[features.code_mode]
enabled = false
