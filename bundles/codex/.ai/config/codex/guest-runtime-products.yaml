category: codex
version: "1.0.0"
description: Retained exact Codex guest executable product
build_products:
  schema: ryeos.build_products.v1
  output_roots:
    - name: runtime
      path: products/codex-guest-runtime
      storage: large_content
      bounds:
        maximum_entries: 3
        maximum_depth: 3
        maximum_file_bytes: 268435456
        maximum_total_bytes: 268435456
  products:
    - name: runtime
      source: {kind: workspace_output, root: runtime}
      path: products/codex-guest-runtime
      shape: tree
      storage: large_content
      required: true
      bounds:
        maximum_entries: 3
        maximum_depth: 3
        maximum_file_bytes: 268435456
        maximum_total_bytes: 268435456
product_relationships:
  schema: ryeos.product_relationships.v1
  relationships:
    # Qualification roots must be able to inspect an unqualified subject.
    # Keep this distinct from the ordinary Worker's evidence-gated edge.
    - name: runtime_to_qualification_verifier
      producer:
        canonical_ref: graph:codex/guest-runtime-production
        recipe_binding: product_recipe
        product_name: runtime
        parameters: {}
      consumer:
        canonical_ref: tool:codex/qualification/consumer-runtime-verifier
        declaration_id: subject
      required_product:
        shape: tree
        storage: large_content
        bounds:
          maximum_entries: 3
          maximum_depth: 3
          maximum_file_bytes: 268435456
          maximum_total_bytes: 268435456
      qualification:
        policy_ref: null
        required_claims: []
    - name: runtime_to_external_authoring_worker
      producer:
        canonical_ref: graph:codex/guest-runtime-production
        recipe_binding: product_recipe
        product_name: runtime
        parameters: {}
      consumer:
        canonical_ref: worker:codex/external-hosted-authoring
        declaration_id: guest-runtime
      required_product:
        shape: tree
        storage: large_content
        bounds:
          maximum_entries: 3
          maximum_depth: 3
          maximum_file_bytes: 268435456
          maximum_total_bytes: 268435456
      # The five candidate/lifecycle claims an independent runtime qualification
      # must establish before a worker can select this product.
      qualification:
        policy_ref: config:codex/consumer-qualification-policy
        required_claims:
          - bounded_candidate_capture
          - candidate_only_execution
          - controller_credential_exclusion
          - native_writer_exclusion
          - no_local_execution_fallback
    # Verifier of the trusted variant; see runtime_to_qualification_verifier.
    - name: runtime_to_qualification_verifier_trusted_lane
      producer:
        canonical_ref: graph:codex/guest-runtime-production
        recipe_binding: product_recipe
        product_name: runtime
        parameters: {}
      consumer:
        canonical_ref: tool:codex/qualification/consumer-runtime-verifier-trusted-lane
        declaration_id: subject
      required_product:
        shape: tree
        storage: large_content
        bounds:
          maximum_entries: 3
          maximum_depth: 3
          maximum_file_bytes: 268435456
          maximum_total_bytes: 268435456
      qualification:
        policy_ref: null
        required_claims: []
    # Trusted variant sibling of runtime_to_external_authoring_worker.
    - name: runtime_to_external_authoring_worker_trusted_lane
      producer:
        canonical_ref: graph:codex/guest-runtime-production
        recipe_binding: product_recipe
        product_name: runtime
        parameters: {}
      consumer:
        canonical_ref: worker:codex/external-hosted-authoring-trusted-lane
        declaration_id: guest-runtime
      required_product:
        shape: tree
        storage: large_content
        bounds:
          maximum_entries: 3
          maximum_depth: 3
          maximum_file_bytes: 268435456
          maximum_total_bytes: 268435456
      # The five candidate/lifecycle claims an independent runtime qualification
      # must establish before a worker can select this product.
      qualification:
        policy_ref: config:codex/consumer-qualification-policy-trusted-lane
        required_claims:
          - bounded_candidate_capture
          - candidate_only_execution
          - controller_credential_exclusion
          - native_writer_exclusion
          - no_local_execution_fallback
