category: codex
version: "1.0.0"
description: Retained exact Codex guest executable product
build_products:
  schema: ryeos.build_products.v1
  output_roots:
    - name: runtime
      path: products/codex-guest-runtime
      storage: large_content
      bounds:
        maximum_entries: 3
        maximum_depth: 3
        maximum_file_bytes: 268435456
        maximum_total_bytes: 268435456
  products:
    - name: runtime
      source: {kind: workspace_output, root: runtime}
      path: products/codex-guest-runtime
      shape: tree
      storage: large_content
      required: true
      bounds:
        maximum_entries: 3
        maximum_depth: 3
        maximum_file_bytes: 268435456
        maximum_total_bytes: 268435456
product_relationships:
  schema: ryeos.product_relationships.v1
  relationships:
    # Qualification roots must be able to inspect an unqualified subject.
    # Keep this distinct from the ordinary Worker's evidence-gated edge.
    - name: runtime_to_qualification_verifier
      producer:
        canonical_ref: graph:codex/guest-runtime-production
        recipe_binding: product_recipe
        product_name: runtime
        parameters: {}
      consumer:
        canonical_ref: tool:codex/qualification/consumer-runtime-verifier
        declaration_id: subject
      required_product:
        shape: tree
        storage: large_content
        bounds:
          maximum_entries: 3
          maximum_depth: 3
          maximum_file_bytes: 268435456
          maximum_total_bytes: 268435456
      qualification:
        policy_ref: null
        required_claims: []
    - name: runtime_to_external_authoring_worker
      producer:
        canonical_ref: graph:codex/guest-runtime-production
        recipe_binding: product_recipe
        product_name: runtime
        parameters: {}
      consumer:
        canonical_ref: worker:codex/external-hosted-authoring
        declaration_id: guest-runtime
      required_product:
        shape: tree
        storage: large_content
        bounds:
          maximum_entries: 3
          maximum_depth: 3
          maximum_file_bytes: 268435456
          maximum_total_bytes: 268435456
      # This relationship intentionally cannot admit external execution yet.
      # An independent runtime qualification must establish the five required
      # candidate/lifecycle claims before a worker can select it; the policy
      # it will name is populated by the consumer-context merge on a node
      # that holds the captured runtime, then signed.
      qualification:
        policy_ref: null
        required_claims: []
