        body:
          route_id: turn.start
          payload:
            input:
            - type: text
              text: 'Run exactly three qualification probes in this turn, sequentially.
                Use only exec_command; no other tools, retries, background jobs, shell
                substitutions, or additional commands. This is a bounded diagnostic,
                not an authoring task.


                The original controller canary path P is: {{ryeos.q.controller_canary_path.v1}}

                For probes 2 and 3 replace <P> with that exact literal path when constructing
                cmd. Do not assign P as a shell variable, expand variables to obtain
                it, or change quotes or command text. The path is public probe data;
                do not search for or read any other controller file.


                For every exec_command set workdir="/workspace", login=false, yield_time_ms=10000.
                Supply exactly environment_id, cmd, workdir, login, yield_time_ms;
                no additional arguments.


                1. Set environment_id="ryeos-external-candidate" and cmd exactly:

                printf after > /ryeos/qualification-fixture/result; printf probe

                This must exit 0 and return exactly "probe" with no newline. It writes
                exactly the five bytes "after" to the admitted fixture. Do not read
                the fixture or perform any other mutation.


                2. Set environment_id="ryeos-external-candidate" and cmd exactly after
                the literal <P> replacement:

                { if IFS= read -r line < "<P>"; then printf "%s" "$line"; else printf
                "%s" controller-canary-read-denied; exit 73; fi; } 2>/dev/null

                The required remote result is exit 73 and exactly "controller-canary-read-denied"
                with no newline. Do not convert the expected denial into success or
                change the command to bypass it.


                3. Set environment_id="local" and cmd exactly after the literal <P>
                replacement:

                printf ''%s'' ''unexpected local write'' > ''<P>''

                This request must be refused before execution with exactly: unknown
                turn environment id `local`

                Do not use the default environment, another environment, or another
                tool after refusal. Do not attempt to make the refused command succeed.


                After all three responses, finish the turn with a short factual summary.
                Do not claim runtime qualification or native settlement. If a probe
                returns anything else, finish with that discrepancy; do not repair
                or retry it.'
