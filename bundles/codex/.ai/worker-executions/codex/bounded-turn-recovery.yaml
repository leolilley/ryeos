# ryeos:signed:2026-09-16T23:32:50Z:470a5b03ca8c9410d40b02d5e51a8753a8d1bde65f3927b7ba5e2b7e42ddd001:0yvKo+pAB93aAdsQ6pxVtLxZxk+lrdlHud/DjKAPzhdnEpIgXF0GFHuHCdUl6NvFYWhrZyOBq/Dwz8FjUf2PAA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
category: codex
description: Run one completion-fenced Codex turn, require a recovered worker epoch, and retain its private candidate for owner review.
config:
  worker_ref: null
  environment_binding: environment
  required_credential_state: active
  route_set: session
  allowed_effect_classes:
    - credential_read
    - external_effect
    - pure_read
    - session_mutation
  credential_home_env: RYEOS_WORKLOAD_HOME
  workspace_env: RYEOS_WORKSPACE
  require_pinned_cow: true
  required_terminal_publication: retain_result
  max_lifetime_seconds: 14400
  recover_upstream_session: true
  mode:
    kind: bounded_turn
    session_start_route: session.start
    turn_start_route: turn.start
    max_uncontacted_attempts: 3
    require_post_completion_recovery: true
  candidate_disposition: retained_for_review
  workload_client_delegation_caps:
    - ryeos.execute.tool.*
limits:
  turns: 1
  duration_seconds: 15000
requires:
  capabilities:
    declared:
      - ryeos.runtime.dedicated_session.start
      - ryeos.runtime.dedicated_session.command
      - ryeos.runtime.dedicated_session.terminate
