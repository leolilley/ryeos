version: "1.0.0"
category: codex
description: Open one short-lived RyeOS-owned Codex credential-enrollment execution on an explicitly trusted process-group node.
config:
  worker_ref: worker:codex/trusted-hosted
  environment_binding: null
  required_credential_state: any
