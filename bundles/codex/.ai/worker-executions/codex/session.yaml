version: "1.0.0"
category: codex
description: Open one RyeOS-owned Codex session against an immutable project generation.
config:
  worker_ref: worker:codex/hosted
  required_credential_state: active
  route_set: session
  allowed_effect_classes:
    - external_effect
    - pure_read
    - session_mutation
  credential_home_env: RYEOS_WORKLOAD_HOME
  workspace_env: RYEOS_WORKSPACE
