version: "1.0.0"
category: codex
description: Open one short-lived RyeOS-owned Codex credential-enrollment execution.
config:
  worker_ref: worker:codex/hosted
  required_credential_state: any
  route_set: enrollment
  allowed_effect_classes:
    - credential_read
    - credential_write
    - pure_read
  credential_home_env: RYEOS_WORKLOAD_HOME
  workspace_env: RYEOS_WORKSPACE
  require_pinned_cow: false
  required_terminal_publication: any
  max_lifetime_seconds: 1500
  recover_upstream_session: false
limits:
  duration_seconds: 1800
requires:
  capabilities:
    declared:
      - ryeos.runtime.dedicated_session.start
      - ryeos.runtime.dedicated_session.command
      - ryeos.runtime.dedicated_session.terminate
