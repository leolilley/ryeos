tokens: [codex, session, start]
description: "Start a pinned-project Codex session; --async and --pin-project are required"
help:
  usage: "ryeos --project <path> codex session start <credential-profile-id> --async --pin-project"
  examples:
    - "ryeos --project . codex session start personal --async --pin-project"
forms:
  - slots:
      - field: credential_profile_id
project:
  resolution: required
  default: discover_upward_ai
  request_project_path: true
parameter_binding:
  mode: tail_object
  flag_key_normalization: hyphen_to_underscore
control_flags:
  - flag: async
    help: "Return after durable accepted launch"
    binding: launch_mode_accepted
  - flag: pin-project
    help: "Capture the project into a retained copy-on-write generation"
    binding: pin_project_at_admission
dispatch:
  kind: execute_ref
  execute: worker_execution:codex/session
  availability: daemon
