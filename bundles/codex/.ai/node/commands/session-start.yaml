tokens: [codex, session, start]
description: "Start a Codex session from the principal's pushed project HEAD; --current-head is required and --async is recommended for interactive control"
help:
  usage: "ryeos --project <path> codex session start <credential-profile-id> --async --current-head"
  examples:
    - "ryeos --project . codex session start personal --async --current-head"
forms:
  - slots:
      - field: credential_profile_id
project:
  resolution: required
  default: discover_upward_ai
  request_project_path: true
parameter_binding:
  mode: tail_object
  flag_key_normalization: hyphen_to_underscore
control_flags:
  - flag: async
    help: "Return after durable accepted launch"
    binding: launch_mode_accepted
  - flag: current-head
    help: "Resolve the principal's pushed project HEAD into a retained copy-on-write generation"
    binding: pin_current_head_at_admission
dispatch:
  kind: execute_ref
  execute: worker_execution:codex/session
  availability: daemon
