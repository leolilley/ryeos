# ryeos:signed:2026-11-27T23:12:07Z:46c1a73bf8fa2658d4354e8b2d285be8282ab40fa47b328e9b6ae57f4bcc462d:Kd1Yzu6TaaZp1EYty7JrZz4wNDTh4MVIF+9qwWkhwNr2MSbBbkhArlSaaJFvoLIB0l7PQLbCvZwbJO6PmN3WAA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "engine/kinds/directive"
inventory_policy:
  admission:
    capability_template: "ryeos.execute.{kind}.{bare_id}"
version: "1.0.0"
location:
  directory: directives
resolution:
  - step: resolve_extends_chain
effective_trust:
  include_references: false
# Which spaces and trust classes may supply a launch root of this kind.
# Work signed by an unpinned key runs only where node policy admits it.
launch_trust:
  allowed_spaces: [bundle, project]
  allowed_trust: [trusted_bundle, trusted_project]
  operator_may_admit: [untrusted_project]
execution:
  # A directive has no direct tool-call effect and no direct workspace use of
  # its own: it acts only through the tools it dispatches, and each of those
  # is judged against its own declaration when it is called. `none` says
  # nothing wider. The directive's model calls are not covered by it; they
  # are judged at launch by the sealed external-effect authority against any
  # thread ceiling. Only a signed kind schema can declare `none`.
  effect_class_ceiling:
    constant: none
  workspace_access:
    constant: none
  # Explicit delegation to the runtime registry. The dispatcher will
  # call `RuntimeRegistry::lookup_for("directive")` to find the
  # default runtime serving this kind (today: `runtime:directive-runtime`).
  # Without this `delegate` block the dispatcher refuses to consult
  # the registry — there is no implicit fallback.
  delegate:
    via: runtime_registry
  thread_profile:
    name: directive_run
    root_executable: true
    supports_interrupt: true
    supports_continuation: true
  # Launch augmentation: before the directive runtime is spawned, the
  # daemon pre-resolves knowledge refs declared in the directive's
  # `context:` block, dispatches a child knowledge-runtime compose
  # method, and writes the rendered strings into `rendered_contexts`.
  # If `composed_context` is missing or empty, the augmentation is a
  # no-op — directives without context blocks are unaffected.
  launch_augmentations:
    - step: compose_context_positions
      target_kind: knowledge
      target_method: compose_positions
      source_derived: composed_context
      output_derived: rendered_contexts
      meta_output_derived: rendered_contexts_meta
      per_position_budget:
        system: 4000
        before: 2000
        after: 2000
  hooks:
    authored_path: [hooks]
    plan_derived: effective_hook_plan
    events:
      after_step:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [turn]
        allowed_results: [discard, observation, control, notice]
      continuation:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event]
        allowed_results: [discard, observation, control, notice]
      # Fired when the model replies with no tool call and the run would
      # finish. The only result is `verdict`: the hook's action returns
      # `{verdict: accept}` or `{verdict: reject, reason: <key>}`, the key
      # naming one of the hook's signed `steer` texts. A rejection appends that
      # text and takes another turn, within the hook's signed per-run limit;
      # past it the run ends failed (`finish_check_retries_exhausted`), never
      # as a success. The event root carries `turn`, `attempt` and
      # `rejections_left`, never the reply.
      finish_check:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event]
        allowed_results: [verdict]
      # Fired when the provider refused a request and the provider entry
      # names the refusal with a code (its `request_rejections` rows). The
      # event root carries `code`, `status`, `turn` and `retryable`. Observation
      # only: the failure is already typed and a hook cannot turn it into a
      # retry or a different outcome.
      provider_error:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event]
        allowed_results: [discard, observation]
      # Fired when live context reaches the compaction trigger, and when the
      # provider refused a request with one of the compaction policy's overflow
      # codes. The event root carries `trigger` (`pressure` or `overflow`),
      # `turn`, the token counts, and for an overflow the rejection `code` and
      # `status`. It carries no conversation text. A control result may name
      # `compact` or `skip_compaction`; with no action the compaction policy
      # decides.
      context_pressure:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event]
        allowed_results: [discard, observation, control]
      # The four events below observe the run and never steer it: a result is
      # validated and dropped, so no result can block a call, retry a turn or
      # end the run. Their roots carry names, counts and codes only, never a
      # call's arguments or result text.
      #
      # Fired once for each tool call about to be dispatched (not for
      # `directive_return`). The event root carries `turn`, `tool`, `call_id`,
      # `index` and `batch_size`. Every call that fired it fires `after_tool`.
      before_tool:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event]
        allowed_results: [discard, observation]
      # Fired once for each tool call after its result is recorded. The event
      # root carries `turn`, `tool`, `call_id`, `status` (`ok`, `error` or
      # `refused`), `raw_size`, `truncated`, `spilled` and `duplicate`. A call
      # refused before it ran (limit, deadline, preflight) has status `refused`.
      after_tool:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event]
        allowed_results: [discard, observation]
      # Fired when a provider turn ended without a usable answer: at the output
      # limit, with an empty reply, or with a reply that wrote a call as text.
      # The event root carries `turn`, `reason` (`output_limit`, `empty_reply`
      # or `malformed_reply`), `outcome` (`corrected`, `failed`, or `retried`
      # for an empty reply no policy counts) and `streak` (0 when no policy
      # counts it).
      turn_incomplete:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event]
        allowed_results: [discard, observation]
      # Fired by the loop guard's idle finding: when the model is warned and
      # when the run is stopped. The event root carries `turn`, `phase`
      # (`warned` or `stopped`), `idle_turns` and `grace_turns`.
      idle:
        context_contract:
          schema: ryeos.hooks.context.v1
          allowed_roots: [event]
        allowed_results: [discard, observation]
formats:
  - extensions: [".md"]
    parser: parser:ryeos/core/markdown/directive
    signature:
      prefix: "<!--"
      suffix: "-->"
inventory_kinds: [tool]
composer: handler:ryeos/core/extends-chain
composer_config:
  extends_field: extends
  fields:
    - name: body
      strategy: root_verbatim
      required: true
      expect_value_type: string
      derive_as: body
    # Unified capability requirements. `declared` (self-asserted action
    # authority → effective_caps) and `manifest` (manifest-backed runtime
    # authority) inherit independently when omitted. A declaration atomically
    # replaces its subtree and fails composition if it widens the immediately
    # effective parent. The signed bundle manifest remains the final upper
    # bound for `manifest` at launch.
    - name: requires
      strategy: narrow_requires_capabilities
      expect_value_type: mapping
    - name: context
      strategy: dict_merge_string_seq_root_last
      expect_value_type: mapping
      derive_as: composed_context
      derived_dict_string_seq: true
    - name: model
      strategy: replace_root_last
      expect_value_type: mapping
    - name: limits
      strategy: dict_merge_root_last
      expect_value_type: mapping
    - name: inputs
      strategy: keyed_seq_merge_root_last
      key: name
      expect_value_type: sequence
    - name: hooks
      strategy: replace_root_last
      expect_value_type: sequence
    # Author-vouched effect class for the directive's provider boundary
    # (`recorded` | `sealed` | `live`; absent means live — fresh sampling,
    # no records). The daemon reads the sealed declaration from the admitted
    # capsule at record publication; the runtime reads it only to decide
    # whether to submit.
    - name: effects
      strategy: replace_root_last
      expect_value_type: string
    # Author vouching that issuing this directive's model calls more than once
    # has no effect beyond their charge (`once` | `repeatable`; absent means
    # once). It gates retry after a provider failure that leaves it unknown
    # whether the call was acted on; it is independent of `effects`, which
    # concerns record and replay of the answer.
    - name: provider_contact
      strategy: replace_root_last
      expect_value_type: string
  policy_facts:
    - name: effective_caps
      path: [requires, capabilities, declared]
      expect: array_of_strings
composed_value_contract:
  root_type: mapping
  required:
    body:
      type: single
      prim: string
  optional:
    extends:
      type: union
      prims: [string, "null"]
    context:
      type: single
      prim: mapping
    model:
      type: single
      prim: mapping
    limits:
      type: single
      prim: mapping
    inputs:
      type: single
      prim: sequence
    hooks:
      type: single
      prim: sequence
    # Unified capability requirements (`capabilities.declared` self-asserted
    # action authority + `capabilities.manifest` manifest-backed runtime
    # authority). Narrowed against the parent through `extends` (see
    # composer_config); `manifest` is additionally bounded by the signed bundle
    # manifest at launch.
    requires:
      type: single
      prim: mapping
    # Effect class for the provider boundary; see the composer field above.
    effects:
      type: single
      prim: string
    # Repeatability declaration; see the composer field above.
    provider_contact:
      type: single
      prim: string
metadata:
  rules:
    name:
      from: filename
      required: true
    version:
      from: path
      key: version
    description:
      from: path
      key: description
    category:
      from: relative_dir
      required: true
    required_secrets:
      from: path_string_seq
      key: required_secrets
