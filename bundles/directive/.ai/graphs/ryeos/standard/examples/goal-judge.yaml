# ryeos:signed:2026-11-28T17:47:26Z:e713a3783f05956ef72ed561e6a064d0d1b24834792d9da87a1c4f2cc743f402:o7IeJ+SBQk66SGGnoSj1jhPMLN9BWPMnd0tO8wfJYE1CD2MvOOgrpV4fWo2Yc5pzrw6MTaNRu+9CYTsjvH78Dg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
category: ryeos/standard/examples
description: "Example: run a working directive under a goal, check its deliverable with deterministic gates, let a tool-less judge that sees only the quoted deliverable add refusals, and repeat with the author's signed repair text for a signed number of rounds. Ends failed, never successful, when the rounds run out."
requires:
  capabilities:
    declared:
      - ryeos.execute.directive.ryeos/standard/examples/goal-work
      - ryeos.execute.directive.ryeos/standard/examples/goal-judge
      - ryeos.execute.tool.ryeos/standard/examples/goal-fail
      - ryeos.execute.tool.ryeos/standard/examples/goal-repair
config:
  start: start_check
  max_steps: 100
  on_error: fail
  state:
    goal: "Write one short paragraph that states what a signed item is."
    max_rounds: 3
    max_chars: 4000
    criteria:
      - {key: states_the_point, text: "The paragraph states what a signed item is in its first sentence."}
      - {key: no_filler, text: "The paragraph contains no preamble or closing remark."}
    repair:
      states_the_point: "Your last deliverable did not state the point in its first sentence. Start with it."
      no_filler: "Your last deliverable had a preamble or a closing remark. Return the paragraph only."
    gate_repair:
      gate_length: "Your last deliverable was empty or too long. Return one paragraph of at most 4000 characters."
    gate_failed_keys: ["gate_length"]
    round: 0
    deliverable: ""
    gate_ok: false
    verdict_pass: false
    failed: []
    repair_text: ""
    trail: ""
  nodes:
    # The signed round bound must be a whole number from 1 to 8; anything else ends
    # the graph failed before any directive runs.
    start_check:
      node_type: gate
      next:
        type: conditional
        branches:
          - when: 'type(state.max_rounds) == "number" && matches(string(state.max_rounds), "^[1-8]$")'
            to: work
          - to: bad_config

    work:
      node_type: action
      follow: true
      action:
        item_id: "directive:ryeos/standard/examples/goal-work"
        ref_bindings:
          model: "directive:ryeos/standard/examples/goal-work"
        params:
          goal: "${state.goal}"
          round: "${state.round + 1}"
          repair: "${state.repair_text}"
      assign:
        deliverable: "${result.deliverable}"
        round: "${state.round + 1}"
        gate_ok: "${type(result.deliverable) == \"string\" && length(result.deliverable) > 0 && length(result.deliverable) <= state.max_chars}"
        failed: []
        repair_text: ""
        trail: "${state.trail + \"work:\" + string(state.round + 1) + \"=\" + (dispatch.child_thread_id ?? \"none\") + \";\"}"
      next: {type: unconditional, to: gate}

    # Deterministic checks come first and a failure here is final for the
    # round: the judge is not asked, so it can never override a gate.
    gate:
      node_type: gate
      next:
        type: conditional
        branches:
          - when: "state.gate_ok"
            to: judge
          - to: gate_repair_text

    judge:
      node_type: action
      follow: true
      action:
        item_id: "directive:ryeos/standard/examples/goal-judge"
        ref_bindings:
          model: "directive:ryeos/standard/examples/goal-judge"
        params:
          goal: "${state.goal}"
          criteria: "${state.criteria}"
          deliverable: "${state.deliverable}"
      assign:
        verdict_pass: "${result.pass}"
        failed: "${result.failed}"
        trail: "${state.trail + \"judge:\" + string(state.round) + \"=\" + (dispatch.child_thread_id ?? \"none\") + \";\"}"
      next:
        type: conditional
        branches:
          - when: 'type(state.verdict_pass) != "bool" || type(state.failed) != "array"'
            to: bad_verdict
          - when: "state.verdict_pass && length(state.failed) == 0"
            to: done
          - when: "!state.verdict_pass && length(state.failed) > 0"
            to: repair
          - to: bad_verdict

    # The repair text comes only from the author's signed map. A key the judge
    # names that is not in the map ends the run failed with judge_result_invalid
    # inside the tool, so free text from a judge never reaches the working
    # directive and a bad key is refused even in the last round.
    repair:
      action:
        item_id: "tool:ryeos/standard/examples/goal-repair"
        ref_bindings: {}
        params:
          failed: "${state.failed}"
          repair: "${state.repair}"
      assign:
        repair_text: "${result.text}"
      next: {type: unconditional, to: bound}

    gate_repair_text:
      action:
        item_id: "tool:ryeos/standard/examples/goal-repair"
        ref_bindings: {}
        params:
          failed: "${state.gate_failed_keys}"
          repair: "${state.gate_repair}"
      assign:
        repair_text: "${result.text}"
      next: {type: unconditional, to: bound}

    bound:
      node_type: gate
      next:
        type: conditional
        branches:
          - when: "state.round >= state.max_rounds"
            to: exhausted
          - to: work

    bad_config:
      action:
        item_id: "tool:ryeos/standard/examples/goal-fail"
        ref_bindings: {}
        params:
          code: goal_config_invalid
          rounds: 0
      next: {type: unconditional, to: done}

    exhausted:
      action:
        item_id: "tool:ryeos/standard/examples/goal-fail"
        ref_bindings: {}
        params:
          code: goal_rounds_exhausted
          rounds: "${state.round}"
      next: {type: unconditional, to: done}

    bad_verdict:
      action:
        item_id: "tool:ryeos/standard/examples/goal-fail"
        ref_bindings: {}
        params:
          code: judge_result_invalid
          rounds: "${state.round}"
      next: {type: unconditional, to: done}

    done:
      node_type: return
      output:
        deliverable: "${state.deliverable}"
        rounds: "${state.round}"
        trail: "${state.trail}"
