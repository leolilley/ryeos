category: "ryeos-runtime/model-providers"
family: chat_completions
transport:
  kind: remote_http
  base_url: "https://api.z.ai/api/paas/v4"
auth:
  env_var: ZAI_API_KEY
  header_name: Authorization
  prefix: "Bearer "
headers:
  Content-Type: application/json
  Accept-Language: "en-US,en"
schemas:
  accounting: {require_usage: true}
  messages:
    role_map: {user: user, assistant: assistant, system: system, tool: tool}
    content_key: content
    system_message: {mode: message_role}
    tool_result:
      role: tool
      wrap_mode: direct
      block_template:
        tool_call_id: "{tool_call_id}"
        content: "{content}"
    tool_call_block_template:
      id: "{id}"
      type: function
      function:
        name: "{name}"
        arguments: "{input_json}"
  tools:
    template:
      type: function
      function:
        name: "{name}"
        description: "{description}"
        parameters: "{schema}"
  streaming:
    mode: delta_merge
    metadata:
      usage:
        path: usage
        input_tokens_path: prompt_tokens
        output_tokens_path: completion_tokens
        reasoning_tokens_path: completion_tokens_details.reasoning_tokens
        reasoning_included_in_output: true
        aggregation: latest_snapshot
        single_snapshot: true
      finish_reason_path: choices.0.finish_reason
      response_id_path: id
      error:
        path: error
        message_path: message
        code_path: code
        finish_reasons: [sensitive, model_context_window_exceeded, network_error]
  output_limit: {path: max_tokens, semantics: provider_native_output_tokens}
body_template:
  model: "{model}"
  messages: "{messages}"
  tools: "{tools}"
  stream: "{stream}"
body_extra:
  # Z.AI buffers function arguments unless tool streaming is explicitly
  # enabled. Every model advertised below supports this option.
  tool_stream: true
profiles:
  - name: glm-5-2-spend
    match: [glm-5.2]
    spend_authority:
      billing_principal: zai-api-key
      credential_authority_generation: gen-1
      pricing_contract_subject: zai-standard-api-2026-07
      tariff:
        schema_version: 1
        currency: usd
        pricing_generation: zai-2026-07
        input_per_million: "1.4"
        output_per_million: "4.4"
        covered_dimensions: [input_tokens, output_tokens]
  - name: glm-4-7-flash-free
    match: [glm-4.7-flash]
    # Keep the zero-priced measurement route aligned with the fast wire shape
    # verified against the general API. Model policy belongs in this signed
    # config rather than in runtime code.
    body_extra:
      thinking: {type: disabled}
    spend_authority:
      billing_principal: zai-api-key
      credential_authority_generation: gen-1
      pricing_contract_subject: zai-standard-api-2026-07
      tariff:
        schema_version: 1
        currency: usd
        pricing_generation: zai-2026-07
        input_per_million: "0"
        output_per_million: "0"
        covered_dimensions: [input_tokens, output_tokens]
