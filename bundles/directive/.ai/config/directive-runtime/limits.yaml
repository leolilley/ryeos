category: "directive-runtime"
defaults:
  # 0 means unlimited. By default RyeOS applies no hard execution limits; runaways
  # are an operator/project policy via this config, directive-authored `limits:`,
  # execution policy, or caller overrides.
  turns: 0
  tool_calls: 0
  tokens: 0
  provider_request_body_bytes: 0
  spend_usd: "0"
  spawns: 0
  depth: 0
  duration_seconds: 0
  # Applies only to a run that has a deadline (caller `run_timeout`). `reserve`
  # is the time an execution keeps to settle after its work is stopped; it is
  # also what a parent keeps back from its children. `wrap_up_seconds` is how
  # long before the hard stop the model is told time is short (0 = never).
  wrap_up_seconds: 60
  deadline:
    reserve_seconds: 30
