# ryeos:signed:2026-09-05T00:45:39Z:98ad43b7d1403d6751a1aa92d08afb26f6d9587a1d627f7e054ff7a0229083b0:TV1EufABxdZIBzUXYVfAxV5ocKOBeNJNc/VD6ghj0GZO2xEsnmLA3dzK9GqAOj4TSKGVkhyoJ6Yvg0J08Q1XBA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "rye/web"
version: "1.0.0"
tool_type: "subprocess"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
description: "Search the web via Tavily — a fast, reliable search API built for LLM use. Returns ranked result titles, URLs, and snippets. Requires TAVILY_API_KEY."

# Resolved from host env by name (vault > host env > .env) and injected into the
# tool subprocess env. Dispatch fails clearly if the key is not configured.
required_secrets:
  - TAVILY_API_KEY

config:
  command: "bin:ryeos-web-tools"
  args:
    - "tavily"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 20

config_schema:
  type: object
  properties:
    query:
      type: string
      description: "Search query"
      minLength: 1
    num_results:
      type: integer
      minimum: 1
      maximum: 20
      default: 10
      description: "Maximum number of results to return"
    search_depth:
      type: string
      enum: ["basic", "advanced"]
      default: "basic"
      description: "Tavily search depth. basic is fast; advanced is deeper but slower."
  required: [query]
