# ryeos:signed:2026-09-05T00:45:39Z:de5e07fd4d92a382149d962805bca1dbd82729f0951429330a74773df5afb008:emNct4QmLK0myBnt+nYd/YOhNQMHFrIMTYZgzQnB8KsKg2tJzk+PX+Lbm4atKX9NMCiXmbGeU7RvyjTJKyHsDw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "rye/web"
version: "1.0.0"
tool_type: "subprocess"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
description: "Search the web and return ranked result titles, URLs, and snippets"

config:
  command: "bin:ryeos-web-tools"
  args:
    - "search"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 30

config_schema:
  type: object
  properties:
    query:
      type: string
      description: "Search query"
      minLength: 1
    num_results:
      type: integer
      minimum: 1
      maximum: 20
      default: 10
      description: "Maximum number of results to return"
    provider:
      type: string
      enum: ["auto", "bing_web_rss", "duckduckgo", "google_news_rss", "bing_news_rss"]
      default: "auto"
      description: "Search provider. auto uses the built-in fallback chain."
  required: [query]
