# ryeos:signed:2026-07-27T09:00:08Z:e512fb54b3b73a20a0d4d8c4ba66a1033ae7d707ced0fd471b527d0e0f83616c:77Uiv0bGEzF2iAXj6VBGNHgXkxBWJlCN/aDHecBBmrtyLP/dmv0+PfFnVmmP8ANhL9vcoIgJAaHgK0RxdI5WAg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: "rye/web"
version: "1.0.0"
tool_type: "subprocess"
executor_id: "@subprocess"
description: "Search the web and return ranked result titles, URLs, and snippets"

config:
  command: "bin:ryeos-web-tools"
  args:
    - "search"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 30

config_schema:
  type: object
  properties:
    query:
      type: string
      description: "Search query"
      minLength: 1
    num_results:
      type: integer
      minimum: 1
      maximum: 20
      default: 10
      description: "Maximum number of results to return"
    provider:
      type: string
      enum: ["auto", "bing_web_rss", "duckduckgo", "google_news_rss", "bing_news_rss"]
      default: "auto"
      description: "Search provider. auto uses the built-in fallback chain."
  required: [query]
