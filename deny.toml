[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # unsafe-libyaml is unmaintained and serde_yaml, which 29 workspace crates
    # read signed YAML through, has no safe successor to upgrade to; the
    # advisory reports no vulnerability. The migration off serde_yaml is a
    # tracked item; until it lands this advisory is acknowledged, not fixed.
    "RUSTSEC-2024-0449",
    # chrono and chrono-tz are unmaintained; the advisory reports no
    # vulnerability. Nine workspace crates (state, scheduler, executor, API,
    # effect and scheduler contracts, the Render adapter) use chrono and the
    # scheduler uses chrono-tz for named time zones. Moving to a maintained
    # time crate is a tracked migration; until it lands this is acknowledged,
    # not fixed.
    "RUSTSEC-2026-0543",
    # chrono-tz, same reason (its own advisory).
    "RUSTSEC-2026-0555",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The Rune UI toolkit, taken from its fork at an exact rev (crates/clients/rune/Cargo.toml).
allow-git = ["https://github.com/leolilley/rune"]
