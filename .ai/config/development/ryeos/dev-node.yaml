{
  "category": "development/ryeos",
  "name": "dev-node",
  "version": "1.0.0",
  "schema": "ryeos.development.dev-node.v1",
  "description": "Where a developer's node and its worktree build live, read by the featured-build-check, bundle-set-init-smoke and dev-node-drift-check host tools. Defaults follow install-local-direct.sh; a site copy passed with --config-file names its own bin dir and app root. Values expand ${NAME} and ${NAME:-default} from WORKTREE and the environment.",
