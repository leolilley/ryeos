category: development/ryeos
version: "1.0.0"
description: UNSIGNED private-origin GNU CPython product recipe; GNU/GPU qualification remains unresolved
build_products:
  schema: ryeos.build_products.v1
  output_roots:
    - name: private_distribution
      path: products/gnu-python-relocatable-distribution
      storage: large_content
      bounds:
        maximum_entries: 10000
        maximum_depth: 64
        maximum_file_bytes: 134217728
        maximum_total_bytes: 268435456
  products:
    - name: runtime_private
      source: {kind: workspace_output, root: private_distribution}
      path: products/gnu-python-relocatable-distribution
      shape: tree
      storage: large_content
      required: true
      bounds:
        maximum_entries: 10000
        maximum_depth: 64
        maximum_file_bytes: 134217728
        maximum_total_bytes: 268435456
    - name: elf_inventory_private
      source: {kind: workspace_output, root: private_distribution}
      path: products/gnu-python-relocatable-distribution/elf-inventory.json
      shape: file
      storage: large_content
      required: true
      bounds:
        maximum_entries: 1
        maximum_depth: 1
        maximum_file_bytes: 4194304
        maximum_total_bytes: 4194304
    - name: notices_private
      source: {kind: workspace_output, root: private_distribution}
      path: products/gnu-python-relocatable-distribution/notices
      shape: tree
      storage: large_content
      required: true
      bounds:
        maximum_entries: 256
        maximum_depth: 8
        maximum_file_bytes: 134217728
        maximum_total_bytes: 268435456
product_relationships:
  schema: ryeos.product_relationships.v1
  relationships:
    - name: runtime_private_to_qualification
      producer:
        canonical_ref: graph:ryeos/development/gnu-python-private-production
        recipe_binding: product_recipe
        product_name: runtime_private
        parameters: {}
      consumer:
        canonical_ref: tool:ryeos/environments/qualification/gnu-python-private
        declaration_id: subject
      required_product:
        shape: tree
        storage: large_content
        bounds:
          maximum_entries: 10000
          maximum_depth: 64
          maximum_file_bytes: 134217728
          maximum_total_bytes: 268435456
      qualification:
        policy_ref: null
        required_claims: []
    - name: runtime_private_to_qualified_runtime
      producer:
        canonical_ref: graph:ryeos/development/gnu-python-private-production
        recipe_binding: product_recipe
        product_name: runtime_private
        parameters: {}
      consumer:
        canonical_ref: config:development/ryeos/gnu-python-private-qualified-runtime
        declaration_id: runtime
      required_product:
        shape: tree
        storage: large_content
        bounds:
          maximum_entries: 10000
          maximum_depth: 64
          maximum_file_bytes: 134217728
          maximum_total_bytes: 268435456
      qualification:
        policy_ref: config:ryeos/environments/qualification/gnu-python-private
        required_claims: [gnu_python_private_origin_startup_providers_v1, gnu_python_zlib_1_3_2]
