{
  "category": "development/ryeos",
  "name": "guarded-cargo",
  "version": "1.0.0",
  "schema": "ryeos.development.guarded-cargo.v1",
  "description": "Portable defaults for the guarded-cargo host tool. A site copy passed with --config-file names its own shared target dir, lock, live-step process patterns and disk floors. Values expand ${NAME} and ${NAME:-default} from WORKTREE, TARGET_DIR and the environment.",
  "lock_path": "${XDG_RUNTIME_DIR:-/tmp}/ryeos-guarded-cargo.lock",
  "target_dir": "${CARGO_TARGET_DIR:-${WORKTREE}/target}",
  "tmpdir": null,
  "cargo": "cargo",
  "env": {
    "CARGO_INCREMENTAL": "0"
  },
  "live_step_patterns": [],
  "wait_for_unguarded_cargo": true,
  "poll_seconds": {
    "live_step": 20,
    "unguarded_cargo": 10,
    "watchdog": 5
  },
  "disk": {
    "paths": ["${TARGET_DIR}", "/"],
    "refuse_below_mib": 2500,
    "kill_below_mib": 1500
  },
  "priority": {
    "nice": 19,
    "ionice_idle": true,
    "new_session": true
  },
  "shared_target": {
    "touch_sources_on_worktree_change": true,
    "source_paths": ["crates", "tests/e2e/external-execution/support"],
    "marker": ".last-source-tree"
  },
  "prune": {
    "remove_dirs": ["debug/incremental", "debug/examples"],
    "test_executables": "all",
    "deps_dirs": ["debug/deps"],
    "stale_artifacts": {
      "max_age_minutes": 120,
      "name_globs": ["libryeos*", "ryeos*", "liblillux*", "lillux*", "*codex*", "*render_sandbox*", "*external*"]
    }
  }
}
