# ryeos:signed:2026-09-17T03:43:53Z:ef469b4082111fa1399f162823fbcc414aa7dee15502eee9e3ba2c8b44a20176:IOWsBsTmemnb0O+56oUM9FB05O0NyaaEuThhKUypfzq4weg2uRGBnixg0g002UgxsnbjugCM1j8HtxUrnqQVAg==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
# Trusted/disposable hosted lane. This differs from the hard-contained
# authoring environment only in the exact worker protocol it selects.
category: development/ryeos
schema: ryeos.worker_environment.v6
worker_ref: worker:codex/trusted-hosted-authoring
external_product_slots:
  - id: authoring-tools
    relationship_ref: config:development/ryeos/authoring-environment-products
    relationship: runtime_to_authoring_worker
    kind: tree
    mount_root: execution_runtime
    mount: authoring-tools
external_content: []
configuration:
  executable_search:
    - realization_id: authoring-tools
      relative_directory: bin
  process_environment:
    GIT_CONFIG_NOSYSTEM: {kind: literal, value: "1"}
    GIT_CONFIG_GLOBAL: {kind: literal, value: /dev/null}
    GIT_PAGER: {kind: literal, value: cat}
    TZ: {kind: literal, value: UTC}
    TMPDIR: {kind: runtime_view_directory, relative_path: scratch}
credential_requirement:
  workload_family: codex
  required_state: active
  subject_projection_contract: codex.account.v1
portable_state_contract: ryeos.worker_session.restore.v1
workload_client:
  protocol: ryeos.workload-client/v2
  bindings:
    - kind: structured_session
  executions:
    - item_ref: tool:ryeos/development/cargo-build
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: immutable_current_generation
    - item_ref: tool:ryeos/development/cargo-check
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: immutable_current_generation
    - item_ref: tool:ryeos/development/cargo-test
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: immutable_current_generation
    - item_ref: tool:ryeos/development/format-check
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: immutable_current_generation
    - item_ref: tool:ryeos/development/format-file
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: shared_exclusive
    - item_ref: tool:ryeos/development/platform-inspect
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: immutable_current_generation
  max_in_flight: 1
  max_invocations_per_boot: 16
  max_lifetime_seconds: 1800
