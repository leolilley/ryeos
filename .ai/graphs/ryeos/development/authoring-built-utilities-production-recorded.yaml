# ryeos:signed:2026-10-30T04:44:55Z:402b67ebbb000ab8df44619c45d209ab277bf11cb992512b06f112e8fc0eb32d:CjHq+wGXWip+xr7/qFMluDfE0zMbmZo/pmhnNKbxII1PNb58DNeDN5b9Cs2yGlvWGdLu2dkugnlgzuWauipDBw==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
category: ryeos/development
description: Reuse or run the exact retained authoring utility build
requires:
  capabilities:
    declared:
      - ryeos.execute.graph.ryeos/development/authoring-built-utilities-production
      - ryeos.execute.config.development/ryeos/authoring-built-utilities-products
      - ryeos.execute.tool.ryeos/development/authoring-environment-production/build-utilities
config:
  start: produce
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    required: [build_support_selection, platform_selection]
    properties:
      build_support_selection:
        type: object
        required: [declaration_id, witness_hash, qualification_hash, witness_source, remote_testimony]
        properties:
          declaration_id: {type: string, enum: [authoring-build-support]}
          witness_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
          qualification_hash: {type: "null"}
          remote_testimony: {type: [object, "null"]}
          witness_source:
            oneOf:
              - type: object
                required: [kind]
                properties:
                  kind: {const: local_capture}
                additionalProperties: false
              - type: object
                required: [kind, acceptance_hash]
                properties:
                  kind: {const: received}
                  acceptance_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
                additionalProperties: false
        additionalProperties: false
      platform_selection:
        type: object
        required: [declaration_id, witness_hash, qualification_hash, witness_source, remote_testimony]
        properties:
          declaration_id: {type: string, enum: [platform]}
          witness_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
          qualification_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
          remote_testimony: {type: [object, "null"]}
          witness_source:
            oneOf:
              - type: object
                required: [kind]
                properties:
                  kind: {const: local_capture}
                additionalProperties: false
              - type: object
                required: [kind, acceptance_hash]
                properties:
                  kind: {const: received}
                  acceptance_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
                additionalProperties: false
        additionalProperties: false
    additionalProperties: false
  nodes:
    produce:
      node_type: action
      effects: recorded
      cache_result: false
      action:
        item_id: graph:ryeos/development/authoring-built-utilities-production
        ref_bindings: {}
        params: {}
        product_selections:
          - target: {kind: root}
            selection: "${inputs.build_support_selection}"
          - target: {kind: root}
            selection: "${inputs.platform_selection}"
      assign:
        accepted_products: "${result}"
      next:
        type: unconditional
        to: done
    done:
      node_type: return
      output: "${state.accepted_products}"
