# ryeos:signed:2026-09-16T23:32:50Z:a0fa42374dc801f096267d8297d5f8ade9ec1989967038781eb5ade6be030b86:V92DTvbFh9wat1N98LKs6CYu60O28HGSm/UgA8CmY5n8tgJ962vcexuN1EQzh/grh2ow1NL/ZdGLhJyVrnGdBQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
category: ryeos/development
description: Run one bounded Codex development turn across a required recovery boundary and return its exact terminal candidate coordinate
effects: live
requires:
  capabilities:
    declared:
      - ryeos.execute.config.development/ryeos/worker-environment
      - ryeos.execute.worker_execution.codex/bounded-turn-recovery
      - ryeos.runtime.dedicated_session.start
      - ryeos.runtime.dedicated_session.command
      - ryeos.runtime.dedicated_session.terminate
config:
  start: run
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    properties:
      goal: {type: object}
      credential_profile_id: {type: string, minLength: 1, maxLength: 256}
      target_product_selections: {type: array}
    required: [goal, credential_profile_id, target_product_selections]
    additionalProperties: false
  nodes:
    run:
      node_type: action
      effects: live
      cache_result: false
      follow: true
      action:
        item_id: worker_execution:codex/bounded-turn-recovery
        ref_bindings:
          environment: config:development/ryeos/worker-environment
        product_selections: "${inputs.target_product_selections}"
        params:
          goal: "${inputs.goal}"
          credential_profile_id: "${inputs.credential_profile_id}"
      assign:
        candidate_terminal_thread_id: "${dispatch.child_thread_id}"
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output:
        schema: ryeos.remote_worker_workflow_graph_result.v1
        candidate_terminal_thread_id: "${state.candidate_terminal_thread_id}"
