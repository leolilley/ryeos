version: "1.0.0"
category: ryeos/development
description: Produce the private-origin GNU CPython runtime as a distinct retained product
effects: recorded
product_recipe: config:development/ryeos/gnu-python-private-products
external_product_slots:
  - id: production-support
    relationship_ref: config:development/ryeos/authoring-prepared-input-products
    relationship: prepared_inputs_to_gnu_python_private_production
    kind: tree
    mount_root: execution_runtime
    mount: gnu-python-support
requires:
  capabilities:
    declared:
      - ryeos.execute.config.development/ryeos/gnu-python-private-products
      - ryeos.execute.tool.ryeos/development/authoring-environment-production/produce-gnu-python
config:
  start: produce
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    properties: {}
    additionalProperties: false
  nodes:
    produce:
      node_type: action
      effects: live
      cache_result: false
      action:
        item_id: tool:ryeos/development/authoring-environment-production/produce-gnu-python
        ref_bindings: {}
        params:
          profile: private_origin_v1
        thread: inline
      assign:
        production: "${result}"
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.production}"
