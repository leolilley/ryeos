version: "1.0.0"
category: ryeos/development
description: Validate bounded hard-contained OCI qualification evidence without provisioning a host
effects: recorded
requires:
  capabilities:
    declared:
      - ryeos.execute.tool.ryeos/development/hosted-oci-runtime/verify
config:
  start: verify
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    properties:
      evidence: {type: object}
    required: [evidence]
    additionalProperties: false
  nodes:
    verify:
      node_type: action
      effects: live
      cache_result: false
      action:
        item_id: tool:ryeos/development/hosted-oci-runtime/verify
        ref_bindings: {}
        params:
          evidence: "${config.evidence}"
        thread: inline
      assign:
        qualification: "${result}"
      next:
        type: unconditional
        to: done
    done:
      node_type: return
      output:
        qualification: "${state.qualification}"
