# ryeos:signed:2026-09-13T03:32:01Z:5aa2fa6cee4d4ec5ed98c1f33ae57ed505d9c6b05fd1cec8ca4f8615b6eea525:IOsOBGj95kIfJjq2ri7aYsmU/3ikIQcVTpP7c4RoJZ9VxDayoDPdAejEXlU/x1cMPt/YRBsJtpsNC/32uHAACA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
category: ryeos/development
description: Run one bounded Codex development turn and return its exact terminal candidate coordinate
effects: live
requires:
  capabilities:
    declared:
      - ryeos.execute.config.development/ryeos/worker-environment
      - ryeos.execute.worker_execution.codex/bounded-turn
config:
  start: run
  max_steps: 2
  on_error: fail
  config_schema:
    type: object
    properties:
      goal: {type: object}
      credential_profile_id: {type: string, minLength: 1, maxLength: 256}
    required: [goal, credential_profile_id]
    additionalProperties: false
  nodes:
    run:
      node_type: action
      effects: live
      cache_result: false
      follow: true
      action:
        item_id: worker_execution:codex/bounded-turn
        ref_bindings:
          environment: config:development/ryeos/worker-environment
        params:
          goal: "${inputs.goal}"
          credential_profile_id: "${inputs.credential_profile_id}"
      assign:
        candidate_terminal_thread_id: "${dispatch.child_thread_id}"
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output:
        schema: ryeos.remote_worker_workflow_graph_result.v1
        candidate_terminal_thread_id: "${state.candidate_terminal_thread_id}"
