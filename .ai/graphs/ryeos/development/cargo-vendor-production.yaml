# ryeos:signed:2026-09-22T06:28:31Z:e16390cac0ddb623f4d214cabba689d0e5168e8558271d1a156fa9ee4a948e6f:UU9m+pnduXk565D2uwLBj6ukKoyJMlaSiiovIHIJwdIAjixEU1IgnlTIR4VCBD9wDl7FPKi/JgQN093ch+/hAQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.1.0"
category: ryeos/development
description: Produce the exact locked Cargo vendor closure as one retained named product
effects: recorded
product_recipe: config:development/ryeos/cargo-vendor-products
external_product_slots:
  - id: registry-inputs
    relationship_ref: config:development/ryeos/registry-products
    relationship: registry_inputs_to_cargo_vendor
    kind: tree
    mount_root: execution_runtime
    mount: registry-inputs
  - id: platform
    relationship_ref: config:development/ryeos/platform-products
    relationship: platform_to_cargo_vendor_production
    kind: tree
    mount_root: execution_runtime
    mount: platform
requires:
  capabilities:
    declared:
      - ryeos.execute.config.development/ryeos/cargo-vendor-products
      - ryeos.execute.config.development/ryeos/registry-products
      - ryeos.execute.config.development/ryeos/platform-products
      - ryeos.execute.tool.ryeos/development/cargo-vendor
      - ryeos.execute.tool.ryeos/development/cargo-vendor-finalize/run
config:
  start: produce
  max_steps: 3
  on_error: fail
  config_schema:
    type: object
    properties: {}
    additionalProperties: false
  nodes:
    produce:
      node_type: action
      effects: live
      cache_result: false
      action:
        item_id: tool:ryeos/development/cargo-vendor
        ref_bindings: {}
        params: {}
        thread: inline
      assign:
        production: "${result}"
      next: {type: unconditional, to: retain_lock}
    retain_lock:
      node_type: action
      effects: live
      cache_result: false
      action:
        item_id: tool:ryeos/development/cargo-vendor-finalize/run
        ref_bindings: {}
        params: {}
        thread: inline
      assign:
        lock_retention: "${result}"
      next: {type: unconditional, to: done}
    done:
      node_type: return
      output: "${state.production}"
