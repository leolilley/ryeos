# The JavaScript snippet modules the pinned Rune renderer emits, as paths relative to the
# Rune crate root. This is the one declared list: build-rune-web.sh refuses any snippet
# outside it and flattens each to rune_<file stem>.js, check-rune-snippets.py compares it
# with the pinned Rune source, publish.sh derives its inventory from the registry built
# from it, and generate_asset_registry.py requires the registry to carry exactly these.
# A Rune pin bump that adds or drops a snippet changes this list and nothing else by hand.
snippets = [
  "src/platform/web/bridge.js",
  "src/platform/web/health.js",
  "src/platform/web/pipelines.js",
  "src/platform/web/platform.js",
  "src/platform/web/platform_text.js",
  "src/platform/web/segmenter.js",
]
# The files the pinned Rune renderer fetches at runtime beside its bindings module, as paths
# relative to the Rune crate root; each is served under its file name. With `embedded-fonts`
# Rune compiles in Inter cut to Latin, Greek and Cyrillic text and fetches these full faces
# after its first frame. build-rune-web.sh packages exactly these from the pinned Rune source,
# check-rune-snippets.py compares them with that source, and generate_asset_registry.py
# requires the registry to carry them.
fetched = [
  "assets/web/Inter-Regular.ttf",
  "assets/web/Inter-Medium.ttf",
  "assets/web/Inter-SemiBold.ttf",
]
