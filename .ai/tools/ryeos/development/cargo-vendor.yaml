category: ryeos/development
name: cargo-vendor
version: "1.1.1"
description: Produce locked vendored sources using admitted Cargo and exact public registry inputs
executor_id: "@subprocess"
execution_protocol: protocol:ryeos/core/opaque
effects: live
workspace_access: immutable_current_generation
filesystem_authority: captured_execution
network_authority: isolated
# The Graph admits the qualified platform product. The child independently
# declares the exact executable realization it uses for its Cargo command.
external_content:
  - id: platform
    kind: tree
    mode: pinned
    digest: b74b15f0877a2c4941e8bb5660b9f827091aeeb2b2a50b00311101c903895c00
    mount_root: execution_runtime
    mount: platform
env_config:
  env:
    PATH: ""
  env_paths:
    PATH:
      prepend: []
      append: []
config:
  command: realization:platform/rust/bin/cargo
  # Cargo's public local-registry contract, not its private cache format.
  # Exact archives/index records are immutable inputs. Cargo owns unpacking;
  # retained result import and consumer binding remain separate RyeOS actions.
  args:
    - --config
    - 'source.crates-io.replace-with="ryeos-locked-inputs"'
    - --config
    - 'source.ryeos-locked-inputs.local-registry="/ryeos/realizations/registry-inputs"'
    - vendor
    - --manifest-path
    - Cargo.toml
    - --locked
    - --frozen
    - --offline
    - --respect-source-config
    - --versioned-dirs
    - products/cargo-vendor
  timeout_secs: 300
  env:
    CARGO_HOME: /tmp/cargo
    CARGO_TARGET_DIR: /tmp/target
    RUSTC: /ryeos/realizations/platform/rust/bin/rustc
    RUSTDOC: /ryeos/realizations/platform/rust/bin/rustdoc
config_schema:
  type: object
  properties: {}
  additionalProperties: false
